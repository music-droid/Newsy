<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Short, bounded news briefings — not a news portal.">
  <meta name="color-scheme" content="light">
  <meta name="theme-color" content="#6b4f3a">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Newsy">
  <title>Newsy</title>
  <!-- Self-contained offline reader. PWA install (Add to Home Screen) needs the
       multi-file HTTPS deploy (index.html + manifest + sw.js + icons). Service
       workers do not run from file://. See HOME-SCREEN.md. -->
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400;600&family=Source+Serif+4:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
  <style>
/* Newsy — calm briefings, not a news portal */
:root {
  --bg: #f7f3ec;
  --bg-soft: #f0eae0;
  --ink: #2c2925;
  --ink-muted: #5c564e;
  --ink-faint: #8a8278;
  --accent: #6b4f3a;
  --accent-soft: #c4a882;
  --rule: #e0d6c8;
  --chip: #fffdf9;
  --chip-active: #6b4f3a;
  --chip-active-ink: #f7f3ec;
  --link: #4a6b5a;
  --link-hover: #355244;
  --max: 38rem;
  --font: "Source Serif 4", "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif;
  --font-ui: "Source Sans 3", "Segoe UI", system-ui, -apple-system, sans-serif;
}

*,
*::before,
*::after {
  box-sizing: border-box;
}

html {
  font-size: 112.5%; /* ~18px */
  -webkit-text-size-adjust: 100%;
}

body {
  margin: 0;
  min-height: 100vh;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font);
  line-height: 1.65;
  font-weight: 400;
}

a {
  color: var(--link);
  text-decoration-thickness: 1px;
  text-underline-offset: 0.15em;
}

a:hover {
  color: var(--link-hover);
}

.wrap {
  width: min(100% - 2rem, var(--max));
  margin-inline: auto;
  padding-block: 2rem 4rem;
}

/* Header */
.site-header {
  border-bottom: 1px solid var(--rule);
  padding-bottom: 1.25rem;
  margin-bottom: 1.75rem;
}

.brand {
  font-family: var(--font-ui);
  font-size: 0.75rem;
  font-weight: 600;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: var(--accent);
  margin: 0 0 0.35rem;
}

.briefing-title {
  font-size: clamp(1.45rem, 4vw, 1.85rem);
  font-weight: 600;
  line-height: 1.25;
  margin: 0 0 0.25rem;
  letter-spacing: -0.01em;
}

.meta {
  font-family: var(--font-ui);
  font-size: 0.85rem;
  color: var(--ink-muted);
  margin: 0;
}

/* Picker — compact "Briefings" select (native wheel on iPhone) */
.picker {
  display: flex;
  align-items: center;
  gap: 0.75rem;
  margin: 0 0 1.75rem;
}

.picker-label {
  font-family: var(--font-ui);
  font-size: 0.7rem;
  font-weight: 600;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--ink-faint);
  margin: 0;
  flex: 0 0 auto;
}

.select-wrap {
  position: relative;
  flex: 1 1 auto;
  max-width: 16rem;
}

.select-wrap::after {
  content: "";
  position: absolute;
  right: 1rem;
  top: 50%;
  width: 0.5rem;
  height: 0.5rem;
  border-right: 2px solid var(--accent, #6b4f3a);
  border-bottom: 2px solid var(--accent, #6b4f3a);
  transform: translateY(-70%) rotate(45deg);
  pointer-events: none;
}

.briefing-select {
  -webkit-appearance: none;
  appearance: none;
  width: 100%;
  min-height: 44px;
  font-family: var(--font-ui);
  font-size: 1rem; /* 16px+ keeps iOS Safari from zooming on focus */
  font-weight: 600;
  color: var(--accent, #6b4f3a);
  background: var(--chip);
  border: 1.5px solid var(--accent, #6b4f3a);
  border-radius: 999px;
  padding: 0.5rem 2.5rem 0.5rem 1.1rem;
  cursor: pointer;
  transition: background 0.15s ease, box-shadow 0.15s ease;
}

.briefing-select:hover {
  background: #f7f1e8;
}

.briefing-select:focus-visible {
  outline: none;
  box-shadow: 0 0 0 3px rgba(107, 79, 58, 0.25);
}

/* Beats */
.beats {
  display: flex;
  flex-direction: column;
  gap: 2rem;
}

.beat {
  padding-top: 0.25rem;
}

.beat-title {
  font-size: 1.05rem;
  font-weight: 600;
  margin: 0 0 0.65rem;
  padding-bottom: 0.4rem;
  border-bottom: 1px solid var(--rule);
  color: var(--accent);
  letter-spacing: 0.01em;
}

.beat-body {
  margin: 0;
}

.beat-body p {
  margin: 0 0 0.85rem;
}

.beat-body p:last-child {
  margin-bottom: 0;
}

.sources {
  margin-top: 0.85rem;
  padding-top: 0.55rem;
  border-top: 1px dotted var(--rule);
  font-family: var(--font-ui);
  font-size: 0.8rem;
  color: var(--ink-muted);
  line-height: 1.55;
}

.sources-label {
  font-weight: 600;
  color: var(--ink-faint);
  margin-right: 0.35rem;
}

.sources a {
  word-break: break-word;
}

.sources .sep {
  color: var(--ink-faint);
  margin: 0 0.3rem;
}

.sources .name-only {
  color: var(--ink-muted);
}

/* Status / empty */
.status {
  font-family: var(--font-ui);
  font-size: 0.9rem;
  color: var(--ink-muted);
  padding: 1.5rem 0;
}

.site-footer {
  margin-top: 3rem;
  padding-top: 1rem;
  border-top: 1px solid var(--rule);
  font-family: var(--font-ui);
  font-size: 0.75rem;
  color: var(--ink-faint);
}

.site-footer p {
  margin: 0;
}


/* Podcast player */
.podcast {
  margin-top: 0.85rem;
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 0.65rem 0.85rem;
}

.listen-btn {
  font-family: var(--font-ui);
  font-size: 0.8rem;
  font-weight: 600;
  letter-spacing: 0.04em;
  appearance: none;
  border: 1px solid var(--accent);
  background: var(--accent);
  color: var(--chip-active-ink);
  border-radius: 999px;
  padding: 0.4rem 1rem;
  cursor: pointer;
  transition: background 0.15s ease, color 0.15s ease, border-color 0.15s ease;
}

.listen-btn:hover {
  background: #5a3f2d;
  border-color: #5a3f2d;
}

.listen-btn:focus-visible {
  outline: 2px solid var(--accent-soft);
  outline-offset: 2px;
}

.listen-btn[aria-pressed="true"] {
  background: var(--bg-soft);
  color: var(--accent);
  border-color: var(--accent);
}

.podcast audio {
  flex: 1 1 12rem;
  min-width: 11rem;
  max-width: 100%;
  height: 2.1rem;
  accent-color: var(--accent);
}

@media print {
  .podcast {
    display: none !important;
  }
}

/* Print — quiet page, no chrome clutter */
@media print {
  :root {
    --bg: #fff;
    --ink: #111;
    --ink-muted: #333;
    --rule: #ccc;
    --accent: #333;
    --link: #000;
  }

  body {
    background: #fff;
    font-size: 11pt;
    line-height: 1.5;
  }

  .wrap {
    width: 100%;
    max-width: none;
    padding: 0;
  }

  .picker,
  .site-footer {
    display: none;
  }

  .site-header {
    border-bottom-color: #999;
  }

  .beat {
    break-inside: avoid;
  }

  a {
    color: inherit;
    text-decoration: none;
  }

  .sources a::after {
    content: " (" attr(href) ")";
    font-size: 0.75em;
    color: #555;
  }
}

@media (max-width: 480px) {
  html {
    font-size: 106.25%;
  }

  .wrap {
    width: min(100% - 1.5rem, var(--max));
    padding-block: 1.5rem 3rem;
  }
}

/* ---- v3: glance, images, collapsible stories, new at this hour ---- */
.top-line { font-size: 1.1rem; font-style: italic; color: var(--ink-muted); margin: 0 0 1.25rem; }
.glance { background: var(--bg-soft); border-radius: 12px; padding: 0.9rem 1.1rem; margin-bottom: 2rem; }
.glance-label, .carried, .tag, .why span, .beat-figure figcaption {
  font-family: var(--font-ui); font-size: 0.7rem; font-weight: 600; letter-spacing: 0.12em; text-transform: uppercase; color: var(--accent);
}
.glance-label { margin: 0 0 0.4rem; }
.glance ol { list-style: none; margin: 0; padding: 0; }
.glance li { padding: 0.3rem 0; border-top: 1px solid var(--rule); font-size: 0.92rem; line-height: 1.4; }
.glance li:first-child { border-top: 0; }
.glance a { color: var(--ink); text-decoration: none; }
.glance-beat { font-family: var(--font-ui); font-weight: 600; color: var(--accent); margin-right: 0.3rem; }
.beat-figure { margin: 0.5rem 0 0.9rem; }
.beat-figure img { width: 100%; aspect-ratio: 16 / 9; object-fit: cover; border-radius: 10px; display: block; background: var(--bg-soft); }
.beat-figure figcaption { margin-top: 0.3rem; color: var(--ink-faint); font-weight: 400; letter-spacing: 0.06em; }
.beat-figure figcaption a { color: inherit; }
.carried { color: var(--ink-faint); margin: 0 0 0.4rem; }
.stories { list-style: none; margin: 0; padding: 0; }
.story { border-top: 1px solid var(--rule); }
.story:last-child { border-bottom: 1px solid var(--rule); }
.story summary { cursor: pointer; list-style: none; padding: 0.7rem 1.6rem 0.7rem 0; position: relative; font-weight: 600; line-height: 1.35; }
.story summary::-webkit-details-marker { display: none; }
.story summary::after { content: "+"; position: absolute; right: 0.2rem; top: 0.6rem; font-family: var(--font-ui); color: var(--accent); font-size: 1.2rem; }
.story details[open] summary::after { content: "–"; }
.story-body { padding: 0 0 0.9rem; }
.story-body p:first-child { margin-top: 0; }
.story-img { width: 100%; border-radius: 8px; margin-bottom: 0.6rem; }
.why { font-size: 0.92rem; color: var(--ink-muted); }
.new-hour { background: #fff8ec; border: 1px solid var(--accent-soft); border-radius: 12px; padding: 0.8rem 1rem; }
.new-hour .beat-title { color: #9a3b1e; }
.tag { margin-right: 0.35rem; }

  </style>
</head>
<body>
  <main class="wrap">
    <header class="site-header">
      <p class="brand" id="brand">Newsy</p>
      <h1 class="briefing-title" id="briefing-title">Briefing</h1>
      <p class="meta" id="briefing-meta"></p>
      <div class="podcast" id="podcast" hidden>
        <button type="button" class="listen-btn" id="listen-btn" aria-label="Listen to this briefing">Listen</button>
        <audio id="podcast-audio" controls preload="none"></audio>
      </div>
    </header>

    <nav class="picker" aria-label="Briefings">
      <label class="picker-label" for="briefing-select">Briefings</label>
      <div class="select-wrap">
        <select id="briefing-select" class="briefing-select"></select>
      </div>
    </nav>

    <p class="status" id="status" hidden>Loading…</p>

    <div class="beats" id="beats"></div>

    <footer class="site-footer">
      <p>A short page. Read it, then close the tab.</p>
    </footer>
  </main>
  <script>
(function () {
  "use strict";


  const els = {
    brand: document.getElementById("brand"),
    title: document.getElementById("briefing-title"),
    meta: document.getElementById("briefing-meta"),
    podcast: document.getElementById("podcast"),
    listenBtn: document.getElementById("listen-btn"),
    audio: document.getElementById("podcast-audio"),
    select: document.getElementById("briefing-select"),
    beats: document.getElementById("beats"),
    status: document.getElementById("status"),
  };

  let briefings = [];

  function formatGeneratedAt(iso) {
    if (!iso) return "";
    const d = new Date(iso);
    if (Number.isNaN(d.getTime())) return iso;
    try {
      return new Intl.DateTimeFormat("en-US", {
        weekday: "short",
        month: "short",
        day: "numeric",
        year: "numeric",
        hour: "numeric",
        minute: "2-digit",
        timeZoneName: "short",
      }).format(d);
    } catch (_) {
      return iso;
    }
  }

  const MONTHS = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
  const WEEKDAYS = ["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"];
  const SLOT_NAMES = { morning: "Morning", noon: "Noon", evening: "Night" };

  function slotOf(b) {
    const m = /-(morning|noon|evening)$/.exec(b.id || "");
    return m ? m[1] : (b.slot || "").toLowerCase();
  }

  function optionLabel(b) {
    // e.g. "Wed, Oct 7 · Night"
    const src = b.date || (b.id || "").slice(0, 10);
    const parts = src.split("-");
    const slot = SLOT_NAMES[slotOf(b)] || (b.slot ? b.slot.charAt(0).toUpperCase() + b.slot.slice(1) : "");
    if (parts.length === 3) {
      const y = Number(parts[0]);
      const mo = Number(parts[1]);
      const day = Number(parts[2]);
      const wd = WEEKDAYS[new Date(Date.UTC(y, mo - 1, day)).getUTCDay()];
      return wd + ", " + MONTHS[mo - 1] + " " + day + (slot ? " · " + slot : "");
    }
    return b.label || b.id;
  }

  function renderSources(sources) {
    if (!sources || !sources.length) return "";
    const parts = sources.map(function (s) {
      const name = s.name || "Source";
      if (s.url) {
        return (
          '<a href="' +
          escapeAttr(s.url) +
          '" rel="noopener noreferrer" target="_blank">' +
          escapeHtml(name) +
          "</a>"
        );
      }
      return '<span class="name-only">' + escapeHtml(name) + "</span>";
    });
    return (
      '<p class="sources"><span class="sources-label">Sources</span> ' +
      parts.join('<span class="sep">·</span>') +
      "</p>"
    );
  }

  function bodyHtml(body) {
    if (!body) return "";
    // Allow simple HTML paragraphs; if plain text, wrap paragraphs
    if (/<[a-z][\s\S]*>/i.test(body)) return body;
    return body
      .split(/\n\n+/)
      .map(function (p) {
        return "<p>" + escapeHtml(p.trim()) + "</p>";
      })
      .join("");
  }

  function escapeHtml(str) {
    return String(str)
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;");
  }

  function escapeAttr(str) {
    return escapeHtml(str).replace(/'/g, "&#39;");
  }


  function setPodcast(b) {
    if (!els.podcast || !els.audio) return;
    const src = b && b.audio ? b.audio : "";
    if (!src) {
      els.audio.pause();
      els.audio.removeAttribute("src");
      els.audio.load();
      els.podcast.hidden = true;
      if (els.listenBtn) {
        els.listenBtn.setAttribute("aria-pressed", "false");
        els.listenBtn.textContent = "Listen";
      }
      return;
    }
    const abs = new URL(src, location.href).href;
    const current = els.audio.currentSrc || els.audio.src || "";
    if (current !== abs) {
      els.audio.pause();
      els.audio.src = src;
      els.audio.load();
      if (els.listenBtn) {
        els.listenBtn.setAttribute("aria-pressed", "false");
        els.listenBtn.textContent = "Listen";
      }
    }
    els.podcast.hidden = false;
  }

  function storyHtml(st, open) {
    const why = st.why ? '<p class="why"><span>Why it matters</span> ' + escapeHtml(st.why) + "</p>" : "";
    const img = st.image && st.image.src
      ? '<img class="story-img" loading="lazy" src="' + escapeAttr(st.image.src) + '" alt="' + escapeAttr(st.image.alt || "") + '" onerror="this.remove()">'
      : "";
    return (
      '<li class="story"><details' + (open ? " open" : "") + ">" +
      '<summary><span class="story-head">' + escapeHtml(st.headline || "") + "</span></summary>" +
      '<div class="story-body">' + img + why + bodyHtml(st.body || "") + renderSources(st.sources) + "</div>" +
      "</details></li>"
    );
  }

  function storiesOf(beat) {
    if (Array.isArray(beat.stories) && beat.stories.length) return beat.stories;
    if (beat.body) return [{ headline: beat.headline || beat.title || "", body: beat.body, sources: beat.sources }];
    return [];
  }

  function beatImageHtml(beat) {
    const im = beat.image;
    if (!im || !im.src) return "";
    const credit = im.credit
      ? '<figcaption>' + (im.sourceUrl
          ? '<a href="' + escapeAttr(im.sourceUrl) + '" rel="noopener noreferrer" target="_blank">' + escapeHtml(im.credit) + "</a>"
          : escapeHtml(im.credit)) + "</figcaption>"
      : "";
    return '<figure class="beat-figure"><img loading="lazy" src="' + escapeAttr(im.src) + '" alt="' + escapeAttr(im.alt || "") +
      '" onerror="this.closest(\'figure\').remove()">' + credit + "</figure>";
  }

  function wordCount(b) {
    let txt = "";
    (b.newAtThisHour || []).forEach(function (n) { txt += " " + (n.headline || "") + " " + (n.body || ""); });
    (b.beats || []).forEach(function (beat) {
      storiesOf(beat).forEach(function (st) { txt += " " + (st.headline || "") + " " + (st.body || ""); });
    });
    return txt.replace(/<[^>]+>/g, " ").split(/\s+/).filter(Boolean).length;
  }

  function renderBriefing(b) {
    if (!b) {
      els.title.textContent = "No briefing";
      els.meta.textContent = "";
      els.beats.innerHTML = "";
      setPodcast(null);
      els.status.hidden = false;
      els.status.textContent = "No briefing selected.";
      return;
    }

    els.status.hidden = true;
    els.title.textContent = b.label || b.id;
    const when = formatGeneratedAt(b.generatedAt);
    const mins = Math.max(1, Math.round(wordCount(b) / 230));
    els.meta.textContent = (when ? "Prepared " + when + " · " : "") + mins + " min read";
    setPodcast(b);

    document.title = (b.label || "Briefing") + " · Newsy";

    const beats = b.beats || [];
    let html = "";

    if (b.topLine) {
      html += '<p class="top-line">' + escapeHtml(b.topLine) + "</p>";
    }

    // At a glance: one tappable line per beat (NYT/Axios-style index)
    html += '<nav class="glance" aria-label="At a glance"><p class="glance-label">At a glance</p><ol>' +
      beats.map(function (beat) {
        return '<li><a href="#beat-' + escapeAttr(beat.id || "") + '" data-jump="beat-' + escapeAttr(beat.id || "") + '"><span class="glance-beat">' +
          escapeHtml(beat.title || "") + "</span> " + escapeHtml(beat.headline || "") + "</a></li>";
      }).join("") + "</ol></nav>";

    const fresh = b.newAtThisHour || [];
    if (fresh.length) {
      html += '<section class="beat new-hour" id="beat-new"><h2 class="beat-title">New at this hour</h2><ul class="stories">' +
        fresh.map(function (n, i) {
          const tag = n.beat ? '<span class="tag">' + escapeHtml(n.beat) + "</span> " : "";
          return storyHtml({ headline: "", body: n.body, sources: n.sources, why: n.why, image: n.image }, i === 0)
            .replace('<span class="story-head"></span>', '<span class="story-head">' + tag + escapeHtml(n.headline || "") + "</span>");
        }).join("") + "</ul></section>";
    }

    html += beats.map(function (beat) {
      const stories = storiesOf(beat);
      const carried = beat.carried ? '<p class="carried">' + escapeHtml(beat.carried === true ? "Continuing from this morning" : beat.carried) + "</p>" : "";
      return (
        '<article class="beat" id="beat-' + escapeAttr(beat.id || "") + '">' +
        '<h2 class="beat-title">' + escapeHtml(beat.title || "") + "</h2>" +
        beatImageHtml(beat) + carried +
        '<ul class="stories">' + stories.map(function (st) { return storyHtml(st, false); }).join("") + "</ul>" +
        (beat.stories && beat.stories.length ? renderSources(beat.sources) : "") +
        "</article>"
      );
    }).join("");

    els.beats.innerHTML = html;

    // in-page jumps without clobbering the briefing hash
    els.beats.querySelectorAll("[data-jump]").forEach(function (a) {
      a.addEventListener("click", function (e) {
        e.preventDefault();
        const t = document.getElementById(a.getAttribute("data-jump"));
        if (t) t.scrollIntoView({ behavior: "smooth", block: "start" });
      });
    });

    if (els.select && els.select.value !== b.id) els.select.value = b.id;

    if (history.replaceState) {
      history.replaceState(null, "", "#" + encodeURIComponent(b.id));
    } else {
      location.hash = encodeURIComponent(b.id);
    }
  }

  function findBriefing(id) {
    return briefings.find(function (b) {
      return b.id === id;
    });
  }

  function renderPicker() {
    if (!els.select) return;
    // Newest first (briefings.json is already newest-first; sort defensively by id)
    const ordered = briefings.slice().sort(function (a, b) {
      const ka = (a.date || a.id || "") + " " + ({ morning: 1, noon: 2, evening: 3 }[slotOf(a)] || 0);
      const kb = (b.date || b.id || "") + " " + ({ morning: 1, noon: 2, evening: 3 }[slotOf(b)] || 0);
      return ka < kb ? 1 : ka > kb ? -1 : 0;
    });
    els.select.innerHTML = ordered
      .map(function (b) {
        return '<option value="' + escapeAttr(b.id) + '">' + escapeHtml(optionLabel(b)) + "</option>";
      })
      .join("");

    els.select.addEventListener("change", function () {
      const found = findBriefing(els.select.value);
      if (found) {
        renderBriefing(found);
        window.scrollTo(0, 0);
      }
    });

    window.addEventListener("hashchange", function () {

        "headline": "Solar-array spacewalk Thursday; SLS core stage stacks.",
        "stories": [
          {
            "headline": "Thursday’s spacewalk: Menon and Kutryk to install a new solar array",
            "body": "<p>NASA’s Anil Menon and Canada’s Joshua Kutryk step outside Thursday at 8 a.m. Eastern, with NASA+ coverage from 6:30, to install a roll-out solar array on the station’s port truss. Jessica Watkins and Luke Delaney will assist from inside. The crew also packed a failed robot-arm wrist joint to ride home on a Dragon in November.<\/p>",
            "sources": [
              {
                "name": "NASA",
                "url": "https://www.nasa.gov/blogs/spacestation/2026/10/27/spacewalk-preps-robotics-jobs-and-science-duties-fill-tuesday-schedule/"
              }
            ]
          },
          {
            "headline": "Artemis III: SLS core stage joins the boosters this week",
            "body": "<p>NASA said its core stage would be stacked between the twin boosters this week in the Vehicle Assembly Building. A shortened “stubby” stack will do fueling tests to fix past hydrogen leaks, and a stretched Centaur V is the chosen future upper stage. Artemis III, set for no earlier than summer 2027, will test docking with both Blue Origin’s and SpaceX’s landers in Earth orbit, and Axiom is developing a lighter “sortie” suit for two-hour moonwalks, with two paths kept open for a 2028 landing.<\/p>",
            "sources": [
              {
                "name": "NASASpaceflight",
                "url": "https://www.nasaspaceflight.com/2026/10/nasa-artemis-sls-sortie-suit-dual-paths/"
              },
              {
                "name": "NASA",
                "url": "https://www.nasa.gov/blogs/missions/2026/10/23/nasa-shares-artemis-acceleration-plans-for-moon-missions/"
              }
            ]
          },
          {
            "headline": "UVEX approved; Mars-simulation crew comes out Saturday",
            "body": "<p>NASA confirmed the 590-million-dollar UVEX telescope, which will make the first deep ultraviolet maps of the whole sky, for launch by January 2031. On Halloween, the four CHAPEA volunteers leave their 3D-printed Mars habitat in Houston after 378 days.<\/p>",
            "sources": [
              {
                "name": "NASA Science",
                "url": "https://science.nasa.gov/blogs/uvex/2026/10/27/nasas-uvex-space-telescope-successfully-passes-key-milestone/"

                "url": "https://www.nasa.gov/news-release/nasa-invites-media-to-crew-completion-of-yearlong-mars-simulation/"
              }
            ]
          },
          {
            "headline": "Swift’s mission ends after almost 22 years",
            "body": "<p>After a failed robotic rescue, the Swift observatory, built for two years, will reenter in the coming weeks after catching more than 2,000 gamma-ray bursts and feeding about 7,000 papers.<\/p>",
            "sources": [
              {
                "name": "Space.com",

        "stories": [
          {
            "headline": "Miami: Jericho 2026 continues in Little Haiti",
            "body": "<p>The week of renewal Archbishop Wenski opened on his 76th birthday at Notre Dame d’Haïti continues in Little Haiti. In Creole he preached that dignity comes from God, “not TPS or a green card,” and named pride, indifference and fear as walls to be torn down by prayer and the Word. Miami-Dade County, meanwhile, is one of eight communities receiving federal STREETS money for homeless outreach and recovery.<\/p>",
            "sources": [
              {
                "name": "Archdiocese of Miami",
                "url": "https://www.miamiarch.org/CatholicDiocese.php?op=Article_archdiocese-of-miami-archbishop-wenski-calls-for-faith-and-dignity-at-jericho-2026"
              },
              {

          },
          {
            "headline": "Miami: The archbishop stands firm on school vaccine rules",
            "body": "<p>Archbishop Wenski continues to resist Attorney General James Uthmeier’s pressure over religious exemptions in Catholic schools, calling it “bullying” and defending vaccination as serving the common good.<\/p>",
            "sources": [
              {
                "name": "WUSF",
                "url": "https://www.wusf.org/health-news-florida/2026-10-19/miami-archbishop-hits-back-ag-uthmeier-over-catholic-schools-vaccine-rules"

            ]
          },
          {
            "headline": "Rome: The Pope says faith must become culture",
            "body": "<p>At this morning’s audience, Pope Leo quoted Saint John Paul II, saying Christians must pair their faith with patient study and that the Church draws what is good, beautiful and true from every culture.<\/p>",
            "sources": [
              {
                "name": "Holy See Press Office",
                "url": "https://press.vatican.va/content/salastampa/en/bollettino/pubblico/2026/10/28/261028a.html"

              }
            ]
          },
          {
            "headline": "Africa: The continent now has more Catholics than Europe",
            "body": "<p>New Fides figures put Africa’s Catholics at 288.3 million against Europe’s 287.2 million. Africa added 7.58 million Catholics and 1,676 priests, and was the only continent where seminarians increased, by 786, as the world total fell by 2,891. Bishops including Archbishop Ignatius Kaigama of Abuja and Bishop Joseph Kacou Aka of Yamoussoukro are calling for transparent budgets, audits and local giving to sustain that growth.<\/p>",
            "sources": [
              {
                "name": "ACI Africa",
                "url": "https://www.aciafrica.org/news/24953/african-catholic-bishops-urge-local-support-financial-accountability-to-sustain-churchs-growth"
              }
            ]
          },
          {
            "headline": "Asia: Tagbilaran’s new bishop: “Let Bohol welcome the world” without losing itself",
            "body": "<p>At his installation, Bishop Crispin Varquez urged tourism that protects Bohol’s environment, workers and heritage, and told his people, “Allow me to love you.” <b>Who he is:<\/b> a Tagbilaran native, bishop of Borongan for 19 years through Typhoon Yolanda, now the diocese’s eighth bishop, with the motto “Humility and Simplicity.” Cardinal Jose Advincula preached, and about 50 bishops attended.<\/p>",
            "sources": [
              {
                "name": "CBCP News",
                "url": "https://cbcpnews.net/cbcpnews/new-tagbilaran-bishop-urges-growth-that-protects-environment-culture/"

              {
                "name": "Daily Tribune",
                "url": "https://tribune.net.ph/2026/10/27/bishop-crispin-varquez-installed-as-new-tagbilaran-bishop"
              }
            ]
          },
          {
            "headline": "Europe: Sicily buries Cardinal Paolo Romeo today",
            "body": "<p><b>Who he was:<\/b> a priest of Acireale who became a Vatican diplomat, nuncio in Haiti, Colombia, Canada and Italy, then archbishop of Palermo from 2006 to 2015; Benedict XVI made him a cardinal in 2010. He died Sunday at 88.<\/p>",
            "sources": [
              {
                "name": "Vatican News",

              }
            ]
          },
          {
            "headline": "Latin America: The Pope will meet abuse survivors on his trip",
            "body": "<p>The Nov. 6–17 visit to Uruguay, Argentina and Peru now includes a meeting with survivors, as Montevideo, Luján, Chiclayo and Cuzco prepare.<\/p>",
            "sources": [
              {
                "name": "The Washington Post (AP)",
                "url": "https://www.washingtonpost.com/world/2026/10/27/vatican-pope-abuse-trip/69daec20-d220-11f1-9931-2a41b76fc976_story.html"
              }
            ]
          },
          {
            "headline": "Appointments this week: Madagascar, Joliet, Italy and Greece",
            "body": "<p>Archbishop Jean Nicolas Rakotojaona now leads Fianarantsoa, Madagascar; born in 1973 with a theology doctorate from Fribourg, he was coadjutor until Sunday. Bishop Brendan Cahill, until now bishop of Victoria, Texas, is installed in Joliet on Nov. 11. Thursday, Giorgio Ferretti takes possession of Lucera-Troia in Italy; Saturday, Georgios Altouvas is installed at Syros in Greece, and Michele Di Tolve, a Milan priest, at Chioggia.<\/p>",
            "sources": [
              {

        "headline": "Countdown Oct. 27; Medjugorje Oct. 25; Africa’s Church rising.",
        "stories": [
          {
            "headline": "Countdown to the Kingdom: latest post Oct. 27, on the Divine Will",
            "body": "<p>Checked this morning, the newest post is Tuesday, Oct. 27: “How to Offer Your Ordinary Acts in the Divine Will,” in which Deacon Mike McKeown draws on Servant of God Luisa Piccarreta: before ordinary tasks, say interiorly, “Jesus wants to do this in me.” Before it: Marija’s Oct. 25 Medjugorje message, two Oct. 23 essays, “The Suicide of the West” and “Defending Your Family,” and Oct. 20 and 21 messages attributed to Pedro Regis in Brazil about “a great war” and “the one who opposes Christ.” The site asks readers to test every message with the Church, which alone judges authenticity.<\/p>",
            "sources": [
              {
                "name": "Countdown to the Kingdom",
                "url": "https://www.countdowntothekingdom.com/"
              },
              {
                "name": "Countdown to the Kingdom",
                "url": "https://www.countdowntothekingdom.com/how-to-offer-your-ordinary-acts-in-the-divine-will/"
              }
            ]
          },
          {
            "headline": "Medjugorje, Oct. 25 (latest): “Pray more strongly and more for the peace”",
            "body": "<p>The latest monthly message, given Oct. 25, 2026, through Marija: “A fire of hatred and wars is spreading in the hearts of people who do not want peace but their own weak interests. That is why, little children, you be prayer and my extended hands of love and peace for all those who are far from my motherly heart. Pray more strongly and more for the peace that God desires to give you but you do not want it. I am with you and I am praying that peace may prevail and reign in every heart.” The next monthly message is due Nov. 25.<\/p>",
            "sources": [
              {
                "name": "Medjugorje.ws",
                "url": "https://wap.medjugorje.ws/en/messages/261025m/"
              },
              {
                "name": "Medjugorje.org",
                "url": "https://www.medjugorje.org/olmmsg.htm"
              }
            ]
          },
          {
            "headline": "Reading the night beside the message",
            "body": "<p>Overnight brought both halves of the message. The fire: 88 drones over Ukraine, a missile on Saudi Arabia’s largest refinery claimed by the Houthis, talk of new strikes on Iran, and a UN warning that Sudan’s sieges could repeat El Fasher. The “extended hands”: 30 calm hours in Oleshky, Ethiopia’s and Eritrea’s leaders in the same city, Gulf states drafting a peace deal, and a Pope back in the square saying faith must become culture. The call is the same: pray more, and be peace where we are.<\/p>",
            "sources": [
              {
                "name": "Kyiv Independent",
                "url": "https://kyivindependent.com/ceasefire-in-oleshky-enters-30th-hour-as-russian-strikes-kill-2-injure-17-elsewhere-in-ukraine-over-past-day/"
              },
              {
                "name": "The Guardian",
                "url": "https://www.theguardian.com/world/2026/oct/28/gulf-states-multipart-peace-deal-avert-renewal-us-iran-war"

              {
                "name": "The Abay Times",
                "url": "https://abaytimes.com/politics/isaias-arrives-in-moscow-as-putin-schedules-talks-with-abiy"
              }
            ]
          },
          {
            "headline": "Missions: Africa’s Church overtakes Europe’s",
            "body": "<p>Fides counts 288 million Catholics in Africa, now more than in Europe, with Africa the only continent where seminarians increased. For a Church once evangelized by European missionaries, it is a striking reversal. Its bishops say the next test is sustaining that growth honestly, with budgets, audits and local generosity.<\/p>",
            "sources": [
              {
                "name": "ACI Africa",
                "url": "https://www.aciafrica.org/news/24953/african-catholic-bishops-urge-local-support-financial-accountability-to-sustain-churchs-growth"
              }
            ]
          },
          {
            "headline": "Revival on campus: 35 baptized at Ohio State; UniteUS keeps moving",
            "body": "<p>Nearly 1,000 people came to Ohio State’s fall kickoff, where 35 were baptized. UniteUS, which began at Auburn in 2023, reported more than 700 decisions for Christ and about 100 baptisms, some in plastic-lined truck beds, at Appalachian State, and held a campus night at South Alabama Tuesday; Belmont in Nashville is next, on Nov. 10. Local churches, not one big organization, are carrying much of this.<\/p>",
            "sources": [
              {
                "name": "WWJD",
                "url": "https://wwjd.com/news/ohio-state-fall-kickoff-35-baptisms/"
              },
              {
                "name": "Billy Graham Evangelistic Association",
                "url": "https://billygraham.org/decision-magazine/articles/spirit-movement-at-appalachian-state-university-worship-rally-includes-100-baptisms-in-plastic-lined-truck-beds"
              },
              {
                "name": "CBN News",
                "url": "https://cbn.com/news/us/700-students-choose-christ-100-get-baptized-revival-hits-appalachian-state"
              }
            ]
          },
          {
            "headline": "Eucharistic: Guatemala’s Cuilapa Host still under study",
            "body": "<p>In Cuilapa, a consecrated Host that witnesses say stayed intact in water for eight days and developed reddish stains is being examined by a multidisciplinary team. The diocese stresses only the Holy See can authorize veneration; cases like Sokółka in Poland took years of review.<\/p>",
            "sources": [
              {
                "name": "InfoVaticana",
                "url": "https://infovaticana.com/en/2026/10/23/new-testimonies-about-the-possible-eucharistic-manifestation-in-guatemala-three-months-after-the-event/"
              }
            ]
          },
          {
            "headline": "Digital money, soberly: the digital euro pilot signs up merchants",
            "body": "<p>The European Central Bank’s deadline for merchants to apply for its digital euro pilot closed Oct. 27. The 12-month pilot is planned from late 2027, while lawmakers still argue over offline payments, anti-money-laundering rules and fees. In Britain, the national ID card is scrapped but the government digital wallet goes on. These are real systems worth watching closely, with privacy the key question, not cause for panic.<\/p>",

                "name": "ECB",

              }

      {
        "id": "pick-me-up",
        "title": "Pick-me-up",
        "headline": "Heat at Atlanta tonight; Eva Mendes joins Starfighter.",
        "stories": [
          {
            "headline": "Heat at Atlanta tonight at 7, chasing a first win",
            "body": "<p>The 0–4 Heat visit the 2–2 Hawks at State Farm Arena. Atlanta is a 3.5-point favorite and is without Mouhamed Gueye (foot), with Veesaar out for the season. Giannis Antetokounmpo is coming off his first Heat triple-double, 29 points, 15 rebounds and 11 assists, in the 113–109 loss to Dallas. Indiana visits Kaseya Center Friday at 8.<\/p>",
            "sources": [

            "headline": "Four volunteers leave NASA’s yearlong Mars habitat on Oct. 31",
            "body": "<p>The CHAPEA crew will step out of their 3D-printed Mars habitat in Houston on Halloween after 378 days of simulated Mars life. Aboard the station, the crew kept preparing for Thursday’s spacewalk to install a roll-out solar array, and NASA praised the Alabama-built SLS rocket as Artemis III moves ahead.<\/p>",

            "headline": "Swift’s mission ends after 20 years; reentry expected within weeks",
            "body": "<p>NASA has formally ended the Neil Gehrels Swift Observatory after Katalyst’s robotic rescue craft failed to boost it. Swift was built for two years and lasted almost 22. It caught more than 2,000 gamma-ray bursts and 1,400 supernovae, and its data fed about 7,000 papers. It took its last data Oct. 20 and should fall back into the atmosphere in the coming weeks.<\/p>",

            "body": "<p>Under Competition Model 2.0, ordered by Administrator Jared Isaacman, early proposals will focus on scientific merit, and detailed engineering and costing come later. Discovery and New Frontiers selections drop from 35 months to about 19.5, and the smallest missions move to a single round. There are tougher penalties for cost overruns, up to cancellation.<\/p>",

            "headline": "Latin America: Survivors’ meeting added to the Pope’s trip",

            "body": "<p>On Saturday Archbishop Thomas Wenski consecrated the new altar of Our Lady of Mercy (La Merced) Mission at Corpus Christi parish. Founded in 2005 under Fr. José Luis Menéndez, the mission is known for hand-carved cedar altars by Bolivian craftsmen, 23-karat gold leaf applied by Cuban conservators, and more than 130 Latin American colonial paintings and sculptures. In his homily the archbishop spoke of the way of beauty, saying “beauty is strictly at the service of evangelization,” and that “here there is a place for all.”<\/p>",

            "headline": "China’s Long March 8A lofts nine Guowang internet satellites",
            "body": "<p>A Long March 8A lifted off from the Hainan commercial launch site at Wenchang at 10:03 p.m. Eastern on Saturday, carrying nine satellites for Guowang, China’s state broadband constellation and its answer to Starlink. It was the 674th flight of the Long March family.<\/p>",
            "sources": [
              {
                "name": "Xinhua",
                "url": "https://english.news.cn/20261025/7af8535c5bb6453196459c08ec6c8f10/c.html"
              },
              {
                "name": "NextSpaceflight",
                "url": "https://www.nextspaceflight.com/launches/details/8437/"
              }
            ]
          },
          {
            "headline": "Tonight: Starlink 15-16 from Vandenberg on a 26th-flight booster",
            "body": "<p>SpaceX targets 12:45 a.m. Eastern Tuesday, late tonight, to launch 27 Starlink satellites from Vandenberg in California. Booster B1082 will fly for the 26th time. Amazon’s Leo satellites are due to launch Thursday, and another Falcon flies Friday.<\/p>",

              {
                "name": "SpaceX",
                "url": "https://www.spacex.com/launches/sl-15-16"

              {
                "name": "NextSpaceflight",
                "url": "https://www.nextspaceflight.com/launches/details/8434/"
              }
            ]
          },
          {
            "headline": "Starship and new pads: November’s big test",
            "body": "<p>Starship’s next flight is eyed for November. Blue Origin is planning new Florida pads, and Starbase is seeking approval for up to 456 launches a year. Launch capacity is now the bottleneck for both moon programs.<\/p>",
            "sources": [
              {
                "name": "Ars Technica",
                "url": "https://arstechnica.com/space/2026/10/latest-estimate-for-starship-launches-required-to-support-a-moon-landing-22/"
              },
              {

            ]

        "headline": "NASA borrows Apollo’s urgency; science town hall today at 2.",
        "stories": [
          {
            "headline": "NASA adopts Apollo’s urgency to build a moon base in two years",
            "body": "<p>An AP report this weekend lays out administrator Jared Isaacman’s timeline. Artemis III next summer becomes an Earth-orbit docking test of both commercial landers, SpaceX’s and Blue Origin’s, with three launches in quick succession and an Italian astronaut on board. Artemis IV would land in 2028. The first moon-base cargo flight, Astrobotic’s second try for the south pole, comes by year’s end, and lighter Axiom “sortie suits” will be tested on the space station next year. Isaacman calls it “the same playbook that went from Apollo 7 splashdown to Apollo 11 in just nine months.”<\/p>",
            "sources": [
              {
                "name": "AP via The Weather Channel",
                "url": "https://weather.com/2026/10/25/science/space/nasa-adopts-apollos-urgency-to-build-moon-base-in-two-years"
              },
              {
                "name": "NASA",
                "url": "https://www.nasa.gov/blogs/missions/2026/10/23/nasa-shares-artemis-acceleration-plans-for-moon-missions/"
              }
            ],
            "why": "Safety advisers have warned that speed must not outrun crew safety. That tension will shape the next year."
          },
          {
            "headline": "Today at 2 p.m.: science town hall on faster mission selection",
            "body": "<p>NASA’s science directorate holds a town hall this afternoon on its “Competition Model 2.0.” The plan would cut the time from proposal to mission selection from about 35 months to 19.5.<\/p>",
            "sources": [
              {
                "name": "NASA Science",
                "url": "https://science.nasa.gov/directorates/smd/faster-to-science-a-letter-to-the-science-community/"
              }
            ]
          },
          {
            "headline": "Thursday: spacewalk to add a new solar array",
            "body": "<p>Astronauts Anil Menon and Joshua Kutryk prepare to install a roll-out solar array outside the space station on Thursday, Oct. 29.<\/p>",
            "sources": [
              {
                "name": "NASA",
                "url": "https://www.nasa.gov/blogs/spacestation/2026/10/23/advanced-research-spacewalk-preps-end-week-as-nasa-announces-artemis-status/"
              }
            ]
          },
          {
            "headline": "Stennis Space Center marks 65 years of rocket testing",
            "body": "<p>NASA’s Stennis Space Center in Mississippi, where engines from Saturn V to the Space Launch System were tested, is marking its 65th anniversary.<\/p>",
            "sources": [
              {
                "name": "NASA",
                "url": "https://www.nasa.gov/stennis/about-stennis/stennis-space-center-history/65th-anniversary/"
              }

        "headline": "Wenski dedicates La Merced altar; New York settlement; Madagascar succession.",
        "stories": [
          {
            "headline": "Miami: Archbishop Wenski dedicates a new altar at La Merced",
            "body": "<p>On Saturday Archbishop Thomas Wenski consecrated the new altar of Our Lady of Mercy (La Merced) Mission at Corpus Christi parish. Founded in 2005 under Fr. José Luis Menéndez, the mission is known for hand-carved cedar altars by Bolivian craftsmen, 23-karat gold leaf applied by Cuban conservators, and more than 130 Latin American colonial paintings and sculptures. In his homily the archbishop spoke of the way of beauty, saying “beauty is strictly at the service of evangelization,” and that “here there is a place for all.”<\/p>",
            "sources": [
              {
                "name": "Archdiocese of Miami",
                "url": "https://www.miamiarch.org/CatholicDiocese.php?op=Article_today-the-altar-upon-which-mass-will-be-celebrated-is-consecrated"
              }
            ],
            "why": "For a music minister: the rite of dedication is one of the richest liturgies in the book, and Miami rarely sees one."
          },
          {
            "headline": "Miami: Catholic schools’ vaccine rules fight continues",
            "body": "<p>Archbishop Wenski is still pushing back against Attorney General James Uthmeier over vaccine requirements in Catholic schools. The archdiocese says its schools may set their own health standards.<\/p>",
            "sources": [
              {
                "name": "WUSF",
                "url": "https://www.wusf.org/health-news-florida/2026-10-19/miami-archbishop-hits-back-ag-uthmeier-over-catholic-schools-vaccine-rules"
              }
            ]
          },
          {
            "headline": "Africa: Madagascar’s Fianarantsoa gets a new archbishop",
            "body": "<p>Pope Leo accepted the resignation of Archbishop Fulgence Rabemahafaly of Fianarantsoa, 75, on Sunday. His coadjutor, Jean Nicolas Rakotojaona, succeeds him immediately. <b>Who he is:<\/b> born in Antananarivo in 1973 and ordained in 2002, he earned a doctorate in theology at Fribourg, led a seminary, and became auxiliary bishop of Morondava in 2023 and coadjutor a year ago.<\/p>",
            "sources": [
              {
                "name": "ACI Africa",
                "url": "https://www.aciafrica.org/news/24921/pope-leo-xiv-accepts-retirement-of-catholic-archbishop-in-madagascar-names-successor"

              {

                "url": "https://press.vatican.va/content/salastampa/it/bollettino/pubblico/2026/10/25/0837/01554.html"
              }
            ]
          },
          {
            "headline": "North America: New York archdiocese agrees to $800 million abuse settlement",
            "body": "<p>The Archdiocese of New York and about 1,300 survivors of clergy abuse agreed to an $800 million settlement, the second-largest by a US archdiocese. Archbishop Ronald Hicks told clergy it will be final when signed during the week of Nov. 6 and prayed it would “bring some measure of healing and reconciliation.” Separately, Milwaukee’s Archbishop Jeffrey Grob and Des Moines’ Bishop William Joensen said a White House prayer visit was publicized for politics without their consent.<\/p>",
            "sources": [
              {
                "name": "PBS NewsHour (AP)",

                "name": "National Catholic Register",

              }
            ]
          },
          {
            "headline": "North America: Indianapolis to host the 2029 Eucharistic Congress",
            "body": "<p>The National Eucharistic Congress returns to Indianapolis in 2029, building on the 2024 congress that drew about 50,000 people.<\/p>",
            "sources": [
              {
                "name": "National Eucharistic Congress",
                "url": "https://eucharisticcongress.org/post/press-releases/national-eucharistic-congress-to-return-to-indianapolis-in-2029/"
              }
            ]
          },
          {
            "headline": "Europe: Italy mourns Cardinal Paolo Romeo",
            "body": "<p>Cardinal Paolo Romeo, archbishop of Palermo from 2006 to 2015, died Sunday at 88. <b>Who he was:<\/b> a Sicilian Vatican diplomat who served as papal nuncio in several countries, including Italy, before Benedict XVI sent him to Palermo. In 2013 he presided over the beatification of Blessed Pino Puglisi, the priest murdered by the mafia. His funeral is Wednesday in Acireale.<\/p>",
            "sources": [
              {
                "name": "Vatican News",
                "url": "https://www.vaticannews.va/it/vaticano/news/2026-10/morte-palermo-cardinale-romeo-servizio-chiesa.html"

            ]
          },
          {
            "headline": "Middle East: Christians in Jordan bury their dead as suspects are caught",
            "body": "<p>The Orthodox community of Hamoud, near Karak, is mourning those killed in Friday’s funeral attack. Pope Leo prayed for them at the Angelus, and all three suspects were arrested this morning.<\/p>",
            "sources": [
              {
                "name": "Al Jazeera",
                "url": "https://www.aljazeera.com/news/2026/10/26/jordan-arrests-three-suspects-in-deadly-church-attack"
              }
            ]
          },
          {
            "headline": "Asia: Korea’s bishops elect a new president ahead of Seoul WYD",
            "body": "<p>Korea’s bishops elected Bishop Augustine Kim Jong-su of Daejeon as conference president and approved new guidelines on sexual violence in the Church. <b>Who he is:<\/b> Kim, 70, chaired the bishops’ special committee that drafted those guidelines, and his conference is preparing for World Youth Day in Seoul in 2027. In the Philippines, Bishop Crispin Varquez is installed at Tagbilaran on Tuesday.<\/p>",
            "sources": [
              {

            "headline": "Latin America: Brazil’s bishops had asked respect for the ballot box",
            "body": "<p>Before Sunday’s runoff, the Brazilian bishops’ Permanent Council defended democracy and a conscientious vote without naming candidates, while 64 bishops signed a separate letter. With Flávio Bolsonaro disputing the result, that call to accept the ballot box now applies.<\/p>",
            "sources": [
              {
                "name": "CNBB",

            ]
          },
          {
            "headline": "Appointments calendar: installations this week",
            "body": "<p>Tuesday, Oct. 27: Crispin Varquez, the former bishop of Borongan, is installed at Tagbilaran in the Philippines. Thursday: Giorgio Ferretti takes possession of Lucera-Troia in Italy. Saturday, Oct. 31: Jean Abou Charouche is ordained Melkite exarch for Argentina, Georgios Altouvas is installed at Syros in Greece, and Michele Di Tolve, a priest of Milan, at Chioggia. Bishop Emeritus Virginio Bressanelli of Neuquén, Argentina, died Oct. 23.<\/p>",

      {
        "id": "signs",
        "title": "Signs of the times",
        "headline": "Countdown Oct. 25; Medjugorje Oct. 25: “a fire of hatred.”",
        "stories": [
          {
            "headline": "Medjugorje, Oct. 25: “A fire of hatred and wars is spreading”",
            "body": "<p>Our Lady’s monthly message through the visionary Marija, given Oct. 25, 2026: “Dear children! A fire of hatred and wars is spreading in the hearts of people who do not want peace but their own weak interests. That is why, little children, you be prayer and my extended hands of love and peace for all those who are far from my motherly heart. Pray more strongly and more for the peace that God desires to give you, but you do not want it. I am with you and I am praying that peace may prevail and begin to reign in every heart. Thank you for having responded to my call.”<\/p><p>It came on the same day the Assisi peace meeting opened and the Pope pleaded for Yemen. The Vatican’s 2024 nulla osta encourages the spiritual fruits of Medjugorje without declaring the messages supernatural.<\/p>",
            "sources": [
              {
                "name": "Medjugorje.hr",
                "url": "https://medjugorje.hr/en/our-lady-messages-archive"
              },
              {
                "name": "Medjugorje.org",
                "url": "https://www.medjugorje.org/olmmsg.htm"
              }
            ],
            "why": "The message asks for a response, not fear: be prayer, and be her hands of peace."
          },
          {
            "headline": "Countdown to the Kingdom: latest post Oct. 25",
            "body": "<p>The site’s newest post, dated Sunday, Oct. 25, carries the Medjugorje message under the title “Marija – A Fire of Hatred is Spreading.” Earlier posts were “The Suicide of the West” and “Defending Your Family” on Oct. 23, and Pedro Regis messages on Oct. 20 and 21: “There Will be a Great War” and “The One Who Opposes Christ.”<\/p>",
            "sources": [
              {
                "name": "Countdown to the Kingdom",
                "url": "https://www.countdowntothekingdom.com/marija-a-fire-of-hatred-is-spreading/"
              },
              {
                "name": "Countdown to the Kingdom",
                "url": "https://www.countdowntothekingdom.com/"
              }
            ]
          },
          {
            "headline": "Anguera, Oct. 24: “Forward without fear!”",
            "body": "<p>Message No. 5,994, attributed to Our Lady through Pedro Regis in Anguera, Brazil, was given Saturday, Oct. 24, on the eve of the runoff. It asks a return to Jesus and says “tomorrow will be better for men and women of prayer.” It names Confession, the Eucharist, Scripture, the Rosary, consecration to the Immaculate Heart and fidelity to the true Magisterium as “the weapons for your great victory,” and warns of “long years of hard trials,” ending: “Forward without fear!” The local bishop has not issued a judgment on these messages, so they call for prudent discernment.<\/p>",
            "sources": [
              {
                "name": "Apelos Urgentes",
                "url": "https://apelosurgentes.com.br/pt-br/mensagens/"
              }
            ]
          },
          {
            "headline": "Wars and rumours of wars: a weekend of missiles and martyrs",
            "body": "<p>The weekend gave the Medjugorje message context. Houthi missiles were fired at Saudi cities, mourners were attacked at an Orthodox church in Jordan, 140 drones flew over Ukraine, and today is one year since El Fasher fell. Against that, more than 53 nations’ religious leaders are praying in Assisi through Tuesday. Christ’s words in Matthew 24 apply: “See that you are not alarmed.”<\/p>",
            "sources": [
              {
                "name": "Vatican News",
                "url": "https://www.vaticannews.va/en/church/news/2026-10/international-meeting-peace-assisi-more-than-words-actions.html"
              },
              {
                "name": "Al Jazeera",
                "url": "https://www.aljazeera.com/news/2026/10/26/jordan-arrests-three-suspects-in-deadly-church-attack"
              }
            ]
          },
          {
            "headline": "Revival: campus baptisms keep climbing this fall",
            "body": "<p>The fall’s campus revival continues to grow. Appalachian State reports more than 700 decisions for Christ and 100 baptisms, Ohio State 35 baptisms, Pearl River 59, Pepperdine 19 and Howard Payne 17. In the Church, US dioceses report an average 38 percent rise in people entering at Easter 2026.<\/p>",
            "sources": [
              {
                "name": "CBN News",
                "url": "https://cbn.com/news/us/700-students-choose-christ-100-get-baptized-revival-hits-appalachian-state"
              },
              {
                "name": "WWJD",
                "url": "https://wwjd.com/news/campus-baptisms-fall-2026/"
              },
              {
                "name": "National Catholic Register",
                "url": "https://www.ncregister.com/cna/us-dioceses-report-elevated-numbers-for-2026-new-catholics"
              }
            ]
          },
          {
            "headline": "Eucharistic: new testimony on Guatemala’s Cuilapa Host",
            "body": "<p>Three months on, witnesses in Cuilapa, Guatemala, describe a consecrated Host that stayed intact in water for eight days and developed reddish stains. A multidisciplinary team is studying it, and the diocese stresses that only the Holy See can authorize public veneration.<\/p>",
            "sources": [
              {
                "name": "InfoVaticana",
                "url": "https://infovaticana.com/en/2026/10/23/new-testimonies-about-the-possible-eucharistic-manifestation-in-guatemala-three-months-after-the-event/"
              }
            ]
          },
          {
            "headline": "Digital ID and money, soberly: Europe’s next steps",
            "body": "<p>The digital euro does not exist yet. The ECB plans a pilot in late 2027 and possible issuance in 2029. Negotiators meet Nov. 5 on holding limits, offline payments, money-laundering rules and fees. Separately, the European Payments Council launched SCARLET to standardize how the coming EU Digital Identity Wallet approves payments. These are real steps toward digital money and identity, and the safeguards in them are being argued in public.<\/p>",
            "sources": [
              {
                "name": "The European Post",
                "url": "https://theeuropeanpost.eu/european-affairs/trilogue-talks-put-the-digital-euro-holding-limit-on-the-line/"
              },
              {
                "name": "European Payments Council",
                "url": "https://www.europeanpaymentscouncil.eu/news-insights/news/epc-launches-scarlet-initiative-support-consistent-use-eu-digital-identity"
              }
            ],
            "why": "What to watch: whether the Nov. 5 deal keeps cash protected and caps how much any person can hold."
          }

          {
            "headline": "Today: Mini Monster Monday at the Children’s Museum",
            "body": "<p>Miami Children’s Museum on Watson Island holds Mini Monster Monday today. There’s trick-or-treating at noon and 3:30, a “Creepy Pair of Underwear” show and a little haunted house, and the museum is open 10 to 6. The 3:30 round fits after pickup.<\/p>",

          },
          {
            "headline": "This week: trunk-or-treats and Halloween parties",
            "body": "<p>Wednesday at 6 p.m. Miami-Dade Schools Police hosts a trunk-or-treat at 3300 NW 27th Ave. Thursday from 4 to 8, Hialeah Cares throws a Halloween party at Miami Dade College Hialeah. Saturday from 2 to 5:30 there’s a costume party at North Dade Regional Library, plus MiChi-Boo at the Children’s Museum. Tidal Cove’s “Tidal-ween” runs Saturday and Sunday.<\/p>",

              {

          {
            "headline": "Thursday: VOUS Worship “Man Alive,” free at Bayfront Park",
            "body": "<p>VOUS Worship brings its “Man Alive” night to the FPL Solar Amphitheater at Bayfront Park on Thursday, Oct. 29. Doors open at 6, the music runs 7 to 10, and admission is free.<\/p>",

            "headline": "Coming up: Crowder, Braveheart Summit and Gilberto Daza",

        "id": "pick-me-up",
        "title": "Pick-me-up",
        "headline": "Heat host Dallas tonight; Maul’s teaser; Vader on Monday Night Football.",
        "stories": [
          {
            "headline": "Heat look for a first win tonight against Dallas",
            "body": "<p>Miami lost 115–110 at Charlotte on Saturday to fall to 0–3. Brandon Miller scored 34 for the Hornets, and Giannis Antetokounmpo was held to 14 in 25 minutes before fouling out with 1:57 left. There is a bright spot: Davion Mitchell is averaging 17 points and shooting 46.7 percent from three. Tonight at 7:30 the Heat host the Mavericks at Kaseya Center. Young star Cooper Flagg is out with a shoulder injury, and Kyrie Irving is expected back. Erik Spoelstra says hard starts are when a team will “collectively build a resolve.”<\/p>",

              {

            ]
          },
          {
            "headline": "Star Wars: “Chains can be broken” in Maul’s new teaser",
            "body": "<p>StarWars.com has released the teaser for the animated series “Star Wars: Maul – Shadow Lord,” with the tagline “Chains can be broken. Empires can be shattered.” Fans are also marking ten years of Rogue One this season.<\/p>",

              {

        "stories": [
          {
            "headline": "Ending the war: Starlink restored, truce still set for Tuesday",
            "body": "<p>Promise: end the war in Ukraine. What was done: after the President said he had heard the Starlink speed limits were “fixed,” President Zelensky confirmed full speeds were back this morning and thanked the President and Congress; the Oleshky truce takes effect Tuesday, with talks in Abu Dhabi in early November. Real impact: three people were killed in Synelnykove tonight, and both sides kept up deep drone strikes. Room for disagreement: supporters see steady pressure producing a truce and talks; critics note the killing goes on while the details are negotiated.<\/p>",

            ]

          {
            "headline": "Peace through strength: Iran offers to reopen Hormuz if the blockade ends",
            "body": "<p>Promise: stop Iran’s threats and keep shipping open. What was done: the President has warned of “another little Epic Fury” and kept the naval blockade of Iranian ports in place. Real impact: Iran’s ambassador to Pakistan says Tehran offered to reopen the Strait if the blockade is lifted, and that Washington refused; meanwhile mines, Houthi missiles and Saudi strikes widened the war today. Room for disagreement: hawks say the blockade is the leverage that brought Iran to offer anything; critics say lifting it could reopen shipping and lower fuel prices.<\/p>",
            "sources": [
              {
                "name": "Gulf News",

                "url": "https://www.thenationalnews.com/news/mena/2026/10/24/iran-us-war-live-trump-epic-fury/"
              }
            ]
          },
          {
            "headline": "Fair trade: a tariff reshuffle on Canada",
            "body": "<p>Promise: protect American workers with reciprocal trade. What was done: a new proclamation swaps which Canadian goods face Section 338 duties, effective Oct. 30, dropping items such as plywood and packing crates and adding valves and carpets. Real impact: the duties stay in place, just on a different list of goods. Room for disagreement: the White House says Canada walked away from a deal and retaliated; critics warn tariffs raise prices on both sides of the border.<\/p>",
            "sources": [
              {
                "name": "The White House",
                "url": "https://www.whitehouse.gov/fact-sheets/2026/10/fact-sheet-president-donald-j-trump-further-modifies-canadian-products-subject-to-tariffs-under-section-338/"
              }
            ]
          },
          {
            "headline": "Election integrity: the President votes in person",
            "body": "<p>Promise: secure, trustworthy elections. What was done: the President and First Lady voted in person at the Palm Beach County elections office today, after he has urged limits on mail voting; the Justice Department’s Alaska suit is before a federal judge. Real impact: Florida’s early voting is open statewide through Oct. 31. Room for disagreement: supporters say voting in person shows confidence in the process; critics note he voted by mail as recently as August.<\/p>",
            "sources": [
              {
                "name": "AP News",
                "url": "https://apnews.com/article/trump-voting-florida-midterms-2195b4226316fa8cb13b875f08d5df88"
              },
              {
                "name": "USA Today",

              }
            ]
          },
          {
            "headline": "MAHA: “U.S.-Caught” seafood labels and a crackdown on short weights",
            "body": "<p>Promise: honest, healthy food for American families. What was done: the FDA issued draft guidance for “U.S.-Caught” labels on qualifying seafood and put 11 foreign firms on import alert after finding 46% of sampled imports overstated their weight with ice glaze. Real impact: easier-to-spot American seafood once final; comments are open until Dec. 13. Room for disagreement: fishermen welcome it, but the labels are voluntary and still in draft.<\/p>",
            "sources": [
              {
                "name": "HHS",
                "url": "https://www.hhs.gov/press-room/fda-advances-america-first-seafood-strategy-us-origin-labeling.html"
              }
            ]
          },
          {
            "headline": "Lower costs and MAHA: housing order and Alzheimer’s plan move to agencies",
            "body": "<p>Promise: affordable homes and a focus on preventing chronic disease. What was done: this week’s housing order tells the FHFA to pilot cancelling mortgage insurance for borrowers with enough equity, and HHS launched a national Alzheimer’s prevention plan with up to 48.8 million dollars for earlier detection. Real impact: both depend on how fast agencies act. Room for disagreement: builders and patient advocates welcome the steps; economists note high rates still drive housing costs, and caregivers want help now.<\/p>",

          {
            "headline": "Starlink in Ukraine: speeds restored, and a sharp exchange",
            "body": "<p>Ukraine’s Defense Ministry says Starshield links are stable again above 400 km/h, after more than a week capped near 160. Musk wrote on X that Ukraine’s military had “violated Starlink terms of service” by using it for offensive drone strikes, a “loophole” he says was closed, and added that without Starlink “the Ukrainian front line would collapse.” Ukrainian officials deny the charge, and Sen. Richard Blumenthal has opened an inquiry into who ordered the limits.<\/p>",

          {
            "headline": "Filing: any Tesla merger needs Musk’s own sign-off",
            "body": "<p>SpaceX’s quarterly filing says any combination with Tesla would need approval from its special committee, its board and its “controlling shareholder,” Elon Musk, who holds roughly 85% of SpaceX’s voting power, At Tesla, approval requires a majority of all outstanding shares, not just those voting; a vote could come near Tesla’s Dec. 3 annual meeting. One estimate gives Musk about 57% of the combined company’s votes.<\/p>",

          },
          {
            "headline": "Stocks: SpaceX ends the week on a double upgrade",
            "body": "<p>SpaceX closed Friday at 147.49 dollars, up 1.89%, after Phillip Securities moved from Sell to Buy and raised its target from 75 to 250 dollars, citing the AI unit’s 7.6 billion dollars in quarterly sales. Tesla slipped 0.6% to 372.22. Reports that SpaceX is negotiating leases on at least 80,000 U.S. cell towers weighed on telecom stocks.<\/p>",

            "headline": "Starlink 15-15 finally flies; the Falcon era winds down",
            "body": "<p>A Falcon 9 lifted 27 Starlink satellites from Vandenberg at 6:48 p.m. Eastern Friday, and booster B1063 landed on its 36th flight. Starlink launches are slowing as SpaceX shifts to Starship, and Florida has already flown its last Falcon Starlink mission.<\/p>",

          {
            "headline": "Grok goes to business with 130 partners",
            "body": "<p>SpaceX’s AI unit, built on xAI, launched a partner network for consultancies and software firms to deploy Grok, with more than 130 early members including Nvidia, Snowflake, Databricks, Bain and Booz Allen. The AI business was SpaceX’s largest revenue line last quarter, at 7.56 billion dollars.<\/p>",

            "headline": "Tesla: Cybercab sales to private buyers by year’s end",
            "body": "<p>Tesla says it expects to start selling the Cybercab, its robotaxi with no steering wheel or pedals, to private buyers by the end of the year, while federal safety regulators continue to review how it meets vehicle standards. The company also plans to widen robotaxi service, starting with Dallas next month. Tesla shares are down about 17% this year.<\/p>",

            "headline": "Starlink 15-15 lifts off on the fourth try",
            "body": "<p>SpaceX launched 27 Starlink satellites from Vandenberg Space Force Base at 6:48 p.m. Eastern Friday. Booster B1063, which launched NASA’s DART asteroid mission in 2021, flew for the 36th time and landed on the droneship Of Course I Still Love You. It was the 116th Falcon 9 flight of 2026.<\/p>",

          {
            "headline": "Starship: next flight eyed for November",
            "body": "<p>NASA’s Artemis manager says SpaceX is targeting “the November time frame” for the next Starship flight. NASA’s safety panel estimates about 22 refuelling flights for a Starship Moon landing; Musk says six to eight.<\/p>",

          {
            "headline": "Blue Origin plans new Florida pads; Starbase seeks 456 launches a year",
            "body": "<p>Blue Origin plans a 330-million-dollar expansion at Cape Canaveral with two new pads by mid-2027, though New Glenn has not flown since a May test explosion. The FAA is reviewing SpaceX’s plan for up to 456 Starship launches a year from Texas, with comments due Nov. 30.<\/p>",

        "headline": "Spacewalk Thursday; Dragonfly simulated flight; Artemis III 2027.",
        "stories": [
          {
            "headline": "Spacewalk set for Thursday to add a new solar array",
            "body": "<p>NASA astronaut Anil Menon and Canadian astronaut Joshua Kutryk will step outside the space station on Thursday, Oct. 29, to install a roll-out solar array on the truss, with Jessica Watkins and Luke Delaney running the robotic arm. This week Expedition 75 also worked on bioprinting research.<\/p>",
            "sources": [
              {
                "name": "NASA",
                "url": "https://www.nasa.gov/blogs/spacestation/2026/10/23/advanced-research-spacewalk-preps-end-week-as-nasa-announces-artemis-status/"
              }
            ]
          },
          {
            "headline": "Dragonfly “flies” over Titan, in simulation",
            "body": "<p>NASA’s Dragonfly rotorcraft completed its most complete test yet of its first flight on Saturn’s moon Titan, run in real time on flight-like computers at Johns Hopkins APL with simulated cameras, lidar and sensors. “The cool thing about first flight is that it’s our most challenging flight,” said engineer Zach Putnam. Dragonfly launches no earlier than 2028 and arrives in 2034.<\/p>",
            "sources": [
              {
                "name": "NASA Science",
                "url": "https://science.nasa.gov/blogs/dragonfly/2026/10/23/nasas-dragonfly-completes-first-simulated-flight/"
              }
            ]
          },
          {
            "headline": "Artemis III holds for summer 2027; landing in 2028",
            "body": "<p>Administrator Jared Isaacman says the SLS will be stacked this month, with a tanking test by year’s end and Artemis III launching between about May and September 2027. The Earth-orbit mission will dock with test versions of both Moon landers, Blue Origin’s Blue Moon and SpaceX’s Starship, before Artemis IV attempts the first landing since Apollo in 2028.<\/p>",
            "sources": [
              {
                "name": "NASA",
                "url": "https://www.nasa.gov/blogs/missions/2026/10/23/nasa-shares-artemis-acceleration-plans-for-moon-missions/"
              },
              {
                "name": "Aerospace America",
                "url": "https://aerospaceamerica.aiaa.org/nasa-eyeing-year-end-tanking-test-and-summer-2027-launch-for-artemis-iii/"
              },
              {
                "name": "AP News",
                "url": "https://apnews.com/article/nasa-artemis-moon-astronauts-space-0a535368f718cb42f5b9c3378d3953c2"
              }
            ]
          },
          {
            "headline": "Science town hall Monday on faster mission picks",
            "body": "<p>Science chief Nicola Fox’s “Competition Model 2.0,” which aims to cut mission selection from about 35 months to 19.5, gets a public town hall on Monday, Oct. 26, at 2 p.m. Eastern.<\/p>",
            "sources": [
              {
                "name": "NASA Science",
                "url": "https://science.nasa.gov/directorates/smd/faster-to-science-a-letter-to-the-science-community/"
              }
            ]
          },
          {
            "headline": "Safety advisers warn about crew access to orbit",
            "body": "<p>NASA’s Aerospace Safety Advisory Panel warned the agency risks losing human access to low Earth orbit as Crew Dragon nears retirement and commercial stations remain uncertain, and flagged “numerous firsts” in the Moon-landing plan. Its warning ties the station’s future to the same budget and schedule pressures driving the Moon push.<\/p>",
            "sources": [
              {
                "name": "SpaceNews",
                "url": "https://spacenews.com/nasa-safety-advisers-warn-agency-risks-losing-crewed-access-to-leo/"

      {

        "stories": [
          {
            "headline": "Miami: Little Flower’s new pipe organ premieres tonight",
            "body": "<p>Organist Nathan Laube inaugurates the new French Romantic pipe organ at Church of the Little Flower in Coral Gables tonight at 7:30, free and open to all, as the parish marks its centennial. The instrument was a decade in the making. Emmaus retreats also continue across the archdiocese this weekend.<\/p>",

              {
                "name": "Archdiocese of Miami",
                "url": "https://www.miamiarch.org/CatholicDiocese.php?op=Article_archdiocese-of-miami-around-the-archdiocese-coming-up-this-weekend-10-23-2026"

              }
            ]
          },
          {
            "headline": "Miami: Archbishop Wenski at Jericho 2026: “God gave us our dignity”",
            "body": "<p>Celebrating his 76th birthday at Notre Dame d’Haïti in Little Haiti, Archbishop Thomas Wenski opened Jericho 2026, the parish’s week of renewal, with a homily in Haitian Creole. “It is not TPS or a green card that gives us dignity,” he said; it is God who gave us our dignity. He urged the community toward “byen viv ansanm,” living well together. Fr. Reginald Jean-Mary leads the parish.<\/p>",
            "sources": [
              {
                "name": "Archdiocese of Miami",
                "url": "https://www.miamiarch.org/CatholicDiocese.php?op=Article_archdiocese-of-miami-archbishop-wenski-calls-for-faith-and-dignity-at-jericho-2026"
              }
            ]
          },
          {
            "headline": "Miami: “We are a people of both,” faith and medicine",
            "body": "<p>In the Florida Catholic, Archbishop Wenski urged compassion for people living with mental illness, saying Catholics need not choose between faith and medicine: “We are a people of both.” He pointed to Catholic Charities of Miami, now in its 95th year, and its St. Luke’s Center as places of help.<\/p>",
            "sources": [
              {
                "name": "Florida Catholic",
                "url": "https://www.thefloridacatholic.org/dioceses/miami/archbishop-urges-compassion-for-those-with-mental-illness/article_90a269c0-bcae-4826-acc3-d6c8c3fe9c77.html"
              }
            ]
          },
          {
            "headline": "Rome: six new Venerables, two of them missionary bishops",
            "body": "<p>Pope Leo approved decrees on the heroic virtues of six Servants of God. Who they are: Friedrich Kaiser Depel, a German-born missionary who became the first prelate of Caravelí in Peru and founded the Missionary Sisters of Jesus, Word and Victim; Oreste Marengo, a Salesian bishop in northeast India; Margarita “Luminosa” Bavosi, a consecrated laywoman of the Focolare; Fathers Domenico Pogliani of Milan and Alessandro Vitetti of Rossano-Cariati; and Capuchin friar Daniele of San Giovanni Rotondo, a spiritual son of Saint Pio. The Pope also received Patriarch Bartholomew I.<\/p>",

            "body": "<p>Checked again this evening: Countdown to the Kingdom’s newest posts remain the two dated Friday, Oct. 23, “The Suicide of the West,” on Mark Mallett’s reflection about the collapse of Christendom, and “Defending Your Family,” recalling Sr. Lúcia’s warning that “the decisive battle between the kingdom of Christ and Satan will be over marriage and the family.” Just before them, on Oct. 20 and 21, the site posted Pedro Regis messages warning of “a great war” and of “the one who opposes Christ.” The site itself urges readers to test every message with the Church.<\/p>",
