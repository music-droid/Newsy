  <meta name="description" content="Short, bounded news briefings — not a news portal.">
  <meta name="color-scheme" content="light">
  <meta name="theme-color" content="#6b4f3a">

       multi-file HTTPS deploy (index.html + manifest + sw.js + icons). Service
       workers do not run from file://. See HOME-SCREEN.md. -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400;600&family=Source+Serif+4:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
  <style>
/* Newsy — calm briefings, not a news portal */
:root {
  --bg: #f7f3ec;
  --bg-soft: #f0eae0;
  --ink: #2c2925;
  --ink-muted: #5c564e;
  --ink-faint: #8a8278;
  --accent: #6b4f3a;
  --accent-soft: #c4a882;
  --rule: #e0d6c8;
  --chip: #fffdf9;
  --chip-active: #6b4f3a;
  --chip-active-ink: #f7f3ec;
  --link: #4a6b5a;
  --link-hover: #355244;
  --max: 38rem;
  --font: "Source Serif 4", "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif;
  --font-ui: "Source Sans 3", "Segoe UI", system-ui, -apple-system, sans-serif;
}

*,
*::before,
*::after {
  box-sizing: border-box;
}

html {
  font-size: 112.5%; /* ~18px */
  -webkit-text-size-adjust: 100%;
}

body {
  margin: 0;
  min-height: 100vh;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font);
  line-height: 1.65;
  font-weight: 400;
}

a {
  color: var(--link);
  text-decoration-thickness: 1px;
  text-underline-offset: 0.15em;
}

a:hover {
  color: var(--link-hover);
}

.wrap {
  width: min(100% - 2rem, var(--max));
  margin-inline: auto;
  padding-block: 2rem 4rem;
}

/* Header */
.site-header {
  border-bottom: 1px solid var(--rule);
  padding-bottom: 1.25rem;
  margin-bottom: 1.75rem;
}

.brand {
  font-family: var(--font-ui);
  font-size: 0.75rem;
  font-weight: 600;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: var(--accent);
  margin: 0 0 0.35rem;
}

.briefing-title {
  font-size: clamp(1.45rem, 4vw, 1.85rem);
  font-weight: 600;
  line-height: 1.25;
  margin: 0 0 0.25rem;
  letter-spacing: -0.01em;
}

.meta {
  font-family: var(--font-ui);
  font-size: 0.85rem;
  color: var(--ink-muted);
  margin: 0;
}

/* Picker — chips */
.picker {
  margin: 0 0 2rem;
}

.picker-label {
  font-family: var(--font-ui);
  font-size: 0.7rem;
  font-weight: 600;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--ink-faint);
  margin: 0 0 0.6rem;
}

.chips {
  display: flex;
  flex-wrap: wrap;
  gap: 0.4rem;
  list-style: none;
  margin: 0;
  padding: 0;
}

.chip {
  font-family: var(--font-ui);
  font-size: 0.8rem;
  appearance: none;
  border: 1px solid var(--rule);
  background: var(--chip);
  color: var(--ink-muted);
  border-radius: 999px;
  padding: 0.35rem 0.85rem;
  cursor: pointer;
  transition: background 0.15s ease, color 0.15s ease, border-color 0.15s ease;
}

.chip:hover {
  border-color: var(--accent-soft);
  color: var(--ink);
}

.chip[aria-pressed="true"] {
  background: var(--chip-active);
  border-color: var(--chip-active);
  color: var(--chip-active-ink);
}

.chip:focus-visible {
  outline: 2px solid var(--accent-soft);
  outline-offset: 2px;
}

/* Beats */
.beats {
  display: flex;
  flex-direction: column;
  gap: 2rem;
}

.beat {
  padding-top: 0.25rem;
}

.beat-title {
  font-size: 1.05rem;
  font-weight: 600;
  margin: 0 0 0.65rem;
  padding-bottom: 0.4rem;
  border-bottom: 1px solid var(--rule);
  color: var(--accent);
  letter-spacing: 0.01em;
}

.beat-body {
  margin: 0;
}

.beat-body p {
  margin: 0 0 0.85rem;
}

.beat-body p:last-child {
  margin-bottom: 0;
}

.sources {
  margin-top: 0.85rem;
  padding-top: 0.55rem;
  border-top: 1px dotted var(--rule);
  font-family: var(--font-ui);
  font-size: 0.8rem;
  color: var(--ink-muted);
  line-height: 1.55;
}

.sources-label {
  font-weight: 600;
  color: var(--ink-faint);
  margin-right: 0.35rem;
}

.sources a {
  word-break: break-word;
}

.sources .sep {
  color: var(--ink-faint);
  margin: 0 0.3rem;
}

.sources .name-only {
  color: var(--ink-muted);
}

/* Status / empty */
.status {
  font-family: var(--font-ui);
  font-size: 0.9rem;
  color: var(--ink-muted);
  padding: 1.5rem 0;
}

.site-footer {
  margin-top: 3rem;
  padding-top: 1rem;
  border-top: 1px solid var(--rule);
  font-family: var(--font-ui);
  font-size: 0.75rem;
  color: var(--ink-faint);
}

.site-footer p {
  margin: 0;
}

/* Print — quiet page, no chrome clutter */
@media print {
  :root {
    --bg: #fff;
    --ink: #111;
    --ink-muted: #333;
    --rule: #ccc;
    --accent: #333;
    --link: #000;
  }

  body {
    background: #fff;
    font-size: 11pt;
    line-height: 1.5;
  }

  .wrap {
    width: 100%;
    max-width: none;
    padding: 0;
  }

  .picker,
  .site-footer {
    display: none;
  }

  .site-header {
    border-bottom-color: #999;
  }

  .beat {
    break-inside: avoid;
  }

  a {
    color: inherit;
    text-decoration: none;
  }

  .sources a::after {
    content: " (" attr(href) ")";
    font-size: 0.75em;
    color: #555;
  }
}

@media (max-width: 480px) {
  html {
    font-size: 106.25%;
  }

  .wrap {
    width: min(100% - 1.5rem, var(--max));
    padding-block: 1.5rem 3rem;
  }
}

  </style>
</head>
<body>
  <main class="wrap">
    <header class="site-header">
      <p class="brand" id="brand">Newsy</p>
      <h1 class="briefing-title" id="briefing-title">Briefing</h1>
      <p class="meta" id="briefing-meta"></p>
    </header>

    <nav class="picker" aria-label="Past briefings">
      <p class="picker-label">Briefings</p>
      <ul class="chips" id="chips"></ul>
    </nav>

    <p class="status" id="status" hidden>Loading…</p>

    <div class="beats" id="beats"></div>

    <footer class="site-footer">
      <p>A short page. Read it, then close the tab.</p>
    </footer>
  </main>

  <script>
(function () {
  "use strict";

  const els = {
    brand: document.getElementById("brand"),
    title: document.getElementById("briefing-title"),
    meta: document.getElementById("briefing-meta"),
    chips: document.getElementById("chips"),
    beats: document.getElementById("beats"),
    status: document.getElementById("status"),
  };

  let briefings = [];

  function formatGeneratedAt(iso) {
    if (!iso) return "";
    const d = new Date(iso);
    if (Number.isNaN(d.getTime())) return iso;
    try {
      return new Intl.DateTimeFormat("en-US", {
        weekday: "short",
        month: "short",
        day: "numeric",
        year: "numeric",
        hour: "numeric",
        minute: "2-digit",
        timeZoneName: "short",
      }).format(d);
    } catch (_) {
      return iso;
    }
  }

  function chipLabel(b) {
    // Prefer short date + slot for the chip row
    const d = b.date || "";
    const parts = d.split("-");
    if (parts.length === 3) {
      const month = Number(parts[1]);
      const day = Number(parts[2]);
      const months = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
      const slot = (b.slot || "").charAt(0).toUpperCase() + (b.slot || "").slice(1);
      return months[month - 1] + " " + day + " · " + slot;
    }
    return b.label || b.id;
  }

  function renderSources(sources) {
    if (!sources || !sources.length) return "";
    const parts = sources.map(function (s) {
      const name = s.name || "Source";
      if (s.url) {
        return (
          '<a href="' +
          escapeAttr(s.url) +
          '" rel="noopener noreferrer" target="_blank">' +
          escapeHtml(name) +
          "</a>"
        );
      }
      return '<span class="name-only">' + escapeHtml(name) + "</span>";
    });
    return (
      '<p class="sources"><span class="sources-label">Sources</span> ' +
      parts.join('<span class="sep">·</span>') +
      "</p>"
    );
  }

  function bodyHtml(body) {
    if (!body) return "";
    // Allow simple HTML paragraphs; if plain text, wrap paragraphs
    if (/<[a-z][\s\S]*>/i.test(body)) return body;
    return body
      .split(/\n\n+/)
      .map(function (p) {
        return "<p>" + escapeHtml(p.trim()) + "</p>";
      })
      .join("");
  }

  function escapeHtml(str) {
    return String(str)
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;");
  }

  function escapeAttr(str) {
    return escapeHtml(str).replace(/'/g, "&#39;");
  }

  function renderBriefing(b) {
    if (!b) {
      els.title.textContent = "No briefing";
      els.meta.textContent = "";
      els.beats.innerHTML = "";
      els.status.hidden = false;
      els.status.textContent = "No briefing selected.";
      return;
    }

    els.status.hidden = true;
    els.title.textContent = b.label || b.id;
    const when = formatGeneratedAt(b.generatedAt);
    els.meta.textContent = when ? "Prepared " + when : "";

    document.title = (b.label || "Briefing") + " · Newsy";

    const beats = b.beats || [];
    els.beats.innerHTML = beats
      .map(function (beat) {
        return (
          '<article class="beat" id="beat-' +
          escapeAttr(beat.id || "") +
          '">' +
          "<h2 class=\"beat-title\">" +
          escapeHtml(beat.title || "") +
          "</h2>" +
          '<div class="beat-body">' +
          bodyHtml(beat.body || "") +
          "</div>" +
          renderSources(beat.sources) +
          "</article>"
        );
      })
      .join("");

    // Update chip pressed state
    Array.prototype.forEach.call(els.chips.querySelectorAll(".chip"), function (btn) {
      btn.setAttribute("aria-pressed", btn.dataset.id === b.id ? "true" : "false");
    });

    // Reflect selection in the URL hash without scrolling noise
    if (history.replaceState) {
      history.replaceState(null, "", "#" + encodeURIComponent(b.id));
    } else {
      location.hash = encodeURIComponent(b.id);
    }
  }

  function renderChips() {
    els.chips.innerHTML = briefings
      .map(function (b) {
        return (
          "<li>" +
          '<button type="button" class="chip" data-id="' +
          escapeAttr(b.id) +
          '" aria-pressed="false">' +
          escapeHtml(chipLabel(b)) +
          "</button>" +
          "</li>"
        );
      })
      .join("");

    els.chips.addEventListener("click", function (e) {
      const btn = e.target.closest(".chip");
      if (!btn) return;
      const found = briefings.find(function (b) {
        return b.id === btn.dataset.id;
      });
      if (found) renderBriefing(found);
    });
  }

  function pickInitial() {
    const hash = (location.hash || "").replace(/^#/, "");
    if (hash) {
      const decoded = decodeURIComponent(hash);
      const match = briefings.find(function (b) {
        return b.id === decoded;
      });
      if (match) return match;
    }
    return briefings[0] || null;
  }

  function showError(msg) {
    els.status.hidden = false;
    els.status.textContent = msg;
    els.title.textContent = "Briefing";
    els.meta.textContent = "";
    els.beats.innerHTML = "";
  }

        "headline": "Yemen retakes Mokha; Ukraine's record drone barrage; Vatican City prepares Amoris assembly.",
        "body": "<p><strong>Vatican City.<\/strong> The Vatican’s assembly marking ten years of <em>Amoris Laetitia<\/em> opens tomorrow and runs through October 14, with USCCB leaders and three U.S. cardinals taking part. Pope Leo met the Vatican’s two lay workers’ associations and urged “the path of dialogue,” but he didn’t answer their recent demands for back pay after years of wage restraint. Today he also published a foreword to <em>YOUCAT: Love Forever<\/em>, calling married love a faithful “yes” for a lifetime. St. Peter’s Basilica still has no archpriest named since Cardinal Gambetti was moved to Chieti-Vasto.<\/p><p><strong>Africa.<\/strong> Kenya confirmed its first Ebola death: a Kenyan who had lived in Congo, where more than 4,000 have died this year, flew into Nairobi Saturday and died days later. In Nigeria, all 32 people aboard an Air Force ATR-42 that crashed Monday in Ondo State were killed, and President Tinubu declared three days of mourning. In Ethiopia’s widening Tigray war, witnesses tell the Guardian that the new rebel alliance is forcibly recruiting men and boys as young as 15. Egypt’s objection also pushed the African Union to walk back a statement on the crisis.<\/p><p><strong>Asia.<\/strong> Saudi-backed Yemeni government forces say they’ve retaken the Red Sea port of Mokha and positions around the Bab el-Mandeb Strait. The Houthis answered with missile and drone strikes on Riyadh’s airport, Abha airport, and the Rabigh refinery, and Pakistan and Turkey agreed to send troops to Saudi Arabia. Iran has attacked ships in the Strait of Hormuz nearly every day since September 29, and Brent is holding near $100. Separately, Japan said a Chinese survey ship left its economic waters after repeated demands.<\/p><p><strong>Europe.<\/strong> Russia says it shot down 1,750 Ukrainian drones and 17 Flamingo cruise missiles in 24 hours, the largest Ukrainian barrage of the war by Moscow’s count. Strikes near Moscow killed two men, hurt nine, set a fuel depot on fire, and snarled more than 200 flights. A Russian strike also hit a medical facility in Kramatorsk. European officials tell the Washington Post that Putin is counting on sabotage, cyberattacks, and nuclear threats to break Europe’s support for Kyiv this winter.<\/p><p><strong>North America.<\/strong> With four weeks until the November 3 midterms, NPR and the Guardian both report that Democrats hold a clear polling edge, driven by costs, tariffs, and the Iran war. The 30-year Treasury yield is near 5.67% and the 10-year near 5.30%, the highest since 2002. The Pentagon has raised combat pay for the first time since 2002: hostile fire pay doubled to $450 a month, and imminent danger pay rose to $275.<\/p><p><strong>South America.<\/strong> Final counts in Brazil show Flávio Bolsonaro with 47.03% to President Lula’s 45.16%, setting up an October 25 runoff. Since democracy returned in 1985, no first-round runner-up has gone on to win. U.S. prosecutors say Venezuela itself has never claimed immunity for Maduro and Cilia Flores, and the immunity hearing is November 17.<\/p><p><strong>Oceania.<\/strong> At a pre-COP31 meeting in Tuvalu with Prime Minister Albanese, Fiji’s Sitiveni Rabuka said the 2023 deal to move away from fossil fuels is “not open for renegotiation.” A Tuvalu government adviser said Australia “overstepped” during the visit. In New Zealand, National’s plan to pay for health spending by cutting Pacific aid drew fire from coalition partner NZ First.<\/p>",

        "headline": "Insurer price rule finalized; ICE arrests hit records through local police.",
        "body": "<p><strong>“Patients should know the price before they get care.”<\/strong> <em>What was done:<\/em> On Monday, HHS, Labor, and Treasury finalized an overhaul of the insurer price-disclosure rules. Insurers must post real dollar amounts instead of vague percentages, drop “ghost” rates for services a provider would never perform, report more out-of-network prices, and name an executive who vouches that the files are accurate. <em>Impact:<\/em> nothing yet. The changes take effect 5 to 11 months after publication, and drug-price disclosure is still waiting until spring. Employer groups say the data will finally be usable for bargaining. Healthcare Dive notes that price transparency hasn’t yet moved overall U.S. health spending. Promise partly kept, with the payoff still ahead.<\/p><p><strong>“The largest deportation operation in history.”<\/strong> <em>What was done:<\/em> The Marshall Project finds that after the big city operations ended, arrests climbed through a quieter, nationwide approach that relies on about 2,000 local police and sheriff partnerships. DHS reported nearly 51,000 ICE arrests in August, a monthly record. In Florida, July arrests topped 7,000, triple the year before. <em>Impact:<\/em> arrests are not the same as removals, and in July half of the people arrested had no prior criminal record. That share keeps rising. Enforcement is clearly up, but the deportation total is still not the promised scale.<\/p>",

        "id": "catholic",
        "title": "Catholic",
        "headline": "Little Flower turns 100; Zambia's archbishop charged; new UAE nuncio named.",
        "body": "<p><strong>Miami.<\/strong> Archbishop Wenski celebrated the 100th anniversary of St. Theresa, the Church of the Little Flower in Coral Gables. The St. Carlo Acutis Eucharistic Miracles Exposition comes to the archdiocese October 12 to 16. No new Miami clergy assignments have been posted.<\/p><p><strong>United States.<\/strong> The Vatican’s ten-years-after <em>Amoris Laetitia<\/em> meeting on families opens tomorrow. USCCB president Archbishop Coakley and vice president Bishop Flores represent the U.S. bishops, after their audiences with Pope Leo this week.<\/p><p><strong>Latin America.<\/strong> Peru is preparing for Pope Leo’s November 11 to 16 visit to Lima, Chiclayo, Cusco, and Pucallpa. The bishops have launched a “Friends of Leo” volunteer corps for crowds expected to reach up to a million.<\/p><p><strong>Europe.<\/strong> In Germany, impatience is building as the bishops’ proposed permanent Synodal Conference still waits for Vatican approval, and its November meeting has been postponed.<\/p><p><strong>Africa.<\/strong> Archbishop Alick Banda of Lusaka, an outspoken critic of the government, was arrested over a car he says former President Lungu gave him and that he surrendered to the state in 2023. He spent a night in prison and is out on bail, and his trial starts November 3. Cardinal Ambongo, speaking for Africa’s bishops, has called for fair and transparent due process.<\/p><p><strong>Asia.<\/strong> The Philippine bishops are backing “Dapat Isa Lang,” a nationwide signature drive for a law that would actually bar political dynasties.<\/p><p><strong>Middle East.<\/strong> Two Christian women, Maysa Abu Dawoud and Mary al-Najjar, were killed in an Israeli strike on a Gaza City apartment on October 3. Gaza’s Christians will hold a Rosary, Mass, and procession for peace tomorrow.<\/p><p><strong>Oceania.<\/strong> Parramatta’s diocese is hosting a Eucharistic miracles exhibit from October 11 to 25, and Sydney is set to host the 2028 International Eucharistic Congress from September 24 to October 1.<\/p><p><strong>Reassignments.<\/strong><\/p><ul><li><strong>Cardinal Mauro Gambetti<\/strong> leaves St. Peter’s Basilica and the Vatican City vicariate to become Archbishop of Chieti-Vasto, Italy. He succeeds Archbishop Bruno Forte, whose resignation was accepted.<\/li><li><strong>Msgr. Grzegorz Bielaszka<\/strong>, a Polish Vatican diplomat, was named Apostolic Nuncio to the United Arab Emirates and made an archbishop on October 5. He succeeds Archbishop Christophe El-Kassis.<\/li><li><strong>Bishop Ramón Salazar Estrada<\/strong>, auxiliary of Guadalajara and a leading voice on life issues for Mexico’s bishops, moves to lead the Diocese of Mazatlán, his first diocese of his own.<\/li><li><strong>Bishop Pierre Goudreault<\/strong>, president of the Canadian bishops, was named Bishop of Trois-Rivières, Quebec.<\/li><li><strong>Bishop Bonaventure Bosco Gubazire, M.Afr.<\/strong> was ordained and installed as Kabale, Uganda’s fifth bishop on October 3.<\/li><\/ul>",

        "headline": "Rosary-for-peace message stands; Cape Town revival Saturday; national digital IDs spread.",
        "body": "<p><strong>Latest message.<\/strong> Our Lady’s September 25 Medjugorje message through Marija is still the newest: “May this time be a time of prayer for peace. I am calling you to renew in your families the prayer of the Rosary for my intentions… like never before I pray for you and with you, my little children.” It fits Pope Leo’s October call to the Rosary. The next monthly message is due October 25.<\/p><p><strong>Countdown to the Kingdom.<\/strong> Nothing new since the October 3 posts: that Medjugorje message, a Flame of Love passage from Elizabeth Kindelmann (“the Spirit of Pentecost will flood the earth”), and Pedro Regis’s October 2 message (“healing will come, only by the mercy of Jesus”).<\/p><p><strong>Eucharistic miracles.<\/strong> No new reports. The Host in Cuilapa, Guatemala, that reportedly didn’t dissolve and developed red stains is still under formal Church discernment, and the Church is asking for “prudence and restraint.”<\/p><p><strong>Revival and returns.<\/strong> Saturday’s free “Revival Fire” gathering at Athlone Stadium in Cape Town is pitched as the start of a revival movement “from Cape Town to Cairo.” Pastors are running about 50 buses, and bus bookings are already full. In the U.S., dioceses this year reported an average of about 38% more adults entering the Church than last year. A survey of new Catholics found most came for a deeper relationship with God and for the liturgy and tradition, not for marriage.<\/p><p><strong>Digital ID watch.<\/strong> The Philippines approved ₱2.5 billion to upgrade the biometric and digital side of its national ID. Vietnam set rules for its VNeID app, which combines electronic ID, digital documents, payments, and public services. The EU keeps promoting its digital identity wallet. No implantable-chip news this morning.<\/p>",
