<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Short, bounded news briefings — not a news portal.">
  <meta name="color-scheme" content="light">
  <meta name="theme-color" content="#6b4f3a">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Newsy">
  <title>Newsy</title>
  <!-- Self-contained offline reader. PWA install (Add to Home Screen) needs the
       multi-file HTTPS deploy (index.html + manifest + sw.js + icons). Service
       workers do not run from file://. See HOME-SCREEN.md. -->
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400;600&family=Source+Serif+4:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
  <style>
/* Newsy — calm briefings, not a news portal */
:root {
  --bg: #f7f3ec;
  --bg-soft: #f0eae0;
  --ink: #2c2925;
  --ink-muted: #5c564e;
  --ink-faint: #8a8278;
  --accent: #6b4f3a;
  --accent-soft: #c4a882;
  --rule: #e0d6c8;
  --chip: #fffdf9;
  --chip-active: #6b4f3a;
  --chip-active-ink: #f7f3ec;
  --link: #4a6b5a;
  --link-hover: #355244;
  --max: 38rem;
  --font: "Source Serif 4", "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif;
  --font-ui: "Source Sans 3", "Segoe UI", system-ui, -apple-system, sans-serif;
}

*,
*::before,
*::after {
  box-sizing: border-box;
}

html {
  font-size: 112.5%; /* ~18px */
  -webkit-text-size-adjust: 100%;
}

body {
  margin: 0;
  min-height: 100vh;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font);
  line-height: 1.65;
  font-weight: 400;
}

a {
  color: var(--link);
  text-decoration-thickness: 1px;
  text-underline-offset: 0.15em;
}

a:hover {
  color: var(--link-hover);
}

.wrap {
  width: min(100% - 2rem, var(--max));
  margin-inline: auto;
  padding-block: 2rem 4rem;
}

/* Header */
.site-header {
  border-bottom: 1px solid var(--rule);
  padding-bottom: 1.25rem;
  margin-bottom: 1.75rem;
}

.brand {
  font-family: var(--font-ui);
  font-size: 0.75rem;
  font-weight: 600;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: var(--accent);
  margin: 0 0 0.35rem;
}

.briefing-title {
  font-size: clamp(1.45rem, 4vw, 1.85rem);
  font-weight: 600;
  line-height: 1.25;
  margin: 0 0 0.25rem;
  letter-spacing: -0.01em;
}

.meta {
  font-family: var(--font-ui);
  font-size: 0.85rem;
  color: var(--ink-muted);
  margin: 0;
}

/* Picker — compact "Briefings" select (native wheel on iPhone) */
.picker {
  display: flex;
  align-items: center;
  gap: 0.75rem;
  margin: 0 0 1.75rem;
}

.picker-label {
  font-family: var(--font-ui);
  font-size: 0.7rem;
  font-weight: 600;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--ink-faint);
  margin: 0;
  flex: 0 0 auto;
}

.select-wrap {
  position: relative;
  flex: 1 1 auto;
  max-width: 16rem;
}

.select-wrap::after {
  content: "";
  position: absolute;
  right: 1rem;
  top: 50%;
  width: 0.5rem;
  height: 0.5rem;
  border-right: 2px solid var(--accent, #6b4f3a);
  border-bottom: 2px solid var(--accent, #6b4f3a);
  transform: translateY(-70%) rotate(45deg);
  pointer-events: none;
}

.briefing-select {
  -webkit-appearance: none;
  appearance: none;
  width: 100%;
  min-height: 44px;
  font-family: var(--font-ui);
  font-size: 1rem; /* 16px+ keeps iOS Safari from zooming on focus */
  font-weight: 600;
  color: var(--accent, #6b4f3a);
  background: var(--chip);
  border: 1.5px solid var(--accent, #6b4f3a);
  border-radius: 999px;
  padding: 0.5rem 2.5rem 0.5rem 1.1rem;
  cursor: pointer;
  transition: background 0.15s ease, box-shadow 0.15s ease;
}

.briefing-select:hover {
  background: #f7f1e8;
}

.briefing-select:focus-visible {
  outline: none;
  box-shadow: 0 0 0 3px rgba(107, 79, 58, 0.25);
}

/* Beats */
.beats {
  display: flex;
  flex-direction: column;
  gap: 2rem;
}

.beat {
  padding-top: 0.25rem;
}

.beat-title {
  font-size: 1.05rem;
  font-weight: 600;
  margin: 0 0 0.65rem;
  padding-bottom: 0.4rem;
  border-bottom: 1px solid var(--rule);
  color: var(--accent);
  letter-spacing: 0.01em;
}

.beat-body {
  margin: 0;
}

.beat-body p {
  margin: 0 0 0.85rem;
}

.beat-body p:last-child {
  margin-bottom: 0;
}

.sources {
  margin-top: 0.85rem;
  padding-top: 0.55rem;
  border-top: 1px dotted var(--rule);
  font-family: var(--font-ui);
  font-size: 0.8rem;
  color: var(--ink-muted);
  line-height: 1.55;
}

.sources-label {
  font-weight: 600;
  color: var(--ink-faint);
  margin-right: 0.35rem;
}

.sources a {
  word-break: break-word;
}

.sources .sep {
  color: var(--ink-faint);
  margin: 0 0.3rem;
}

.sources .name-only {
  color: var(--ink-muted);
}

/* Status / empty */
.status {
  font-family: var(--font-ui);
  font-size: 0.9rem;
  color: var(--ink-muted);
  padding: 1.5rem 0;
}

.site-footer {
  margin-top: 3rem;
  padding-top: 1rem;
  border-top: 1px solid var(--rule);
  font-family: var(--font-ui);
  font-size: 0.75rem;
  color: var(--ink-faint);
}

.site-footer p {
  margin: 0;
}


/* Podcast player */
.podcast {
  margin-top: 0.85rem;
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 0.65rem 0.85rem;
}

.listen-btn {
  font-family: var(--font-ui);
  font-size: 0.8rem;
  font-weight: 600;
  letter-spacing: 0.04em;
  appearance: none;
  border: 1px solid var(--accent);
  background: var(--accent);
  color: var(--chip-active-ink);
  border-radius: 999px;
  padding: 0.4rem 1rem;
  cursor: pointer;
  transition: background 0.15s ease, color 0.15s ease, border-color 0.15s ease;
}

.listen-btn:hover {
  background: #5a3f2d;
  border-color: #5a3f2d;
}

.listen-btn:focus-visible {
  outline: 2px solid var(--accent-soft);
  outline-offset: 2px;
}

.listen-btn[aria-pressed="true"] {
  background: var(--bg-soft);
  color: var(--accent);
  border-color: var(--accent);
}

.podcast audio {
  flex: 1 1 12rem;
  min-width: 11rem;
  max-width: 100%;
  height: 2.1rem;
  accent-color: var(--accent);
}

@media print {
  .podcast {
    display: none !important;
  }
}

/* Print — quiet page, no chrome clutter */
@media print {
  :root {
    --bg: #fff;
    --ink: #111;
    --ink-muted: #333;
    --rule: #ccc;
    --accent: #333;
    --link: #000;
  }

  body {
    background: #fff;
    font-size: 11pt;
    line-height: 1.5;
  }

  .wrap {
    width: 100%;
    max-width: none;
    padding: 0;
  }

  .picker,
  .site-footer {
    display: none;
  }

  .site-header {
    border-bottom-color: #999;
  }

  .beat {
    break-inside: avoid;
  }

  a {
    color: inherit;
    text-decoration: none;
  }

  .sources a::after {
    content: " (" attr(href) ")";
    font-size: 0.75em;
    color: #555;
  }
}

@media (max-width: 480px) {
  html {
    font-size: 106.25%;
  }

  .wrap {
    width: min(100% - 1.5rem, var(--max));
    padding-block: 1.5rem 3rem;
  }
}

/* ---- v3: glance, images, collapsible stories, new at this hour ---- */
.top-line { font-size: 1.1rem; font-style: italic; color: var(--ink-muted); margin: 0 0 1.25rem; }
.glance { background: var(--bg-soft); border-radius: 12px; padding: 0.9rem 1.1rem; margin-bottom: 2rem; }
.glance-label, .carried, .tag, .why span, .beat-figure figcaption {
  font-family: var(--font-ui); font-size: 0.7rem; font-weight: 600; letter-spacing: 0.12em; text-transform: uppercase; color: var(--accent);
}
.glance-label { margin: 0 0 0.4rem; }
.glance ol { list-style: none; margin: 0; padding: 0; }
.glance li { padding: 0.3rem 0; border-top: 1px solid var(--rule); font-size: 0.92rem; line-height: 1.4; }
.glance li:first-child { border-top: 0; }
.glance a { color: var(--ink); text-decoration: none; }
.glance-beat { font-family: var(--font-ui); font-weight: 600; color: var(--accent); margin-right: 0.3rem; }
.beat-figure { margin: 0.5rem 0 0.9rem; }
.beat-figure img { width: 100%; aspect-ratio: 16 / 9; object-fit: cover; border-radius: 10px; display: block; background: var(--bg-soft); }
.beat-figure figcaption { margin-top: 0.3rem; color: var(--ink-faint); font-weight: 400; letter-spacing: 0.06em; }
.beat-figure figcaption a { color: inherit; }
.carried { color: var(--ink-faint); margin: 0 0 0.4rem; }
.stories { list-style: none; margin: 0; padding: 0; }
.story { border-top: 1px solid var(--rule); }
.story:last-child { border-bottom: 1px solid var(--rule); }
.story summary { cursor: pointer; list-style: none; padding: 0.7rem 1.6rem 0.7rem 0; position: relative; font-weight: 600; line-height: 1.35; }
.story summary::-webkit-details-marker { display: none; }
.story summary::after { content: "+"; position: absolute; right: 0.2rem; top: 0.6rem; font-family: var(--font-ui); color: var(--accent); font-size: 1.2rem; }
.story details[open] summary::after { content: "–"; }
.story-body { padding: 0 0 0.9rem; }
.story-body p:first-child { margin-top: 0; }
.story-img { width: 100%; border-radius: 8px; margin-bottom: 0.6rem; }
.why { font-size: 0.92rem; color: var(--ink-muted); }
.new-hour { background: #fff8ec; border: 1px solid var(--accent-soft); border-radius: 12px; padding: 0.8rem 1rem; }
.new-hour .beat-title { color: #9a3b1e; }
.tag { margin-right: 0.35rem; }

  </style>
</head>
<body>
  <main class="wrap">
    <header class="site-header">
      <p class="brand" id="brand">Newsy</p>
      <h1 class="briefing-title" id="briefing-title">Briefing</h1>
      <p class="meta" id="briefing-meta"></p>
      <div class="podcast" id="podcast" hidden>
        <button type="button" class="listen-btn" id="listen-btn" aria-label="Listen to this briefing">Listen</button>
        <audio id="podcast-audio" controls preload="none"></audio>
      </div>
    </header>

    <nav class="picker" aria-label="Briefings">
      <label class="picker-label" for="briefing-select">Briefings</label>
      <div class="select-wrap">
        <select id="briefing-select" class="briefing-select"></select>
      </div>
    </nav>

    <p class="status" id="status" hidden>Loading…</p>

    <div class="beats" id="beats"></div>

    <footer class="site-footer">
      <p>A short page. Read it, then close the tab.</p>
    </footer>
  </main>
  <script>
(function () {
  "use strict";


  const els = {
    brand: document.getElementById("brand"),
    title: document.getElementById("briefing-title"),
    meta: document.getElementById("briefing-meta"),
    podcast: document.getElementById("podcast"),
    listenBtn: document.getElementById("listen-btn"),
    audio: document.getElementById("podcast-audio"),
    select: document.getElementById("briefing-select"),
    beats: document.getElementById("beats"),
    status: document.getElementById("status"),
  };

  let briefings = [];

  function formatGeneratedAt(iso) {
    if (!iso) return "";
    const d = new Date(iso);
    if (Number.isNaN(d.getTime())) return iso;
    try {
      return new Intl.DateTimeFormat("en-US", {
        weekday: "short",
        month: "short",
        day: "numeric",
        year: "numeric",
        hour: "numeric",
        minute: "2-digit",
        timeZoneName: "short",
      }).format(d);
    } catch (_) {
      return iso;
    }
  }

  const MONTHS = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
  const WEEKDAYS = ["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"];
  const SLOT_NAMES = { morning: "Morning", noon: "Noon", evening: "Night" };

  function slotOf(b) {
    const m = /-(morning|noon|evening)$/.exec(b.id || "");
    return m ? m[1] : (b.slot || "").toLowerCase();
  }

  function optionLabel(b) {
    // e.g. "Wed, Oct 7 · Night"
    const src = b.date || (b.id || "").slice(0, 10);
    const parts = src.split("-");
    const slot = SLOT_NAMES[slotOf(b)] || (b.slot ? b.slot.charAt(0).toUpperCase() + b.slot.slice(1) : "");
    if (parts.length === 3) {
      const y = Number(parts[0]);
      const mo = Number(parts[1]);
      const day = Number(parts[2]);
      const wd = WEEKDAYS[new Date(Date.UTC(y, mo - 1, day)).getUTCDay()];
      return wd + ", " + MONTHS[mo - 1] + " " + day + (slot ? " · " + slot : "");
    }
    return b.label || b.id;
  }

  function renderSources(sources) {
    if (!sources || !sources.length) return "";
    const parts = sources.map(function (s) {
      const name = s.name || "Source";
      if (s.url) {
        return (
          '<a href="' +
          escapeAttr(s.url) +
          '" rel="noopener noreferrer" target="_blank">' +
          escapeHtml(name) +
          "</a>"
        );
      }
      return '<span class="name-only">' + escapeHtml(name) + "</span>";
    });
    return (
      '<p class="sources"><span class="sources-label">Sources</span> ' +
      parts.join('<span class="sep">·</span>') +
      "</p>"
    );
  }

  function bodyHtml(body) {
    if (!body) return "";
    // Allow simple HTML paragraphs; if plain text, wrap paragraphs
    if (/<[a-z][\s\S]*>/i.test(body)) return body;
    return body
      .split(/\n\n+/)
      .map(function (p) {
        return "<p>" + escapeHtml(p.trim()) + "</p>";
      })
      .join("");
  }

  function escapeHtml(str) {
    return String(str)
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;");
  }

  function escapeAttr(str) {
    return escapeHtml(str).replace(/'/g, "&#39;");
  }


  function setPodcast(b) {
    if (!els.podcast || !els.audio) return;
    const src = b && b.audio ? b.audio : "";
    if (!src) {
      els.audio.pause();
      els.audio.removeAttribute("src");
      els.audio.load();
      els.podcast.hidden = true;
      if (els.listenBtn) {
        els.listenBtn.setAttribute("aria-pressed", "false");
        els.listenBtn.textContent = "Listen";
      }
      return;
    }
    const abs = new URL(src, location.href).href;
    const current = els.audio.currentSrc || els.audio.src || "";
    if (current !== abs) {
      els.audio.pause();
      els.audio.src = src;
      els.audio.load();
      if (els.listenBtn) {
        els.listenBtn.setAttribute("aria-pressed", "false");
        els.listenBtn.textContent = "Listen";
      }
    }
    els.podcast.hidden = false;
  }

  function storyHtml(st, open) {
    const why = st.why ? '<p class="why"><span>Why it matters</span> ' + escapeHtml(st.why) + "</p>" : "";
    const img = st.image && st.image.src
      ? '<img class="story-img" loading="lazy" src="' + escapeAttr(st.image.src) + '" alt="' + escapeAttr(st.image.alt || "") + '" onerror="this.remove()">'
      : "";
    return (
      '<li class="story"><details' + (open ? " open" : "") + ">" +
      '<summary><span class="story-head">' + escapeHtml(st.headline || "") + "</span></summary>" +
      '<div class="story-body">' + img + why + bodyHtml(st.body || "") + renderSources(st.sources) + "</div>" +
      "</details></li>"
    );
  }

  function storiesOf(beat) {
    if (Array.isArray(beat.stories) && beat.stories.length) return beat.stories;
    if (beat.body) return [{ headline: beat.headline || beat.title || "", body: beat.body, sources: beat.sources }];
    return [];
  }

  function beatImageHtml(beat) {
    const im = beat.image;
    if (!im || !im.src) return "";
    const credit = im.credit
      ? '<figcaption>' + (im.sourceUrl
          ? '<a href="' + escapeAttr(im.sourceUrl) + '" rel="noopener noreferrer" target="_blank">' + escapeHtml(im.credit) + "</a>"
          : escapeHtml(im.credit)) + "</figcaption>"
      : "";
    return '<figure class="beat-figure"><img loading="lazy" src="' + escapeAttr(im.src) + '" alt="' + escapeAttr(im.alt || "") +
      '" onerror="this.closest(\'figure\').remove()">' + credit + "</figure>";
  }

  function wordCount(b) {
    let txt = "";
    (b.newAtThisHour || []).forEach(function (n) { txt += " " + (n.headline || "") + " " + (n.body || ""); });
    (b.beats || []).forEach(function (beat) {
      storiesOf(beat).forEach(function (st) { txt += " " + (st.headline || "") + " " + (st.body || ""); });
    });
    return txt.replace(/<[^>]+>/g, " ").split(/\s+/).filter(Boolean).length;
  }

  function renderBriefing(b) {
    if (!b) {
      els.title.textContent = "No briefing";
      els.meta.textContent = "";
      els.beats.innerHTML = "";
      setPodcast(null);
      els.status.hidden = false;
      els.status.textContent = "No briefing selected.";
      return;
    }

    els.status.hidden = true;
    els.title.textContent = b.label || b.id;
    const when = formatGeneratedAt(b.generatedAt);
    const mins = Math.max(1, Math.round(wordCount(b) / 230));
    els.meta.textContent = (when ? "Prepared " + when + " · " : "") + mins + " min read";
    setPodcast(b);

    document.title = (b.label || "Briefing") + " · Newsy";

    const beats = b.beats || [];
    let html = "";

    if (b.topLine) {
      html += '<p class="top-line">' + escapeHtml(b.topLine) + "</p>";
    }

    // At a glance: one tappable line per beat (NYT/Axios-style index)
    html += '<nav class="glance" aria-label="At a glance"><p class="glance-label">At a glance</p><ol>' +
      beats.map(function (beat) {
        return '<li><a href="#beat-' + escapeAttr(beat.id || "") + '" data-jump="beat-' + escapeAttr(beat.id || "") + '"><span class="glance-beat">' +
          escapeHtml(beat.title || "") + "</span> " + escapeHtml(beat.headline || "") + "</a></li>";
      }).join("") + "</ol></nav>";

    const fresh = b.newAtThisHour || [];
    if (fresh.length) {
      html += '<section class="beat new-hour" id="beat-new"><h2 class="beat-title">New at this hour</h2><ul class="stories">' +
        fresh.map(function (n, i) {
          const tag = n.beat ? '<span class="tag">' + escapeHtml(n.beat) + "</span> " : "";
          return storyHtml({ headline: "", body: n.body, sources: n.sources, why: n.why, image: n.image }, i === 0)
            .replace('<span class="story-head"></span>', '<span class="story-head">' + tag + escapeHtml(n.headline || "") + "</span>");
        }).join("") + "</ul></section>";
    }

    html += beats.map(function (beat) {
      const stories = storiesOf(beat);
      const carried = beat.carried ? '<p class="carried">' + escapeHtml(beat.carried === true ? "Continuing from this morning" : beat.carried) + "</p>" : "";
      return (
        '<article class="beat" id="beat-' + escapeAttr(beat.id || "") + '">' +
        '<h2 class="beat-title">' + escapeHtml(beat.title || "") + "</h2>" +
        beatImageHtml(beat) + carried +
        '<ul class="stories">' + stories.map(function (st) { return storyHtml(st, false); }).join("") + "</ul>" +
        (beat.stories && beat.stories.length ? renderSources(beat.sources) : "") +
        "</article>"
      );
    }).join("");

    els.beats.innerHTML = html;

    // in-page jumps without clobbering the briefing hash
    els.beats.querySelectorAll("[data-jump]").forEach(function (a) {
      a.addEventListener("click", function (e) {
        e.preventDefault();
        const t = document.getElementById(a.getAttribute("data-jump"));
        if (t) t.scrollIntoView({ behavior: "smooth", block: "start" });
      });
    });

    if (els.select && els.select.value !== b.id) els.select.value = b.id;

    if (history.replaceState) {
      history.replaceState(null, "", "#" + encodeURIComponent(b.id));
    } else {
      location.hash = encodeURIComponent(b.id);
    }
  }

  function findBriefing(id) {
    return briefings.find(function (b) {
      return b.id === id;
    });
  }

  function renderPicker() {
    if (!els.select) return;
    // Newest first (briefings.json is already newest-first; sort defensively by id)
    const ordered = briefings.slice().sort(function (a, b) {
      const ka = (a.date || a.id || "") + " " + ({ morning: 1, noon: 2, evening: 3 }[slotOf(a)] || 0);
      const kb = (b.date || b.id || "") + " " + ({ morning: 1, noon: 2, evening: 3 }[slotOf(b)] || 0);
      return ka < kb ? 1 : ka > kb ? -1 : 0;
    });
    els.select.innerHTML = ordered
      .map(function (b) {
        return '<option value="' + escapeAttr(b.id) + '">' + escapeHtml(optionLabel(b)) + "</option>";
      })
      .join("");

    els.select.addEventListener("change", function () {
      const found = findBriefing(els.select.value);
      if (found) {
        renderBriefing(found);
        window.scrollTo(0, 0);
      }
    });

    window.addEventListener("hashchange", function () {

          {
            "headline": "Swift’s mission ends after 20 years; reentry expected within weeks",
            "body": "<p>NASA has formally ended the Neil Gehrels Swift Observatory after Katalyst’s robotic rescue craft failed to boost it. Swift was built for two years and lasted almost 22. It caught more than 2,000 gamma-ray bursts and 1,400 supernovae, and its data fed about 7,000 papers. It took its last data Oct. 20 and should fall back into the atmosphere in the coming weeks.<\/p>",
            "sources": [
              {
                "name": "Space.com",
                "url": "https://www.space.com/space-exploration/missions/nasa-ends-swift-space-telescope-mission-after-failed-rescue-attempt"
              }
            ]
          },
          {
            "headline": "“More missions, more often”: NASA overhauls how it picks science missions",
            "body": "<p>Under Competition Model 2.0, ordered by Administrator Jared Isaacman, early proposals will focus on scientific merit, and detailed engineering and costing come later. Discovery and New Frontiers selections drop from 35 months to about 19.5, and the smallest missions move to a single round. There are tougher penalties for cost overruns, up to cancellation.<\/p>",
            "sources": [
              {
                "name": "Top Tech News (Space.com)",
                "url": "https://toptech.news/more-missions-more-often-nasa-is-overhauling-how-it-selects-science-missions/"

            ]
          },
          {
            "headline": "Station spacewalk Thursday; a moon-landing simulator opens to reporters",
            "body": "<p>The station crew is preparing for Thursday’s spacewalk to install a new roll-out solar array. NASA Ames shows reporters its lunar-landing simulator Oct. 29–30 as Artemis aims for a 2028 landing.<\/p>",
            "sources": [
              {
                "name": "NASA",
                "url": "https://www.nasa.gov/blogs/spacestation/2026/10/26/week-begins-with-robotics-prep-for-spacewalk-and-advanced-research/"

            ]
          },

            "headline": "Perseverance measures the Mars dust astronauts will breathe",
            "body": "<p>JPL says Perseverance found Martian dust fine enough to reach deep into the lungs, data that will shape suits, habitats and filters for future crews.<\/p>",
            "sources": [
              {
                "name": "NASA JPL",
                "url": "https://www.jpl.nasa.gov/news/nasas-perseverance-offers-clues-to-protect-crews-from-mars-dust/"

            "headline": "Miami: Archbishop Wenski at Jericho 2026: “God gave us our dignity”",
            "body": "<p>Celebrating his 76th birthday at Notre Dame d’Haïti in Little Haiti, Archbishop Thomas Wenski preached in Haitian Creole at the opening of Jericho, the mission’s week of renewal. “It is not TPS or a green card that gives us dignity,” he said; “God made us human.” He named walls of pride, indifference and fear, and the fear of ICE, to be torn down by prayer and the Word, not violence. Haiti’s TPS ended in July and legal challenges continue.<\/p>",

            "body": "<p>Bishop Crispin “Bai” Varquez took possession of the Diocese of Tagbilaran in Bohol, Philippines, this morning as its eighth bishop, urging “passion and enthusiasm for the work of evangelization.” <b>Who he is:<\/b> a Tagbilaran native, 65, ordained in 1989, a former seminary formator, and bishop of Borongan in Eastern Samar from 2007. He succeeds Alberto Uy, now archbishop of Cebu.<\/p>",

          {
            "headline": "Africa: Kidnapped Nigerian priest freed in Benue",
            "body": "<p>Fr. John Inalegwu Otache, pastor of St. Margaret’s in Ajegbe-Awume, was rescued with seven other captives by Benue police and local vigilantes, and two suspects were arrested. The Diocese of Otukpo gave thanks “with hearts full of joy” and asked prayers for those still held, including Fr. Emmanuel Ezema of Zaria, missing since December.<\/p>",

            "headline": "Middle East: Jordan answers the Karak church attack with strikes in Syria",

            "headline": "Latin America: Peru, Argentina and Uruguay prepare for the Pope",
            "body": "<p>With the Pope’s medical all-clear, preparations go ahead for Nov. 6–17, from Montevideo and Luján to Chiclayo, where he was bishop, and Cuzco.<\/p>",
            "sources": [
              {
                "name": "Andina",

        "headline": "Medjugorje Oct. 25; Countdown Oct. 25; campus revival tonight.",
        "stories": [
          {
            "headline": "Medjugorje, Oct. 25: “Pray more strongly and more for the peace”",
            "body": "<p>The latest monthly message, given Oct. 25, 2026, through the visionary Marija: “Dear children! A fire of hatred and wars is spreading in the hearts of people who do not want peace but their own weak interests. That is why, little children, you be prayer and my extended hands of love and peace for all those who are far from my motherly heart. Pray more strongly and more for the peace that God desires to give you but you do not want it. I am with you and I am praying that peace may prevail and reign in every heart.” The next monthly message is due Nov. 25.<\/p>",
            "sources": [
              {
                "name": "Medjugorje.ws",

              },
              {
                "name": "Medjugorje.org",

          {
            "headline": "Countdown to the Kingdom: latest post Oct. 25",
            "body": "<p>Checked this morning, the newest post is still Sunday, Oct. 25: “Marija – A Fire of Hatred is Spreading,” summed up as “Pray for people who do not want peace.” Before it came “The Suicide of the West” and “Defending Your Family” on Oct. 23, and two messages attributed to Pedro Regis: “The One Who Opposes Christ” on Oct. 21 and “There Will be a Great War” on Oct. 20. The site asks readers to test every message with the Church, which alone judges authenticity.<\/p>",

              {
                "name": "Countdown to the Kingdom",

              },

                "name": "Countdown to the Kingdom",

            ]

          {
            "headline": "The message and the night’s news, read together",
            "body": "<p>In the 48 hours since Our Lady spoke of a “fire of hatred and wars,” 16 ballistic missiles fell on Kyiv, Houthi missiles flew at Saudi cities, Jordan struck Syria over a church massacre, and El Fasher marked a year under the RSF. Against that, religious leaders from 53 nations pray in Assisi today, and a small truce lets aid reach Oleshky. The message asks for two things: be prayer, and be “extended hands of love and peace.” Jesus’ words in Matthew 24 still apply: “See that you are not alarmed.”<\/p>",
            "sources": [
              {
                "name": "Ukrinform",
                "url": "https://www.ukrinform.net/rubric-ato/4178535-zelensky-on-overnight-attack-russia-targeted-energy-logistics-and-urban-infrastructure-almost-everywhere.html"

          },
          {
            "headline": "Revival on campus: UniteUS reaches South Alabama tonight",
            "body": "<p>UniteUS, the student outreach that began at Auburn in 2023, holds its next campus night tonight at the University of South Alabama. At Appalachian State this month it reported more than 700 decisions for Christ and about 100 baptisms. The ministry says it has reached more than two dozen campuses, the University of Miami among them, and more than 100,000 students. Belmont in Nashville is next, on Nov. 10.<\/p>",
            "sources": [
              {
                "name": "CBN News",

          },
          {
            "headline": "Revival by the water: beach and campus baptisms keep spreading",
            "body": "<p>More than 550 people were baptized at Bridlington South Beach in England on Oct. 10, after earlier beach baptisms at Bigbury. Thousands joined the oceanfront baptisms at Oceanside, California, on Oct. 17. Local churches report students baptized after campus nights from Mississippi to Georgia. Many of these gatherings are led by local congregations, not one big organization.<\/p>",

              {

              {

          {
            "headline": "Eucharistic: Guatemala’s Cuilapa Host under study",
            "body": "<p>Witnesses in Cuilapa, Guatemala, describe a consecrated Host that stayed intact in water for eight days and developed reddish stains. A multidisciplinary team is studying it, and the diocese stresses that only the Holy See can authorize veneration. Similar cases, such as Sokółka in Poland, took years of scientific and Church review.<\/p>",

            "body": "<p>JPL says Perseverance has measured ultrafine Martian dust, data that will shape how suits, habitats and filters are designed for astronauts. NASA also reported its NEO Surveyor asteroid-hunting telescope now has its sunshade ready.<\/p>",
            "sources": [

          {
            "headline": "NASA adopts Apollo’s urgency to build a moon base in two years",
            "body": "<p>An AP report this weekend lays out administrator Jared Isaacman’s timeline. Artemis III next summer becomes an Earth-orbit docking test of both commercial landers, SpaceX’s and Blue Origin’s, with three launches in quick succession and an Italian astronaut on board. Artemis IV would land in 2028. The first moon-base cargo flight, Astrobotic’s second try for the south pole, comes by year’s end, and lighter Axiom “sortie suits” will be tested on the space station next year. Isaacman calls it “the same playbook that went from Apollo 7 splashdown to Apollo 11 in just nine months.”<\/p>",
            "sources": [
              {
                "name": "AP via The Weather Channel",
                "url": "https://weather.com/2026/10/25/science/space/nasa-adopts-apollos-urgency-to-build-moon-base-in-two-years"

            "why": "Safety advisers have warned that speed must not outrun crew safety. That tension will shape the next year."

            "body": "<p>Speaking from his window on Sunday, Pope Leo XIV said the two great commandments belong together: “We cannot truly love God unless this love overflows into love for our brothers and sisters.” After the prayer he appealed for Yemen, and especially for besieged Taiz, where families lack food, water and medical care. He also prayed for the victims of Friday’s attack on a funeral at St. George Orthodox Church in Jordan, and for their families.<\/p>",

            "headline": "Africa: Uganda orders 21-day quarantine as Ebola reaches Kenya",
            "body": "<p>Overnight, Uganda said citizens returning from Congo must spend 21 days in quarantine at their own cost, barred travellers from Congo from transiting the country, and tightened screening at Entebbe and land borders. Kenya now has nine confirmed cases and two deaths, all linked to a businessman who flew in from Congo; Uganda discharged the 60 people it was monitoring after contact with him. Congo’s latest bulletin, for Oct. 23, counts 9,876 confirmed cases and 4,803 deaths since May across 66 health zones. Most cases are in Ituri and North Kivu, and the North Kivu treatment centres are over capacity.<\/p>",

            "headline": "Africa: One year since El Fasher fell, rights groups demand action",
            "body": "<p>Today is one year since the Rapid Support Forces captured El Fasher, the last army stronghold in Darfur. Human Rights Watch says the city is now largely destroyed and empty. The UN estimates that more than 6,000 people were killed in the first three days. Amnesty has gathered new testimony of killings, detention and torture. A defected RSF commander now accuses Abdelrahim Dagalo, the RSF’s deputy leader, of overseeing the atrocities. The war has not paused: army drone strikes hit El Fasher again on Friday, killing civilians.<\/p>",

            "headline": "Africa: Tigray’s fragile recovery as Ethiopia and Eritrea trade threats",
            "body": "<p>Ethiopian federal forces are back in Mekelle. Army chief Field Marshal Berhanu Jula says an offensive by rebel TPLF commanders was pushed back in North Wollo, Wag Hemra and Afar. In Tigray itself, recovery is thin: salaries go unpaid, schools are disrupted and many displaced families have not gone home. The bigger danger is the standoff with Eritrea. Addis Ababa accuses Asmara of keeping troops inside Tigray, and both governments have sharpened their rhetoric. In practice the 2022 Pretoria peace deal has broken down.<\/p>",

            "headline": "Lower gas prices: the White House says relief is coming “rapidly”",
            "body": "<p><b>Promise:<\/b> cheaper fuel. <b>Action:<\/b> a White House release on Sunday points to Defense Production Act money for refining, a Venezuela oil deal that has raised Venezuelan imports more than 400 percent, 130 million barrels of diesel released by partner countries, EPA fuel waivers, and a $54 billion Alaska gas pipeline deal with Korea and Taiwan. It also says more oil is leaving Hormuz than before the conflict. <b>Impact so far:<\/b> not yet at the pump. Brent closed Friday at $116.72, a six-month high, up 6.2 percent for the week. Supporters say supply measures take weeks to work, while critics say the war risk outweighs them.<\/p>",

            "headline": "Medjugorje, Oct. 25: “A fire of hatred and wars is spreading”",
            "body": "<p>Our Lady’s monthly message through the visionary Marija, given Oct. 25, 2026: “Dear children! A fire of hatred and wars is spreading in the hearts of people who do not want peace but their own weak interests. That is why, little children, you be prayer and my extended hands of love and peace for all those who are far from my motherly heart. Pray more strongly and more for the peace that God desires to give you, but you do not want it. I am with you and I am praying that peace may prevail and begin to reign in every heart. Thank you for having responded to my call.”<\/p><p>It came on the same day the Assisi peace meeting opened and the Pope pleaded for Yemen. The Vatican’s 2024 nulla osta encourages the spiritual fruits of Medjugorje without declaring the messages supernatural.<\/p>",

          {
            "headline": "Starlink 15-15 lifts off on the fourth try",
            "body": "<p>SpaceX launched 27 Starlink satellites from Vandenberg Space Force Base at 6:48 p.m. Eastern Friday. Booster B1063, which launched NASA’s DART asteroid mission in 2021, flew for the 36th time and landed on the droneship Of Course I Still Love You. It was the 116th Falcon 9 flight of 2026.<\/p>",

          {
            "headline": "Next up: China’s Long March 8A, then Starlink 15-16",
            "body": "<p>No orbital launches flew today after Friday’s three. China’s Long March 8A is due from Wenchang early Sunday, about 9:50 p.m. Eastern tonight, and SpaceX’s next Starlink flight is listed for Monday night into Tuesday. Friday brought four successful launches worldwide: a Falcon 9, a Rocket Lab Electron and two Chinese Long March rockets.<\/p>",

            "headline": "Starship: next flight eyed for November",
            "body": "<p>NASA’s Artemis manager says SpaceX is targeting “the November time frame” for the next Starship flight. NASA’s safety panel estimates about 22 refuelling flights for a Starship Moon landing; Musk says six to eight.<\/p>",

            "headline": "Blue Origin plans new Florida pads; Starbase seeks 456 launches a year",
            "body": "<p>Blue Origin plans a 330-million-dollar expansion at Cape Canaveral with two new pads by mid-2027, though New Glenn has not flown since a May test explosion. The FAA is reviewing SpaceX’s plan for up to 456 Starship launches a year from Texas, with comments due Nov. 30.<\/p>",

        "headline": "Spacewalk Thursday; Dragonfly simulated flight; Artemis III 2027.",
        "stories": [
          {
            "headline": "Spacewalk set for Thursday to add a new solar array",
            "body": "<p>NASA astronaut Anil Menon and Canadian astronaut Joshua Kutryk will step outside the space station on Thursday, Oct. 29, to install a roll-out solar array on the truss, with Jessica Watkins and Luke Delaney running the robotic arm. This week Expedition 75 also worked on bioprinting research.<\/p>",
            "sources": [
              {
                "name": "NASA",
                "url": "https://www.nasa.gov/blogs/spacestation/2026/10/23/advanced-research-spacewalk-preps-end-week-as-nasa-announces-artemis-status/"
              }
            ]
          },
          {
            "headline": "Dragonfly “flies” over Titan, in simulation",
            "body": "<p>NASA’s Dragonfly rotorcraft completed its most complete test yet of its first flight on Saturn’s moon Titan, run in real time on flight-like computers at Johns Hopkins APL with simulated cameras, lidar and sensors. “The cool thing about first flight is that it’s our most challenging flight,” said engineer Zach Putnam. Dragonfly launches no earlier than 2028 and arrives in 2034.<\/p>",
            "sources": [
              {
                "name": "NASA Science",
                "url": "https://science.nasa.gov/blogs/dragonfly/2026/10/23/nasas-dragonfly-completes-first-simulated-flight/"
              }
            ]
          },
          {
            "headline": "Artemis III holds for summer 2027; landing in 2028",
            "body": "<p>Administrator Jared Isaacman says the SLS will be stacked this month, with a tanking test by year’s end and Artemis III launching between about May and September 2027. The Earth-orbit mission will dock with test versions of both Moon landers, Blue Origin’s Blue Moon and SpaceX’s Starship, before Artemis IV attempts the first landing since Apollo in 2028.<\/p>",
            "sources": [
              {
                "name": "NASA",
                "url": "https://www.nasa.gov/blogs/missions/2026/10/23/nasa-shares-artemis-acceleration-plans-for-moon-missions/"

              }
            ]
          },
          {
            "headline": "Science town hall Monday on faster mission picks",
            "body": "<p>Science chief Nicola Fox’s “Competition Model 2.0,” which aims to cut mission selection from about 35 months to 19.5, gets a public town hall on Monday, Oct. 26, at 2 p.m. Eastern.<\/p>",
            "sources": [
              {
                "name": "NASA Science",
                "url": "https://science.nasa.gov/directorates/smd/faster-to-science-a-letter-to-the-science-community/"
              }
            ]
          },
          {
            "headline": "Safety advisers warn about crew access to orbit",
            "body": "<p>NASA’s Aerospace Safety Advisory Panel warned the agency risks losing human access to low Earth orbit as Crew Dragon nears retirement and commercial stations remain uncertain, and flagged “numerous firsts” in the Moon-landing plan. Its warning ties the station’s future to the same budget and schedule pressures driving the Moon push.<\/p>",

          {
            "headline": "Miami: Little Flower’s new pipe organ premieres tonight",
            "body": "<p>Organist Nathan Laube inaugurates the new French Romantic pipe organ at Church of the Little Flower in Coral Gables tonight at 7:30, free and open to all, as the parish marks its centennial. The instrument was a decade in the making. Emmaus retreats also continue across the archdiocese this weekend.<\/p>",

                "name": "Archdiocese of Miami",

          {
            "headline": "Miami: Archbishop Wenski at Jericho 2026: “God gave us our dignity”",
            "body": "<p>Celebrating his 76th birthday at Notre Dame d’Haïti in Little Haiti, Archbishop Thomas Wenski opened Jericho 2026, the parish’s week of renewal, with a homily in Haitian Creole. “It is not TPS or a green card that gives us dignity,” he said; it is God who gave us our dignity. He urged the community toward “byen viv ansanm,” living well together. Fr. Reginald Jean-Mary leads the parish.<\/p>",
            "sources": [
              {
                "name": "Archdiocese of Miami",
                "url": "https://www.miamiarch.org/CatholicDiocese.php?op=Article_archdiocese-of-miami-archbishop-wenski-calls-for-faith-and-dignity-at-jericho-2026"
              }
            ]
          },
          {
            "headline": "Miami: “We are a people of both,” faith and medicine",
            "body": "<p>In the Florida Catholic, Archbishop Wenski urged compassion for people living with mental illness, saying Catholics need not choose between faith and medicine: “We are a people of both.” He pointed to Catholic Charities of Miami, now in its 95th year, and its St. Luke’s Center as places of help.<\/p>",
            "sources": [
              {
                "name": "Florida Catholic",
                "url": "https://www.thefloridacatholic.org/dioceses/miami/archbishop-urges-compassion-for-those-with-mental-illness/article_90a269c0-bcae-4826-acc3-d6c8c3fe9c77.html"
              }
            ]
          },
          {
            "headline": "Rome: six new Venerables, two of them missionary bishops",
            "body": "<p>Pope Leo approved decrees on the heroic virtues of six Servants of God. Who they are: Friedrich Kaiser Depel, a German-born missionary who became the first prelate of Caravelí in Peru and founded the Missionary Sisters of Jesus, Word and Victim; Oreste Marengo, a Salesian bishop in northeast India; Margarita “Luminosa” Bavosi, a consecrated laywoman of the Focolare; Fathers Domenico Pogliani of Milan and Alessandro Vitetti of Rossano-Cariati; and Capuchin friar Daniele of San Giovanni Rotondo, a spiritual son of Saint Pio. The Pope also received Patriarch Bartholomew I.<\/p>",

              {
                "name": "Vatican News",

          {
            "headline": "Asia: Jesus Youth, born in India, gets new statutes and a papal blessing",
            "body": "<p>The Holy See approved revised statutes for Jesus Youth, the lay movement founded in Kerala 40 years ago, and Pope Leo received about 1,128 of its members today, holding up Ajna George, a young member sustained in illness by her love of the Eucharist. In the Philippines, bishops and religious closed a convention declaring that “the protection of persons must always take precedence over institutional reputation.”<\/p>",

          {
            "headline": "Europe: Liechtenstein’s veto holds as hundreds march in Vaduz",
            "body": "<p>About 250 to 300 people marched in Vaduz today against Hereditary Prince Alois’s veto of a bill, passed 13 to 12, that would have allowed abortion up to 12 weeks, carrying signs such as “Alois, we’re not angry, but very disappointed.” The prince said the bill did not adequately protect unborn life and backs more help for mothers instead. Bishop Benno Elbs had said that protecting life must go with practical help.<\/p>",

            "headline": "Africa: Kolda’s coadjutor takes over in Senegal",
            "body": "<p>Bishop Joseph Francis Janvier Badji now leads the Diocese of Kolda after Bishop Jean-Pierre Bassène’s resignation was accepted today. Who he is: a Senegalese priest named coadjutor in January and ordained bishop in Kolda in April, now shepherding a small Catholic flock in the Casamance.<\/p>",

          {
            "headline": "North America: Detroit to reassign nearly all parish priests in 2027",
            "body": "<p>Archbishop Edward Weisenburger, who came to Detroit from Tucson last year, says nearly every parish priest will receive a new assignment on July 1, 2027, as new pastorates form, except four new priests and five pastors moved this year. Each priest will meet one-on-one with the assignment board, and final restructuring decisions are due in April 2027. Revised parish-grouping drafts went online Oct. 19.<\/p>",

          {
            "headline": "Appointments calendar: installations today through Oct. 31",
            "body": "<p>Bishop Alfonso Raimo is installed today in Terni-Narni-Amelia, Italy. Bishop Crispin Varquez, a Filipino bishop named by Pope Leo in September, is installed in Tagbilaran on Tuesday, and Archbishop Giorgio Ferretti of Foggia-Bovino takes Lucera-Troia on Oct. 29. On Oct. 31, Bishop Michele Di Tolve takes Chioggia, Georgios Altouvas becomes Bishop of Syros, Greece, and Fr. Jean Abou Charouche is ordained Melkite exarch for Argentina.<\/p>",

            "headline": "Latin America: Panama’s bishops bring two priests’ stories to Rome",
            "body": "<p>Archbishop José Domingo Ulloa of Panama said the Pope asked the bishops to be bridges of dialogue, close to migrants. The Holy See cleared the sainthood cause of Fr. Guillermo Sosa, and the bishops recalled Fr. Héctor Gallego, who served farmworkers and disappeared in 1971.<\/p>",

        "stories": [
          {
            "headline": "Countdown to the Kingdom: latest posts still dated Oct. 23",
            "body": "<p>Checked again this evening: Countdown to the Kingdom’s newest posts remain the two dated Friday, Oct. 23, “The Suicide of the West,” on Mark Mallett’s reflection about the collapse of Christendom, and “Defending Your Family,” recalling Sr. Lúcia’s warning that “the decisive battle between the kingdom of Christ and Satan will be over marriage and the family.” Just before them, on Oct. 20 and 21, the site posted Pedro Regis messages warning of “a great war” and of “the one who opposes Christ.” The site itself urges readers to test every message with the Church.<\/p>",
            "sources": [

                "url": "https://www.countdowntothekingdom.com/"
              },

                "name": "Countdown to the Kingdom",

          {
            "headline": "Marian: latest message is still Oct. 22; Medjugorje’s is due Sunday",
            "body": "<p>No new message has been posted today, so the latest attributed to Our Lady, Queen of Peace, through Pedro Regis in Anguera, Brazil, remains No. 5,993 of Thursday, Oct. 22: “Pray. Only through prayer can you achieve victory… God is in a hurry. Turn back,” with the promise that “after all the pain will come great joy.” On the eve of Brazil’s vote, recent messages have repeatedly asked for prayer for Brazil. Medjugorje’s monthly message of the 25th is expected Sunday, as the Mariological Days close there.<\/p>",

              }
            ]
          },
          {
            "headline": "Medjugorje: the local bishop on discernment at the Mariological Days",
            "body": "<p>Opening the first Mariological Days, Bishop Petar Palić of Mostar-Duvno recalled that the Church has judged Medjugorje’s spiritual fruits positively. But that judgment, he said, “does not mean confirmation of the supernatural character of the alleged apparitions,” so discernment remains necessary, and Medjugorje’s future depends on leading people to Christ. The days run through Sunday with the Holy See’s apostolic visitor, Archbishop Aldo Cavalli.<\/p>",
            "sources": [
              {
                "name": "IKA (Croatian Catholic News Agency)",
                "url": "https://ika.hkm.hr/novosti/pozdrav-biskupa-palica-na-marioloskim-danima-u-medugorju/"

              {
                "name": "Bitno.net",

              {
                "name": "Medjugorje parish",
                "url": "https://medjugorje.hr/en/news/mariological-days-medjugorje/460"

            ],
            "why": "It is a balanced word: welcome the graces, stay anchored in the Church."
          },
          {
            "headline": "Revival: young people keep stepping into the water",
            "body": "<p>The fall’s campus revivals keep adding up: about 100 baptised in truck beds at Appalachian State, 35 at Ohio State, 19 at Pepperdine, 59 in one week at Pearl River Community College, and a water-baptism night set for Sunday at Northern Arizona University. In Rome, the Pope told Jesus Youth that young people need to know “their lives are great and beautiful because they are part of God’s greater plan.” The lasting test is whether these young people join a parish or church and stay.<\/p>",

              {

          {
            "headline": "Wars and rumours of wars: missile debris near Mecca",
            "body": "<p>Today Houthi missiles aimed at Saudi oil sites were shot down and debris fell near Mecca and Jeddah, while mines stranded two supertankers off Hormuz and Russia and Ukraine traded deep strikes. Many recall this month’s prophetic warnings of “a great war,” but the Gospel’s counsel stays the same: “See that you are not alarmed” (Matthew 24:6). The Assisi gathering opens Sunday, with Patriarch Bartholomew among 384 religious leaders praying for peace.<\/p>",
            "sources": [
              {
                "name": "KSL / Reuters",

            ]
          },
          {
            "headline": "Digital ID and money, soberly: Europe and China press ahead",
            "body": "<p>A 24-nation EU consortium starts work Oct. 31 to make mobile driver’s licences in the EU Digital Identity Wallet work across borders by 2028, and China has upgraded its digital yuan with smart contracts after 4.3 billion transactions. Programmable money could restrict how funds are spent, which is why many Christians watch it closely, but these remain voluntary tools still being legislated, not prophecy fulfilled.<\/p>",

              {

            "headline": "False prophecy, judged: Shakahola sentencing Nov. 6",

            "sources": [
              {

            "headline": "Eucharistic: Guatemala’s Cuilapa Host remains under study",

            "body": "<p>Promise: end the war in Ukraine. What was done: the Oleshky ceasefire the White House credits to the First Lady takes effect Tuesday, with aid and evacuations from Thursday, and both sides confirm trilateral talks in Abu Dhabi in the first half of November. Real impact so far: overnight Russia sent 126 drones, wounding two in Kyiv, and four people died across Ukraine in the past day. Room for disagreement: supporters see the first concrete steps in months; critics say sanctions relief and the diesel deal reward Moscow, and Kyiv says Starlink limits persist.<\/p>",

            "body": "<p>NASA astronaut Anil Menon and Canadian astronaut Joshua Kutryk will step outside the space station on Thursday, Oct. 29, to install a roll-out solar array on the truss, with Jessica Watkins and Luke Delaney running the robotic arm. This week Expedition 75 also worked on bioprinting research.<\/p>",

            "headline": "Dragonfly “flies” over Titan, in simulation",
            "body": "<p>NASA’s Dragonfly rotorcraft completed its most complete test yet of its first flight on Saturn’s moon Titan, run in real time on flight-like computers at Johns Hopkins APL with simulated cameras, lidar and sensors. “The cool thing about first flight is that it’s our most challenging flight,” said engineer Zach Putnam. Dragonfly launches no earlier than 2028 and arrives in 2034.<\/p>",

            "body": "<p>Administrator Jared Isaacman says the SLS will be stacked this month, with a tanking test by year’s end and Artemis III launching between about May and September 2027. The Earth-orbit mission will dock with test versions of both Moon landers, Blue Origin’s Blue Moon and SpaceX’s Starship, before Artemis IV attempts the first landing since Apollo in 2028.<\/p>",

            "headline": "Miami: Little Flower’s new pipe organ premieres tonight",
            "body": "<p>Organist Nathan Laube inaugurates the new French Romantic pipe organ at Church of the Little Flower in Coral Gables tonight at 7:30, free and open to all, as the parish marks its centennial. The instrument was a decade in the making. Emmaus retreats also continue across the archdiocese this weekend.<\/p>",

          {
            "headline": "Miami: Archbishop Wenski at Jericho 2026: “God gave us our dignity”",
            "body": "<p>Celebrating his 76th birthday at Notre Dame d’Haïti in Little Haiti, Archbishop Thomas Wenski opened Jericho 2026, the parish’s week of renewal, with a homily in Haitian Creole. “It is not TPS or a green card that gives us dignity,” he said; it is God who gave us our dignity. He urged the community toward “byen viv ansanm,” living well together. Fr. Reginald Jean-Mary leads the parish.<\/p>",

            ]

            "headline": "Miami: “We are a people of both,” faith and medicine",
            "body": "<p>In the Florida Catholic, Archbishop Wenski urged compassion for people living with mental illness, saying Catholics need not choose between faith and medicine: “We are a people of both.” He pointed to Catholic Charities of Miami, now in its 95th year, and its St. Luke’s Center as places of help.<\/p>",

              }
            ]

            "headline": "Asia: Jesus Youth, born in India, gets new statutes and a papal blessing",
            "body": "<p>The Holy See approved revised statutes for Jesus Youth, the lay movement founded in Kerala 40 years ago, and Pope Leo received about 1,128 of its members today, holding up Ajna George, a young member sustained in illness by her love of the Eucharist. In the Philippines, bishops and religious closed a convention declaring that “the protection of persons must always take precedence over institutional reputation.”<\/p>",

            "headline": "Europe: Liechtenstein’s prince vetoes legal abortion",
            "body": "<p>Hereditary Prince Alois of Liechtenstein withheld approval from a bill passed 13 to 12 that would have allowed abortion up to 12 weeks, saying it does not adequately protect unborn life; it was the first veto of his reign. He backs more counseling and support for mothers. Campaigners plan a protest in Vaduz today; Bishop Benno Elbs had said beforehand that protecting life must go with practical help for parents.<\/p>",

            "headline": "North America: Detroit to reassign nearly all parish priests in 2027",
            "body": "<p>Archbishop Edward Weisenburger, who came to Detroit from Tucson last year, says nearly every parish priest will receive a new assignment on July 1, 2027, as new pastorates form, except four new priests and five pastors moved this year. Each priest will meet one-on-one with the assignment board, and final restructuring decisions are due in April 2027. Revised parish-grouping drafts went online Oct. 19.<\/p>",

            "headline": "Appointments calendar: installations today through Oct. 31",

        "stories": [
          {
            "headline": "Countdown to the Kingdom: latest posts dated Oct. 23",
            "body": "<p>Checked this morning: Countdown to the Kingdom’s newest posts are both dated Friday, Oct. 23. “The Suicide of the West” points to Mark Mallett’s reflection on the collapse of Christendom, and “Defending Your Family” recalls Sr. Lúcia’s warning to Cardinal Caffarra that “the decisive battle between the kingdom of Christ and Satan will be over marriage and the family,” adding, “do not be afraid.” Earlier in the week the site carried Pedro Regis messages warning of “a great war” (Oct. 20) and of one “who opposes Christ” (Oct. 21). Read with discernment, under the Church’s judgment.<\/p>",
            "sources": [
              {
                "name": "Countdown to the Kingdom",
                "url": "https://www.countdowntothekingdom.com/"
              },
              {
                "name": "Countdown to the Kingdom",

          {
            "headline": "Marian: latest message is Oct. 22, “God is in a hurry. Turn back.”",
            "body": "<p>The most recent message attributed to Our Lady, Queen of Peace, through Pedro Regis in Anguera, Brazil, is No. 5,993, dated Thursday, Oct. 22, 2026. In our translation: “Dear children, pray. Only through prayer can you achieve victory… Humanity has turned away from the Lord. God is in a hurry. Turn back,” with a promise: “After all the pain will come great joy.” The Oct. 20 message said humanity lives “in a time worse than the time of the Flood” but that “none of my devotees will be lost.” The Church has not ruled on Anguera; Medjugorje’s monthly message is expected tomorrow, Oct. 25.<\/p>",
            "sources": [
              {
                "name": "Apelos Urgentes (Anguera)",
                "url": "https://apelosurgentes.com.br/pt-br/mensagens/"
              }
            ]
          },
          {
            "headline": "Medjugorje: the local bishop on discernment at the Mariological Days",
            "body": "<p>Opening the first Mariological Days, Bishop Petar Palić of Mostar-Duvno recalled that the Church has judged Medjugorje’s spiritual fruits positively. But that judgment, he said, “does not mean confirmation of the supernatural character of the alleged apparitions,” so discernment remains necessary, and Medjugorje’s future depends on leading people to Christ. The days run through Sunday with the Holy See’s apostolic visitor, Archbishop Aldo Cavalli.<\/p>",
            "sources": [
              {
                "name": "IKA (Croatian Catholic News Agency)",
                "url": "https://ika.hkm.hr/novosti/pozdrav-biskupa-palica-na-marioloskim-danima-u-medugorju/"
              },
              {
                "name": "Bitno.net",

              {
                "name": "Medjugorje parish",
                "url": "https://medjugorje.hr/en/news/mariological-days-medjugorje/460"
              }
            ],
            "why": "It is a balanced word: welcome the graces, stay anchored in the Church."

          {
            "headline": "Revival: young people keep stepping into the water",
            "body": "<p>The fall’s campus revivals keep adding up: about 100 baptised in truck beds at Appalachian State, 35 at Ohio State, 19 at Pepperdine, 59 in one week at Pearl River Community College, and a water-baptism night set for Sunday at Northern Arizona University. In Rome, the Pope told Jesus Youth that young people need to know “their lives are great and beautiful because they are part of God’s greater plan.” The lasting test is whether these young people join a parish or church and stay.<\/p>",

          {
            "headline": "Wars and rumours of wars: reading the Gulf soberly",
            "body": "<p>Mines striking supertankers, missiles over Riyadh and talk of weekend strikes have many recalling this month’s prophetic warnings of “a great war.” The Gospel’s counsel stays the same: “See that you are not alarmed” (Matthew 24:6). Pray for peace, help the suffering, and join the Assisi gathering in spirit as 384 religious leaders pray for peace from Sunday.<\/p>",
            "sources": [
              {
                "name": "Gulf News",

                "name": "Countdown to the Kingdom",
                "url": "https://www.countdowntothekingdom.com/"

          {
            "headline": "Digital ID and money, soberly: Europe and China press ahead",
            "body": "<p>A 24-nation EU consortium starts work Oct. 31 to make mobile driver’s licences in the EU Digital Identity Wallet work across borders by 2028, and China has upgraded its digital yuan with smart contracts after 4.3 billion transactions. Programmable money could restrict how funds are spent, which is why many Christians watch it closely, but these remain voluntary tools still being legislated, not prophecy fulfilled.<\/p>",
            "sources": [
              {

            "headline": "False prophecy, judged: Shakahola sentencing Nov. 6",
            "body": "<p>Kenyan pastor Paul Mackenzie and 28 associates, convicted of murdering 191 people starved to “meet Jesus,” are sentenced Nov. 6, a sobering reminder of why the Church tests every claimed revelation.<\/p>",
            "sources": [

            "headline": "Eucharistic: Guatemala’s Cuilapa Host remains under study",
            "body": "<p>The Diocese of Santa Rosa de Lima is still examining a consecrated Host at Cuilapa’s cathedral that did not dissolve and showed reddish stains; it is kept reserved and the parish asks for prudence. In Australia, Parramatta’s Eucharistic miracles exhibit closes Sunday.<\/p>",

          {
            "headline": "Election integrity: Alaska lawsuit tests a new approach",
            "body": "<p>Promise: secure, trustworthy elections. What was done: the Justice Department sued to keep Alaska from certifying its Senate race unless Sen. Dan Sullivan wins, citing possible confusion with a similarly named candidate. Real impact: none yet; a federal court will decide. Room for disagreement: the department frames it as protecting voters from being misled; conditioning certification on one candidate’s victory is highly unusual and is drawing sharp criticism.<\/p>",
            "sources": [
              {
                "name": "NBC News",
                "url": "https://www.nbcnews.com/politics/trump-administration/live-blog/trump-rally-byron-donalds-florida-live-updates-rcna605134"
              }
            ]
          },
          {
            "headline": "MAHA: “America First” seafood labels and a crackdown on short weights",
            "body": "<p>Promise: honest, healthy food for American families. What was done: the FDA issued draft guidance for “U.S.-Caught” labels and flag graphics on qualifying seafood, and put 11 foreign firms on import alert after finding 46% of sampled imports overstated their weight, some by up to 32.8%, using ice glaze. Real impact: shoppers could soon spot U.S. seafood more easily; comments are invited by Dec. 13. Room for disagreement: fishermen welcome it; the labels are voluntary and still in draft.<\/p>",
            "sources": [
              {
                "name": "HHS",
                "url": "https://www.hhs.gov/press-room/fda-advances-america-first-seafood-strategy-us-origin-labeling.html"
              }
            ]
          },
          {
            "headline": "Lower costs: the housing order moves to the regulators",
            "body": "<p>Promise: make homeownership affordable. What was done: this week’s order directs the FHFA to pilot cancelling mortgage insurance for borrowers with enough equity and make title-insurance waivers on refinances permanent. Real impact: savings depend on how quickly Fannie Mae and Freddie Mac carry it out. Room for disagreement: builders welcome it; some economists say high rates still dominate costs.<\/p>",
            "sources": [
              {
                "name": "HousingWire",
                "url": "https://www.housingwire.com/articles/trump-order-mortgage-insurance/"
              },
              {
                "name": "White House",
                "url": "https://www.whitehouse.gov/fact-sheets/2026/10/fact-sheet-president-donald-j-trump-decreases-housing-costs-for-americans/"
              }
            ]
          },
          {
            "headline": "MAHA: the Alzheimer’s prevention plan, unveiled in Florida",
            "body": "<p>Promise: prevent chronic disease, not just treat it. What was done: Secretary Kennedy and Dr. Oz unveiled the national Alzheimer’s plan at Broward Health, with an FDA prevention accelerator and up to 48.8 million dollars from ARPA-H for earlier detection. Real impact: research grants first, patient benefits later. Room for disagreement: advocates want more funding for caregivers now.<\/p>",
            "sources": [
              {
                "name": "WLRN",
                "url": "https://www.wlrn.org/health/2026-10-22/rfk-jr-dr-oz-visit-broward-health-to-outline-new-federal-alzheimers-initiative"

              }
            ]
          }

            "headline": "SpaceX’s AI unit launches a Grok partner network with 130 companies",
            "body": "<p>SpaceX Super Intelligence, built on xAI, launched a partner program for consultancies and software firms to deploy Grok in businesses; more than 130 companies joined early access, including Nvidia, Snowflake, Databricks, Bain and Booz Allen. The AI unit was SpaceX’s largest revenue line last quarter, at 7.56 billion dollars.<\/p>",

            "body": "<p>Tesla beat estimates with 28.05 billion dollars in revenue; Megapack orders are nearly sold out for 2027, and Optimus robot production has started in Fremont. Car revenue fell 3%, and NHTSA wants answers on the Cybercab by Oct. 30. Canaccord lifted its target to 442 dollars and Morgan Stanley to 410.<\/p>",

        "headline": "Starlink 15-15 tries again; Starship eyes November.",
        "stories": [
          {
            "headline": "Starlink 15-15: a fourth try at 6:48 p.m. Eastern",
            "body": "<p>After scrubs on Tuesday, Wednesday and Thursday, SpaceX set a fourth attempt for 27 Starlink satellites from Vandenberg at 6:48 p.m. Eastern tonight. Booster B1063 would become only the second Falcon to fly 36 times, landing on the droneship A Shortfall of Gravitas.<\/p>",
            "sources": [
              {
                "name": "Spaceflight Now",
                "url": "https://spaceflightnow.com/2026/10/20/live-coverage-spacex-to-launch-27-starlink-satellites-on-falcon-9-rocket-from-vandenberg-sfb-5/"
              }
            ]
          },
          {
            "headline": "Next Starship flight eyed for November; New Glenn aims to return",
            "body": "<p>NASA’s Artemis manager Jeremy Parsons said SpaceX is targeting “the November time frame” for the next Starship flight, Blue Origin hopes to restart pad operations in November, with New Glenn’s return to flight soon after.<\/p>",
            "sources": [
              {
                "name": "Aerospace America",
                "url": "https://aerospaceamerica.aiaa.org/nasa-eyeing-year-end-tanking-test-and-summer-2027-launch-for-artemis-iii/"
              }
            ]
          },
          {
            "headline": "How many Starship flights for a Moon landing? 22, or 6 to 8",
            "body": "<p>NASA’s safety panel estimates about 22 refuelling flights for the Starship lunar lander; Musk says it will be “more like 6 to 8.” The gap matters, because orbital refuelling is the least-proven step on the path to a 2028 landing.<\/p>",
            "sources": [
              {
                "name": "Ars Technica",
                "url": "https://arstechnica.com/space/2026/10/latest-estimate-for-starship-launches-required-to-support-a-moon-landing-22/"
              }
            ]
          },
          {
            "headline": "Blue Origin plans new Florida pads; Starbase seeks 456 launches a year",
            "body": "<p>Blue Origin plans a 330-million-dollar Cape Canaveral expansion with two new pads by mid-2027, though New Glenn has not flown since a May test explosion. The FAA is reviewing SpaceX’s plan for up to 456 Starship launches a year from Texas, with comments due Nov. 30.<\/p>",
            "sources": [
              {
                "name": "Space Foundation",
                "url": "https://www.spacefoundation.org/2026/10/21/washington-updates-boosting-starship-cadence/"
              }
            ]
          }
        ],

        "stories": [
          {
            "headline": "Artemis III on track for summer 2027; Moon landing still 2028",
            "body": "<p>Administrator Jared Isaacman said NASA will stack the SLS boosters with the core stage this month, run a tanking test by year’s end and launch Artemis III between about May and September 2027. The two-week Earth-orbit mission sends four astronauts to dock first with Blue Origin’s Blue Moon test lander, with two crew entering it, and then with a Starship test article for about two hours. Artemis IV, the first landing since Apollo, stays set for 2028, with the lander not yet chosen.<\/p>",
            "sources": [
              {
                "name": "Aerospace America",
                "url": "https://aerospaceamerica.aiaa.org/nasa-eyeing-year-end-tanking-test-and-summer-2027-launch-for-artemis-iii/"
              },
              {
                "name": "AP News",
                "url": "https://apnews.com/article/nasa-artemis-moon-astronauts-space-0a535368f718cb42f5b9c3378d3953c2"

              {
                "name": "NASA",
                "url": "https://www.nasa.gov/blogs/missions/2026/10/23/nasa-shares-artemis-acceleration-plans-for-moon-missions/"
              }
            ],
            "why": "The plan answers this week’s safety-panel worries with a step-by-step rehearsal before anyone lands."
          },
          {
            "headline": "NASA moving fast toward a Moon base",
            "body": "<p>AP reports the agency is moving fast on plans for a Moon base alongside the landings. Parsons said both lander providers, SpaceX and Blue Origin, plan Moon landings in 2028, and the Artemis III flight will also test the new lunar spacesuits.<\/p>",
            "sources": [
              {
                "name": "AP News",
                "url": "https://apnews.com/article/nasa-artemis-moon-astronauts-space-0a535368f718cb42f5b9c3378d3953c2"
              },
              {
                "name": "Aerospace America",
                "url": "https://aerospaceamerica.aiaa.org/nasa-eyeing-year-end-tanking-test-and-summer-2027-launch-for-artemis-iii/"
              }
            ]
          },
          {
            "headline": "Safety panel warns NASA could lose crew access to orbit",
            "body": "<p>NASA’s Aerospace Safety Advisory Panel warned the agency risks losing human access to low Earth orbit, given Crew Dragon’s expected retirement and uncertainty over commercial space stations. It also flagged “numerous firsts” in the Moon-landing plan.<\/p>",
            "sources": [
              {
                "name": "SpaceNews",
                "url": "https://spacenews.com/nasa-safety-advisers-warn-agency-risks-losing-crewed-access-to-leo/"
              }
            ]
          },
          {
            "headline": "NASA Science overhauls how it picks missions",
            "body": "<p>Science chief Nicola Fox announced “Competition Model 2.0,” which judges proposals on science first and cuts selection time by up to 45%, from about 35 months to 19.5. Goddard and JPL will lead implementation studies, and a town hall is set for Monday, Oct. 26, at 2 p.m. Eastern.<\/p>",
            "sources": [
              {
                "name": "NASA Science",
                "url": "https://science.nasa.gov/directorates/smd/faster-to-science-a-letter-to-the-science-community/"
              }
            ]
          },
          {
            "headline": "Roman nears science; X-59 gets a new pilot",
            "body": "<p>The Nancy Grace Roman Space Telescope has entered its final commissioning phase, and NASA pilot Mike Lippert flew the low-boom supersonic X-59 for the first time, reaching Mach 1.4 at 55,000 feet. Psyche is now thrusting steadily toward its metal asteroid, due in 2029.<\/p>",
            "sources": [
              {
                "name": "NASA Science",
                "url": "https://science.nasa.gov/blogs/roman/2026/10/22/nasas-roman-space-telescope-enters-final-commissioning-phase/"

        "stories": [
          {
            "headline": "Miami: Little Flower’s new pipe organ premieres Saturday",
            "body": "<p>Organist Nathan Laube inaugurates the new French Romantic pipe organ at Church of the Little Flower in Coral Gables on Saturday, Oct. 24, at 7:30 p.m., free and open to all, as the parish marks its centennial. The instrument was a decade in the making.<\/p>",

          {
            "headline": "Miami: Emmaus retreats and a sixth-grade vocations rally",
            "body": "<p>Emmaus retreats run this weekend across the archdiocese, including the men’s English Emmaus at Our Lady of Lourdes, and sixth-graders from archdiocesan schools gathered at St. Agatha for the FOCUS 11 vocations rally.<\/p>",

          {
            "headline": "Europe: Shevchuk brings Ukraine’s prisoners to the Pope; papal aid mission next",
            "body": "<p>Major Archbishop Sviatoslav Shevchuk, who leads the world’s largest Eastern Catholic church, gave Pope Leo a list of hundreds of Ukrainian prisoners of war. Who goes next: Archbishop Luis Marín de San Martín, the Papal Almoner and prefect of the Dicastery for the Service of Charity, visits Ukraine Oct. 27 to 30 with food and medicine.<\/p>",
            "sources": [
              {
                "name": "Vatican News",

          },
          {
            "headline": "Latin America: Panama’s bishops at the Vatican; two priests remembered",
            "body": "<p>Archbishop José Domingo Ulloa of Panama, president of the bishops’ conference, said the Pope asked them to be bridges of dialogue and solidarity, close to migrants. Fr. Guillermo Sosa’s cause received the nihil obstat, and the bishops presented the life of Fr. Héctor Gallego, a Colombian-born priest who served farmworkers in Veraguas and disappeared in 1971.<\/p>",
            "sources": [
              {
                "name": "Vatican News (Spanish)",
                "url": "https://www.vaticannews.va/es/papa/news/2026-10/mons-ulloa-llamado-papa-dialogo-solidaridad-visita-ad-limina.html"
              }
            ]
          },
          {
            "headline": "North America: Illinois Catholic hospitals shielded from assisted-suicide rules",
            "body": "<p>A federal judge’s temporary order now covers the Illinois Catholic Health Association, which the Thomas More Society says protects 95% of the state’s Catholic health institutions from having to refer patients for assisted suicide.<\/p>",
            "sources": [
              {
                "name": "OSV News via CNA",
                "url": "https://catholics.news/most-catholic-health-institutions-in-illinois-temporarily-protected-from-assisted-suicide-law"
              }
            ]
          },
          {
            "headline": "Africa: Angola’s bishops call the family a “school of faith”",
            "body": "<p>Archbishop José Manuel Imbamba of Saurimo, president of the bishops of Angola and São Tomé, said after the Vatican’s Amoris Laetitia anniversary meeting that the Church must protect the family’s dignity and walk with families in crisis. His continent now has more Catholics than Europe.<\/p>",
            "sources": [
              {
                "name": "Vatican News",
                "url": "https://www.vaticannews.va/en/africa/news/2026-10/angola-archbishop-imbamba-highlights-the-family-s-role-in-nurtu.html"

            ]
          },
          {
            "headline": "Asia: 1,650 children in Myanmar keep the 100th Mission Sunday",
            "body": "<p>In war-torn Myanmar, about 1,650 children gathered near Yangon for World Mission Sunday, where Cardinal Charles Maung Bo told them they “can be a missionary today” through small kindnesses.<\/p>",
            "sources": [
              {
                "name": "Vatican News",

              }
            ]
          },
          {
            "headline": "Appointments calendar: installations through Oct. 31",
            "body": "<p>No new bishop appointments appeared in today’s Vatican bulletin. Bishop Alfonso Raimo is installed in Terni-Narni-Amelia, Italy, on Saturday. Bishop Crispin Varquez is installed in Tagbilaran, Philippines, on Tuesday; who he is: a Filipino bishop appointed by Pope Leo in September. Archbishop Giorgio Ferretti of Foggia-Bovino takes Lucera-Troia on Oct. 29. On Oct. 31, Bishop Michele Di Tolve takes Chioggia, near Venice; Georgios Altouvas is installed as Bishop of Syros, Greece; and Fr. Jean Abou Charouche is ordained Melkite apostolic exarch for Argentina, shepherding Eastern Catholics there.<\/p>",

          {
            "headline": "North and South America: Metuchen’s new bishop; an Amazon diocese gets one",
            "body": "<p>Bishop Michael Saporito, formerly an auxiliary of Newark, was installed Thursday as Bishop of Metuchen, New Jersey. In Brazil, Fr. Leandro Machado Silvestre, 48, a seminary rector and missionary priest from Mogi das Cruzes, was named bishop of Guajará-Mirim on the Bolivian border.<\/p>",

            "body": "<p>The Diocese of Parramatta’s Eucharistic miracles exhibit runs through Sunday, Oct. 25, drawing pilgrims across western Sydney.<\/p>",

      {
        "id": "signs",
        "title": "Signs of the times",
        "headline": "Countdown posts Oct. 23; Marian message Oct. 22; Medjugorje mural.",
        "stories": [
          {
            "headline": "Countdown to the Kingdom: two new posts dated Oct. 23",
            "body": "<p>Checked this evening: Countdown to the Kingdom’s newest posts are both dated Friday, Oct. 23. “The Suicide of the West” links Mark Mallett’s latest reflection at The Now Word on the state of Western civilization. “Defending Your Family” shares a reflection by Brian Kravec built on Fatima seer Sr. Lúcia’s letter to Cardinal Carlo Caffarra: “the decisive battle between the kingdom of Christ and Satan will be over marriage and the family… But do not be afraid, because Our Lady has already crushed his head.”<\/p><p>The thread this week runs from Pedro Regis’s warnings of “a great war” (Oct. 20) and of one “who opposes Christ” (Oct. 21) to these practical calls to guard the home. Read soberly, the counsel is concrete: family prayer, the sacraments, and fidelity in marriage.<\/p>",
            "sources": [
              {
                "name": "Countdown to the Kingdom",
                "url": "https://www.countdowntothekingdom.com/the-suicide-of-the-west/"
              },
              {
                "name": "Countdown to the Kingdom",
                "url": "https://www.countdowntothekingdom.com/defending-your-family/"
              },
              {
                "name": "Countdown to the Kingdom",
                "url": "https://www.countdowntothekingdom.com/"
              }
            ]
          },
          {
            "headline": "Marian: latest message still Oct. 22, “God is in a hurry. Turn back.”",
            "body": "<p>The most recent message attributed to Our Lady, Queen of Peace, through Pedro Regis in Anguera, Brazil, remains No. 5,993, dated Thursday, Oct. 22, 2026. In our translation: “Dear children, pray. Only through prayer can you achieve victory… Humanity has turned away from the Lord. God is in a hurry. Turn back.” It adds a promise: “After all the pain will come great joy.” Messages there usually come several times a week, so another may arrive this weekend; the Church has not ruled on Anguera, and it is offered for prayerful discernment.<\/p>",
            "sources": [
              {
                "name": "Apelos Urgentes",
                "url": "https://apelosurgentes.com.br/pt-br/mensagens/"
              }
            ]
          },
