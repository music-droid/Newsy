          {
            "headline": "Appointments calendar: installations through Oct. 31",
            "body": "<p>Bishop Crispin Varquez is installed in Tagbilaran, Philippines, on Tuesday, Oct. 27. Who he is: a Filipino bishop appointed by Pope Leo in September. Archbishop Giorgio Ferretti of Foggia-Bovino takes Lucera-Troia in Italy on Oct. 29, and Bishop Michele Di Tolve takes Chioggia, near Venice, on Oct. 31. No new appointments had been published in the Vatican’s bulletin by mid-morning.<\/p>",

            "headline": "North and South America: Metuchen’s new bishop; an Amazon diocese gets one",
            "body": "<p>Bishop Michael Saporito, formerly an auxiliary of Newark, was installed Thursday as Bishop of Metuchen, New Jersey. In Brazil, Fr. Leandro Machado Silvestre, 48, a seminary rector and missionary priest from Mogi das Cruzes, was named bishop of Guajará-Mirim on the Bolivian border.<\/p>",

        "headline": "Countdown latest Oct. 21; new Marian message Oct. 22.",
        "stories": [
          {
            "headline": "Countdown to the Kingdom: checked this morning, latest post Oct. 21",
            "body": "<p>Checked this morning: the newest Countdown to the Kingdom post is still Wednesday’s, “Pedro – The One Who Opposes Christ,” dated Oct. 21, after “There Will be a Great War” on Oct. 20 and “What is the Promised Peace?” on Oct. 16. The thread this week runs from warnings of conflict to calls for steady prayer, which the site pairs with messages from the Italian seers Angela and Simona. Read soberly, the common counsel is confession, the Rosary and trust, not fear.<\/p>",

              {

                "url": "https://www.countdowntothekingdom.com/"
              },
              {
                "name": "Countdown to the Kingdom",
                "url": "https://www.countdowntothekingdom.com/pedro-a-reference-to-antichrist/"
              }
            ]
          },
          {
            "headline": "Marian: a new message dated Oct. 22: “God is in a hurry. Turn back.”",
            "body": "<p>The latest message attributed to Our Lady, Queen of Peace, through Pedro Regis in Anguera, Brazil, is No. 5,993, dated Thursday, Oct. 22, 2026. In our translation: “Dear children, pray. Only through prayer can you achieve victory… Humanity has turned away from the Lord. God is in a hurry. Turn back.” It continues: “Difficult times will come for the just, but those who remain faithful to the end will be proclaimed blessed by the Father. Courage! After all the pain will come great joy.” The Church has not ruled on Anguera, so it is offered for prayerful discernment.<\/p>",
            "sources": [
              {
                "name": "Apelos Urgentes",
                "url": "https://apelosurgentes.com.br/pt-br/mensagens/"
              }
            ]
          },
          {
            "headline": "Medjugorje: Mariological Days continue; monthly message due Sunday",
            "body": "<p>The first Mariological Days continue through Sunday in the Hall of St. John Paul II, opened by Archbishop Aldo Cavalli, the Holy See’s apostolic visitor, with theologians revisiting the Second Vatican Council’s teaching on Mary. The monthly message to Marija is expected Sunday, Oct. 25.<\/p>",
            "sources": [
              {
                "name": "Medjugorje.hr",
                "url": "https://medjugorje.hr/en/news/mariological-days-medjugorje/460"

        "headline": "Housing-cost order signed; Alzheimer’s plan unveiled in Florida.",
        "stories": [
          {
            "headline": "Lower costs: an order to cut mortgage insurance and closing costs",
            "body": "<p>Promise: make homeownership affordable again. What was done: President Trump signed “Decreasing Housing Costs for the American People,” directing the FHFA to pilot proactive cancellation of mortgage insurance for borrowers with enough equity, make its title-insurance waiver for refinances permanent, and asking USDA and VA to lower rates on their direct home loans, plus a manufactured-housing task force. Real impact: lenders call it “a big deal” for refinancing; KBW analysts expect limited market effect because refinances are only about 7% of title premiums. Room for disagreement: the savings depend on rates falling enough for people to refinance.<\/p>",
            "sources": [
              {
                "name": "HousingWire",
                "url": "https://www.housingwire.com/articles/trump-order-mortgage-insurance/"
              },
              {
                "name": "The White House",
                "url": "https://www.whitehouse.gov/fact-sheets/2026/10/fact-sheet-president-donald-j-trump-decreases-housing-costs-for-americans/"
              }
            ]
          },
          {
            "headline": "MAHA: Kennedy brings a new Alzheimer’s plan to Fort Lauderdale",
            "body": "<p>Promise: prevent chronic disease, not just treat it. What was done: Secretary Kennedy, CMS chief Dr. Mehmet Oz and Sen. Rick Scott unveiled the 2026 national Alzheimer’s plan at Broward Health, with an FDA Alzheimer’s Prevention Accelerator and up to 48.8 million dollars from ARPA-H for earlier detection. Kennedy tied dementia to blood pressure, diabetes, obesity and inactivity. Real impact: about 7.4 million Americans live with dementia, and Florida is among the hardest-hit states; results will take years to measure.<\/p>",
            "sources": [
              {
                "name": "WLRN",
                "url": "https://www.wlrn.org/health/2026-10-22/rfk-jr-dr-oz-visit-broward-health-to-outline-new-federal-alzheimers-initiative"
              },
              {
                "name": "HHS",
                "url": "https://www.hhs.gov/press-room/hhs-unveils-national-plan-alzheimers-dementia-prevention-care.html"
              }
            ]
          },
          {
            "headline": "Bring Americans home: Hubbard is back on U.S. soil",
            "body": "<p>Promise: bring wrongfully detained Americans home. What was done: Stephen Hubbard, freed by Putin during envoy Witkoff’s visit, landed at Joint Base San Antonio-Lackland last night; Trump says there was “no swap.” Real impact: a 74-year-old held more than four years is home. Room for disagreement: Kyiv says the gesture came as Washington eased sanctions on Russian diesel.<\/p>",
            "sources": [
              {
                "name": "KSAT",
                "url": "https://www.ksat.com/news/local/2026/10/22/american-released-from-russian-custody-lands-at-joint-base-san-antonio-lackland/"

              }
            ]
          },
          {
            "headline": "Ending the war: talks are set, but cluster warheads hit Kyiv",
            "body": "<p>Promise: end the war in Ukraine. What was done: after Witkoff’s three hours with Putin, Russia agreed to three-way talks after Nov. 10, and Trump called it “the closest we’ve been.” Real impact so far: none on the ground; Zelensky says Russia used cluster warheads on Kyiv overnight, and the Kremlin says the new proposals lack substance. Room for disagreement: Congress is pushing back on the sanctions relief offered to draw Moscow in.<\/p>",
            "sources": [
              {
                "name": "CBS News",
                "url": "https://www.cbsnews.com/news/zelenskyy-russia-cluster-warheads-deadly-strikes-hours-after-us-prisoner-release/"
              },
              {
                "name": "The Guardian",
                "url": "https://www.theguardian.com/world/2026/oct/22/ukraine-war-briefing-peace-proposals-lack-substance-witkoff-putin-meeting"
              }
            ]
          },
          {
            "headline": "MAHA: the women’s health order is now in the Federal Register",
            "body": "<p>Promise: put women’s health and chronic disease at the center of federal research. What was done: the executive order creating an NIH Women’s Health Division within 90 days and a White House task force co-chaired by Secretary Kennedy and chief of staff Susie Wiles was published today. Real impact: still to come; the test is funding and whether research on menopause, maternal health and sex differences actually grows.<\/p>",

              {
                "name": "HHS",
                "url": "https://www.hhs.gov/press-room/trump-flotus-womens-health-executive-order-new-nih-division.html"

                "url": "https://www.whitehouse.gov/fact-sheets/2026/10/fact-sheet-president-donald-j-trump-and-first-lady-melania-trump-advance-womens-health-to-improve-outcomes-in-all-phases-of-life/"
              }

          {
            "headline": "Securing the border: Big Bend wall fight reaches the Supreme Court",
            "body": "<p>Promise: finish the wall. What was done: the administration asked the justices to let construction resume in Big Bend National Park after a judge blocked it over environmental and historic-preservation waivers. Real impact: work stays paused until the Court acts. Room for disagreement: Texans on both sides of the aisle have objected to building in the park.<\/p>",

                "name": "Al Jazeera",

            "headline": "MAHA: HHS launches a national kidney-care plan focused on prevention",
            "body": "<p>Promise: tackle chronic disease at the root. What was done: HHS Secretary Robert F. Kennedy Jr. on Tuesday launched a Kidney Care National Plan built on Trump’s 2019 executive order, aiming to detect kidney disease earlier, expand home dialysis and competition, and make living donation easier. About 37 million American adults have kidney disease, most without knowing it. Real impact so far: HHS’s own analysis credits the 2019 order with about 2,000 extra transplants a year; the new plan is a strategy, so funding and rules will tell.<\/p>",

          {
            "headline": "How many Starship flights to land on the Moon? NASA’s panel says 22",
            "body": "<p>At NASA’s safety panel meeting today, former astronaut Charlie Precourt said the latest estimate for refueling flights for the Starship lunar lander is “around 22.” Musk replied on X that the number is “way too high” and will be “more like 6 to 8.” Even at twice-weekly launches, 22 flights would take about three months.<\/p>",

          {
            "headline": "Blue Origin plans two new Florida pads; Starbase seeks 456 launches a year",
            "body": "<p>Blue Origin plans a 330-million-dollar Cape Canaveral expansion adding two launch and landing pads by mid-2027; New Glenn has not flown since a May hot-fire explosion. The FAA is reviewing SpaceX’s plan for up to 456 Starship launches a year from Starbase, with public comments due Nov. 30.<\/p>",
            "sources": [
              {
                "name": "Space Foundation",
                "url": "https://www.spacefoundation.org/2026/10/21/washington-updates-boosting-starship-cadence/"
              }
            ]
          },
          {
            "headline": "SpaceX will try to catch both booster and ship on Starship’s next flight",
            "body": "<p>Ars Technica reports that SpaceX plans to catch Starship itself, not just the Super Heavy booster, on the next flight, aiming for a much faster launch cadence; the company cites “significant constructive engagement with the FAA.”<\/p>",
            "sources": [
              {
                "name": "SpaceNexus Daily",
                "url": "https://spacenexus.us/briefing/2026-10-22"
              },
              {
                "name": "KeepTrack space brief",
                "url": "https://keeptrack.space/space-brief/space-brief-2026-10-21"
              }
            ]
          },
          {
            "headline": "Artemis II’s Jeremy Hansen becomes Canada’s special adviser on space",
            "body": "<p>Prime Minister Mark Carney appointed astronaut Jeremy Hansen, who flew around the Moon on Artemis II in April and has just retired from the Canadian Space Agency, as special adviser on space to him and Industry Minister Mélanie Joly. Hansen will help write a new national space strategy focused on sovereignty and security. The same day, Defence Minister David McGuinty announced a 20-million-dollar agreement for a launch complex in southern Newfoundland, adding to one in Nova Scotia, so Canada can put critical satellites up without relying on foreign rockets.<\/p>",
            "sources": [
              {
                "name": "CBC News (Canadian Press)",
                "url": "https://www.cbc.ca/news/politics/jeremy-hansen-carney-special-adviser-9.7390754"
              }
            ]
          },
          {
            "headline": "China launches a Ceres-1 from a ship in the Yellow Sea",
            "body": "<p>Late Tuesday Eastern time, Galactic Energy launched a Ceres-1 solid rocket from the Dongfang Hangtiangang launch ship off Rizhao, Shandong, carrying the first pathfinder satellite for the Guangzhou-backed Wuyang remote-sensing constellation, which will fly in low-inclination orbits. Sea launches let China reach orbits that are hard to hit from its inland pads.<\/p>",
            "sources": [
              {
                "name": "SpaceNews: Ceres-1 sea launch",
                "url": "https://spacenews.com/ceres-1-sea-launch-lofts-first-satellite-for-low-inclination-wuyang-remote-sensing-constellation/"
              }
            ]
          }

            "headline": "Safety panel flags “numerous firsts” for the Moon landing",
            "body": "<p>NASA’s Aerospace Safety Advisory Panel warned today that Artemis IV carries “a large number of firsts that reduce the likelihood of mission success,” chief among them repeated fueling of the lander in orbit. Panel member Charlie Precourt praised Administrator Jared Isaacman’s push to clear schedule barriers; NASA still aims for a crewed landing in 2028.<\/p>",
            "sources": [
              {
                "name": "Ars Technica",
                "url": "https://arstechnica.com/space/2026/10/latest-estimate-for-starship-launches-required-to-support-a-moon-landing-22/"
              }
            ]
          },
          {
            "headline": "Roman Space Telescope enters its final commissioning phase",
            "body": "<p>NASA says the Nancy Grace Roman Space Telescope has finished checkout and begun final science commissioning, with test images performing well in crowded star fields and dusty regions. Hubble’s gravitational-lens observations are helping prepare Roman’s dark-matter science.<\/p>",
            "sources": [
              {
                "name": "NASA Science",
                "url": "https://science.nasa.gov/blogs/roman/2026/10/22/nasas-roman-space-telescope-enters-final-commissioning-phase/"

              {
                "name": "NASA Science",
                "url": "https://science.nasa.gov/missions/hubble/nasas-hubble-charts-path-for-roman-with-gravitational-lenses/"
              }
            ]
          },
          {
            "headline": "Psyche thrusts toward the asteroid belt; X-59 gets a new pilot",
            "body": "<p>After its Mars flyby, the Psyche spacecraft has begun nearly continuous electric thrusting toward its metal-rich asteroid, arriving in summer 2029. And NASA test pilot Mike Lippert flew the X-59, built to make a soft sonic “thump,” for the first time, reaching Mach 1.4 at 55,000 feet.<\/p>",
            "sources": [
              {
                "name": "NASA Science",
                "url": "https://science.nasa.gov/blogs/psyche/2026/10/22/pedal-to-the-metal-nasas-psyche-heads-toward-asteroid-belt/"
              },
              {
                "name": "NASA",
                "url": "https://www.nasa.gov/blogs/quesst/2026/10/22/nasas-mike-lippert-takes-controls-of-x-59-for-first-time/"
              }
            ]
          },
          {
            "headline": "Artemis update Friday at Kennedy",
            "body": "<p>Administrator Jared Isaacman and Artemis leaders brief at Kennedy Space Center on Friday at 2 p.m. on speeding toward a crewed Moon landing by 2028, with Artemis III now planned as a 2027 docking test in Earth orbit.<\/p>",
            "sources": [
              {
                "name": "The Florida Press: Artemis briefing",
                "url": "https://www.thefloridapress.com/news/nasa-leaders-to-update-artemis-acceleration-and-2028-moon-landing-plan-at-kenned"
              }
            ]
          },
          {
            "headline": "An RS-25 engine fires for nearly 500 seconds for future Artemis rockets",
            "body": "<p>NASA tested RS-25 engine No. 10001 for close to 500 seconds at Stennis Space Center in Mississippi, validating flight components and a new thermal-protection system for the engines that power the Space Launch System on future Artemis missions. Each SLS core stage flies four RS-25s, and this test series supports the newly built engines meant for later Moon flights.<\/p>",
            "sources": [
              {
                "name": "NASA",
                "url": "https://www.nasa.gov/image-article/rs-25-engine-test-in-support-of-future-artemis-missions/"
              }
            ]
          },
          {
            "headline": "SR-1 Freedom, NASA’s nuclear-powered Mars craft, moves ahead",
            "body": "<p>NASA says contract actions are keeping Space Reactor-1 Freedom on track for a late-2028 launch as the first fission-powered spacecraft to travel beyond Earth orbit. Sierra Lobo will build the power-conversion system that turns the Idaho National Laboratory reactor’s heat into electricity for electric propulsion, and the reactor stays off until the craft leaves Earth orbit. At Mars it will deliver SkyFall, three helicopters evolved from Ingenuity, to scout for water.<\/p>",
            "sources": [
              {
                "name": "NASA: SR-1 Freedom advances",
                "url": "https://www.nasa.gov/centers-and-facilities/glenn/sr-1-freedom-advances-with-progress-on-nuclear-power-module/"

            ],
            "why": "The same fission technology is meant to keep a Moon base running through the long lunar night."
          }

        "headline": "John Paul II relic tonight; Holy See–Honduras accord.",
        "stories": [
          {
            "headline": "Miami: A relic of St. John Paul II for veneration tonight",
            "body": "<p>On the saint’s feast day, the Servants of the Pierced Hearts of Jesus and Mary hold a bilingual Mass with veneration of a relic of St. John Paul II at 7 p.m. tonight at Church of the Little Flower, 2711 Indian Mound Trail, Coral Gables. The same church premieres its new pipe organ Saturday night.<\/p>",
            "sources": [
              {
                "name": "Archdiocese of Miami",
                "url": "https://www.miamiarch.org/CatholicDiocese.php?op=Event_179259611829656"
              }
            ]
          },
          {
            "headline": "Miami: Little Flower inaugurates a new French Romantic pipe organ Saturday",
            "body": "<p>World-renowned organist Nathan Laube will inaugurate the new pipe organ at Church of the Little Flower in Coral Gables on Saturday, Oct. 24, at 7:30 p.m., free and open to all, as part of the parish’s 100th anniversary. A decade in the making, the instrument is designed to recreate the sound St. Thérèse of Lisieux would have heard, and it is the only organ in Southeast Florida with mechanical action. The same weekend brings Emmaus retreats in English and Spanish and the FOCUS 11 vocations rally for sixth-graders on Friday.<\/p>",
            "sources": [
              {
                "name": "Archdiocese of Miami: Coming up this weekend",
                "url": "https://www.miamiarch.org/CatholicDiocese.php?op=Article_archdiocese-of-miami-around-the-archdiocese-coming-up-this-weekend-10-23-2026"
              }
            ],
            "why": "A rare local event for church musicians: mechanical-action organs are almost unknown in South Florida."
          },
          {
            "headline": "Miami: Wenski keeps up his religious-liberty case on school vaccines",
            "body": "<p>Archbishop Thomas Wenski is pressing his dispute with Attorney General James Uthmeier, who warned Catholic schools could lose voucher funding unless they grant religious exemptions to vaccines. Wenski says the Church does not consider those vaccines objectionable, that the schools follow state health guidance, and that parents choosing a Catholic school “expect the Catholic school to be Catholic.” He called the threat “classic bullying” and said it reflects attacks now coming “from the right.”<\/p>",
            "sources": [
              {
                "name": "WUSF: Miami archbishop hits back",
                "url": "https://www.wusf.org/health-news-florida/2026-10-19/miami-archbishop-hits-back-ag-uthmeier-over-catholic-schools-vaccine-rules"

              {
                "name": "WLRN: Between the Lines with Wenski",

              }
            ]
          },
          {
            "headline": "Vatican: A new Holy See–Honduras agreement protects the Church’s freedom",
            "body": "<p>Cardinal Parolin and President Nasry Asfura signed a 25-article accord recognizing the Church’s legal status and its freedom to govern itself and carry out its mission. Who they are: Parolin is the Vatican’s secretary of state; Asfura, a former mayor of Tegucigalpa, is Honduras’s president. It enters into force after ratification.<\/p>",
            "sources": [
              {
                "name": "Vatican News",
                "url": "https://www.vaticannews.va/en/vatican-city/news/2026-10/holy-see-honduras-agreement-relations-freedom-religion-church.html"

              {

                "url": "https://tnh.gob.hn/television/asfura-firma-acuerdo-con-el-vaticano-sobre-libertad-religiosa-y-cooperacion"
              }
            ]
          },
          {
            "headline": "Vatican: “Venite ad Me” calls the Church back to the first proclamation",
            "body": "<p>The new Doctrine of the Faith document on transmitting the faith says families no longer pass it on “automatically” and asks parishes to evangelize adults, not only catechize children. It notes conversions are rising in some secular places, but many neophytes drift away soon after baptism, so communities must welcome and accompany them. It also calls for more room for women in leading Church processes.<\/p>",
            "sources": [
              {
                "name": "Vatican News",

            ]
          },
          {
            "headline": "Asia: World Youth Day Seoul opens registration",
            "body": "<p>Pope Leo’s video invitation launched registration for WYD Seoul 2027, Aug. 3–8, under the theme “Take courage! I have overcome the world.” It will be the first World Youth Day in Korea, home to a fast-growing Church founded by lay converts.<\/p>",

              {

              },
              {
                "name": "WYD Seoul 2027",

              }
            ]
          },
          {
            "headline": "Installation: Bishop Michael Saporito’s Metuchen installation was set for today",
            "body": "<p>Bishop Michael A. Saporito was scheduled to be installed at 1 p.m. today as Bishop of Metuchen, New Jersey, succeeding diocesan administrator Fr. Jonathan Toborowsky. Who he is: until now an auxiliary bishop of Newark, named by Pope Leo on Sept. 15 to lead the 1,425-square-mile central New Jersey diocese. Next in the calendar: Bishop Crispin Varquez is installed in Tagbilaran, Philippines, on Tuesday.<\/p>",
            "sources": [
              {
                "name": "USCCB",
                "url": "https://www.usccb.org/news/2026/pope-leo-xiv-appoints-most-reverend-michael-saporito-bishop-metuchen"

              {
                "name": "Catholic-Hierarchy",

              }
            ]

            "headline": "Appointment: Fr. Leandro Machado Silvestre named bishop of Guajará-Mirim, Brazil",
            "body": "<p>Pope Leo on Wednesday named Fr. Leandro Machado Silvestre, 48, bishop of Guajará-Mirim, an Amazon diocese on the Bolivian border in Rondônia. Who he is: a priest of Mogi das Cruzes, near São Paulo, ordained in 2004, a longtime seminary rector, and since 2023 a <em>fidei donum<\/em> missionary priest in Porto Velho, where he is a pastor, spiritual director of the major seminary and, since January, vicar general.<\/p>",
            "sources": [
              {
                "name": "Holy See Press Office: Resignations and Appointments, Oct. 21",

              }
            ]
          },
          {
            "headline": "Appointment: Bishop Ignatius Ding Zuyao ordained for Haimen, China",
            "body": "<p>Fr. Ignatius Ding Zuyao, 40, was ordained Bishop of Haimen in Jiangsu Province on Oct. 15, after Pope Leo appointed him Aug. 24 under the Holy See–China Provisional Agreement; the news was reported in Hong Kong’s <em>Sunday Examiner<\/em> today. Who he is: a Haimen priest ordained in 2011, trained at Sheshan and Beijing seminaries, and most recently pastor of Qingnian Donglu Parish in Nantong. Bishop Joseph Shen Bin of Shanghai, his predecessor in Haimen, was principal consecrator before about 400 priests, religious and laypeople.<\/p>",
            "sources": [
              {
                "name": "Sunday Examiner",
                "url": "https://www.examiner.org.hk/2026/10/21/new-bishop-ordained-for-haimen-china/news/china/"
              }
            ]
          },
          {
            "headline": "Appointments: Venice, Fla., reshuffles its priests",
            "body": "<p>In Florida’s Diocese of Venice, effective this week, Fr. David Vidal, longtime pastor of Ave Maria Parish, becomes full-time vicar general, among other moves.<\/p>",
            "sources": [
              {
                "name": "Diocese of Venice: Appointments",
                "url": "https://dioceseofvenice.org/tag/appointments/"

        "headline": "Countdown latest Oct. 21; Marian message Oct. 20; Medjugorje opens.",
        "stories": [
          {
            "headline": "Countdown to the Kingdom: checked tonight, latest post still Oct. 21",
            "body": "<p>Checked this evening: the newest Countdown to the Kingdom post remains Wednesday’s “Pedro – The One Who Opposes Christ,” dated Oct. 21, preceded by “There Will be a Great War” and “What is the Promised Peace?” The site pairs these with calls for peace from the Italian seers Angela and Simona. Read together, the theme of the week is spiritual combat answered with prayer, not fear, and the site itself reminds readers that the Church is the final judge of private revelation.<\/p>",
            "sources": [
              {

                "url": "https://www.countdowntothekingdom.com/"
              },
              {
                "name": "Countdown to the Kingdom",

              }
            ]
          },
          {
            "headline": "Marian: the latest message is still Oct. 20; the week’s thread is conversion",
            "body": "<p>No newer message has been posted tonight; the latest is Tuesday, Oct. 20, 2026, attributed to Our Lady, Queen of Peace, through Pedro Regis in Anguera, Brazil: “You live in a time worse than the time of the Flood… None of my devotees will be lost.” It follows Oct. 17 (“You are in the world, but not of the world… this is the opportune time for your return”) and Oct. 13 (“Seek the treasures of God”). Offered for prayerful discernment under the Church’s judgment; the next Medjugorje monthly message is expected Sunday, Oct. 25.<\/p>",
            "sources": [
              {
                "name": "Apelos Urgentes",
                "url": "https://apelosurgentes.com.br/pt-br/mensagens/"
              },
              {
                "name": "Medjugorje.org",
                "url": "https://www.medjugorje.org/olmmsg.htm"
              }
            ]
          },
          {
            "headline": "Medjugorje: the Mariological Days opened this afternoon with Cavalli",
            "body": "<p>The first Mariological Days opened today in the Hall of St. John Paul II, on his feast, with an address by Archbishop Aldo Cavalli, the Holy See’s apostolic visitor, followed by evening prayer and Mass with Fr. Zvonimir Pavičić. Ten theologians will revisit the Second Vatican Council’s teaching on Mary through Sunday, Oct. 25, the day of the monthly message. It shows the Holy See anchoring devotion there in sound theology after its “nihil obstat” on Medjugorje’s spiritual fruits.<\/p>",
            "sources": [
              {
                "name": "PROTV",
                "url": "https://protv.ba/program-marioloskih-dana-u-medugorju/"
              },
              {
                "name": "Medjugorje.hr",
                "url": "https://medjugorje.hr/en/news/mariological-days-medjugorje/460"
              }
            ]
          },
          {
            "headline": "Returns to the faith: the Vatican confirms conversions are rising",
            "body": "<p>Today’s “Venite ad Me” states plainly that conversions and returns to the Church are increasing in some highly secularized places, and gathers testimonies from people who discovered or rediscovered Jesus in its final chapter. Its warning: too many new Catholics drift away soon after baptism, so parishes must become real communities that walk with them.<\/p>",
            "sources": [
              {
                "name": "Vatican News",
                "url": "https://www.vaticannews.va/en/vatican-city/news/2026-10/dicastery-doctrine-faith-venite-ad-me-transmission-change.html"
              }
            ]
          },
          {
            "headline": "Revival: Ohio State’s 35 baptisms, Fresno State next on Sunday",
            "body": "<p>Ohio State’s Oct. 19 “Invitation to Jesus” event, led by football players, drew nearly 1,000 people and ended with 35 baptisms. It joins this fall’s run of campus revivals: about 100 baptized at Appalachian State’s UniteUS rally, 19 at Pepperdine, 15 at North Georgia, with Fresno State’s Fields of Faith planning baptisms this Sunday.<\/p>",
            "sources": [
              {
                "name": "Sports Spectrum",
                "url": "https://sportsspectrum.com/sport/football/2026/10/21/ohio-state-football-3rd-invitation-jesus-event/"
              },
              {
                "name": "WWJD.com",
                "url": "https://wwjd.com/news/campus-baptisms-fall-2026/"
              },
              {
                "name": "Billy Graham Decision",
                "url": "https://billygraham.org/decision-magazine/articles/spirit-movement-at-appalachian-state-university-worship-rally-includes-100-baptisms-in-plastic-lined-truck-beds"
              }
            ]
          },
          {
            "headline": "Revival: UniteUS’s arena nights, from Miami to Appalachian State, roll on",
            "body": "<p>The campus movement UniteUS, founded by Alabama mother Tonya Prewett, filled the University of Miami’s arena in late September, with baptisms in water troughs outside late into the night; Prewett said hundreds committed to follow Jesus, though no count was published. At Appalachian State on Oct. 13, organizers and the Billy Graham association’s <em>Decision<\/em> magazine report more than 700 students chose Christ and about 100 were baptized in plastic-lined pickup-truck beds. Next stops: South Alabama on Oct. 27 and Belmont in Nashville on Nov. 10. A sober note from one Christian outlet: arena counts and baptism counts are different measures, and the real test is whether new believers find a church home by November.<\/p>",
            "sources": [
              {
                "name": "5Talents",
                "url": "https://www.5talentsmag.com/campus/uniteus-campus-revival-miami-baptisms-tonya-prewett"
              },
              {
                "name": "Decision Magazine (BGEA)",
                "url": "https://billygraham.org/decision-magazine/articles/spirit-movement-at-appalachian-state-university-worship-rally-includes-100-baptisms-in-plastic-lined-truck-beds"

              {
                "name": "CBN News",
                "url": "https://cbn.com/news/us/700-students-choose-christ-100-get-baptized-revival-hits-appalachian-state"
              }
            ]
          },
          {
            "headline": "Digital ID and money, soberly: EU wallets get payment rules; digital euro debated",
            "body": "<p>The European Payments Council launched SCARLET, a rulebook for using EU Digital Identity Wallets to approve bank logins and payments, with version 1.0 planned for December 2027. EU lawmakers are meanwhile negotiating digital-euro rules on offline payments, anti-money-laundering checks and merchant fees; the ECB plans a pilot in late 2027 and possible issuance in 2029. These are real steps toward linking identity and money, worth watching for privacy and cash protections, not cause for panic.<\/p>",
            "sources": [
              {
                "name": "Biometric Update",
                "url": "https://www.biometricupdate.com/202610/european-payments-council-launches-scarlet-framework-for-eudi-wallet-payments"
              },
              {
                "name": "Agence Europe",
                "url": "https://agenceurope.eu/en/bulletin/article/13964/26/digital-euro-eu-co-legislators-examine-anti-money-laundering-offline-payments-usage-fees"

              }
            ]
          },
          {
            "headline": "False prophecy, judged: Shakahola sentencing set for Nov. 6",
            "body": "<p>Kenya’s conviction of self-styled pastor Paul Mackenzie and 28 associates for the murders of 191 people, 190 of them children whom he told to starve to “meet Jesus,” is a hard reminder of why the Church tests every claimed revelation. His “End Days” sermons called schools and medicine evil. Sentencing is Nov. 6.<\/p>",

              {
                "name": "BBC: Shakahola verdict",
                "url": "https://www.bbc.com/news/articles/ckd6d2l3dz4xo"
              },

              }
            ]
          },
          {
            "headline": "Eucharistic: the Cuilapa Host remains under the bishop’s study",
            "body": "<p>In Guatemala, the Diocese of Santa Rosa de Lima is still studying a consecrated Host at Cuilapa’s cathedral that did not dissolve in water and showed reddish stains; it is kept reserved, not displayed, and the parish asks for “prudence and moderation.” In Australia, a Eucharistic miracles exhibit runs in Parramatta through Oct. 25.<\/p>",

              {

        "headline": "John Paul II relic Mass tonight; big family weekend ahead.",
        "stories": [
          {
            "headline": "Tonight: Mass and a St. John Paul II relic in Coral Gables",
            "body": "<p>A bilingual Mass with veneration of a relic of St. John Paul II begins at 7 p.m. at Church of the Little Flower, 2711 Indian Mound Trail. All are welcome.<\/p>",
            "sources": [

            "body": "<p>Promise: bring wrongfully detained Americans home. What was done: Stephen Hubbard, freed by Putin during envoy Witkoff’s visit, landed at Joint Base San Antonio-Lackland last night; Trump says there was “no swap.” Real impact: a 74-year-old held more than four years is home. Room for disagreement: Kyiv says the gesture came as Washington eased sanctions on Russian diesel.<\/p>",

            "headline": "An RS-25 engine fires for nearly 500 seconds for future Artemis rockets",
            "body": "<p>NASA tested RS-25 engine No. 10001 for close to 500 seconds at Stennis Space Center in Mississippi, validating flight components and a new thermal-protection system for the engines that power the Space Launch System on future Artemis missions. Each SLS core stage flies four RS-25s, and this test series supports the newly built engines meant for later Moon flights.<\/p>",

            "headline": "Miami: Little Flower inaugurates a new French Romantic pipe organ Saturday",
            "body": "<p>World-renowned organist Nathan Laube will inaugurate the new pipe organ at Church of the Little Flower in Coral Gables on Saturday, Oct. 24, at 7:30 p.m., free and open to all, as part of the parish’s 100th anniversary. A decade in the making, the instrument is designed to recreate the sound St. Thérèse of Lisieux would have heard, and it is the only organ in Southeast Florida with mechanical action. The same weekend brings Emmaus retreats in English and Spanish and the FOCUS 11 vocations rally for sixth-graders on Friday.<\/p>",

            "headline": "Miami: Wenski keeps up his religious-liberty case on school vaccines",
            "body": "<p>Archbishop Thomas Wenski is pressing his dispute with Attorney General James Uthmeier, who warned Catholic schools could lose voucher funding unless they grant religious exemptions to vaccines. Wenski says the Church does not consider those vaccines objectionable, that the schools follow state health guidance, and that parents choosing a Catholic school “expect the Catholic school to be Catholic.” He called the threat “classic bullying” and said it reflects attacks now coming “from the right.”<\/p>",

            "headline": "Vatican: “Venite ad Me” calls the Church back to the first proclamation",
            "body": "<p>The new Doctrine of the Faith document on transmitting the faith says families no longer pass it on “automatically” and asks parishes to evangelize adults, not only catechize children. It notes conversions are rising in some secular places, but many neophytes drift away soon after baptism, so communities must welcome and accompany them. It also calls for more room for women in leading Church processes.<\/p>",

            "headline": "Asia: World Youth Day Seoul opens registration",
            "body": "<p>Pope Leo’s video invitation launched registration for WYD Seoul 2027, Aug. 3–8, under the theme “Take courage! I have overcome the world.” It will be the first World Youth Day in Korea, home to a fast-growing Church founded by lay converts.<\/p>",

            "headline": "Installation: Bishop Michael Saporito takes the chair in Metuchen today",

            "headline": "Appointment: Fr. Leandro Machado Silvestre named bishop of Guajará-Mirim, Brazil",

            "headline": "Appointment: Bishop Ignatius Ding Zuyao ordained for Haimen, China",
            "body": "<p>Fr. Ignatius Ding Zuyao, 40, was ordained Bishop of Haimen in Jiangsu Province on Oct. 15, after Pope Leo appointed him Aug. 24 under the Holy See–China Provisional Agreement; the news was reported in Hong Kong’s <em>Sunday Examiner<\/em> today. Who he is: a Haimen priest ordained in 2011, trained at Sheshan and Beijing seminaries, and most recently pastor of Qingnian Donglu Parish in Nantong. Bishop Joseph Shen Bin of Shanghai, his predecessor in Haimen, was principal consecrator before about 400 priests, religious and laypeople.<\/p>",

      {

        "headline": "Countdown latest Oct. 21; Marian message Oct. 20; Medjugorje days open.",
        "stories": [
          {
            "headline": "Countdown to the Kingdom: checked this morning, latest post Oct. 21",
            "body": "<p>Checked at dawn: the newest Countdown to the Kingdom post is still Wednesday’s “Pedro – The One Who Opposes Christ,” dated Oct. 21, after Tuesday’s “There Will be a Great War.” Its key line, from an Oct. 13 message, says “He who opposes Christ will act in the world, and my poor children will carry a heavy cross.” The site itself reminds readers that the Church, not the site, is the final judge of private revelation.<\/p>",
            "sources": [
              {
                "name": "Countdown to the Kingdom",
                "url": "https://www.countdowntothekingdom.com/"
              },
              {
                "name": "Countdown: Pedro – The One Who Opposes Christ",

              }
            ]
          },
          {
            "headline": "Marian: the newest message is Oct. 20, a call not to delay conversion",
            "body": "<p>The latest dated Marian message is Tuesday, Oct. 20, 2026, attributed to Our Lady, Queen of Peace, through Pedro Regis in Anguera, Brazil: “You live in a time worse than the time of the Flood… None of my devotees will be lost. This is the time of grace. What you have to do, do not leave for tomorrow.” They are offered here for prayerful discernment, under the Church’s judgment. The next Medjugorje monthly message is expected Sunday, Oct. 25.<\/p>",
            "sources": [
              {
                "name": "Apelos Urgentes (Anguera)",
                "url": "https://apelosurgentes.com.br/pt-br/mensagens/"
              },
              {
                "name": "Medjugorje.org messages",

              }
            ]

          {
            "headline": "Medjugorje: the first Mariological Days open this afternoon",
            "body": "<p>The first Mariological Days in Medjugorje open today at 3 p.m. local time (9 a.m. Eastern) with an address by Archbishop Aldo Cavalli, the Vatican’s apostolic visitor, and run through Oct. 25 with ten theologians revisiting the Second Vatican Council’s teaching on Mary. It is a sign of how the Holy See, after granting its “nihil obstat” to the spiritual fruits of Medjugorje, is anchoring devotion there in sound theology.<\/p>",
            "sources": [
              {
                "name": "Medjugorje.hr",
                "url": "https://medjugorje.hr/en/news/mariological-days-medjugorje/460"
              },
              {
                "name": "Medjugorje.it",

          {
            "headline": "Returns to the faith: the Vatican confirms conversions are rising",
            "body": "<p>Today’s “Venite ad Me” states plainly that conversions and returns to the Church are increasing in some highly secularized places, and gathers testimonies from people who discovered or rediscovered Jesus in its final chapter. Its warning: too many new Catholics drift away soon after baptism, so parishes must become real communities that walk with them.<\/p>",
            "sources": [
              {
                "name": "Vatican News",
                "url": "https://www.vaticannews.va/en/vatican-city/news/2026-10/dicastery-doctrine-faith-venite-ad-me-transmission-change.html"
              }
            ]
          },
          {
            "headline": "Revival: Ohio State’s 35 baptisms, Fresno State next on Sunday",
            "body": "<p>Ohio State’s Oct. 19 “Invitation to Jesus” event, led by football players, drew nearly 1,000 people and ended with 35 baptisms. It joins this fall’s run of campus revivals: about 100 baptized at Appalachian State’s UniteUS rally, 19 at Pepperdine, 15 at North Georgia, with Fresno State’s Fields of Faith planning baptisms this Sunday.<\/p>",
            "sources": [
              {
                "name": "Sports Spectrum",
                "url": "https://sportsspectrum.com/sport/football/2026/10/21/ohio-state-football-3rd-invitation-jesus-event/"

              {
                "name": "WWJD.com",

              {
                "name": "Billy Graham Decision",

              }
            ]
          },
          {
            "headline": "Digital ID and money, soberly: EU wallets get payment rules; digital euro debated",
            "body": "<p>The European Payments Council launched SCARLET, a rulebook for using EU Digital Identity Wallets to approve bank logins and payments, with version 1.0 planned for December 2027. EU lawmakers are meanwhile negotiating digital-euro rules on offline payments, anti-money-laundering checks and merchant fees; the ECB plans a pilot in late 2027 and possible issuance in 2029. These are real steps toward linking identity and money, worth watching for privacy and cash protections, not cause for panic.<\/p>",
            "sources": [
              {
                "name": "Biometric Update",
                "url": "https://www.biometricupdate.com/202610/european-payments-council-launches-scarlet-framework-for-eudi-wallet-payments"

          {
            "headline": "False prophecy, judged: Shakahola sentencing set for Nov. 6",
            "body": "<p>Kenya’s conviction of self-styled pastor Paul Mackenzie and 28 associates for the murders of 191 people, 190 of them children whom he told to starve to “meet Jesus,” is a hard reminder of why the Church tests every claimed revelation. His “End Days” sermons called schools and medicine evil. Sentencing is Nov. 6.<\/p>",
            "sources": [
              {
                "name": "BBC: Shakahola verdict",
                "url": "https://www.bbc.com/news/articles/ckd6d2l3dz4xo"

              {

                "url": "https://capitalfm.africa/court-convicts-all-29-shakahola-accused-of-murder-sets-sentencing-for-november-6/"
              }
            ]
          },
          {
            "headline": "Eucharistic: the Cuilapa Host remains under the bishop’s study",
            "body": "<p>In Guatemala, the Diocese of Santa Rosa de Lima is still studying a consecrated Host at Cuilapa’s cathedral that did not dissolve in water and showed reddish stains; it is kept reserved, not displayed, and the parish asks for “prudence and moderation.” In Australia, a Eucharistic miracles exhibit runs in Parramatta through Oct. 25.<\/p>",
            "sources": [
              {
                "name": "Perpetual Eucharistic Adoration: Guatemala report",
                "url": "https://perpetualeucharisticadoration.com/reported-eucharistic-miracle-guatemala-2026/"

              {

            ]
          },
          {
            "headline": "Revival: UniteUS’s arena nights, from Miami to Appalachian State, roll on",
            "body": "<p>The campus movement UniteUS, founded by Alabama mother Tonya Prewett, filled the University of Miami’s arena in late September, with baptisms in water troughs outside late into the night; Prewett said hundreds committed to follow Jesus, though no count was published. At Appalachian State on Oct. 13, organizers and the Billy Graham association’s <em>Decision<\/em> magazine report more than 700 students chose Christ and about 100 were baptized in plastic-lined pickup-truck beds. Next stops: South Alabama on Oct. 27 and Belmont in Nashville on Nov. 10. A sober note from one Christian outlet: arena counts and baptism counts are different measures, and the real test is whether new believers find a church home by November.<\/p>",
            "sources": [
              {
                "name": "5Talents",
                "url": "https://www.5talentsmag.com/campus/uniteus-campus-revival-miami-baptisms-tonya-prewett"

        "headline": "Giannis scores 35, but Edwards’ 45 wins it.",
        "stories": [
          {
            "headline": "Heat: Edwards’ 45 spoils Giannis’s 35 in a 131–106 opener",
            "body": "<p>Giannis Antetokounmpo opened his Heat career with 35 points on 13-of-19 shooting, the most ever in a Heat regular-season debut and four more than LeBron James’s in 2010, before fouling out with seven minutes left. But Anthony Edwards hit nine threes for 45, joining Wilt Chamberlain and Michael Jordan as the only players with 40 in multiple openers, and Minnesota won the three-point battle 63–24. Bam Adebayo had 15.<\/p>",
            "sources": [
              {
                "name": "Miami Herald",
                "url": "https://www.miamiherald.com/sports/nba/miami-heat/article317697665.html"
              },
              {
                "name": "AP via NBA.com",

              },

          {
            "headline": "Heat: next up, Detroit on Friday",
            "body": "<p>Miami hosts the Pistons Friday night at Kaseya Center. Detroit was the East’s No. 1 seed last season at 60–22 and opened this year by beating Boston; the Heat shot 8 of 33 from three on opening night, the number to watch.<\/p>",
            "sources": [
              {
                "name": "Miami Herald",

              }

            "headline": "Star Wars: Lucasfilm Games opens the door to indie studios",
            "body": "<p>Lucasfilm Games says it will partner with smaller and independent studios on future Star Wars games, alongside big-budget titles like Zero Company and Galactic Racer; Knights of the Old Republic and Fate of the Old Republic remain in development. That sits beside this week’s report that DICE and Respawn are teaming up on Battlefront 3.<\/p>",

              {

            "body": "<p>Brendan Nugent, 43, faced Wangaratta Magistrates Court on new charges, including causing harm to a Commonwealth public official, and was remanded until February; MP Helen Haines remains in critical but stable condition after losing both legs. Federal Police Commissioner Krissy Barrett said nearly one person a week is being charged with targeting federal parliamentarians, calling the threat climate “febrile,” and police and ASIO briefed MPs on security. Prime Minister Albanese urged calmer politics but said MPs must still be able to meet people “in the queues of Aldi or Woolies.”<\/p>",

            "headline": "Oceania: Australia and Papua New Guinea hold their first forum as allies",

            "headline": "Cutting health red tape: big employers join the prior-authorization fix",
            "body": "<p>Promise: make health care work for patients, not paperwork. What was done: HHS, CMS and the Labor Department announced Wednesday that Amazon, Google, Meta, Oracle and Axon will back extending the 2025 insurer pledge on electronic prior authorization to self-funded employer plans, which cover more than 180 million Americans. “Prior authorization should help patients get the right care, not trap doctors and families in administrative delays,” Secretary Kennedy said. Real impact: promising but voluntary; a federal rule requires electronic prior authorization from certain payers only from Jan. 1, 2027, so watch whether faxes and denials actually drop.<\/p>",

              {
                "name": "HHS",

              }
            ]
          },
          {
            "headline": "Ending the war: Russia agrees to resume three-way talks after Nov. 10",
            "body": "<p>Promise: end the Ukraine war. What was done: Witkoff’s ninth meeting with Putin produced Moscow’s agreement to restart U.S.–Russia–Ukraine talks after Nov. 10 and plans for a Putin–Trump–Xi summit in Shenzhen. Real impact: a process, not peace; the Kremlin wants talks on a postwar “security framework” and still aims to take the rest of eastern Ukraine. Room for disagreement: critics in Kyiv and Europe say easing sanctions for Russian diesel rewards Moscow before any ceasefire.<\/p>",
            "sources": [
              {
                "name": "France 24",
                "url": "https://www.france24.com/en/europe/20261021-zelensky-proposes-freezing-front-with-russia-first-step-peace-talks"

              {

              }
            ]
          },
          {
            "headline": "Bring Americans home: Hubbard is free after more than four years",
            "body": "<p>Promise: bring wrongfully detained Americans home. What was done: Stephen Hubbard, a retired teacher in his 70s seized in Ukraine in 2022 and sentenced to nearly seven years as a “mercenary,” a charge he always denied, was released as Witkoff arrived, a day after Trump asked for it. Witkoff thanked Putin, saying Hubbard’s son is a Greek Orthodox priest. Real impact: a sick, elderly man is going home to his family. Room for disagreement: the release was folded into a meeting where Putin praised the diesel deal Kyiv opposes.<\/p>",
            "sources": [
              {
                "name": "Kremlin transcript",
                "url": "http://en.kremlin.ru/events/president/news/81044"
              },
              {
                "name": "AP",
                "url": "https://apnews.com/article/russia-american-released-stephen-hubbard-ukraine-witkoff-2c7e34d6606be242ed4a7473e57110c7"
              }
            ]
          },
          {
            "headline": "Securing the border: the administration asks the Supreme Court to restart Big Bend work",
            "body": "<p>Promise: secure the southern border. What was done: the administration asked the justices Wednesday to lift a Texas judge’s Oct. 14 injunction on a 1.7-billion-dollar road, camera, sensor and vehicle-barrier project along more than 500 miles in and around Big Bend National Park; it says the halt leaves “a quarter of the southern border” exposed. Real impact, and disagreement: the sector saw more than 89,000 apprehensions from 2021 to 2025, but opponents, including a bipartisan group of lawmakers, say it accounts for about 2% of apprehensions and that waiving environmental laws threatens a national treasure.<\/p>",
            "sources": [
              {
                "name": "Washington Post",
                "url": "https://www.washingtonpost.com/politics/2026/10/21/trump-officials-ask-supreme-court-let-border-security-project-resume-national-park/"

              {
                "name": "AP",
                "url": "https://apnews.com/article/border-wall-landowners-texas-immigration-8fd59097185de220bc9787eb20b522ec"
              }
            ]
          },
          {
            "headline": "MAHA: HHS launches a national kidney-care plan focused on prevention",
            "body": "<p>Promise: tackle chronic disease at the root. What was done: HHS Secretary Robert F. Kennedy Jr. on Tuesday launched a Kidney Care National Plan built on Trump’s 2019 executive order, aiming to detect kidney disease earlier, expand home dialysis and competition, and make living donation easier. About 37 million American adults have kidney disease, most without knowing it. Real impact so far: HHS’s own analysis credits the 2019 order with about 2,000 extra transplants a year; the new plan is a strategy, so funding and rules will tell.<\/p>",
            "sources": [
              {

            "headline": "Tesla beats on profit and cash, cuts its spending plan to $20 billion",
            "body": "<p>Tesla’s third-quarter revenue was about flat at $28.0 billion, slightly below forecasts, and GAAP net income fell roughly 44% to $787 million, hit partly by marking down its SpaceX and Bitcoin holdings. But adjusted earnings of 48 cents a share beat estimates, gross margin was 19.6%, and free cash flow was a positive $1.5 billion when Wall Street feared heavy cash burn, because capital spending was $4.7 billion against about $7.8 billion expected. The CFO cut 2026 capex guidance to about $20 billion from more than $25 billion and said Tesla secured $30 billion of shorter-term debt for future spending. Shares rose about 1.5% to 1.7% after hours.<\/p>",

          },

            "headline": "On the call: Cybercabs to Dallas, unsupervised FSD around mid-2027, Optimus tempered",
            "body": "<p>Musk said the Austin Cybercab fleet has grown tenfold since launch and unsupervised miles grew eightfold in the quarter; Tesla’s self-driving chief, Ashok, said Dallas is next, with other cities before year-end, and unsupervised self-driving in customer cars around the second quarter of 2027. Optimus has begun initial production in Fremont, but Musk asked investors to “temper expectations,” saying it will take about a year to reach 20,000 a week and outside customers come around the end of 2027. Tesla has its largest car backlog in four years, limited by batteries, and FSD is on over 75% of new North American deliveries. Analysts were told no merger questions would be taken.<\/p>",

          {
            "headline": "SpaceX closes up 7.8% after its first big profit quarter",
            "body": "<p>SpaceX shares finished Wednesday at $159.31, up $11.52 or 7.79%, on volume of about 219 million shares, more than double Tuesday’s, after its record quarter and Musk’s confirmation of merger committees. They slipped about 1% after hours as Tesla reported. Over the past two months it has closed between about $134 and $172.<\/p>",

            "headline": "Canada turns toward Europe in space, and the U.S. ambassador objects",
            "body": "<p>At a Canadian space conference, U.S. Ambassador Pete Hoekstra said Canada has decided to “move away” from SpaceX and look more to the European Space Agency, calling it a surprising choice given “all the innovation” Musk drives. For SpaceX holders it is a small contract question, but part of a wider pattern of allies weighing sovereign alternatives to Starlink and Falcon launches.<\/p>",

            "body": "<p>Four Democratic senators wrote to SpaceX asking who ordered speed limits on Starlink terminals used by Ukrainian forces Oct. 12–14, and a bipartisan group of nine asked the Pentagon inspector general to investigate whether the slowdown delayed missile warnings. Musk said any changes to Starshield, the military version, came from U.S. government decisions.<\/p>",

          {
            "headline": "Artemis II’s Jeremy Hansen becomes Canada’s special adviser on space",
            "body": "<p>Prime Minister Mark Carney appointed astronaut Jeremy Hansen, who flew around the Moon on Artemis II in April and has just retired from the Canadian Space Agency, as special adviser on space to him and Industry Minister Mélanie Joly. Hansen will help write a new national space strategy focused on sovereignty and security. The same day, Defence Minister David McGuinty announced a 20-million-dollar agreement for a launch complex in southern Newfoundland, adding to one in Nova Scotia, so Canada can put critical satellites up without relying on foreign rockets.<\/p>",

          {
            "headline": "Starship Flight 15 will try to catch both the booster and the ship",
            "body": "<p>On SpaceX’s earnings webcast, Musk confirmed that Flight 15, expected next month, will try to catch both the Super Heavy booster and, for the first time, the Starship upper stage with the launch tower’s arms. An animation showed the ship returning belly-first, flipping upright and sliding into the “chopsticks.” Musk called success on the first try “more likely than not,” said it would be the first full recovery of an orbital rocket, and predicted weekly Starship flights in the first half of 2027.<\/p>",

          {
            "headline": "China launches a Ceres-1 from a ship in the Yellow Sea",
            "body": "<p>Late Tuesday Eastern time, Galactic Energy launched a Ceres-1 solid rocket from the Dongfang Hangtiangang launch ship off Rizhao, Shandong, carrying the first pathfinder satellite for the Guangzhou-backed Wuyang remote-sensing constellation, which will fly in low-inclination orbits. Sea launches let China reach orbits that are hard to hit from its inland pads.<\/p>",

              {
                "name": "SpaceNews: Ceres-1 sea launch",

            "headline": "Europe’s Space Rider test model is destroyed in a drop test",
            "body": "<p>ESA confirmed it lost a full-scale Space Rider test article this month when its parafoil failed to deploy properly during the final drop-test campaign; an independent investigation is underway. It is the second setback in the campaign after a May attempt was aborted, and it adds schedule risk to Europe’s reusable uncrewed spaceplane, which needs a controlled parafoil landing to bring payloads home.<\/p>",

            "headline": "This week’s launch board: China and SpaceX close it out",
            "body": "<p>After Wednesday’s Chinese sea launch, the week ends with two Long March missions from Taiyuan and Jiuquan on Friday, a Long March 8A from Wenchang on Saturday, and a Falcon 9 Starlink flight from Vandenberg late Friday Pacific time that NASASpaceFlight says would be Falcon 9’s 700th mission. Japan’s new H3-24L variant sent the MMX probe toward Mars’ moon Phobos on Monday, aiming to return samples to Australia in 2031.<\/p>",

          {
            "headline": "An RS-25 engine fires for nearly 500 seconds for future Artemis rockets",
            "body": "<p>NASA tested RS-25 engine No. 10001 for close to 500 seconds at Stennis Space Center in Mississippi, validating flight components and a new thermal-protection system for the engines that power the Space Launch System on future Artemis missions. Each SLS core stage flies four RS-25s, and this test series supports the newly built engines meant for later Moon flights.<\/p>",

          {
            "headline": "JPL marks 90 years by looking to its next missions",
            "body": "<p>NASA’s Jet Propulsion Laboratory, founded in 1936, marked its 90th anniversary by pointing to what comes next, including the SkyFall Mars helicopters, MoonFall, the SunRISE radio-astronomy smallsats and the NEO Surveyor asteroid-hunting telescope. Separately, NASA highlighted CASALS, a lidar instrument designed to fill gaps in 3D maps of Earth’s surface.<\/p>",

          {
            "headline": "SR-1 Freedom, NASA’s nuclear-powered Mars craft, moves ahead",
            "body": "<p>NASA says contract actions are keeping Space Reactor-1 Freedom on track for a late-2028 launch as the first fission-powered spacecraft to travel beyond Earth orbit. Sierra Lobo will build the power-conversion system that turns the Idaho National Laboratory reactor’s heat into electricity for electric propulsion, and the reactor stays off until the craft leaves Earth orbit. At Mars it will deliver SkyFall, three helicopters evolved from Ingenuity, to scout for water.<\/p>",
            "sources": [
              {
                "name": "NASA: SR-1 Freedom advances",

          {
            "headline": "Artemis update Friday at Kennedy",
            "body": "<p>Administrator Jared Isaacman and Artemis leaders brief at Kennedy Space Center on Friday at 2 p.m. on speeding toward a crewed Moon landing by 2028, with Artemis III now planned as a 2027 docking test in Earth orbit.<\/p>",
            "sources": [
              {
                "name": "The Florida Press: Artemis briefing",

          },
          {
            "headline": "The final two solar-array spacewalks are set for Oct. 29 and Nov. 5",
            "body": "<p>NASA astronaut Anil Menon and the Canadian Space Agency’s Joshua Kutryk will install the space station’s last two roll-out solar arrays on spacewalks 100 and 101, finishing a multi-year power upgrade. Meanwhile, two NASA-funded satellite-relay demonstrations that rode Bandwagon-5 on Monday are checking out in orbit.<\/p>",

              {
                "name": "NASA: Spacewalk preps keep crew busy",

            "headline": "Miami: Little Flower inaugurates a new French Romantic pipe organ Saturday",
            "body": "<p>World-renowned organist Nathan Laube will inaugurate the new pipe organ at Church of the Little Flower in Coral Gables on Saturday, Oct. 24, at 7:30 p.m., free and open to all, as part of the parish’s 100th anniversary. A decade in the making, the instrument is designed to recreate the sound St. Thérèse of Lisieux would have heard, and it is the only organ in Southeast Florida with mechanical action. The same weekend brings Emmaus retreats in English and Spanish and the FOCUS 11 vocations rally for sixth-graders on Friday.<\/p>",

              {
                "name": "Archdiocese of Miami: Coming up this weekend",

              }
            ],
            "why": "A rare local event for church musicians: mechanical-action organs are almost unknown in South Florida."
          },
          {
            "headline": "Miami: Wenski keeps up his religious-liberty case on school vaccines",
            "body": "<p>Archbishop Thomas Wenski is pressing his dispute with Attorney General James Uthmeier, who warned Catholic schools could lose voucher funding unless they grant religious exemptions to vaccines. Wenski says the Church does not consider those vaccines objectionable, that the schools follow state health guidance, and that parents choosing a Catholic school “expect the Catholic school to be Catholic.” He called the threat “classic bullying” and said it reflects attacks now coming “from the right.”<\/p>",

              }
            ]
          },
          {
            "headline": "Vatican: The Pope’s tumor was localized; doctors say no further treatment",
            "body": "<p>The Holy See Press Office said tonight that final tests on the lung tissue removed Oct. 13 confirm a localized adenocarcinoma and that “no further treatment is necessary,” according to Dr. Luigi Carbone and surgeon Stefano Margaritora. It caps a day when Leo XIV, 71, toured St. Peter’s Square in the popemobile and thanked the faithful for their prayers. On Sunday he said the illness had given him “a profound sense of closeness” to all who are sick.<\/p>",
            "sources": [
              {

              }

            "headline": "Appointment: Fr. Leandro Machado Silvestre named bishop of Guajará-Mirim, Brazil",

          {
            "headline": "Countdown to the Kingdom: checked tonight, latest post still Oct. 21",
            "body": "<p>Checked this evening: the newest Countdown to the Kingdom post remains Wednesday’s “Pedro – The One Who Opposes Christ,” dated Oct. 21, after Tuesday’s “There Will be a Great War.” Its key line comes from an Oct. 13 message attributed to Our Lady through Brazilian seer Pedro Regis: “The one who opposes Christ will act in the world, and my poor children will bear a heavy cross… Those who remain faithful to the end will be saved.” The same message adds hope: “Do not forget: your victory is in the Eucharist.” The site’s editors note they are not the final judges of authenticity; the Church is, and private revelation never adds to the deposit of faith.<\/p>",

            "headline": "Marian: the newest message is still Oct. 20; this week’s thread is conversion",
            "body": "<p>The latest dated Marian message remains Tuesday, Oct. 20, 2026, attributed to Our Lady, Queen of Peace, through Pedro Regis: “You live in a time worse than the time of the Flood… None of my devotees will be lost. This is the time of grace.” Read alongside the Oct. 17 message, the theme is consistent: “You are walking toward a future of great spiritual darkness… Repent and seek the mercy of my Jesus through the Sacrament of Confession,” with the familiar counsel of “the Holy Rosary and Sacred Scripture” in hand. The Anguera messages are not Church-approved and are offered for discernment; Medjugorje’s monthly message, under a 2024 nihil obstat for the parish’s spiritual fruits, comes Sunday, Oct. 25.<\/p>",

            "headline": "Medjugorje: Mariological Days open Thursday at the Vatican’s urging",
            "body": "<p>The first Mariological Days in Medjugorje begin Thursday, Oct. 22, at 3 p.m., with an opening talk by Archbishop Aldo Cavalli, the apostolic visitor for the parish, and run through Oct. 25 alongside the evening prayer program. Organizers, with the Pontifical International Marian Academy, will study the Second Vatican Council’s teaching on Mary. Pastor Fr. Zvonimir Pavičić said the idea came from the Dicastery for the Doctrine of the Faith, so that devotion at a place honoring the Queen of Peace stays “correct, pure, Catholic.” Lectures are translated into seven languages.<\/p>",

            "headline": "Digital ID, soberly: three African nations link identity systems across borders",
            "body": "<p>Benin, Ghana and Rwanda have connected to the Smart Africa Data Exchange in a pilot that lets a traveler’s identity be checked against home-country records, for example at an airport e-gate. Organizers stress it works “without centralizing identity databases or surrendering control over national data.” It joins Europe’s digital-identity wallet and the digital euro talks as systems worth watching for what they reveal and who controls the data; the real questions are privacy, consent and the right to opt out, not fear.<\/p>",
