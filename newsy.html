<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Short, bounded news briefings — not a news portal.">
  <meta name="color-scheme" content="light">
  <meta name="theme-color" content="#6b4f3a">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Newsy">
  <title>Newsy</title>
  <!-- Self-contained offline reader. PWA install (Add to Home Screen) needs the
       multi-file HTTPS deploy (index.html + manifest + sw.js + icons). Service
       workers do not run from file://. See HOME-SCREEN.md. -->
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400;600&family=Source+Serif+4:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
  <style>
/* Newsy — calm briefings, not a news portal */
:root {
  --bg: #f7f3ec;
  --bg-soft: #f0eae0;
  --ink: #2c2925;
  --ink-muted: #5c564e;
  --ink-faint: #8a8278;
  --accent: #6b4f3a;
  --accent-soft: #c4a882;
  --rule: #e0d6c8;
  --chip: #fffdf9;
  --chip-active: #6b4f3a;
  --chip-active-ink: #f7f3ec;
  --link: #4a6b5a;
  --link-hover: #355244;
  --max: 38rem;
  --font: "Source Serif 4", "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif;
  --font-ui: "Source Sans 3", "Segoe UI", system-ui, -apple-system, sans-serif;
}

*,
*::before,
*::after {
  box-sizing: border-box;
}

html {
  font-size: 112.5%; /* ~18px */
  -webkit-text-size-adjust: 100%;
}

body {
  margin: 0;
  min-height: 100vh;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font);
  line-height: 1.65;
  font-weight: 400;
}

a {
  color: var(--link);
  text-decoration-thickness: 1px;
  text-underline-offset: 0.15em;
}

a:hover {
  color: var(--link-hover);
}

.wrap {
  width: min(100% - 2rem, var(--max));
  margin-inline: auto;
  padding-block: 2rem 4rem;
}

/* Header */
.site-header {
  border-bottom: 1px solid var(--rule);
  padding-bottom: 1.25rem;
  margin-bottom: 1.75rem;
}

.brand {
  font-family: var(--font-ui);
  font-size: 0.75rem;
  font-weight: 600;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: var(--accent);
  margin: 0 0 0.35rem;
}

.briefing-title {
  font-size: clamp(1.45rem, 4vw, 1.85rem);
  font-weight: 600;
  line-height: 1.25;
  margin: 0 0 0.25rem;
  letter-spacing: -0.01em;
}

.meta {
  font-family: var(--font-ui);
  font-size: 0.85rem;
  color: var(--ink-muted);
  margin: 0;
}

/* Picker — compact "Briefings" select (native wheel on iPhone) */
.picker {
  display: flex;
  align-items: center;
  gap: 0.75rem;
  margin: 0 0 1.75rem;
}

.picker-label {
  font-family: var(--font-ui);
  font-size: 0.7rem;
  font-weight: 600;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--ink-faint);
  margin: 0;
  flex: 0 0 auto;
}

.select-wrap {
  position: relative;
  flex: 1 1 auto;
  max-width: 16rem;
}

.select-wrap::after {
  content: "";
  position: absolute;
  right: 1rem;
  top: 50%;
  width: 0.5rem;
  height: 0.5rem;
  border-right: 2px solid var(--accent, #6b4f3a);
  border-bottom: 2px solid var(--accent, #6b4f3a);
  transform: translateY(-70%) rotate(45deg);
  pointer-events: none;
}

.briefing-select {
  -webkit-appearance: none;
  appearance: none;
  width: 100%;
  min-height: 44px;
  font-family: var(--font-ui);
  font-size: 1rem; /* 16px+ keeps iOS Safari from zooming on focus */
  font-weight: 600;
  color: var(--accent, #6b4f3a);
  background: var(--chip);
  border: 1.5px solid var(--accent, #6b4f3a);
  border-radius: 999px;
  padding: 0.5rem 2.5rem 0.5rem 1.1rem;
  cursor: pointer;
  transition: background 0.15s ease, box-shadow 0.15s ease;
}

.briefing-select:hover {
  background: #f7f1e8;
}

.briefing-select:focus-visible {
  outline: none;
  box-shadow: 0 0 0 3px rgba(107, 79, 58, 0.25);
}

/* Beats */
.beats {
  display: flex;
  flex-direction: column;
  gap: 2rem;
}

.beat {
  padding-top: 0.25rem;
}

.beat-title {
  font-size: 1.05rem;
  font-weight: 600;
  margin: 0 0 0.65rem;
  padding-bottom: 0.4rem;
  border-bottom: 1px solid var(--rule);
  color: var(--accent);
  letter-spacing: 0.01em;
}

.beat-body {
  margin: 0;
}

.beat-body p {
  margin: 0 0 0.85rem;
}

.beat-body p:last-child {
  margin-bottom: 0;
}

.sources {
  margin-top: 0.85rem;
  padding-top: 0.55rem;
  border-top: 1px dotted var(--rule);
  font-family: var(--font-ui);
  font-size: 0.8rem;
  color: var(--ink-muted);
  line-height: 1.55;
}

.sources-label {
  font-weight: 600;
  color: var(--ink-faint);
  margin-right: 0.35rem;
}

.sources a {
  word-break: break-word;
}

.sources .sep {
  color: var(--ink-faint);
  margin: 0 0.3rem;
}

.sources .name-only {
  color: var(--ink-muted);
}

/* Status / empty */
.status {
  font-family: var(--font-ui);
  font-size: 0.9rem;
  color: var(--ink-muted);
  padding: 1.5rem 0;
}

.site-footer {
  margin-top: 3rem;
  padding-top: 1rem;
  border-top: 1px solid var(--rule);
  font-family: var(--font-ui);
  font-size: 0.75rem;
  color: var(--ink-faint);
}

.site-footer p {
  margin: 0;
}


/* Podcast player */
.podcast {
  margin-top: 0.85rem;
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 0.65rem 0.85rem;
}

.listen-btn {
  font-family: var(--font-ui);
  font-size: 0.8rem;
  font-weight: 600;
  letter-spacing: 0.04em;
  appearance: none;
  border: 1px solid var(--accent);
  background: var(--accent);
  color: var(--chip-active-ink);
  border-radius: 999px;
  padding: 0.4rem 1rem;
  cursor: pointer;
  transition: background 0.15s ease, color 0.15s ease, border-color 0.15s ease;
}

.listen-btn:hover {
  background: #5a3f2d;
  border-color: #5a3f2d;
}

.listen-btn:focus-visible {
  outline: 2px solid var(--accent-soft);
  outline-offset: 2px;
}

.listen-btn[aria-pressed="true"] {
  background: var(--bg-soft);
  color: var(--accent);
  border-color: var(--accent);
}

.podcast audio {
  flex: 1 1 12rem;
  min-width: 11rem;
  max-width: 100%;
  height: 2.1rem;
  accent-color: var(--accent);
}

@media print {
  .podcast {
    display: none !important;
  }
}

/* Print — quiet page, no chrome clutter */
@media print {
  :root {
    --bg: #fff;
    --ink: #111;
    --ink-muted: #333;
    --rule: #ccc;
    --accent: #333;
    --link: #000;
  }

  body {
    background: #fff;
    font-size: 11pt;
    line-height: 1.5;
  }

  .wrap {
    width: 100%;
    max-width: none;
    padding: 0;
  }

  .picker,
  .site-footer {
    display: none;
  }

  .site-header {
    border-bottom-color: #999;
  }

  .beat {
    break-inside: avoid;
  }

  a {
    color: inherit;
    text-decoration: none;
  }

  .sources a::after {
    content: " (" attr(href) ")";
    font-size: 0.75em;
    color: #555;
  }
}

@media (max-width: 480px) {
  html {
    font-size: 106.25%;
  }

  .wrap {
    width: min(100% - 1.5rem, var(--max));
    padding-block: 1.5rem 3rem;
  }
}

/* ---- v3: glance, images, collapsible stories, new at this hour ---- */
.top-line { font-size: 1.1rem; font-style: italic; color: var(--ink-muted); margin: 0 0 1.25rem; }
.glance { background: var(--bg-soft); border-radius: 12px; padding: 0.9rem 1.1rem; margin-bottom: 2rem; }
.glance-label, .carried, .tag, .why span, .beat-figure figcaption {
  font-family: var(--font-ui); font-size: 0.7rem; font-weight: 600; letter-spacing: 0.12em; text-transform: uppercase; color: var(--accent);
}
.glance-label { margin: 0 0 0.4rem; }
.glance ol { list-style: none; margin: 0; padding: 0; }
.glance li { padding: 0.3rem 0; border-top: 1px solid var(--rule); font-size: 0.92rem; line-height: 1.4; }
.glance li:first-child { border-top: 0; }
.glance a { color: var(--ink); text-decoration: none; }
.glance-beat { font-family: var(--font-ui); font-weight: 600; color: var(--accent); margin-right: 0.3rem; }
.beat-figure { margin: 0.5rem 0 0.9rem; }
.beat-figure img { width: 100%; aspect-ratio: 16 / 9; object-fit: cover; border-radius: 10px; display: block; background: var(--bg-soft); }
.beat-figure figcaption { margin-top: 0.3rem; color: var(--ink-faint); font-weight: 400; letter-spacing: 0.06em; }
.beat-figure figcaption a { color: inherit; }
.carried { color: var(--ink-faint); margin: 0 0 0.4rem; }
.stories { list-style: none; margin: 0; padding: 0; }
.story { border-top: 1px solid var(--rule); }
.story:last-child { border-bottom: 1px solid var(--rule); }
.story summary { cursor: pointer; list-style: none; padding: 0.7rem 1.6rem 0.7rem 0; position: relative; font-weight: 600; line-height: 1.35; }
.story summary::-webkit-details-marker { display: none; }
.story summary::after { content: "+"; position: absolute; right: 0.2rem; top: 0.6rem; font-family: var(--font-ui); color: var(--accent); font-size: 1.2rem; }
.story details[open] summary::after { content: "–"; }
.story-body { padding: 0 0 0.9rem; }
.story-body p:first-child { margin-top: 0; }
.story-img { width: 100%; border-radius: 8px; margin-bottom: 0.6rem; }
.why { font-size: 0.92rem; color: var(--ink-muted); }
.new-hour { background: #fff8ec; border: 1px solid var(--accent-soft); border-radius: 12px; padding: 0.8rem 1rem; }
.new-hour .beat-title { color: #9a3b1e; }
.tag { margin-right: 0.35rem; }

  </style>
</head>
<body>
  <main class="wrap">
    <header class="site-header">
      <p class="brand" id="brand">Newsy</p>
      <h1 class="briefing-title" id="briefing-title">Briefing</h1>
      <p class="meta" id="briefing-meta"></p>
      <div class="podcast" id="podcast" hidden>
        <button type="button" class="listen-btn" id="listen-btn" aria-label="Listen to this briefing">Listen</button>
        <audio id="podcast-audio" controls preload="none"></audio>
      </div>
    </header>

    <nav class="picker" aria-label="Briefings">
      <label class="picker-label" for="briefing-select">Briefings</label>
      <div class="select-wrap">
        <select id="briefing-select" class="briefing-select"></select>
      </div>
    </nav>

    <p class="status" id="status" hidden>Loading…</p>

    <div class="beats" id="beats"></div>

    <footer class="site-footer">
      <p>A short page. Read it, then close the tab.</p>
    </footer>
  </main>
  <script>
(function () {
  "use strict";


  const els = {
    brand: document.getElementById("brand"),
    title: document.getElementById("briefing-title"),
    meta: document.getElementById("briefing-meta"),
    podcast: document.getElementById("podcast"),
    listenBtn: document.getElementById("listen-btn"),
    audio: document.getElementById("podcast-audio"),
    select: document.getElementById("briefing-select"),
    beats: document.getElementById("beats"),
    status: document.getElementById("status"),
  };

  let briefings = [];

  function formatGeneratedAt(iso) {
    if (!iso) return "";
    const d = new Date(iso);
    if (Number.isNaN(d.getTime())) return iso;
    try {
      return new Intl.DateTimeFormat("en-US", {
        weekday: "short",
        month: "short",
        day: "numeric",
        year: "numeric",
        hour: "numeric",
        minute: "2-digit",
        timeZoneName: "short",
      }).format(d);
    } catch (_) {
      return iso;
    }
  }

  const MONTHS = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
  const WEEKDAYS = ["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"];
  const SLOT_NAMES = { morning: "Morning", noon: "Noon", evening: "Night" };

  function slotOf(b) {
    const m = /-(morning|noon|evening)$/.exec(b.id || "");
    return m ? m[1] : (b.slot || "").toLowerCase();
  }

  function optionLabel(b) {
    // e.g. "Wed, Oct 7 · Night"
    const src = b.date || (b.id || "").slice(0, 10);
    const parts = src.split("-");
    const slot = SLOT_NAMES[slotOf(b)] || (b.slot ? b.slot.charAt(0).toUpperCase() + b.slot.slice(1) : "");
    if (parts.length === 3) {
      const y = Number(parts[0]);
      const mo = Number(parts[1]);
      const day = Number(parts[2]);
      const wd = WEEKDAYS[new Date(Date.UTC(y, mo - 1, day)).getUTCDay()];
      return wd + ", " + MONTHS[mo - 1] + " " + day + (slot ? " · " + slot : "");
    }
    return b.label || b.id;
  }

  function renderSources(sources) {
    if (!sources || !sources.length) return "";
    const parts = sources.map(function (s) {
      const name = s.name || "Source";
      if (s.url) {
        return (
          '<a href="' +
          escapeAttr(s.url) +
          '" rel="noopener noreferrer" target="_blank">' +
          escapeHtml(name) +
          "</a>"
        );
      }
      return '<span class="name-only">' + escapeHtml(name) + "</span>";
    });
    return (
      '<p class="sources"><span class="sources-label">Sources</span> ' +
      parts.join('<span class="sep">·</span>') +
      "</p>"
    );
  }

  function bodyHtml(body) {
    if (!body) return "";
    // Allow simple HTML paragraphs; if plain text, wrap paragraphs
    if (/<[a-z][\s\S]*>/i.test(body)) return body;
    return body
      .split(/\n\n+/)
      .map(function (p) {
        return "<p>" + escapeHtml(p.trim()) + "</p>";
      })
      .join("");
  }

  function escapeHtml(str) {
    return String(str)
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;");
  }

  function escapeAttr(str) {
    return escapeHtml(str).replace(/'/g, "&#39;");
  }


  function setPodcast(b) {
    if (!els.podcast || !els.audio) return;
    const src = b && b.audio ? b.audio : "";
    if (!src) {
      els.audio.pause();
      els.audio.removeAttribute("src");
      els.audio.load();
      els.podcast.hidden = true;
      if (els.listenBtn) {
        els.listenBtn.setAttribute("aria-pressed", "false");
        els.listenBtn.textContent = "Listen";
      }
      return;
    }
    const abs = new URL(src, location.href).href;
    const current = els.audio.currentSrc || els.audio.src || "";
    if (current !== abs) {
      els.audio.pause();
      els.audio.src = src;
      els.audio.load();
      if (els.listenBtn) {
        els.listenBtn.setAttribute("aria-pressed", "false");
        els.listenBtn.textContent = "Listen";
      }
    }
    els.podcast.hidden = false;
  }

  function storyHtml(st, open) {
    const why = st.why ? '<p class="why"><span>Why it matters</span> ' + escapeHtml(st.why) + "</p>" : "";
    const img = st.image && st.image.src
      ? '<img class="story-img" loading="lazy" src="' + escapeAttr(st.image.src) + '" alt="' + escapeAttr(st.image.alt || "") + '" onerror="this.remove()">'
      : "";
    return (
      '<li class="story"><details' + (open ? " open" : "") + ">" +
      '<summary><span class="story-head">' + escapeHtml(st.headline || "") + "</span></summary>" +
      '<div class="story-body">' + img + why + bodyHtml(st.body || "") + renderSources(st.sources) + "</div>" +
      "</details></li>"
    );
  }

  function storiesOf(beat) {
    if (Array.isArray(beat.stories) && beat.stories.length) return beat.stories;
    if (beat.body) return [{ headline: beat.headline || beat.title || "", body: beat.body, sources: beat.sources }];
    return [];
  }

  function beatImageHtml(beat) {
    const im = beat.image;
    if (!im || !im.src) return "";
    const credit = im.credit
      ? '<figcaption>' + (im.sourceUrl
          ? '<a href="' + escapeAttr(im.sourceUrl) + '" rel="noopener noreferrer" target="_blank">' + escapeHtml(im.credit) + "</a>"
          : escapeHtml(im.credit)) + "</figcaption>"
      : "";
    return '<figure class="beat-figure"><img loading="lazy" src="' + escapeAttr(im.src) + '" alt="' + escapeAttr(im.alt || "") +
      '" onerror="this.closest(\'figure\').remove()">' + credit + "</figure>";
  }

  function wordCount(b) {
    let txt = "";
    (b.newAtThisHour || []).forEach(function (n) { txt += " " + (n.headline || "") + " " + (n.body || ""); });
    (b.beats || []).forEach(function (beat) {
      storiesOf(beat).forEach(function (st) { txt += " " + (st.headline || "") + " " + (st.body || ""); });
    });
    return txt.replace(/<[^>]+>/g, " ").split(/\s+/).filter(Boolean).length;
  }

  function renderBriefing(b) {
    if (!b) {
      els.title.textContent = "No briefing";
      els.meta.textContent = "";
      els.beats.innerHTML = "";
      setPodcast(null);
      els.status.hidden = false;
      els.status.textContent = "No briefing selected.";
      return;
    }

    els.status.hidden = true;
    els.title.textContent = b.label || b.id;
    const when = formatGeneratedAt(b.generatedAt);
    const mins = Math.max(1, Math.round(wordCount(b) / 230));
    els.meta.textContent = (when ? "Prepared " + when + " · " : "") + mins + " min read";
    setPodcast(b);

    document.title = (b.label || "Briefing") + " · Newsy";

    const beats = b.beats || [];
    let html = "";

    if (b.topLine) {
      html += '<p class="top-line">' + escapeHtml(b.topLine) + "</p>";
    }

    // At a glance: one tappable line per beat (NYT/Axios-style index)
    html += '<nav class="glance" aria-label="At a glance"><p class="glance-label">At a glance</p><ol>' +
      beats.map(function (beat) {
        return '<li><a href="#beat-' + escapeAttr(beat.id || "") + '" data-jump="beat-' + escapeAttr(beat.id || "") + '"><span class="glance-beat">' +
          escapeHtml(beat.title || "") + "</span> " + escapeHtml(beat.headline || "") + "</a></li>";
      }).join("") + "</ol></nav>";

    const fresh = b.newAtThisHour || [];
    if (fresh.length) {
      html += '<section class="beat new-hour" id="beat-new"><h2 class="beat-title">New at this hour</h2><ul class="stories">' +
        fresh.map(function (n, i) {
          const tag = n.beat ? '<span class="tag">' + escapeHtml(n.beat) + "</span> " : "";
          return storyHtml({ headline: "", body: n.body, sources: n.sources, why: n.why, image: n.image }, i === 0)
            .replace('<span class="story-head"></span>', '<span class="story-head">' + tag + escapeHtml(n.headline || "") + "</span>");
        }).join("") + "</ul></section>";
    }

    html += beats.map(function (beat) {
      const stories = storiesOf(beat);
      const carried = beat.carried ? '<p class="carried">' + escapeHtml(beat.carried === true ? "Continuing from this morning" : beat.carried) + "</p>" : "";
      return (
        '<article class="beat" id="beat-' + escapeAttr(beat.id || "") + '">' +
        '<h2 class="beat-title">' + escapeHtml(beat.title || "") + "</h2>" +
        beatImageHtml(beat) + carried +
        '<ul class="stories">' + stories.map(function (st) { return storyHtml(st, false); }).join("") + "</ul>" +
        (beat.stories && beat.stories.length ? renderSources(beat.sources) : "") +
        "</article>"
      );
    }).join("");

    els.beats.innerHTML = html;

    // in-page jumps without clobbering the briefing hash
    els.beats.querySelectorAll("[data-jump]").forEach(function (a) {
      a.addEventListener("click", function (e) {
        e.preventDefault();
        const t = document.getElementById(a.getAttribute("data-jump"));
        if (t) t.scrollIntoView({ behavior: "smooth", block: "start" });
      });
    });

    if (els.select && els.select.value !== b.id) els.select.value = b.id;

    if (history.replaceState) {
      history.replaceState(null, "", "#" + encodeURIComponent(b.id));
    } else {
      location.hash = encodeURIComponent(b.id);
    }
  }

  function findBriefing(id) {
    return briefings.find(function (b) {
      return b.id === id;
    });
  }

  function renderPicker() {
    if (!els.select) return;
    // Newest first (briefings.json is already newest-first; sort defensively by id)
    const ordered = briefings.slice().sort(function (a, b) {
      const ka = (a.date || a.id || "") + " " + ({ morning: 1, noon: 2, evening: 3 }[slotOf(a)] || 0);
      const kb = (b.date || b.id || "") + " " + ({ morning: 1, noon: 2, evening: 3 }[slotOf(b)] || 0);
      return ka < kb ? 1 : ka > kb ? -1 : 0;
    });
    els.select.innerHTML = ordered
      .map(function (b) {
        return '<option value="' + escapeAttr(b.id) + '">' + escapeHtml(optionLabel(b)) + "</option>";
      })
      .join("");

    els.select.addEventListener("change", function () {
      const found = findBriefing(els.select.value);
      if (found) {
        renderBriefing(found);
        window.scrollTo(0, 0);
      }
    });

    window.addEventListener("hashchange", function () {

            ]

            "headline": "Securing the border: Big Bend wall fight reaches the Supreme Court",
            "body": "<p>Promise: finish the wall. What was done: the administration asked the justices to let construction resume in Big Bend National Park after a judge blocked it over environmental and historic-preservation waivers. Real impact: work stays paused until the Court acts. Room for disagreement: Texans on both sides of the aisle have objected to building in the park.<\/p>",

              }
            ]
          },
          {
            "headline": "MAHA: HHS launches a national kidney-care plan focused on prevention",
            "body": "<p>Promise: tackle chronic disease at the root. What was done: HHS Secretary Robert F. Kennedy Jr. on Tuesday launched a Kidney Care National Plan built on Trump’s 2019 executive order, aiming to detect kidney disease earlier, expand home dialysis and competition, and make living donation easier. About 37 million American adults have kidney disease, most without knowing it. Real impact so far: HHS’s own analysis credits the 2019 order with about 2,000 extra transplants a year; the new plan is a strategy, so funding and rules will tell.<\/p>",

          {
            "headline": "An RS-25 engine fires for nearly 500 seconds for future Artemis rockets",
            "body": "<p>NASA tested RS-25 engine No. 10001 for close to 500 seconds at Stennis Space Center in Mississippi, validating flight components and a new thermal-protection system for the engines that power the Space Launch System on future Artemis missions. Each SLS core stage flies four RS-25s, and this test series supports the newly built engines meant for later Moon flights.<\/p>",

          {
            "headline": "Artemis update Friday at Kennedy",
            "body": "<p>Administrator Jared Isaacman and Artemis leaders brief at Kennedy Space Center on Friday at 2 p.m. on speeding toward a crewed Moon landing by 2028, with Artemis III now planned as a 2027 docking test in Earth orbit.<\/p>",
            "sources": [
              {
                "name": "The Florida Press: Artemis briefing",

          {
            "headline": "SR-1 Freedom, NASA’s nuclear-powered Mars craft, moves ahead",
            "body": "<p>NASA says contract actions are keeping Space Reactor-1 Freedom on track for a late-2028 launch as the first fission-powered spacecraft to travel beyond Earth orbit. Sierra Lobo will build the power-conversion system that turns the Idaho National Laboratory reactor’s heat into electricity for electric propulsion, and the reactor stays off until the craft leaves Earth orbit. At Mars it will deliver SkyFall, three helicopters evolved from Ingenuity, to scout for water.<\/p>",
            "sources": [
              {
                "name": "NASA: SR-1 Freedom advances",
                "url": "https://www.nasa.gov/centers-and-facilities/glenn/sr-1-freedom-advances-with-progress-on-nuclear-power-module/"

            ],
            "why": "The same fission technology is meant to keep a Moon base running through the long lunar night."
          },
          {
            "headline": "The final two solar-array spacewalks are set for Oct. 29 and Nov. 5",
            "body": "<p>NASA astronaut Anil Menon and the Canadian Space Agency’s Joshua Kutryk will install the space station’s last two roll-out solar arrays on spacewalks 100 and 101, finishing a multi-year power upgrade. Meanwhile, two NASA-funded satellite-relay demonstrations that rode Bandwagon-5 on Monday are checking out in orbit.<\/p>",
            "sources": [
              {
                "name": "NASA: Spacewalk preps keep crew busy",

              }
            ]
          },
          {
            "headline": "Stephen Cash returns to lead Marshall Space Flight Center",
            "body": "<p>NASA named veteran engineer Stephen Cash director of Marshall Space Flight Center in Huntsville, Alabama, effective Oct. 19. Cash, a University of Alabama graduate who previously worked at Marshall and then in the aerospace industry, succeeds acting director Rae Ann Meyer, who returns to her deputy role.<\/p>",
            "sources": [
              {
                "name": "NASA: Stephen Cash named Marshall director",

            "headline": "Miami: Little Flower inaugurates a new French Romantic pipe organ Saturday",
            "body": "<p>World-renowned organist Nathan Laube will inaugurate the new pipe organ at Church of the Little Flower in Coral Gables on Saturday, Oct. 24, at 7:30 p.m., free and open to all, as part of the parish’s 100th anniversary. A decade in the making, the instrument is designed to recreate the sound St. Thérèse of Lisieux would have heard, and it is the only organ in Southeast Florida with mechanical action. The same weekend brings Emmaus retreats in English and Spanish and the FOCUS 11 vocations rally for sixth-graders on Friday.<\/p>",

            "headline": "Miami: Wenski keeps up his religious-liberty case on school vaccines",
            "body": "<p>Archbishop Thomas Wenski is pressing his dispute with Attorney General James Uthmeier, who warned Catholic schools could lose voucher funding unless they grant religious exemptions to vaccines. Wenski says the Church does not consider those vaccines objectionable, that the schools follow state health guidance, and that parents choosing a Catholic school “expect the Catholic school to be Catholic.” He called the threat “classic bullying” and said it reflects attacks now coming “from the right.”<\/p>",

              {
                "name": "WUSF: Miami archbishop hits back",

                "name": "WLRN: Between the Lines with Wenski",

            ]

          {
            "headline": "Vatican: “Venite ad Me” calls the Church back to the first proclamation",
            "body": "<p>The new Doctrine of the Faith document on transmitting the faith says families no longer pass it on “automatically” and asks parishes to evangelize adults, not only catechize children. It notes conversions are rising in some secular places, but many neophytes drift away soon after baptism, so communities must welcome and accompany them. It also calls for more room for women in leading Church processes.<\/p>",

                "name": "Vatican News",

            "headline": "Asia: World Youth Day Seoul opens registration",
            "body": "<p>Pope Leo’s video invitation launched registration for WYD Seoul 2027, Aug. 3–8, under the theme “Take courage! I have overcome the world.” It will be the first World Youth Day in Korea, home to a fast-growing Church founded by lay converts.<\/p>",

              {

            "headline": "Installation: Bishop Michael Saporito takes the chair in Metuchen today",

              {

              {

          {
            "headline": "Appointment: Fr. Leandro Machado Silvestre named bishop of Guajará-Mirim, Brazil",
            "body": "<p>Pope Leo on Wednesday named Fr. Leandro Machado Silvestre, 48, bishop of Guajará-Mirim, an Amazon diocese on the Bolivian border in Rondônia. Who he is: a priest of Mogi das Cruzes, near São Paulo, ordained in 2004, a longtime seminary rector, and since 2023 a <em>fidei donum<\/em> missionary priest in Porto Velho, where he is a pastor, spiritual director of the major seminary and, since January, vicar general.<\/p>",

              {
                "name": "Holy See Press Office: Resignations and Appointments, Oct. 21",

          {
            "headline": "Appointment: Bishop Ignatius Ding Zuyao ordained for Haimen, China",
            "body": "<p>Fr. Ignatius Ding Zuyao, 40, was ordained Bishop of Haimen in Jiangsu Province on Oct. 15, after Pope Leo appointed him Aug. 24 under the Holy See–China Provisional Agreement; the news was reported in Hong Kong’s <em>Sunday Examiner<\/em> today. Who he is: a Haimen priest ordained in 2011, trained at Sheshan and Beijing seminaries, and most recently pastor of Qingnian Donglu Parish in Nantong. Bishop Joseph Shen Bin of Shanghai, his predecessor in Haimen, was principal consecrator before about 400 priests, religious and laypeople.<\/p>",

            "headline": "Countdown to the Kingdom: checked this morning, latest post Oct. 21",

          {
            "headline": "Marian: the newest message is Oct. 20, a call not to delay conversion",
            "body": "<p>The latest dated Marian message is Tuesday, Oct. 20, 2026, attributed to Our Lady, Queen of Peace, through Pedro Regis in Anguera, Brazil: “You live in a time worse than the time of the Flood… None of my devotees will be lost. This is the time of grace. What you have to do, do not leave for tomorrow.” They are offered here for prayerful discernment, under the Church’s judgment. The next Medjugorje monthly message is expected Sunday, Oct. 25.<\/p>",

            "body": "<p>Later in the Apostolic Palace, the Pope received participants in “Holiness in History,” a conference of the Dicastery for the Causes of Saints. He told them that canonized holiness “must be proven by authentic credible testimonies that are beyond reproach,” recalling that Pope Pius XI created the dicastery’s historical section to bring the historical-critical method to sainthood causes. Recent causes, he said, also require “serious and rigorous verification” of everything gathered. It was his second public engagement of the morning, a sign he is easing back into a working schedule.<\/p>",

            "headline": "Africa: Geneva hears that Sudan’s war has become “a drone war” on civilians",
            "body": "<p>Talks among nearly two dozen countries continued in Geneva Wednesday, focused first on de-escalation. Switzerland’s State Secretary Alexandre Fasel told delegates, “The war in Sudan has become a drone war; it kills mostly civilians,” noting famine-like conditions in Darfur and Kordofan, almost 34 million people in need of aid and eight million children out of school. UN envoy Pekka Haavisto urged practical steps toward a comprehensive ceasefire and a Sudanese-led transition, but neither the army nor the RSF is at the table; the meeting exists to coordinate mediators such as the Quad of the U.S., Saudi Arabia, the UAE and Egypt. It follows Monday’s drone strike on Abyei’s Amiet market, where the toll has reached at least 153.<\/p>",

            "headline": "Africa: Ethiopia and Eritrea trade statements at the UN, not across the table",
            "body": "<p>Ethiopia’s Getachew Reda met the UN’s Horn of Africa envoy, Guang Cong, asking for help for Tigray’s new six-month caretaker administration with aid, rehabilitation and the return of displaced people, and warning of Asmara’s “destructive role.” Hours later Eritrea’s Information Ministry published a paper calling invasion claims “entirely fabricated,” insisting its troops are only on land awarded to it in 2002, and rejecting mediators’ “both sides” language as a “false equivalence.” On the ground, Ethiopian fighter jets flew low over Mekelle, and the UN says 10 of 16 mobile health teams in neighboring Amhara will stop by month’s end for lack of money. Neither capital is talking to the other.<\/p>",

            "headline": "Africa: In Congo’s Ebola zone, mistrust now keeps the sick from care",
            "body": "<p>A new International Rescue Committee survey in North Kivu found nearly everyone knows about Ebola, but 85% said mistrust of response teams would keep them from seeking care, with burials the top source of tension. Congo’s outbreak, the fastest-spreading on record, stands at 9,552 cases and more than 4,600 deaths and now touches 66 of 167 health zones; in North Kivu, 86% of deaths happen at home, and children under five die at a 70% rate. Cases in Kenya and now Nigeria show it crossing borders. The IRC is expanding into Beni and Butembo, saying trust must be built before the virus arrives.<\/p>",

            "headline": "Asia: Iran says indirect talks go on as it threatens Gulf internet cables",
            "body": "<p>Foreign Minister Abbas Araghchi said Iran and the U.S. are still negotiating through Pakistan and Qatar over Tehran’s seven-day ceasefire plan, which Washington wants to amend, warning that choosing war would bring “an even greater strategic failure.” A Revolutionary Guard official threatened undersea internet cables in the Strait of Hormuz if Iranian infrastructure is hit, and the Guards say a third tanker has struck a mine. In Israel, Prime Minister Netanyahu said he has directed the military and Mossad to topple Iran’s regime, while the Financial Times reports President Trump blocked a planned multiday Israeli strike earlier this month. Iran’s new defense minister is a sanctioned missile-industry veteran, Mehrdad Akhlaghi.<\/p>",

            "body": "<p>The State Department ordered non-emergency government employees and their families to leave Saudi Arabia, citing Iranian-backed Houthi attacks on airports and infrastructure. Wednesday, debris from a drone intercepted over the Shaybah oil field killed two workers, a Filipino and a Nepali, Saudi officials said. Riyadh’s main airport, shut since a deadly Oct. 10 strike, is partly reopening, and Egypt’s President Sisi said any Egyptian military help would be defensive only.<\/p>",

            "headline": "Asia: Lebanon–Israel talks in Tampa end day two on who verifies the south",
            "body": "<p>The second day of U.S.-mediated military talks at Central Command in Tampa ended without an agreement and resume Thursday. Lebanese television says the delegations have narrowed the dispute to two questions: who will verify what is carried out in southern Lebanon, and under whose authority. Lebanon wants Israeli strikes and demolitions to stop; Israel wants direct coordination with the Lebanese Army in the areas it would leave.<\/p>",

            "headline": "Europe: After Witkoff’s visit, Kremlin agrees to three-way talks after Nov. 10",
            "body": "<p>After more than three hours with U.S. envoy Steve Witkoff in St. Petersburg, with Jared Kushner joining remotely, Kremlin aide Yury Ushakov said Russia is ready to resume U.S.–Russia–Ukraine talks after Nov. 10, likely in Abu Dhabi, and wants them to focus on a postwar “security framework.” Zelenskyy said Kyiv is in favor and wants the meeting as soon as possible. Ushakov also said a first-ever Putin–Trump–Xi meeting is being prepared in Shenzhen, China, next month, while dismissing the new European and Ukrainian ideas from Oslo as lacking “much substance.” Witkoff called the talks “constructive,” with “important work left to do.”<\/p>",

            "headline": "Europe: French unions leave Lecornu “disappointed” and call a Nov. 5 strike",
            "body": "<p>Union leaders left a nearly two-and-a-half-hour meeting with Prime Minister Sébastien Lecornu saying he offered no measures; CGT leader Sophie Binet urged workers to “generalise the strike” from Nov. 5, though the Christian workers’ union said the door opened to talks on the minimum wage. Justice Minister Gérald Darmanin said about 2,500 people were detained after the Oct. 17 riots and looting. Curfews were renewed tonight around Paris’s République and Les Halles and in Lyon, and President Macron, touring the Gulf, called for “firmness.”<\/p>",

            "headline": "North America: Canada and Ontario commit $8.7 billion to shield jobs from U.S. tariffs",
            "body": "<p>Prime Minister Mark Carney and Ontario Premier Doug Ford announced an 8.7-billion-dollar Canadian package: a five-billion steel fund, 2.5 billion over two years for the auto industry and one billion to build a road to the Ring of Fire critical-minerals region, which they say protects up to 290,000 jobs. Ottawa will also hold vehicle emissions standards at 2026 levels through 2029, easing pressure on carmakers. “Their approach has changed, and so must ours,” Carney said of Washington, which has threatened 50% tariffs on cars and steel from Jan. 1.<\/p>",

            "headline": "North America: Mexico’s IMSS dissidents march despite an 8% offer",

            "headline": "North America: Supreme Court rebuffs Trump on trans inmates; Big Bend appeal filed",
            "body": "<p>In a one-sentence order, the justices left in place a lower-court block on a federal Bureau of Prisons policy ending hormone therapy for transgender inmates; Justices Thomas and Alito would have granted the administration’s request. Separately, the administration asked the Court to let it resume a 1.7-billion-dollar border-security road, camera and barrier project along more than 500 miles in and around Big Bend National Park, halted by a Texas judge on Oct. 14. Opponents note the Big Bend sector accounts for about 2% of border apprehensions.<\/p>",

            "headline": "South America: Venezuela braces for rival marches on Thursday",
            "body": "<p>María Corina Machado’s movement calls Venezuelans into the streets Thursday, with the Caracas rally at Plaza Venezuela at 4 p.m., to demand a 2027 presidential election date, her safe return and the release of political prisoners. The governing party, led by interim President Delcy Rodríguez, has called a women’s march the same day for breast-cancer awareness month. Both sides are testing who can fill the streets as Washington presses for election guarantees.<\/p>",

            "body": "<p>Brendan Nugent, 43, faced Wangaratta Magistrates Court on new charges, including causing harm to a Commonwealth public official, and was remanded until February; MP Helen Haines remains in critical but stable condition after losing both legs. Federal Police Commissioner Krissy Barrett said nearly one person a week is being charged with targeting federal parliamentarians, calling the threat climate “febrile,” and police and ASIO briefed MPs on security. Prime Minister Albanese urged calmer politics but said MPs must still be able to meet people “in the queues of Aldi or Woolies.”<\/p>",

            "headline": "Cutting health red tape: big employers join the prior-authorization fix",
            "body": "<p>Promise: make health care work for patients, not paperwork. What was done: HHS, CMS and the Labor Department announced Wednesday that Amazon, Google, Meta, Oracle and Axon will back extending the 2025 insurer pledge on electronic prior authorization to self-funded employer plans, which cover more than 180 million Americans. “Prior authorization should help patients get the right care, not trap doctors and families in administrative delays,” Secretary Kennedy said. Real impact: promising but voluntary; a federal rule requires electronic prior authorization from certain payers only from Jan. 1, 2027, so watch whether faxes and denials actually drop.<\/p>",

            "headline": "Ending the war: Russia agrees to resume three-way talks after Nov. 10",
            "body": "<p>Promise: end the Ukraine war. What was done: Witkoff’s ninth meeting with Putin produced Moscow’s agreement to restart U.S.–Russia–Ukraine talks after Nov. 10 and plans for a Putin–Trump–Xi summit in Shenzhen. Real impact: a process, not peace; the Kremlin wants talks on a postwar “security framework” and still aims to take the rest of eastern Ukraine. Room for disagreement: critics in Kyiv and Europe say easing sanctions for Russian diesel rewards Moscow before any ceasefire.<\/p>",

            "headline": "Bring Americans home: Hubbard is free after more than four years",
            "body": "<p>Promise: bring wrongfully detained Americans home. What was done: Stephen Hubbard, a retired teacher in his 70s seized in Ukraine in 2022 and sentenced to nearly seven years as a “mercenary,” a charge he always denied, was released as Witkoff arrived, a day after Trump asked for it. Witkoff thanked Putin, saying Hubbard’s son is a Greek Orthodox priest. Real impact: a sick, elderly man is going home to his family. Room for disagreement: the release was folded into a meeting where Putin praised the diesel deal Kyiv opposes.<\/p>",

            "headline": "Securing the border: the administration asks the Supreme Court to restart Big Bend work",
            "body": "<p>Promise: secure the southern border. What was done: the administration asked the justices Wednesday to lift a Texas judge’s Oct. 14 injunction on a 1.7-billion-dollar road, camera, sensor and vehicle-barrier project along more than 500 miles in and around Big Bend National Park; it says the halt leaves “a quarter of the southern border” exposed. Real impact, and disagreement: the sector saw more than 89,000 apprehensions from 2021 to 2025, but opponents, including a bipartisan group of lawmakers, say it accounts for about 2% of apprehensions and that waiving environmental laws threatens a national treasure.<\/p>",

            "body": "<p>Promise: tackle chronic disease at the root. What was done: HHS Secretary Robert F. Kennedy Jr. on Tuesday launched a Kidney Care National Plan built on Trump’s 2019 executive order, aiming to detect kidney disease earlier, expand home dialysis and competition, and make living donation easier. About 37 million American adults have kidney disease, most without knowing it. Real impact so far: HHS’s own analysis credits the 2019 order with about 2,000 extra transplants a year; the new plan is a strategy, so funding and rules will tell.<\/p>",

            "headline": "Tesla beats on profit and cash, cuts its spending plan to $20 billion",
            "body": "<p>Tesla’s third-quarter revenue was about flat at $28.0 billion, slightly below forecasts, and GAAP net income fell roughly 44% to $787 million, hit partly by marking down its SpaceX and Bitcoin holdings. But adjusted earnings of 48 cents a share beat estimates, gross margin was 19.6%, and free cash flow was a positive $1.5 billion when Wall Street feared heavy cash burn, because capital spending was $4.7 billion against about $7.8 billion expected. The CFO cut 2026 capex guidance to about $20 billion from more than $25 billion and said Tesla secured $30 billion of shorter-term debt for future spending. Shares rose about 1.5% to 1.7% after hours.<\/p>",

          {
            "headline": "On the call: Cybercabs to Dallas, unsupervised FSD around mid-2027, Optimus tempered",
            "body": "<p>Musk said the Austin Cybercab fleet has grown tenfold since launch and unsupervised miles grew eightfold in the quarter; Tesla’s self-driving chief, Ashok, said Dallas is next, with other cities before year-end, and unsupervised self-driving in customer cars around the second quarter of 2027. Optimus has begun initial production in Fremont, but Musk asked investors to “temper expectations,” saying it will take about a year to reach 20,000 a week and outside customers come around the end of 2027. Tesla has its largest car backlog in four years, limited by batteries, and FSD is on over 75% of new North American deliveries. Analysts were told no merger questions would be taken.<\/p>",
            "sources": [

            "headline": "SpaceX closes up 7.8% after its first big profit quarter",
            "body": "<p>SpaceX shares finished Wednesday at $159.31, up $11.52 or 7.79%, on volume of about 219 million shares, more than double Tuesday’s, after its record quarter and Musk’s confirmation of merger committees. They slipped about 1% after hours as Tesla reported. Over the past two months it has closed between about $134 and $172.<\/p>",

            "headline": "Canada turns toward Europe in space, and the U.S. ambassador objects",
            "body": "<p>At a Canadian space conference, U.S. Ambassador Pete Hoekstra said Canada has decided to “move away” from SpaceX and look more to the European Space Agency, calling it a surprising choice given “all the innovation” Musk drives. For SpaceX holders it is a small contract question, but part of a wider pattern of allies weighing sovereign alternatives to Starlink and Falcon launches.<\/p>",

            "headline": "Starlink: senators press SpaceX and the Pentagon over Ukraine slowdowns",
            "body": "<p>Four Democratic senators wrote to SpaceX asking who ordered speed limits on Starlink terminals used by Ukrainian forces Oct. 12–14, and a bipartisan group of nine asked the Pentagon inspector general to investigate whether the slowdown delayed missile warnings. Musk said any changes to Starshield, the military version, came from U.S. government decisions.<\/p>",

        "headline": "Hansen named Canada’s space adviser; Starship catch ahead.",
        "stories": [
          {
            "headline": "Artemis II’s Jeremy Hansen becomes Canada’s special adviser on space",
            "body": "<p>Prime Minister Mark Carney appointed astronaut Jeremy Hansen, who flew around the Moon on Artemis II in April and has just retired from the Canadian Space Agency, as special adviser on space to him and Industry Minister Mélanie Joly. Hansen will help write a new national space strategy focused on sovereignty and security. The same day, Defence Minister David McGuinty announced a 20-million-dollar agreement for a launch complex in southern Newfoundland, adding to one in Nova Scotia, so Canada can put critical satellites up without relying on foreign rockets.<\/p>",
            "sources": [
              {
                "name": "CBC News (Canadian Press)",
                "url": "https://www.cbc.ca/news/politics/jeremy-hansen-carney-special-adviser-9.7390754"
              }
            ]
          },
          {
            "headline": "Starship Flight 15 will try to catch both the booster and the ship",
            "body": "<p>On SpaceX’s earnings webcast, Musk confirmed that Flight 15, expected next month, will try to catch both the Super Heavy booster and, for the first time, the Starship upper stage with the launch tower’s arms. An animation showed the ship returning belly-first, flipping upright and sliding into the “chopsticks.” Musk called success on the first try “more likely than not,” said it would be the first full recovery of an orbital rocket, and predicted weekly Starship flights in the first half of 2027.<\/p>",
            "sources": [
              {
                "name": "KeepTrack: Ship-catch plan for Flight 15",
                "url": "https://keeptrack.space/space-brief/space-brief-2026-10-21"
              },
              {
                "name": "Ars Technica: Musk on the earnings call",
                "url": "https://arstechnica.com/space/2026/10/spacex-and-tesla-into-a-single-company-has-a-lot-of-merit-musk-says/"
              }
            ]
          },
          {
            "headline": "China launches a Ceres-1 from a ship in the Yellow Sea",
            "body": "<p>Late Tuesday Eastern time, Galactic Energy launched a Ceres-1 solid rocket from the Dongfang Hangtiangang launch ship off Rizhao, Shandong, carrying the first pathfinder satellite for the Guangzhou-backed Wuyang remote-sensing constellation, which will fly in low-inclination orbits. Sea launches let China reach orbits that are hard to hit from its inland pads.<\/p>",
            "sources": [
              {
                "name": "SpaceNews: Ceres-1 sea launch",
                "url": "https://spacenews.com/ceres-1-sea-launch-lofts-first-satellite-for-low-inclination-wuyang-remote-sensing-constellation/"
              }
            ]
          },
          {
            "headline": "Europe’s Space Rider test model is destroyed in a drop test",
            "body": "<p>ESA confirmed it lost a full-scale Space Rider test article this month when its parafoil failed to deploy properly during the final drop-test campaign; an independent investigation is underway. It is the second setback in the campaign after a May attempt was aborted, and it adds schedule risk to Europe’s reusable uncrewed spaceplane, which needs a controlled parafoil landing to bring payloads home.<\/p>",
            "sources": [
              {
                "name": "KeepTrack: Space Rider test model lost",
                "url": "https://keeptrack.space/space-brief/space-brief-2026-10-21"
              }
            ]
          },
          {
            "headline": "This week’s launch board: China and SpaceX close it out",
            "body": "<p>After Wednesday’s Chinese sea launch, the week ends with two Long March missions from Taiyuan and Jiuquan on Friday, a Long March 8A from Wenchang on Saturday, and a Falcon 9 Starlink flight from Vandenberg late Friday Pacific time that NASASpaceFlight says would be Falcon 9’s 700th mission. Japan’s new H3-24L variant sent the MMX probe toward Mars’ moon Phobos on Monday, aiming to return samples to Australia in 2031.<\/p>",
            "sources": [
              {
                "name": "NASASpaceFlight",
                "url": "https://www.nasaspaceflight.com/2026/10/launch-preview-102026/"
              }
            ]
          }

          {
            "headline": "An RS-25 engine fires for nearly 500 seconds for future Artemis rockets",
            "body": "<p>NASA tested RS-25 engine No. 10001 for close to 500 seconds at Stennis Space Center in Mississippi, validating flight components and a new thermal-protection system for the engines that power the Space Launch System on future Artemis missions. Each SLS core stage flies four RS-25s, and this test series supports the newly built engines meant for later Moon flights.<\/p>",

            ]

          {
            "headline": "JPL marks 90 years by looking to its next missions",
            "body": "<p>NASA’s Jet Propulsion Laboratory, founded in 1936, marked its 90th anniversary by pointing to what comes next, including the SkyFall Mars helicopters, MoonFall, the SunRISE radio-astronomy smallsats and the NEO Surveyor asteroid-hunting telescope. Separately, NASA highlighted CASALS, a lidar instrument designed to fill gaps in 3D maps of Earth’s surface.<\/p>",
            "sources": [
              {
                "name": "NASA JPL",
                "url": "https://www.jpl.nasa.gov/news/nasa-jpl-looks-to-next-90-years-of-innovation-exploration/"

              }
            ]
          },
          {
            "headline": "SR-1 Freedom, NASA’s nuclear-powered Mars craft, moves ahead",
            "body": "<p>NASA says contract actions are keeping Space Reactor-1 Freedom on track for a late-2028 launch as the first fission-powered spacecraft to travel beyond Earth orbit. Sierra Lobo will build the power-conversion system that turns the Idaho National Laboratory reactor’s heat into electricity for electric propulsion, and the reactor stays off until the craft leaves Earth orbit. At Mars it will deliver SkyFall, three helicopters evolved from Ingenuity, to scout for water.<\/p>",
            "sources": [
              {
                "name": "NASA: SR-1 Freedom advances",
                "url": "https://www.nasa.gov/centers-and-facilities/glenn/sr-1-freedom-advances-with-progress-on-nuclear-power-module/"
              }
            ],
            "why": "The same fission technology is meant to keep a Moon base running through the long lunar night."
          },
          {
            "headline": "Artemis update Friday at Kennedy",
            "body": "<p>Administrator Jared Isaacman and Artemis leaders brief at Kennedy Space Center on Friday at 2 p.m. on speeding toward a crewed Moon landing by 2028, with Artemis III now planned as a 2027 docking test in Earth orbit.<\/p>",
            "sources": [
              {
                "name": "The Florida Press: Artemis briefing",
                "url": "https://www.thefloridapress.com/news/nasa-leaders-to-update-artemis-acceleration-and-2028-moon-landing-plan-at-kenned"
              }
            ]
          },
          {
            "headline": "The final two solar-array spacewalks are set for Oct. 29 and Nov. 5",
            "body": "<p>NASA astronaut Anil Menon and the Canadian Space Agency’s Joshua Kutryk will install the space station’s last two roll-out solar arrays on spacewalks 100 and 101, finishing a multi-year power upgrade. Meanwhile, two NASA-funded satellite-relay demonstrations that rode Bandwagon-5 on Monday are checking out in orbit.<\/p>",

            "headline": "Stephen Cash returns to lead Marshall Space Flight Center",
            "body": "<p>NASA named veteran engineer Stephen Cash director of Marshall Space Flight Center in Huntsville, Alabama, effective Oct. 19. Cash, a University of Alabama graduate who previously worked at Marshall and then in the aerospace industry, succeeds acting director Rae Ann Meyer, who returns to her deputy role.<\/p>",
            "sources": [

          {
            "headline": "Miami: Little Flower inaugurates a new French Romantic pipe organ Saturday",
            "body": "<p>World-renowned organist Nathan Laube will inaugurate the new pipe organ at Church of the Little Flower in Coral Gables on Saturday, Oct. 24, at 7:30 p.m., free and open to all, as part of the parish’s 100th anniversary. A decade in the making, the instrument is designed to recreate the sound St. Thérèse of Lisieux would have heard, and it is the only organ in Southeast Florida with mechanical action. The same weekend brings Emmaus retreats in English and Spanish and the FOCUS 11 vocations rally for sixth-graders on Friday.<\/p>",
            "sources": [
              {
                "name": "Archdiocese of Miami: Coming up this weekend",
                "url": "https://www.miamiarch.org/CatholicDiocese.php?op=Article_archdiocese-of-miami-around-the-archdiocese-coming-up-this-weekend-10-23-2026"
              }
            ],
            "why": "A rare local event for church musicians: mechanical-action organs are almost unknown in South Florida."
          },
          {
            "headline": "Miami: Wenski keeps up his religious-liberty case on school vaccines",
            "body": "<p>Archbishop Thomas Wenski is pressing his dispute with Attorney General James Uthmeier, who warned Catholic schools could lose voucher funding unless they grant religious exemptions to vaccines. Wenski says the Church does not consider those vaccines objectionable, that the schools follow state health guidance, and that parents choosing a Catholic school “expect the Catholic school to be Catholic.” He called the threat “classic bullying” and said it reflects attacks now coming “from the right.”<\/p>",
            "sources": [
              {
                "name": "WUSF: Miami archbishop hits back",
                "url": "https://www.wusf.org/health-news-florida/2026-10-19/miami-archbishop-hits-back-ag-uthmeier-over-catholic-schools-vaccine-rules"

              {
                "name": "WLRN: Between the Lines with Wenski",
                "url": "https://www.wlrn.org/podcast/between-the-lines-with-dara-kam/2026-10-20/archbishop-thomas-wenski-part-i-standing-up-to-uthmeiers-vaccine-bullying"
              }
            ]
          },
          {
            "headline": "Vatican: The Pope’s tumor was localized; doctors say no further treatment",
            "body": "<p>The Holy See Press Office said tonight that final tests on the lung tissue removed Oct. 13 confirm a localized adenocarcinoma and that “no further treatment is necessary,” according to Dr. Luigi Carbone and surgeon Stefano Margaritora. It caps a day when Leo XIV, 71, toured St. Peter’s Square in the popemobile and thanked the faithful for their prayers. On Sunday he said the illness had given him “a profound sense of closeness” to all who are sick.<\/p>",
            "sources": [
              {
                "name": "Vatican News",
                "url": "https://www.vaticannews.va/en/pope/news/2026-10/pope-leo-xiv-doctors-confirm-no-further-treatment-necessary.html"

              {
                "name": "WPTZ (CNN)",
                "url": "https://www.mynbc5.com/article/pope-leo-xiv-no-further-cancer-treatment/74208323"
              }
            ]
          },
          {
            "headline": "Appointment: Fr. Leandro Machado Silvestre named bishop of Guajará-Mirim, Brazil",
            "body": "<p>Pope Leo on Wednesday named Fr. Leandro Machado Silvestre, 48, bishop of Guajará-Mirim, an Amazon diocese on the Bolivian border in Rondônia. Who he is: a priest of Mogi das Cruzes, near São Paulo, ordained in 2004, a longtime seminary rector, and since 2023 a <em>fidei donum<\/em> missionary priest in Porto Velho, where he is a pastor, spiritual director of the major seminary and, since January, vicar general.<\/p>",
            "sources": [
              {
                "name": "Holy See Press Office: Resignations and Appointments, Oct. 21",
                "url": "https://press.vatican.va/content/salastampa/en/bollettino/pubblico/2026/10/21/261021d.html"
              }
            ]
          },
          {
            "headline": "Appointment: Bishop Ignatius Ding Zuyao ordained for Haimen, China",
            "body": "<p>Fr. Ignatius Ding Zuyao, 40, was ordained Bishop of Haimen in Jiangsu Province on Oct. 15, after Pope Leo appointed him Aug. 24 under the Holy See–China Provisional Agreement; the news was reported in Hong Kong’s <em>Sunday Examiner<\/em> today. Who he is: a Haimen priest ordained in 2011, trained at Sheshan and Beijing seminaries, and most recently pastor of Qingnian Donglu Parish in Nantong. Bishop Joseph Shen Bin of Shanghai, his predecessor in Haimen, was principal consecrator before about 400 priests, religious and laypeople.<\/p>",
            "sources": [
              {
                "name": "Sunday Examiner",
                "url": "https://www.examiner.org.hk/2026/10/21/new-bishop-ordained-for-haimen-china/news/china/"
              }
            ]
          },
          {
            "headline": "Appointments: Venice, Fla., reshuffles priests; Saporito installs Thursday in Metuchen",
            "body": "<p>In Florida’s Diocese of Venice, effective this week, Fr. David Vidal, longtime pastor of Ave Maria Parish, becomes full-time vicar general, among other moves. In New Jersey, Bishop-designate Saporito is installed Thursday in Metuchen.<\/p>",
            "sources": [
              {
                "name": "Diocese of Venice: Appointments",
                "url": "https://dioceseofvenice.org/tag/appointments/"
              },
              {
                "name": "Diocese of Metuchen: Episcopal liturgies",

              }
            ]
          },
          {
            "headline": "Around the world: Europe on technology, Angola on the family, Myanmar’s young missionaries",
            "body": "<p>Europe: in a statement carried by Vatican News on Tuesday, Europe’s bishops said the common good must guide technological innovation. Africa: Archbishop José Manuel Imbamba of Saurimo, Angola, reflecting on this month’s Vatican meeting on <em>Amoris Laetitia<\/em>, highlighted the family’s role in nurturing faith and love, the same theme Pope Leo took up at today’s audience. Asia: in Myanmar, more than 1,600 children celebrated World Mission Sunday, which marked its 100th anniversary this year.<\/p>",

      {
        "id": "signs",
        "title": "Signs of the times",
        "headline": "Countdown latest Oct. 21; Marian message Oct. 20; Medjugorje study days.",
        "stories": [
          {
            "headline": "Countdown to the Kingdom: checked tonight, latest post still Oct. 21",
            "body": "<p>Checked this evening: the newest Countdown to the Kingdom post remains Wednesday’s “Pedro – The One Who Opposes Christ,” dated Oct. 21, after Tuesday’s “There Will be a Great War.” Its key line comes from an Oct. 13 message attributed to Our Lady through Brazilian seer Pedro Regis: “The one who opposes Christ will act in the world, and my poor children will bear a heavy cross… Those who remain faithful to the end will be saved.” The same message adds hope: “Do not forget: your victory is in the Eucharist.” The site’s editors note they are not the final judges of authenticity; the Church is, and private revelation never adds to the deposit of faith.<\/p>",
            "sources": [
              {
                "name": "Countdown to the Kingdom",
                "url": "https://www.countdowntothekingdom.com/"
              },
              {
                "name": "Countdown: Pedro – The One Who Opposes Christ",

              },
              {
                "name": "Apelos Urgentes (Anguera)",
                "url": "https://apelosurgentes.com.br/pt-br/mensagens/"
              }
            ]
          },
          {
            "headline": "Marian: the newest message is still Oct. 20; this week’s thread is conversion",
            "body": "<p>The latest dated Marian message remains Tuesday, Oct. 20, 2026, attributed to Our Lady, Queen of Peace, through Pedro Regis: “You live in a time worse than the time of the Flood… None of my devotees will be lost. This is the time of grace.” Read alongside the Oct. 17 message, the theme is consistent: “You are walking toward a future of great spiritual darkness… Repent and seek the mercy of my Jesus through the Sacrament of Confession,” with the familiar counsel of “the Holy Rosary and Sacred Scripture” in hand. The Anguera messages are not Church-approved and are offered for discernment; Medjugorje’s monthly message, under a 2024 nihil obstat for the parish’s spiritual fruits, comes Sunday, Oct. 25.<\/p>",
            "sources": [
              {
                "name": "Apelos Urgentes (Anguera)",
                "url": "https://apelosurgentes.com.br/pt-br/mensagens/"
              },
              {
                "name": "Medjugorje.org",
                "url": "https://www.medjugorje.org/olmmsg.htm"
              }
            ]
          },
          {
            "headline": "Medjugorje: Mariological Days open Thursday at the Vatican’s urging",
            "body": "<p>The first Mariological Days in Medjugorje begin Thursday, Oct. 22, at 3 p.m., with an opening talk by Archbishop Aldo Cavalli, the apostolic visitor for the parish, and run through Oct. 25 alongside the evening prayer program. Organizers, with the Pontifical International Marian Academy, will study the Second Vatican Council’s teaching on Mary. Pastor Fr. Zvonimir Pavičić said the idea came from the Dicastery for the Doctrine of the Faith, so that devotion at a place honoring the Queen of Peace stays “correct, pure, Catholic.” Lectures are translated into seven languages.<\/p>",
            "sources": [
              {
                "name": "PROTV (Radio Mir Međugorje)",
                "url": "https://protv.ba/program-marioloskih-dana-u-medugorju/"
              },
              {
                "name": "Medjugorje.hr",
                "url": "https://medjugorje.hr/en/news/mariological-days-medjugorje/460"
              }
            ],
            "why": "It shows the Holy See forming the pilgrim devotion it has approved, not just tolerating it."
          },
          {
            "headline": "Revival: UniteUS’s arena nights, from Miami to Appalachian State, roll on",
            "body": "<p>The campus movement UniteUS, founded by Alabama mother Tonya Prewett, filled the University of Miami’s arena in late September, with baptisms in water troughs outside late into the night; Prewett said hundreds committed to follow Jesus, though no count was published. At Appalachian State on Oct. 13, organizers and the Billy Graham association’s <em>Decision<\/em> magazine report more than 700 students chose Christ and about 100 were baptized in plastic-lined pickup-truck beds. Next stops: South Alabama on Oct. 27 and Belmont in Nashville on Nov. 10. A sober note from one Christian outlet: arena counts and baptism counts are different measures, and the real test is whether new believers find a church home by November.<\/p>",
            "sources": [
              {
                "name": "5Talents",
                "url": "https://www.5talentsmag.com/campus/uniteus-campus-revival-miami-baptisms-tonya-prewett"
              },
              {
                "name": "Decision Magazine (BGEA)",
                "url": "https://billygraham.org/decision-magazine/articles/spirit-movement-at-appalachian-state-university-worship-rally-includes-100-baptisms-in-plastic-lined-truck-beds"
              },
              {
                "name": "CBN News",
                "url": "https://cbn.com/news/us/700-students-choose-christ-100-get-baptized-revival-hits-appalachian-state"
              }
            ]
          },
          {
            "headline": "Digital ID, soberly: three African nations link identity systems across borders",
            "body": "<p>Benin, Ghana and Rwanda have connected to the Smart Africa Data Exchange in a pilot that lets a traveler’s identity be checked against home-country records, for example at an airport e-gate. Organizers stress it works “without centralizing identity databases or surrendering control over national data.” It joins Europe’s digital-identity wallet and the digital euro talks as systems worth watching for what they reveal and who controls the data; the real questions are privacy, consent and the right to opt out, not fear.<\/p>",
            "sources": [
              {
                "name": "Xinhua",
                "url": "https://english.news.cn/africa/20261021/f384c358518c40d08ed18e8babd2fa58/c.html"
              },
              {
                "name": "Agence Europe",
                "url": "https://agenceurope.eu/en/bulletin/article/13964/26/digital-euro-eu-co-legislators-examine-anti-money-laundering-offline-payments-usage-fees"
              }
            ]
          },

            "headline": "Bring Americans home: Russia frees Stephen Hubbard as Witkoff arrives",
            "body": "<p>Promise: bring wrongfully detained Americans home. What was done: one day after Trump said “it’s time to have Mr. Hubbard back,” Putin announced the 74-year-old’s release as he opened talks with Witkoff, and the State Department had classified him as wrongfully detained. Real impact: a sick, elderly man is coming home. Room for disagreement: critics in Kyiv note the release came alongside Putin praising a U.S. diesel-import deal that Ukraine opposes.<\/p>",

            "body": "<p>The U.S. bishops announced Tuesday that their fall assembly meets in Baltimore Nov. 16–19, with public sessions livestreamed Nov. 17 and 18. They will hear from Archbishop Paul Coakley, the conference president, and the nuncio, Archbishop Gabriele Caccia, elect a conference secretary, a general secretary and six committee chairmen, and vote on a new edition of the Lectionary for Mass and Book of the Gospels. A panel will look at “recent signs of new life in the Church,” the marked rise in people entering it and young people’s renewed interest in religion.<\/p>",

            "headline": "Africa: Malawi’s Archbishop Msusa tells Catholics, “Every baptised Christian has the gift of prophecy”",
            "body": "<p>Archbishop Thomas Luke Msusa of Blantyre rejected claims that Malawi’s bishops have been paid to keep silent on the economy and promised a pastoral letter “at the right time.” In a Mission Sunday homily he asked why foreign currency can be found to import cars but not fuel, and why private hospitals have medicines that public ones lack. Malawi’s bishops carry weight: their 1992 letter “Living Our Faith” helped end one-party rule. In Ethiopia, meanwhile, the bishops’ call to prayer and fasting for peace continues as the Tigray fighting grinds on.<\/p>",

        "stories": [
          {
            "headline": "Countdown to the Kingdom: checked this morning; newest posts still dated Oct. 16",
            "body": "<p>Checked at dawn Tuesday: the newest posts on Countdown to the Kingdom remain the four dated Oct. 16, so here is a closer look at what they carry. In a Sept. 8 message attributed to Our Lady, Angela of Zaro di Ischia describes Mary with a face “worried” yet smiling, asking for prayer “for the gift of peace for this world, which is so threatened today,” for silence before the Blessed Sacrament, and saying, “Do not be afraid of the cross… your little cross becomes love that saves.” Simona’s message the same day describes Mary’s mantle covering a globe of war scenes until they stop, and calls for “the weapon of the Holy Rosary grasped tightly,” adding, “I tell you all this not to frighten you but to warn you and prepare you.” Mark Mallett’s companion essay asks what the long-promised “period of peace” of the Triumph of the Immaculate Heart actually is; these are private revelations the Church has not approved, best read as invitations to prayer rather than predictions.<\/p>",

            "headline": "Marian: latest dated message Oct. 3; Medjugorje’s next is Sunday",
            "body": "<p>The latest dated Marian message on Countdown to the Kingdom is Oct. 3, 2026, attributed to Our Lady through Pedro Regis of Anguera, Brazil: “Even in the midst of tribulations, do not lose your hope. God is in control of everything… I have come from Heaven to help you, but what I do depends on you.” Two days earlier the same source warned that “humanity is heading toward the abyss of self-destruction that men have prepared with their own hands.” The latest Medjugorje monthly message, given to Marija on Sept. 25, calls families to renew the Rosary “for peace,” and the next is due this Sunday, Oct. 25; the Vatican has approved devotion at Medjugorje since 2024 without ruling on the apparitions themselves.<\/p>",

            "body": "<p>In an eight-hour judgment in Mombasa, Justice Diana Mochache found self-styled pastor Paul Mackenzie and 28 associates guilty of murdering 191 people, 190 of them children, whom he told to starve so they could “meet Jesus”; sentencing is Nov. 6. His “End Days” sermons called schools and medicine evil and digital ID cards “the mark of the devil,” and more than 400 bodies were found in the Shakahola forest. It is a sober lesson for anyone watching the signs of the times: true prophecy in the Church never commands harm, never isolates people from the sacraments and the community, and is always submitted to the Church’s judgment. A father who lost all six children said simply, “I’m a happy man, that all persons have been convicted.”<\/p>",

            "headline": "NASA’s simulated Mars crew marks one year inside its Houston habitat",

            "headline": "Miami: Wenski tells seminary friends to form priests who are “not afraid”",
            "body": "<p>At Mass with the Friends of the Seminary of St. Vincent de Paul before their gala, Archbishop Thomas Wenski recalled that St. John Paul II was elected on the feast of St. Hedwig in 1978 and began with “Be not afraid!” The seminary, he said, is where future priests go “into the dark” of study and prayer so they can later proclaim the Gospel “from the rooftops,” shaping “courageous, authentic hearts rather than superficial hypocrites.” The St. Vincent de Paul Award went to Father Dustin Feddon of the Diocese of Pensacola-Tallahassee, who directs Joseph House, a reentry program for newly released prisoners, and Dr. Anthony Dardano, a medical ethicist and seminary volunteer.<\/p>",
            "sources": [
              {
                "name": "Archdiocese of Miami: Wenski homily to the Friends of the Seminary",

            "body": "<p>Arundel and Brighton, England: Stephen Wang, London-born in 1966, longtime chaplain at the London School of Economics, creator of the Sycamore faith-formation films and rector of Rome’s Venerable English College since 2021, was set to be ordained the diocese’s sixth bishop at noon today. Manila to Rome: Cardinal Luis Antonio Tagle, 69, former archbishop of Manila and pro-prefect at the Dicastery for Evangelization, is now the first Asian dean of the College of Cardinals, and the Philippines’ Ecumenical Bishops’ Forum asked him Monday to use it for unity and the poor. Metuchen, N.J.: Bishop Michael Saporito, until now an auxiliary bishop of Newark, is installed Thursday, Oct. 22, at 2 p.m. at Sacred Heart Church in South Plainfield.<\/p>",

        "stories": [
          {
            "headline": "Countdown to the Kingdom: checked this evening; newest posts still dated Oct. 16",
            "body": "<p>Checked Monday evening: the newest items on Countdown to the Kingdom are still the four posts dated Oct. 16 — Mark Mallett’s “What Is the Promised Peace?”, messages attributed to Our Lady through Angela (“Implore Jesus for the Gift of Peace for this World”) and Simona (“Pray for Peace in the World”) of Zaro di Ischia, Italy, and through Pedro Regis of Anguera, Brazil (“What I Do Depends on You”). Below them sit Oct. 3 posts carrying Marija’s Sept. 25 Medjugorje message and a message titled “Satan Will be Blinded.” Taken together, the week’s theme is unmistakable: peace as a gift to be implored in prayer, and human freedom that, in the words of the Pedro Regis message, “without God’s grace, leads you to perdition.” The site itself reminds readers that the Church, not the site, is the final judge of any private revelation, and that none of it demands the assent owed to Scripture and Tradition.<\/p>",
            "sources": [
              {
                "name": "Countdown to the Kingdom: Home",
                "url": "https://www.countdowntothekingdom.com/"
              },
              {
                "name": "Countdown to the Kingdom: What Is the Promised Peace?",

              {
                "name": "Countdown to the Kingdom: Pedro – What I Do Depends on You",
                "url": "https://www.countdowntothekingdom.com/pedro-what-i-do-depends-on-you/"
              }
            ],
            "why": "What to watch: Zaro’s seers usually receive messages on the 8th and 26th, so the next are expected Oct. 26, the day after Medjugorje’s monthly message."
          },
          {
            "headline": "Marian: the Sept. 25 Medjugorje message stands; the next comes Sunday",
            "body": "<p>The latest monthly message, given through Marija on Sept. 25, 2026: “May this time be a time of prayer for peace. I am calling you to renew in your families the prayer of the Rosary for my intentions, so that I may be able to multiply your prayers and intercede for you before the Most High… like never before I pray for you and with you, my little children.” The next is due this Sunday, Oct. 25. On a day the Pope himself pressed for a ceasefire in Oleshky, the call to pray the Rosary in families for peace reads less like a slogan than a task. Since 2024 the Vatican has approved devotion at Medjugorje for its spiritual fruits, without ruling on whether the apparitions are supernatural.<\/p>",
            "sources": [
              {
                "name": "Medjugorje.org: Monthly message",
                "url": "https://www.medjugorje.org/olmmsg.htm"
              },
              {
                "name": "Holy See Press Office: Pope’s call with Zelenskyy",
                "url": "https://press.vatican.va/content/salastampa/en/bollettino/pubblico/2026/10/19/261019b.html"

            "headline": "Eucharistic: Guatemala’s Cuilapa Host remains under the bishop’s study",
            "body": "<p>The Diocese of Santa Rosa de Lima is still studying a consecrated Host at the Cathedral of the Child Jesus in Cuilapa, Guatemala, which a priest placed in water on July 30 after a teenager tried to throw it away, and which a week later had not dissolved and showed reddish stains “that could be blood.” The parish’s Aug. 22 statement asks for “prudence and moderation,” says such cases “cannot be called miracles until a full investigation is carried out,” and keeps the Host reserved, not on display. Meanwhile, Eucharistic-miracle exhibitions are drawing visitors this month in Como, Italy, through Oct. 31 and in Glenbrook, Australia, through Oct. 25.<\/p>",

              {
                "name": "Apostolate of Eucharistic Adoration: Reported Eucharistic miracle, Guatemala",

            "why": "The parish’s own words are the right frame: “Jesus is alive in the Eucharist; it is not something, it is Someone.”"

          {
            "headline": "Revival: five more campuses where churches walked students into the water",
            "body": "<p>Beyond last week’s App State night, a WWJD roundup counts 19 students baptized in Pepperdine’s pool after Unite LA, 327 commitments and more than 7,000 attendees at the Cheaha Area Crusade in Anniston, Alabama, 17 Howard Payne football players baptized in Texas, 15 students on the University of North Georgia promenade, and 59 baptisms in one week at Pearl River Community College in Mississippi. The common thread is follow-up: in Anniston more than 40 churches met daily to pray over every name and connect each person to a parish. Catholic campus ministries report the same hunger in record OCIA numbers.<\/p>",

              {

              }
            ]

          {
            "headline": "Digital ID, soberly: Utah’s privacy pact and an Orb-verified ID for banking",
            "body": "<p>At the Money20/20 conference, Utah’s chief privacy officer said the state is forming a multi-state consortium around ID principles that treat people as owners of their own data, with 10 states expected to be working on such frameworks by January; 21 states and Puerto Rico already issue digital IDs. At the same conference, World, the Orb-scanning biometric ID project led by Tools for Humanity, launched “proof of human” tools for banks, Zoom calls and AI agents, and says more than 18 million people now hold its Orb-verified ID. One approach limits what can be tracked; the other makes a biometric credential the gate to transactions, which is exactly the trade-off worth watching with clear eyes rather than fear.<\/p>",
            "sources": [
              {
                "name": "Payments Dive: Utah forms digital ID consortium",
                "url": "https://www.paymentsdive.com/news/utah-forms-digital-id-consortium/833351/"

              }

            "headline": "Returns to the faith: Maine’s diocese launches a ‘come home’ campaign",
            "body": "<p>The Diocese of Portland, Maine, will partner with Catholics Come Home starting in Advent, as Pew data show the share of Maine adults identifying as Catholic fell from 29% to 14% since 2007. Its stories are of people drawn back by a welcome: a woman who returned on Mother’s Day after 20 years away, a man greeted at confession with “Welcome back!”, and a woman baptized as an infant who discovered it from a photo and was confirmed this Easter. “The Church is not a reward for the perfect,” she says. “It is a home for sinners seeking God’s mercy.”<\/p>",

                "url": "https://harvestmagazinemaine.org/coming-home-catholic-church"
              }
            ]

            "headline": "Missions: a century of World Mission Sunday, marked with an indulgence",
            "body": "<p>Pius XI began World Mission Sunday in 1926; this year’s theme is “One in Christ, United in Mission,” and the Apostolic Penitentiary granted a plenary indulgence under the usual conditions: confession, Communion and prayer for the Pope’s intentions. In his message, Pope Leo warns that conflict and distrust inside Church communities weaken their witness, and calls evangelization “always a collective, communal, and synodal undertaking.”<\/p>",

                "name": "Vatican News: Pope grants plenary indulgence for 100th World Mission Sunday",

            "body": "<p>Promise: end the Russia–Ukraine war quickly. What was done: on Sunday Trump defended Friday’s hold on the Graham Act’s new tariffs and sanctions, saying he would not “foolishly” drive Moscow from the bargaining table, and his envoys Witkoff and Kushner briefed Zelenskyy on next steps. Impact so far: Zelenskyy says Russia hit Ukraine’s energy sites 76 times in the week after the announced energy truce, and overnight it fired 16 ballistic missiles at Kyiv. Supporters say pressure without talks prolongs the war; critics, including Hakeem Jeffries, say relief without reciprocity rewards Putin.<\/p>",

            "headline": "Lowering prices: a mixed scorecard two weeks before the midterms",

            "headline": "MAHA: Kennedy tours rural EMS and health-workforce programs",
            "body": "<p>Promise: rebuild health care for rural and working Americans. What was done: in Concord, N.H., Health Secretary Robert F. Kennedy Jr. showcased a rural EMS program funded by the federal Rural Health Transformation Program, then toured a health-professions training center in Virginia Beach on workforce shortages. Impact: more trained responders in places that lack them. He also again questioned the hepatitis B vaccine’s pre-licensing trials, a claim that University of Minnesota researchers say is wrong, pointing to a 1980 placebo-controlled study.<\/p>",

            "body": "<p>With Florida carrying out 16 executions this year, more than half the national total, Archbishop Thomas Wenski is urging Catholics to look past political “tribes” and see the convicted as still made in God’s image, backing the Florida bishops’ July pastoral letter against the death penalty. He also told a NAMI conference that a person in a mental-health crisis too often ends up in jail rather than care: “We are a people of both,” prayer and psychiatry. Catholic Charities of Miami, marking 95 years, offers bilingual, sliding-scale counseling and addiction treatment at St. Luke’s Center.<\/p>",

          {
            "headline": "Countdown to the Kingdom: checked this morning, latest posts dated Oct. 16",
            "body": "<p>Checked Monday morning: the newest items on Countdown to the Kingdom are still four posts dated Oct. 16, Mark Mallett’s “What Is the Promised Peace?”, messages attributed to Our Lady through Angela and Simona of Zaro di Ischia, Italy, and through Pedro Regis of Anguera, Brazil. Going deeper into Mallett’s theme: the site frames it around the century-old promise, from Fatima onward, of a “Triumph of the Immaculate Heart” that ushers in a “period of peace,” and asks what that peace is and how it comes. Zaro’s seers receive messages on the 8th and 26th of each month, so the next are expected Oct. 26; the site itself reminds readers that only the Church judges authenticity and that none of this binds like public revelation.<\/p>",
