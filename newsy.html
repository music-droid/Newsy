<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Short, bounded news briefings — not a news portal.">
  <meta name="color-scheme" content="light">
  <meta name="theme-color" content="#6b4f3a">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Newsy">
  <title>Newsy</title>
  <!-- Self-contained offline reader. PWA install (Add to Home Screen) needs the
       multi-file HTTPS deploy (index.html + manifest + sw.js + icons). Service
       workers do not run from file://. See HOME-SCREEN.md. -->
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400;600&family=Source+Serif+4:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
  <style>
/* Newsy — calm briefings, not a news portal */
:root {
  --bg: #f7f3ec;
  --bg-soft: #f0eae0;
  --ink: #2c2925;
  --ink-muted: #5c564e;
  --ink-faint: #8a8278;
  --accent: #6b4f3a;
  --accent-soft: #c4a882;
  --rule: #e0d6c8;
  --chip: #fffdf9;
  --chip-active: #6b4f3a;
  --chip-active-ink: #f7f3ec;
  --link: #4a6b5a;
  --link-hover: #355244;
  --max: 38rem;
  --font: "Source Serif 4", "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif;
  --font-ui: "Source Sans 3", "Segoe UI", system-ui, -apple-system, sans-serif;
}

*,
*::before,
*::after {
  box-sizing: border-box;
}

html {
  font-size: 112.5%; /* ~18px */
  -webkit-text-size-adjust: 100%;
}

body {
  margin: 0;
  min-height: 100vh;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font);
  line-height: 1.65;
  font-weight: 400;
}

a {
  color: var(--link);
  text-decoration-thickness: 1px;
  text-underline-offset: 0.15em;
}

a:hover {
  color: var(--link-hover);
}

.wrap {
  width: min(100% - 2rem, var(--max));
  margin-inline: auto;
  padding-block: 2rem 4rem;
}

/* Header */
.site-header {
  border-bottom: 1px solid var(--rule);
  padding-bottom: 1.25rem;
  margin-bottom: 1.75rem;
}

.brand {
  font-family: var(--font-ui);
  font-size: 0.75rem;
  font-weight: 600;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: var(--accent);
  margin: 0 0 0.35rem;
}

.briefing-title {
  font-size: clamp(1.45rem, 4vw, 1.85rem);
  font-weight: 600;
  line-height: 1.25;
  margin: 0 0 0.25rem;
  letter-spacing: -0.01em;
}

.meta {
  font-family: var(--font-ui);
  font-size: 0.85rem;
  color: var(--ink-muted);
  margin: 0;
}

/* Picker — compact "Briefings" select (native wheel on iPhone) */
.picker {
  display: flex;
  align-items: center;
  gap: 0.75rem;
  margin: 0 0 1.75rem;
}

.picker-label {
  font-family: var(--font-ui);
  font-size: 0.7rem;
  font-weight: 600;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--ink-faint);
  margin: 0;
  flex: 0 0 auto;
}

.select-wrap {
  position: relative;
  flex: 1 1 auto;
  max-width: 16rem;
}

.select-wrap::after {
  content: "";
  position: absolute;
  right: 1rem;
  top: 50%;
  width: 0.5rem;
  height: 0.5rem;
  border-right: 2px solid var(--accent, #6b4f3a);
  border-bottom: 2px solid var(--accent, #6b4f3a);
  transform: translateY(-70%) rotate(45deg);
  pointer-events: none;
}

.briefing-select {
  -webkit-appearance: none;
  appearance: none;
  width: 100%;
  min-height: 44px;
  font-family: var(--font-ui);
  font-size: 1rem; /* 16px+ keeps iOS Safari from zooming on focus */
  font-weight: 600;
  color: var(--accent, #6b4f3a);
  background: var(--chip);
  border: 1.5px solid var(--accent, #6b4f3a);
  border-radius: 999px;
  padding: 0.5rem 2.5rem 0.5rem 1.1rem;
  cursor: pointer;
  transition: background 0.15s ease, box-shadow 0.15s ease;
}

.briefing-select:hover {
  background: #f7f1e8;
}

.briefing-select:focus-visible {
  outline: none;
  box-shadow: 0 0 0 3px rgba(107, 79, 58, 0.25);
}

/* Beats */
.beats {
  display: flex;
  flex-direction: column;
  gap: 2rem;
}

.beat {
  padding-top: 0.25rem;
}

.beat-title {
  font-size: 1.05rem;
  font-weight: 600;
  margin: 0 0 0.65rem;
  padding-bottom: 0.4rem;
  border-bottom: 1px solid var(--rule);
  color: var(--accent);
  letter-spacing: 0.01em;
}

.beat-body {
  margin: 0;
}

.beat-body p {
  margin: 0 0 0.85rem;
}

.beat-body p:last-child {
  margin-bottom: 0;
}

.sources {
  margin-top: 0.85rem;
  padding-top: 0.55rem;
  border-top: 1px dotted var(--rule);
  font-family: var(--font-ui);
  font-size: 0.8rem;
  color: var(--ink-muted);
  line-height: 1.55;
}

.sources-label {
  font-weight: 600;
  color: var(--ink-faint);
  margin-right: 0.35rem;
}

.sources a {
  word-break: break-word;
}

.sources .sep {
  color: var(--ink-faint);
  margin: 0 0.3rem;
}

.sources .name-only {
  color: var(--ink-muted);
}

/* Status / empty */
.status {
  font-family: var(--font-ui);
  font-size: 0.9rem;
  color: var(--ink-muted);
  padding: 1.5rem 0;
}

.site-footer {
  margin-top: 3rem;
  padding-top: 1rem;
  border-top: 1px solid var(--rule);
  font-family: var(--font-ui);
  font-size: 0.75rem;
  color: var(--ink-faint);
}

.site-footer p {
  margin: 0;
}


/* Podcast player */
.podcast {
  margin-top: 0.85rem;
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 0.65rem 0.85rem;
}

.listen-btn {
  font-family: var(--font-ui);
  font-size: 0.8rem;
  font-weight: 600;
  letter-spacing: 0.04em;
  appearance: none;
  border: 1px solid var(--accent);
  background: var(--accent);
  color: var(--chip-active-ink);
  border-radius: 999px;
  padding: 0.4rem 1rem;
  cursor: pointer;
  transition: background 0.15s ease, color 0.15s ease, border-color 0.15s ease;
}

.listen-btn:hover {
  background: #5a3f2d;
  border-color: #5a3f2d;
}

.listen-btn:focus-visible {
  outline: 2px solid var(--accent-soft);
  outline-offset: 2px;
}

.listen-btn[aria-pressed="true"] {
  background: var(--bg-soft);
  color: var(--accent);
  border-color: var(--accent);
}

.podcast audio {
  flex: 1 1 12rem;
  min-width: 11rem;
  max-width: 100%;
  height: 2.1rem;
  accent-color: var(--accent);
}

@media print {
  .podcast {
    display: none !important;
  }
}

/* Print — quiet page, no chrome clutter */
@media print {
  :root {
    --bg: #fff;
    --ink: #111;
    --ink-muted: #333;
    --rule: #ccc;
    --accent: #333;
    --link: #000;
  }

  body {
    background: #fff;
    font-size: 11pt;
    line-height: 1.5;
  }

  .wrap {
    width: 100%;
    max-width: none;
    padding: 0;
  }

  .picker,
  .site-footer {
    display: none;
  }

  .site-header {
    border-bottom-color: #999;
  }

  .beat {
    break-inside: avoid;
  }

  a {
    color: inherit;
    text-decoration: none;
  }

  .sources a::after {
    content: " (" attr(href) ")";
    font-size: 0.75em;
    color: #555;
  }
}

@media (max-width: 480px) {
  html {
    font-size: 106.25%;
  }

  .wrap {
    width: min(100% - 1.5rem, var(--max));
    padding-block: 1.5rem 3rem;
  }
}

/* ---- v3: glance, images, collapsible stories, new at this hour ---- */
.top-line { font-size: 1.1rem; font-style: italic; color: var(--ink-muted); margin: 0 0 1.25rem; }
.glance { background: var(--bg-soft); border-radius: 12px; padding: 0.9rem 1.1rem; margin-bottom: 2rem; }
.glance-label, .carried, .tag, .why span, .beat-figure figcaption {
  font-family: var(--font-ui); font-size: 0.7rem; font-weight: 600; letter-spacing: 0.12em; text-transform: uppercase; color: var(--accent);
}
.glance-label { margin: 0 0 0.4rem; }
.glance ol { list-style: none; margin: 0; padding: 0; }
.glance li { padding: 0.3rem 0; border-top: 1px solid var(--rule); font-size: 0.92rem; line-height: 1.4; }
.glance li:first-child { border-top: 0; }
.glance a { color: var(--ink); text-decoration: none; }
.glance-beat { font-family: var(--font-ui); font-weight: 600; color: var(--accent); margin-right: 0.3rem; }
.beat-figure { margin: 0.5rem 0 0.9rem; }
.beat-figure img { width: 100%; aspect-ratio: 16 / 9; object-fit: cover; border-radius: 10px; display: block; background: var(--bg-soft); }
.beat-figure figcaption { margin-top: 0.3rem; color: var(--ink-faint); font-weight: 400; letter-spacing: 0.06em; }
.beat-figure figcaption a { color: inherit; }
.carried { color: var(--ink-faint); margin: 0 0 0.4rem; }
.stories { list-style: none; margin: 0; padding: 0; }
.story { border-top: 1px solid var(--rule); }
.story:last-child { border-bottom: 1px solid var(--rule); }
.story summary { cursor: pointer; list-style: none; padding: 0.7rem 1.6rem 0.7rem 0; position: relative; font-weight: 600; line-height: 1.35; }
.story summary::-webkit-details-marker { display: none; }
.story summary::after { content: "+"; position: absolute; right: 0.2rem; top: 0.6rem; font-family: var(--font-ui); color: var(--accent); font-size: 1.2rem; }
.story details[open] summary::after { content: "–"; }
.story-body { padding: 0 0 0.9rem; }
.story-body p:first-child { margin-top: 0; }
.story-img { width: 100%; border-radius: 8px; margin-bottom: 0.6rem; }
.why { font-size: 0.92rem; color: var(--ink-muted); }
.new-hour { background: #fff8ec; border: 1px solid var(--accent-soft); border-radius: 12px; padding: 0.8rem 1rem; }
.new-hour .beat-title { color: #9a3b1e; }
.tag { margin-right: 0.35rem; }

  </style>
</head>
<body>
  <main class="wrap">
    <header class="site-header">
      <p class="brand" id="brand">Newsy</p>
      <h1 class="briefing-title" id="briefing-title">Briefing</h1>
      <p class="meta" id="briefing-meta"></p>
      <div class="podcast" id="podcast" hidden>
        <button type="button" class="listen-btn" id="listen-btn" aria-label="Listen to this briefing">Listen</button>
        <audio id="podcast-audio" controls preload="none"></audio>
      </div>
    </header>

    <nav class="picker" aria-label="Briefings">
      <label class="picker-label" for="briefing-select">Briefings</label>
      <div class="select-wrap">
        <select id="briefing-select" class="briefing-select"></select>
      </div>
    </nav>

    <p class="status" id="status" hidden>Loading…</p>

    <div class="beats" id="beats"></div>

    <footer class="site-footer">
      <p>A short page. Read it, then close the tab.</p>
    </footer>
  </main>
  <script>
(function () {
  "use strict";


  const els = {
    brand: document.getElementById("brand"),
    title: document.getElementById("briefing-title"),
    meta: document.getElementById("briefing-meta"),
    podcast: document.getElementById("podcast"),
    listenBtn: document.getElementById("listen-btn"),
    audio: document.getElementById("podcast-audio"),
    select: document.getElementById("briefing-select"),
    beats: document.getElementById("beats"),
    status: document.getElementById("status"),
  };

  let briefings = [];

  function formatGeneratedAt(iso) {
    if (!iso) return "";
    const d = new Date(iso);
    if (Number.isNaN(d.getTime())) return iso;
    try {
      return new Intl.DateTimeFormat("en-US", {
        weekday: "short",
        month: "short",
        day: "numeric",
        year: "numeric",
        hour: "numeric",
        minute: "2-digit",
        timeZoneName: "short",
      }).format(d);
    } catch (_) {
      return iso;
    }
  }

  const MONTHS = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
  const WEEKDAYS = ["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"];
  const SLOT_NAMES = { morning: "Morning", noon: "Noon", evening: "Night" };

  function slotOf(b) {
    const m = /-(morning|noon|evening)$/.exec(b.id || "");
    return m ? m[1] : (b.slot || "").toLowerCase();
  }

  function optionLabel(b) {
    // e.g. "Wed, Oct 7 · Night"
    const src = b.date || (b.id || "").slice(0, 10);
    const parts = src.split("-");
    const slot = SLOT_NAMES[slotOf(b)] || (b.slot ? b.slot.charAt(0).toUpperCase() + b.slot.slice(1) : "");
    if (parts.length === 3) {
      const y = Number(parts[0]);
      const mo = Number(parts[1]);
      const day = Number(parts[2]);
      const wd = WEEKDAYS[new Date(Date.UTC(y, mo - 1, day)).getUTCDay()];
      return wd + ", " + MONTHS[mo - 1] + " " + day + (slot ? " · " + slot : "");
    }
    return b.label || b.id;
  }

  function renderSources(sources) {
    if (!sources || !sources.length) return "";
    const parts = sources.map(function (s) {
      const name = s.name || "Source";
      if (s.url) {
        return (
          '<a href="' +
          escapeAttr(s.url) +
          '" rel="noopener noreferrer" target="_blank">' +
          escapeHtml(name) +
          "</a>"
        );
      }
      return '<span class="name-only">' + escapeHtml(name) + "</span>";
    });
    return (
      '<p class="sources"><span class="sources-label">Sources</span> ' +
      parts.join('<span class="sep">·</span>') +
      "</p>"
    );
  }

  function bodyHtml(body) {
    if (!body) return "";
    // Allow simple HTML paragraphs; if plain text, wrap paragraphs
    if (/<[a-z][\s\S]*>/i.test(body)) return body;
    return body
      .split(/\n\n+/)
      .map(function (p) {
        return "<p>" + escapeHtml(p.trim()) + "</p>";
      })
      .join("");
  }

  function escapeHtml(str) {
    return String(str)
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;");
  }

  function escapeAttr(str) {
    return escapeHtml(str).replace(/'/g, "&#39;");
  }


  function setPodcast(b) {
    if (!els.podcast || !els.audio) return;
    const src = b && b.audio ? b.audio : "";
    if (!src) {
      els.audio.pause();
      els.audio.removeAttribute("src");
      els.audio.load();
      els.podcast.hidden = true;
      if (els.listenBtn) {
        els.listenBtn.setAttribute("aria-pressed", "false");
        els.listenBtn.textContent = "Listen";
      }
      return;
    }
    const abs = new URL(src, location.href).href;
    const current = els.audio.currentSrc || els.audio.src || "";
    if (current !== abs) {
      els.audio.pause();
      els.audio.src = src;
      els.audio.load();
      if (els.listenBtn) {
        els.listenBtn.setAttribute("aria-pressed", "false");
        els.listenBtn.textContent = "Listen";
      }
    }
    els.podcast.hidden = false;
  }

  function storyHtml(st, open) {
    const why = st.why ? '<p class="why"><span>Why it matters</span> ' + escapeHtml(st.why) + "</p>" : "";
    const img = st.image && st.image.src
      ? '<img class="story-img" loading="lazy" src="' + escapeAttr(st.image.src) + '" alt="' + escapeAttr(st.image.alt || "") + '" onerror="this.remove()">'
      : "";
    return (
      '<li class="story"><details' + (open ? " open" : "") + ">" +
      '<summary><span class="story-head">' + escapeHtml(st.headline || "") + "</span></summary>" +
      '<div class="story-body">' + img + why + bodyHtml(st.body || "") + renderSources(st.sources) + "</div>" +
      "</details></li>"
    );
  }

  function storiesOf(beat) {
    if (Array.isArray(beat.stories) && beat.stories.length) return beat.stories;
    if (beat.body) return [{ headline: beat.headline || beat.title || "", body: beat.body, sources: beat.sources }];
    return [];
  }

  function beatImageHtml(beat) {
    const im = beat.image;
    if (!im || !im.src) return "";
    const credit = im.credit
      ? '<figcaption>' + (im.sourceUrl
          ? '<a href="' + escapeAttr(im.sourceUrl) + '" rel="noopener noreferrer" target="_blank">' + escapeHtml(im.credit) + "</a>"
          : escapeHtml(im.credit)) + "</figcaption>"
      : "";
    return '<figure class="beat-figure"><img loading="lazy" src="' + escapeAttr(im.src) + '" alt="' + escapeAttr(im.alt || "") +
      '" onerror="this.closest(\'figure\').remove()">' + credit + "</figure>";
  }

  function wordCount(b) {
    let txt = "";
    (b.newAtThisHour || []).forEach(function (n) { txt += " " + (n.headline || "") + " " + (n.body || ""); });
    (b.beats || []).forEach(function (beat) {
      storiesOf(beat).forEach(function (st) { txt += " " + (st.headline || "") + " " + (st.body || ""); });
    });
    return txt.replace(/<[^>]+>/g, " ").split(/\s+/).filter(Boolean).length;
  }

  function renderBriefing(b) {
    if (!b) {
      els.title.textContent = "No briefing";
      els.meta.textContent = "";
      els.beats.innerHTML = "";
      setPodcast(null);
      els.status.hidden = false;
      els.status.textContent = "No briefing selected.";
      return;
    }

    els.status.hidden = true;
    els.title.textContent = b.label || b.id;
    const when = formatGeneratedAt(b.generatedAt);
    const mins = Math.max(1, Math.round(wordCount(b) / 230));
    els.meta.textContent = (when ? "Prepared " + when + " · " : "") + mins + " min read";
    setPodcast(b);

    document.title = (b.label || "Briefing") + " · Newsy";

    const beats = b.beats || [];
    let html = "";

    if (b.topLine) {
      html += '<p class="top-line">' + escapeHtml(b.topLine) + "</p>";
    }

    // At a glance: one tappable line per beat (NYT/Axios-style index)
    html += '<nav class="glance" aria-label="At a glance"><p class="glance-label">At a glance</p><ol>' +
      beats.map(function (beat) {
        return '<li><a href="#beat-' + escapeAttr(beat.id || "") + '" data-jump="beat-' + escapeAttr(beat.id || "") + '"><span class="glance-beat">' +
          escapeHtml(beat.title || "") + "</span> " + escapeHtml(beat.headline || "") + "</a></li>";
      }).join("") + "</ol></nav>";

    const fresh = b.newAtThisHour || [];
    if (fresh.length) {
      html += '<section class="beat new-hour" id="beat-new"><h2 class="beat-title">New at this hour</h2><ul class="stories">' +
        fresh.map(function (n, i) {
          const tag = n.beat ? '<span class="tag">' + escapeHtml(n.beat) + "</span> " : "";
          return storyHtml({ headline: "", body: n.body, sources: n.sources, why: n.why, image: n.image }, i === 0)
            .replace('<span class="story-head"></span>', '<span class="story-head">' + tag + escapeHtml(n.headline || "") + "</span>");
        }).join("") + "</ul></section>";
    }

    html += beats.map(function (beat) {
      const stories = storiesOf(beat);
      const carried = beat.carried ? '<p class="carried">' + escapeHtml(beat.carried === true ? "Continuing from this morning" : beat.carried) + "</p>" : "";
      return (
        '<article class="beat" id="beat-' + escapeAttr(beat.id || "") + '">' +
        '<h2 class="beat-title">' + escapeHtml(beat.title || "") + "</h2>" +
        beatImageHtml(beat) + carried +
        '<ul class="stories">' + stories.map(function (st) { return storyHtml(st, false); }).join("") + "</ul>" +
        (beat.stories && beat.stories.length ? renderSources(beat.sources) : "") +
        "</article>"
      );
    }).join("");

    els.beats.innerHTML = html;

    // in-page jumps without clobbering the briefing hash
    els.beats.querySelectorAll("[data-jump]").forEach(function (a) {
      a.addEventListener("click", function (e) {
        e.preventDefault();
        const t = document.getElementById(a.getAttribute("data-jump"));
        if (t) t.scrollIntoView({ behavior: "smooth", block: "start" });
      });
    });

    if (els.select && els.select.value !== b.id) els.select.value = b.id;

    if (history.replaceState) {
      history.replaceState(null, "", "#" + encodeURIComponent(b.id));
    } else {
      location.hash = encodeURIComponent(b.id);
    }
  }

  function findBriefing(id) {
    return briefings.find(function (b) {
      return b.id === id;
    });
  }

  function renderPicker() {
    if (!els.select) return;
    // Newest first (briefings.json is already newest-first; sort defensively by id)
    const ordered = briefings.slice().sort(function (a, b) {
      const ka = (a.date || a.id || "") + " " + ({ morning: 1, noon: 2, evening: 3 }[slotOf(a)] || 0);
      const kb = (b.date || b.id || "") + " " + ({ morning: 1, noon: 2, evening: 3 }[slotOf(b)] || 0);
      return ka < kb ? 1 : ka > kb ? -1 : 0;
    });
    els.select.innerHTML = ordered
      .map(function (b) {
        return '<option value="' + escapeAttr(b.id) + '">' + escapeHtml(optionLabel(b)) + "</option>";
      })
      .join("");

    els.select.addEventListener("change", function () {
      const found = findBriefing(els.select.value);
      if (found) {
        renderBriefing(found);
        window.scrollTo(0, 0);
      }
    });

    window.addEventListener("hashchange", function () {

            "headline": "Ending the war: an Oleshky truce and November talks",
            "body": "<p>Promise: end the war in Ukraine. What was done: the White House says the First Lady brokered a local ceasefire in occupied Oleshky starting Oct. 27, with aid and evacuations from Oct. 29, and both Moscow and Kyiv confirm trilateral talks in Abu Dhabi in the first half of November. Real impact: trapped civilians may soon get food and a way out, while nationwide strikes and power cuts continue. Room for disagreement: supporters see momentum; critics, including European leaders, say sanctions relief and the diesel deal reward Russia, and Kyiv says Starlink limits persist.<\/p>",
            "sources": [
              {
                "name": "BBC News",
                "url": "https://www.bbc.co.uk/news/articles/c6vgxkvl4w5eo"

              {

            ]
          },
          {
            "headline": "Energy: Russian diesel sails as oil hits a six-month high",
            "body": "<p>Promise: lower energy prices. What was done: the first 40,000-tonne cargo of Russian diesel under the President’s deal with Putin is bound for New York, arriving around Nov. 7, on top of Thursday’s Defense Production Act order for refining. Real impact: Brent settled at 116.72 dollars Friday, so relief at the pump has not arrived. Room for disagreement: the President says prices “will soon plummet”; skeptics note one cargo is small next to Hormuz disruption.<\/p>",
            "sources": [
              {
                "name": "NBC News",
                "url": "https://www.nbcnews.com/business/energy/russian-diesel-tanker-heads-us-trump-deal-putin-ukraine-war-rcna605187"
              },
              {
                "name": "CNBC",

              {
                "name": "NBC News",
                "url": "https://www.nbcnews.com/politics/trump-administration/live-blog/trump-rally-byron-donalds-florida-live-updates-rcna605134"
              }
            ]
          },
          {
            "headline": "Election integrity: Alaska lawsuit tests a new approach",
            "body": "<p>Promise: secure, trustworthy elections. What was done: the Justice Department sued to keep Alaska from certifying its Senate race unless Sen. Dan Sullivan wins, citing possible confusion with a similarly named candidate. Real impact: none yet; a federal court will decide. Room for disagreement: the department frames it as protecting voters from being misled; conditioning certification on one candidate’s victory is highly unusual and is drawing sharp criticism.<\/p>",
            "sources": [
              {
                "name": "NBC News",
                "url": "https://www.nbcnews.com/politics/trump-administration/live-blog/trump-rally-byron-donalds-florida-live-updates-rcna605134"
              }
            ]
          },
          {
            "headline": "MAHA: “America First” seafood labels and a crackdown on short weights",
            "body": "<p>Promise: honest, healthy food for American families. What was done: the FDA issued draft guidance for “U.S.-Caught” labels and flag graphics on qualifying seafood, and put 11 foreign firms on import alert after finding 46% of sampled imports overstated their weight, some by up to 32.8%, using ice glaze. Real impact: shoppers could soon spot U.S. seafood more easily; comments are invited by Dec. 13. Room for disagreement: fishermen welcome it; the labels are voluntary and still in draft.<\/p>",
            "sources": [
              {
                "name": "HHS",
                "url": "https://www.hhs.gov/press-room/fda-advances-america-first-seafood-strategy-us-origin-labeling.html"
              }
            ]
          },
          {
            "headline": "Lower costs: the housing order moves to the regulators",
            "body": "<p>Promise: make homeownership affordable. What was done: this week’s order directs the FHFA to pilot cancelling mortgage insurance for borrowers with enough equity and make title-insurance waivers on refinances permanent. Real impact: savings depend on how quickly Fannie Mae and Freddie Mac carry it out. Room for disagreement: builders welcome it; some economists say high rates still dominate costs.<\/p>",
            "sources": [
              {

              },
              {
                "name": "White House",

              }
            ]
          },
          {
            "headline": "MAHA: the Alzheimer’s prevention plan, unveiled in Florida",
            "body": "<p>Promise: prevent chronic disease, not just treat it. What was done: Secretary Kennedy and Dr. Oz unveiled the national Alzheimer’s plan at Broward Health, with an FDA prevention accelerator and up to 48.8 million dollars from ARPA-H for earlier detection. Real impact: research grants first, patient benefits later. Room for disagreement: advocates want more funding for caregivers now.<\/p>",

                "name": "WLRN",

            "body": "<p>SpaceX shares closed at 147.49 dollars, up 1.89%, after Phillip Securities jumped from Sell to Buy and tripled its target from 75 to 250 dollars, citing the Super Intelligence unit’s 7.6 billion dollars in third-quarter sales. Reports that SpaceX is negotiating leases on at least 80,000 U.S. cell towers weighed on telecom stocks. Tesla slipped 0.6% to close at 372.22.<\/p>",

            "headline": "Merger math: what a Tesla–SpaceX deal would need",
            "body": "<p>CNBC lays out the hurdles: Musk holds nearly 80% of SpaceX’s votes but about 19.8% of Tesla, where approval needs a majority of all shares, not just those voting. Analyst Steve Westly expects a proposal, possibly before the elections, and a Chinese security review is a risk given Tesla’s business there. William Blair called the push “all about control.”<\/p>",

          {
            "headline": "SpaceX’s AI unit launches a Grok partner network with 130 companies",
            "body": "<p>SpaceX Super Intelligence, built on xAI, launched a partner program for consultancies and software firms to deploy Grok in businesses; more than 130 companies joined early access, including Nvidia, Snowflake, Databricks, Bain and Booz Allen. The AI unit was SpaceX’s largest revenue line last quarter, at 7.56 billion dollars.<\/p>",

          {
            "headline": "Tesla’s quarter: Megapacks nearly sold out, Optimus production begins",
            "body": "<p>Tesla beat estimates with 28.05 billion dollars in revenue; Megapack orders are nearly sold out for 2027, and Optimus robot production has started in Fremont. Car revenue fell 3%, and NHTSA wants answers on the Cybercab by Oct. 30. Canaccord lifted its target to 442 dollars and Morgan Stanley to 410.<\/p>",

        "stories": [
          {
            "headline": "Starlink 15-15: a fourth try at 6:48 p.m. Eastern",
            "body": "<p>After scrubs on Tuesday, Wednesday and Thursday, SpaceX set a fourth attempt for 27 Starlink satellites from Vandenberg at 6:48 p.m. Eastern tonight. Booster B1063 would become only the second Falcon to fly 36 times, landing on the droneship A Shortfall of Gravitas.<\/p>",

            ]
          },
          {
            "headline": "Next Starship flight eyed for November; New Glenn aims to return",
            "body": "<p>NASA’s Artemis manager Jeremy Parsons said SpaceX is targeting “the November time frame” for the next Starship flight, Blue Origin hopes to restart pad operations in November, with New Glenn’s return to flight soon after.<\/p>",

              {

          {
            "headline": "How many Starship flights for a Moon landing? 22, or 6 to 8",
            "body": "<p>NASA’s safety panel estimates about 22 refuelling flights for the Starship lunar lander; Musk says it will be “more like 6 to 8.” The gap matters, because orbital refuelling is the least-proven step on the path to a 2028 landing.<\/p>",
            "sources": [
              {
                "name": "Ars Technica",
                "url": "https://arstechnica.com/space/2026/10/latest-estimate-for-starship-launches-required-to-support-a-moon-landing-22/"

            ]

          {
            "headline": "Blue Origin plans new Florida pads; Starbase seeks 456 launches a year",
            "body": "<p>Blue Origin plans a 330-million-dollar Cape Canaveral expansion with two new pads by mid-2027, though New Glenn has not flown since a May test explosion. The FAA is reviewing SpaceX’s plan for up to 456 Starship launches a year from Texas, with comments due Nov. 30.<\/p>",

        "stories": [
          {
            "headline": "Artemis III on track for summer 2027; Moon landing still 2028",
            "body": "<p>Administrator Jared Isaacman said NASA will stack the SLS boosters with the core stage this month, run a tanking test by year’s end and launch Artemis III between about May and September 2027. The two-week Earth-orbit mission sends four astronauts to dock first with Blue Origin’s Blue Moon test lander, with two crew entering it, and then with a Starship test article for about two hours. Artemis IV, the first landing since Apollo, stays set for 2028, with the lander not yet chosen.<\/p>",

              {

          },
          {
            "headline": "NASA moving fast toward a Moon base",
            "body": "<p>AP reports the agency is moving fast on plans for a Moon base alongside the landings. Parsons said both lander providers, SpaceX and Blue Origin, plan Moon landings in 2028, and the Artemis III flight will also test the new lunar spacesuits.<\/p>",
            "sources": [
              {

          {
            "headline": "Safety panel warns NASA could lose crew access to orbit",
            "body": "<p>NASA’s Aerospace Safety Advisory Panel warned the agency risks losing human access to low Earth orbit, given Crew Dragon’s expected retirement and uncertainty over commercial space stations. It also flagged “numerous firsts” in the Moon-landing plan.<\/p>",
            "sources": [
              {
                "name": "SpaceNews",
                "url": "https://spacenews.com/nasa-safety-advisers-warn-agency-risks-losing-crewed-access-to-leo/"

          },
          {
            "headline": "NASA Science overhauls how it picks missions",
            "body": "<p>Science chief Nicola Fox announced “Competition Model 2.0,” which judges proposals on science first and cuts selection time by up to 45%, from about 35 months to 19.5. Goddard and JPL will lead implementation studies, and a town hall is set for Monday, Oct. 26, at 2 p.m. Eastern.<\/p>",

                "url": "https://science.nasa.gov/directorates/smd/faster-to-science-a-letter-to-the-science-community/"
              }
            ]

          {
            "headline": "Roman nears science; X-59 gets a new pilot",
            "body": "<p>The Nancy Grace Roman Space Telescope has entered its final commissioning phase, and NASA pilot Mike Lippert flew the low-boom supersonic X-59 for the first time, reaching Mach 1.4 at 55,000 feet. Psyche is now thrusting steadily toward its metal asteroid, due in 2029.<\/p>",

                "name": "Vatican News",

          {

            "headline": "Countdown to the Kingdom: two new posts dated Oct. 23",
            "body": "<p>Checked this evening: Countdown to the Kingdom’s newest posts are both dated Friday, Oct. 23. “The Suicide of the West” links Mark Mallett’s latest reflection at The Now Word on the state of Western civilization. “Defending Your Family” shares a reflection by Brian Kravec built on Fatima seer Sr. Lúcia’s letter to Cardinal Carlo Caffarra: “the decisive battle between the kingdom of Christ and Satan will be over marriage and the family… But do not be afraid, because Our Lady has already crushed his head.”<\/p><p>The thread this week runs from Pedro Regis’s warnings of “a great war” (Oct. 20) and of one “who opposes Christ” (Oct. 21) to these practical calls to guard the home. Read soberly, the counsel is concrete: family prayer, the sacraments, and fidelity in marriage.<\/p>",

            "body": "<p>Promise: prevent chronic disease, not just treat it. What was done: Secretary Kennedy, CMS chief Dr. Mehmet Oz and Sen. Rick Scott unveiled the 2026 national Alzheimer’s plan at Broward Health, with an FDA Alzheimer’s Prevention Accelerator and up to 48.8 million dollars from ARPA-H for earlier detection. Kennedy tied dementia to blood pressure, diabetes, obesity and inactivity. Real impact: about 7.4 million Americans live with dementia, and Florida is among the hardest-hit states; results will take years to measure.<\/p>",
            "sources": [
              {
                "name": "WLRN",
                "url": "https://www.wlrn.org/health/2026-10-22/rfk-jr-dr-oz-visit-broward-health-to-outline-new-federal-alzheimers-initiative"
              },
              {
                "name": "HHS",
                "url": "https://www.hhs.gov/press-room/hhs-unveils-national-plan-alzheimers-dementia-prevention-care.html"
              }
            ]
          },
          {
            "headline": "Bring Americans home: Hubbard is back on U.S. soil",
            "body": "<p>Promise: bring wrongfully detained Americans home. What was done: Stephen Hubbard, freed by Putin during envoy Witkoff’s visit, landed at Joint Base San Antonio-Lackland last night; Trump says there was “no swap.” Real impact: a 74-year-old held more than four years is home. Room for disagreement: Kyiv says the gesture came as Washington eased sanctions on Russian diesel.<\/p>",
            "sources": [
              {
                "name": "KSAT",
                "url": "https://www.ksat.com/news/local/2026/10/22/american-released-from-russian-custody-lands-at-joint-base-san-antonio-lackland/"
              },
              {
                "name": "CBS News",
                "url": "https://www.cbsnews.com/news/russia-stephen-hubbard-freed-american-ukraine-war-witkoff-putin/"
              }
            ]
          },
          {
            "headline": "Ending the war: talks are set, but cluster warheads hit Kyiv",
            "body": "<p>Promise: end the war in Ukraine. What was done: after Witkoff’s three hours with Putin, Russia agreed to three-way talks after Nov. 10, and Trump called it “the closest we’ve been.” Real impact so far: none on the ground; Zelensky says Russia used cluster warheads on Kyiv overnight, and the Kremlin says the new proposals lack substance. Room for disagreement: Congress is pushing back on the sanctions relief offered to draw Moscow in.<\/p>",
            "sources": [
              {
                "name": "CBS News",
                "url": "https://www.cbsnews.com/news/zelenskyy-russia-cluster-warheads-deadly-strikes-hours-after-us-prisoner-release/"
              },
              {
                "name": "The Guardian",
                "url": "https://www.theguardian.com/world/2026/oct/22/ukraine-war-briefing-peace-proposals-lack-substance-witkoff-putin-meeting"
              }
            ]
          },
          {
            "headline": "MAHA: the women’s health order is now in the Federal Register",
            "body": "<p>Promise: put women’s health and chronic disease at the center of federal research. What was done: the executive order creating an NIH Women’s Health Division within 90 days and a White House task force co-chaired by Secretary Kennedy and chief of staff Susie Wiles was published today. Real impact: still to come; the test is funding and whether research on menopause, maternal health and sex differences actually grows.<\/p>",
            "sources": [
              {
                "name": "HHS",
                "url": "https://www.hhs.gov/press-room/trump-flotus-womens-health-executive-order-new-nih-division.html"
              },
              {
                "name": "White House fact sheet",
                "url": "https://www.whitehouse.gov/fact-sheets/2026/10/fact-sheet-president-donald-j-trump-and-first-lady-melania-trump-advance-womens-health-to-improve-outcomes-in-all-phases-of-life/"
              }
            ]
          },
          {
            "headline": "Securing the border: Big Bend wall fight reaches the Supreme Court",
            "body": "<p>Promise: finish the wall. What was done: the administration asked the justices to let construction resume in Big Bend National Park after a judge blocked it over environmental and historic-preservation waivers. Real impact: work stays paused until the Court acts. Room for disagreement: Texans on both sides of the aisle have objected to building in the park.<\/p>",
            "sources": [
              {
                "name": "Al Jazeera",
                "url": "https://www.aljazeera.com/news/2026/10/22/trump-administration-seeks-supreme-court-approval-to-build-big-bend-wall"
              },
              {
                "name": "Washington Post",
                "url": "https://www.washingtonpost.com/politics/2026/10/21/trump-officials-ask-supreme-court-let-border-security-project-resume-national-park/"
              }
            ]
          },
          {
            "headline": "MAHA: HHS launches a national kidney-care plan focused on prevention",
            "body": "<p>Promise: tackle chronic disease at the root. What was done: HHS Secretary Robert F. Kennedy Jr. on Tuesday launched a Kidney Care National Plan built on Trump’s 2019 executive order, aiming to detect kidney disease earlier, expand home dialysis and competition, and make living donation easier. About 37 million American adults have kidney disease, most without knowing it. Real impact so far: HHS’s own analysis credits the 2019 order with about 2,000 extra transplants a year; the new plan is a strategy, so funding and rules will tell.<\/p>",
            "sources": [
              {
                "name": "HHS: Kidney Care National Plan",
                "url": "https://www.hhs.gov/press-room/hhs-launches-kidney-care-national-plan.html"
              },
              {

              }
            ]

            "headline": "Tesla closes down 3.1% at $374.58 as analysts split",

            "headline": "Optimus production starts in Fremont; FSD subscriptions hit 1.74 million",
            "body": "<p>Tesla says Optimus robot production has begun at Fremont, with Musk estimating at least a year to reach 20,000 a week, and a demo video in about a month. The Austin Cybercab fleet has grown tenfold, but NHTSA wants answers to 21 questions on the steering-wheel-free car by Oct. 30.<\/p>",

            "headline": "SpaceX: revenue up 161% on its AI cloud business",
            "body": "<p>SpaceX’s third quarter brought $14.6 billion in revenue and $4.4 billion in net income, led by its “Super Intelligence” compute unit, built on xAI, at $7.56 billion, and Starlink. It guided to $33–37 billion for the first quarter of 2027, far above estimates; Nasdaq futures were down almost 2% this morning amid the AI selloff.<\/p>",

        "title": "Space industry",
        "headline": "Starlink flies tonight; Moon lander may need 22 flights.",
        "stories": [
          {
            "headline": "Starlink 15-15 flies tonight on a 36-flight booster",
            "body": "<p>After two delays, the Falcon 9 carrying 27 Starlink satellites from Vandenberg is set for 6:51 p.m. Eastern tonight. Booster B1063 is making its 36th flight, only the second Falcon first stage to reach that mark, with a droneship landing planned in the Pacific.<\/p>",
            "sources": [
              {
                "name": "Next Spaceflight",
                "url": "https://www.nextspaceflight.com/launches/details/8432/"
              },
              {
                "name": "Spaceflight Now",
                "url": "https://spaceflightnow.com/2026/10/20/live-coverage-spacex-to-launch-27-starlink-satellites-on-falcon-9-rocket-from-vandenberg-sfb-5/"
              }
            ]
          },
          {
            "headline": "How many Starship flights to land on the Moon? NASA’s panel says 22",
            "body": "<p>At NASA’s safety panel meeting today, former astronaut Charlie Precourt said the latest estimate for refueling flights for the Starship lunar lander is “around 22.” Musk replied on X that the number is “way too high” and will be “more like 6 to 8.” Even at twice-weekly launches, 22 flights would take about three months.<\/p>",
            "sources": [
              {
                "name": "Ars Technica",
                "url": "https://arstechnica.com/space/2026/10/latest-estimate-for-starship-launches-required-to-support-a-moon-landing-22/"
              }
            ]
          },
          {
            "headline": "Blue Origin plans two new Florida pads; Starbase seeks 456 launches a year",
            "body": "<p>Blue Origin plans a 330-million-dollar Cape Canaveral expansion adding two launch and landing pads by mid-2027; New Glenn has not flown since a May hot-fire explosion. The FAA is reviewing SpaceX’s plan for up to 456 Starship launches a year from Starbase, with public comments due Nov. 30.<\/p>",
            "sources": [
              {
                "name": "Space Foundation",
                "url": "https://www.spacefoundation.org/2026/10/21/washington-updates-boosting-starship-cadence/"
              }
            ]
          },
          {
            "headline": "SpaceX will try to catch both booster and ship on Starship’s next flight",
            "body": "<p>Ars Technica reports that SpaceX plans to catch Starship itself, not just the Super Heavy booster, on the next flight, aiming for a much faster launch cadence; the company cites “significant constructive engagement with the FAA.”<\/p>",
            "sources": [
              {
                "name": "SpaceNexus Daily",
                "url": "https://spacenexus.us/briefing/2026-10-22"
              },
              {
                "name": "KeepTrack space brief",
                "url": "https://keeptrack.space/space-brief/space-brief-2026-10-21"
              }
            ]
          },
          {
            "headline": "Artemis II’s Jeremy Hansen becomes Canada’s special adviser on space",
            "body": "<p>Prime Minister Mark Carney appointed astronaut Jeremy Hansen, who flew around the Moon on Artemis II in April and has just retired from the Canadian Space Agency, as special adviser on space to him and Industry Minister Mélanie Joly. Hansen will help write a new national space strategy focused on sovereignty and security. The same day, Defence Minister David McGuinty announced a 20-million-dollar agreement for a launch complex in southern Newfoundland, adding to one in Nova Scotia, so Canada can put critical satellites up without relying on foreign rockets.<\/p>",
            "sources": [
              {
                "name": "CBC News (Canadian Press)",
                "url": "https://www.cbc.ca/news/politics/jeremy-hansen-carney-special-adviser-9.7390754"
              }
            ]
          },
          {
            "headline": "China launches a Ceres-1 from a ship in the Yellow Sea",
            "body": "<p>Late Tuesday Eastern time, Galactic Energy launched a Ceres-1 solid rocket from the Dongfang Hangtiangang launch ship off Rizhao, Shandong, carrying the first pathfinder satellite for the Guangzhou-backed Wuyang remote-sensing constellation, which will fly in low-inclination orbits. Sea launches let China reach orbits that are hard to hit from its inland pads.<\/p>",
            "sources": [
              {
                "name": "SpaceNews: Ceres-1 sea launch",
                "url": "https://spacenews.com/ceres-1-sea-launch-lofts-first-satellite-for-low-inclination-wuyang-remote-sensing-constellation/"
              }
            ]
          }

        "title": "NASA",
        "headline": "Safety panel flags Moon risks; Roman nears science.",
        "stories": [
          {
            "headline": "Safety panel flags “numerous firsts” for the Moon landing",
            "body": "<p>NASA’s Aerospace Safety Advisory Panel warned today that Artemis IV carries “a large number of firsts that reduce the likelihood of mission success,” chief among them repeated fueling of the lander in orbit. Panel member Charlie Precourt praised Administrator Jared Isaacman’s push to clear schedule barriers; NASA still aims for a crewed landing in 2028.<\/p>",
            "sources": [
              {
                "name": "Ars Technica",
                "url": "https://arstechnica.com/space/2026/10/latest-estimate-for-starship-launches-required-to-support-a-moon-landing-22/"
              }
            ]
          },
          {
            "headline": "Roman Space Telescope enters its final commissioning phase",
            "body": "<p>NASA says the Nancy Grace Roman Space Telescope has finished checkout and begun final science commissioning, with test images performing well in crowded star fields and dusty regions. Hubble’s gravitational-lens observations are helping prepare Roman’s dark-matter science.<\/p>",
            "sources": [
              {
                "name": "NASA Science",
                "url": "https://science.nasa.gov/blogs/roman/2026/10/22/nasas-roman-space-telescope-enters-final-commissioning-phase/"
              },
              {
                "name": "NASA Science",
                "url": "https://science.nasa.gov/missions/hubble/nasas-hubble-charts-path-for-roman-with-gravitational-lenses/"
              }
            ]
          },
          {
            "headline": "Psyche thrusts toward the asteroid belt; X-59 gets a new pilot",
            "body": "<p>After its Mars flyby, the Psyche spacecraft has begun nearly continuous electric thrusting toward its metal-rich asteroid, arriving in summer 2029. And NASA test pilot Mike Lippert flew the X-59, built to make a soft sonic “thump,” for the first time, reaching Mach 1.4 at 55,000 feet.<\/p>",
            "sources": [
              {
                "name": "NASA Science",
                "url": "https://science.nasa.gov/blogs/psyche/2026/10/22/pedal-to-the-metal-nasas-psyche-heads-toward-asteroid-belt/"
              },
              {
                "name": "NASA",
                "url": "https://www.nasa.gov/blogs/quesst/2026/10/22/nasas-mike-lippert-takes-controls-of-x-59-for-first-time/"
              }
            ]
          },
          {
            "headline": "Artemis update Friday at Kennedy",
            "body": "<p>Administrator Jared Isaacman and Artemis leaders brief at Kennedy Space Center on Friday at 2 p.m. on speeding toward a crewed Moon landing by 2028, with Artemis III now planned as a 2027 docking test in Earth orbit.<\/p>",
            "sources": [
              {
                "name": "The Florida Press: Artemis briefing",
                "url": "https://www.thefloridapress.com/news/nasa-leaders-to-update-artemis-acceleration-and-2028-moon-landing-plan-at-kenned"
              }
            ]
          },
          {
            "headline": "An RS-25 engine fires for nearly 500 seconds for future Artemis rockets",
            "body": "<p>NASA tested RS-25 engine No. 10001 for close to 500 seconds at Stennis Space Center in Mississippi, validating flight components and a new thermal-protection system for the engines that power the Space Launch System on future Artemis missions. Each SLS core stage flies four RS-25s, and this test series supports the newly built engines meant for later Moon flights.<\/p>",
            "sources": [
              {
                "name": "NASA",
                "url": "https://www.nasa.gov/image-article/rs-25-engine-test-in-support-of-future-artemis-missions/"
              }
            ]
          },
          {
            "headline": "SR-1 Freedom, NASA’s nuclear-powered Mars craft, moves ahead",
            "body": "<p>NASA says contract actions are keeping Space Reactor-1 Freedom on track for a late-2028 launch as the first fission-powered spacecraft to travel beyond Earth orbit. Sierra Lobo will build the power-conversion system that turns the Idaho National Laboratory reactor’s heat into electricity for electric propulsion, and the reactor stays off until the craft leaves Earth orbit. At Mars it will deliver SkyFall, three helicopters evolved from Ingenuity, to scout for water.<\/p>",
            "sources": [
              {
                "name": "NASA: SR-1 Freedom advances",
                "url": "https://www.nasa.gov/centers-and-facilities/glenn/sr-1-freedom-advances-with-progress-on-nuclear-power-module/"
              }
            ],
            "why": "The same fission technology is meant to keep a Moon base running through the long lunar night."
          }
        ],

        "id": "catholic",
        "title": "Catholic",
        "headline": "John Paul II relic tonight; Holy See–Honduras accord.",
        "stories": [
          {
            "headline": "Miami: A relic of St. John Paul II for veneration tonight",
            "body": "<p>On the saint’s feast day, the Servants of the Pierced Hearts of Jesus and Mary hold a bilingual Mass with veneration of a relic of St. John Paul II at 7 p.m. tonight at Church of the Little Flower, 2711 Indian Mound Trail, Coral Gables. The same church premieres its new pipe organ Saturday night.<\/p>",
            "sources": [
              {
                "name": "Archdiocese of Miami",
                "url": "https://www.miamiarch.org/CatholicDiocese.php?op=Event_179259611829656"
              }
            ]
          },
          {
            "headline": "Miami: Little Flower inaugurates a new French Romantic pipe organ Saturday",
            "body": "<p>World-renowned organist Nathan Laube will inaugurate the new pipe organ at Church of the Little Flower in Coral Gables on Saturday, Oct. 24, at 7:30 p.m., free and open to all, as part of the parish’s 100th anniversary. A decade in the making, the instrument is designed to recreate the sound St. Thérèse of Lisieux would have heard, and it is the only organ in Southeast Florida with mechanical action. The same weekend brings Emmaus retreats in English and Spanish and the FOCUS 11 vocations rally for sixth-graders on Friday.<\/p>",
            "sources": [
              {
                "name": "Archdiocese of Miami: Coming up this weekend",
                "url": "https://www.miamiarch.org/CatholicDiocese.php?op=Article_archdiocese-of-miami-around-the-archdiocese-coming-up-this-weekend-10-23-2026"
              }
            ],
            "why": "A rare local event for church musicians: mechanical-action organs are almost unknown in South Florida."
          },
          {
            "headline": "Miami: Wenski keeps up his religious-liberty case on school vaccines",
            "body": "<p>Archbishop Thomas Wenski is pressing his dispute with Attorney General James Uthmeier, who warned Catholic schools could lose voucher funding unless they grant religious exemptions to vaccines. Wenski says the Church does not consider those vaccines objectionable, that the schools follow state health guidance, and that parents choosing a Catholic school “expect the Catholic school to be Catholic.” He called the threat “classic bullying” and said it reflects attacks now coming “from the right.”<\/p>",
            "sources": [
              {
                "name": "WUSF: Miami archbishop hits back",
                "url": "https://www.wusf.org/health-news-florida/2026-10-19/miami-archbishop-hits-back-ag-uthmeier-over-catholic-schools-vaccine-rules"
              },
              {
                "name": "WLRN: Between the Lines with Wenski",
                "url": "https://www.wlrn.org/podcast/between-the-lines-with-dara-kam/2026-10-20/archbishop-thomas-wenski-part-i-standing-up-to-uthmeiers-vaccine-bullying"
              }
            ]
          },
          {
            "headline": "Vatican: A new Holy See–Honduras agreement protects the Church’s freedom",
            "body": "<p>Cardinal Parolin and President Nasry Asfura signed a 25-article accord recognizing the Church’s legal status and its freedom to govern itself and carry out its mission. Who they are: Parolin is the Vatican’s secretary of state; Asfura, a former mayor of Tegucigalpa, is Honduras’s president. It enters into force after ratification.<\/p>",
            "sources": [
              {
                "name": "Vatican News",
                "url": "https://www.vaticannews.va/en/vatican-city/news/2026-10/holy-see-honduras-agreement-relations-freedom-religion-church.html"
              },
              {
                "name": "Televisión Nacional de Honduras",
                "url": "https://tnh.gob.hn/television/asfura-firma-acuerdo-con-el-vaticano-sobre-libertad-religiosa-y-cooperacion"
              }
            ]
          },
          {
            "headline": "Vatican: “Venite ad Me” calls the Church back to the first proclamation",
            "body": "<p>The new Doctrine of the Faith document on transmitting the faith says families no longer pass it on “automatically” and asks parishes to evangelize adults, not only catechize children. It notes conversions are rising in some secular places, but many neophytes drift away soon after baptism, so communities must welcome and accompany them. It also calls for more room for women in leading Church processes.<\/p>",
            "sources": [
              {
                "name": "Vatican News",
                "url": "https://www.vaticannews.va/en/vatican-city/news/2026-10/dicastery-doctrine-faith-venite-ad-me-transmission-change.html"
              },
              {
                "name": "Religión Digital",
                "url": "https://www.religiondigital.org/vaticano/doctrina-fe-venite-ad-me-tucho-fernandez-papa-leon-xiv-evangelizacion_1_1470438.html"
              }
            ]
          },
          {
            "headline": "Asia: World Youth Day Seoul opens registration",
            "body": "<p>Pope Leo’s video invitation launched registration for WYD Seoul 2027, Aug. 3–8, under the theme “Take courage! I have overcome the world.” It will be the first World Youth Day in Korea, home to a fast-growing Church founded by lay converts.<\/p>",
            "sources": [
              {
                "name": "Yonhap",
                "url": "https://en.yna.co.kr/view/AEN20261022009900315"
              },
              {
                "name": "WYD Seoul 2027",
                "url": "https://wydseoul.org/en"
              }
            ]
          },
          {
            "headline": "Installation: Bishop Michael Saporito’s Metuchen installation was set for today",
            "body": "<p>Bishop Michael A. Saporito was scheduled to be installed at 1 p.m. today as Bishop of Metuchen, New Jersey, succeeding diocesan administrator Fr. Jonathan Toborowsky. Who he is: until now an auxiliary bishop of Newark, named by Pope Leo on Sept. 15 to lead the 1,425-square-mile central New Jersey diocese. Next in the calendar: Bishop Crispin Varquez is installed in Tagbilaran, Philippines, on Tuesday.<\/p>",
            "sources": [
              {
                "name": "USCCB",
                "url": "https://www.usccb.org/news/2026/pope-leo-xiv-appoints-most-reverend-michael-saporito-bishop-metuchen"
              },
              {
                "name": "Catholic-Hierarchy",
                "url": "https://catholic-hierarchy.org/events/b2026e.html"
              }
            ]
          },
          {
            "headline": "Appointment: Fr. Leandro Machado Silvestre named bishop of Guajará-Mirim, Brazil",
            "body": "<p>Pope Leo on Wednesday named Fr. Leandro Machado Silvestre, 48, bishop of Guajará-Mirim, an Amazon diocese on the Bolivian border in Rondônia. Who he is: a priest of Mogi das Cruzes, near São Paulo, ordained in 2004, a longtime seminary rector, and since 2023 a <em>fidei donum<\/em> missionary priest in Porto Velho, where he is a pastor, spiritual director of the major seminary and, since January, vicar general.<\/p>",
            "sources": [
              {
                "name": "Holy See Press Office: Resignations and Appointments, Oct. 21",
                "url": "https://press.vatican.va/content/salastampa/en/bollettino/pubblico/2026/10/21/261021d.html"
              }
            ]
          },

            "headline": "Appointment: Bishop Ignatius Ding Zuyao ordained for Haimen, China",

            "body": "<p>Prime Minister Mark Carney appointed astronaut Jeremy Hansen, who flew around the Moon on Artemis II in April and has just retired from the Canadian Space Agency, as special adviser on space to him and Industry Minister Mélanie Joly. Hansen will help write a new national space strategy focused on sovereignty and security. The same day, Defence Minister David McGuinty announced a 20-million-dollar agreement for a launch complex in southern Newfoundland, adding to one in Nova Scotia, so Canada can put critical satellites up without relying on foreign rockets.<\/p>",

          {
            "headline": "An RS-25 engine fires for nearly 500 seconds for future Artemis rockets",
            "body": "<p>NASA tested RS-25 engine No. 10001 for close to 500 seconds at Stennis Space Center in Mississippi, validating flight components and a new thermal-protection system for the engines that power the Space Launch System on future Artemis missions. Each SLS core stage flies four RS-25s, and this test series supports the newly built engines meant for later Moon flights.<\/p>",

          {
            "headline": "Artemis update Friday at Kennedy",
            "body": "<p>Administrator Jared Isaacman and Artemis leaders brief at Kennedy Space Center on Friday at 2 p.m. on speeding toward a crewed Moon landing by 2028, with Artemis III now planned as a 2027 docking test in Earth orbit.<\/p>",
            "sources": [
              {
                "name": "The Florida Press: Artemis briefing",

          {
            "headline": "SR-1 Freedom, NASA’s nuclear-powered Mars craft, moves ahead",
            "body": "<p>NASA says contract actions are keeping Space Reactor-1 Freedom on track for a late-2028 launch as the first fission-powered spacecraft to travel beyond Earth orbit. Sierra Lobo will build the power-conversion system that turns the Idaho National Laboratory reactor’s heat into electricity for electric propulsion, and the reactor stays off until the craft leaves Earth orbit. At Mars it will deliver SkyFall, three helicopters evolved from Ingenuity, to scout for water.<\/p>",
            "sources": [
              {
                "name": "NASA: SR-1 Freedom advances",
                "url": "https://www.nasa.gov/centers-and-facilities/glenn/sr-1-freedom-advances-with-progress-on-nuclear-power-module/"
              }
            ],
            "why": "The same fission technology is meant to keep a Moon base running through the long lunar night."
          },
          {
            "headline": "The final two solar-array spacewalks are set for Oct. 29 and Nov. 5",
            "body": "<p>NASA astronaut Anil Menon and the Canadian Space Agency’s Joshua Kutryk will install the space station’s last two roll-out solar arrays on spacewalks 100 and 101, finishing a multi-year power upgrade. Meanwhile, two NASA-funded satellite-relay demonstrations that rode Bandwagon-5 on Monday are checking out in orbit.<\/p>",
            "sources": [
              {
                "name": "NASA: Spacewalk preps keep crew busy",
                "url": "https://www.nasa.gov/blogs/spacestation/2026/10/20/blood-vessel-printing-cancer-research-and-spacewalk-preps-keep-crew-busy/"

            ]
          },
          {
            "headline": "Stephen Cash returns to lead Marshall Space Flight Center",
            "body": "<p>NASA named veteran engineer Stephen Cash director of Marshall Space Flight Center in Huntsville, Alabama, effective Oct. 19. Cash, a University of Alabama graduate who previously worked at Marshall and then in the aerospace industry, succeeds acting director Rae Ann Meyer, who returns to her deputy role.<\/p>",
            "sources": [
              {
                "name": "NASA: Stephen Cash named Marshall director",

          {
            "headline": "JPL marks 90 years by looking to its next missions",
            "body": "<p>NASA’s Jet Propulsion Laboratory, founded in 1936, marked its 90th anniversary by pointing to what comes next, including the SkyFall Mars helicopters, MoonFall, the SunRISE radio-astronomy smallsats and the NEO Surveyor asteroid-hunting telescope. Separately, NASA highlighted CASALS, a lidar instrument designed to fill gaps in 3D maps of Earth’s surface.<\/p>",

        "stories": [
          {
            "headline": "Miami: Little Flower inaugurates a new French Romantic pipe organ Saturday",
            "body": "<p>World-renowned organist Nathan Laube will inaugurate the new pipe organ at Church of the Little Flower in Coral Gables on Saturday, Oct. 24, at 7:30 p.m., free and open to all, as part of the parish’s 100th anniversary. A decade in the making, the instrument is designed to recreate the sound St. Thérèse of Lisieux would have heard, and it is the only organ in Southeast Florida with mechanical action. The same weekend brings Emmaus retreats in English and Spanish and the FOCUS 11 vocations rally for sixth-graders on Friday.<\/p>",

                "name": "Archdiocese of Miami: Coming up this weekend",

            "why": "A rare local event for church musicians: mechanical-action organs are almost unknown in South Florida."
          },
          {
            "headline": "Miami: Wenski keeps up his religious-liberty case on school vaccines",
            "body": "<p>Archbishop Thomas Wenski is pressing his dispute with Attorney General James Uthmeier, who warned Catholic schools could lose voucher funding unless they grant religious exemptions to vaccines. Wenski says the Church does not consider those vaccines objectionable, that the schools follow state health guidance, and that parents choosing a Catholic school “expect the Catholic school to be Catholic.” He called the threat “classic bullying” and said it reflects attacks now coming “from the right.”<\/p>",

              {
                "name": "WUSF: Miami archbishop hits back",

                "name": "WLRN: Between the Lines with Wenski",
                "url": "https://www.wlrn.org/podcast/between-the-lines-with-dara-kam/2026-10-20/archbishop-thomas-wenski-part-i-standing-up-to-uthmeiers-vaccine-bullying"

            ]

          {
            "headline": "Vatican: “Venite ad Me” calls the Church back to the first proclamation",
            "body": "<p>The new Doctrine of the Faith document on transmitting the faith says families no longer pass it on “automatically” and asks parishes to evangelize adults, not only catechize children. It notes conversions are rising in some secular places, but many neophytes drift away soon after baptism, so communities must welcome and accompany them. It also calls for more room for women in leading Church processes.<\/p>",
            "sources": [
              {
                "name": "Vatican News",
                "url": "https://www.vaticannews.va/en/vatican-city/news/2026-10/dicastery-doctrine-faith-venite-ad-me-transmission-change.html"

            ]
          },
          {
            "headline": "Asia: World Youth Day Seoul opens registration",
            "body": "<p>Pope Leo’s video invitation launched registration for WYD Seoul 2027, Aug. 3–8, under the theme “Take courage! I have overcome the world.” It will be the first World Youth Day in Korea, home to a fast-growing Church founded by lay converts.<\/p>",

              {

              }
            ]

          {
            "headline": "Installation: Bishop Michael Saporito takes the chair in Metuchen today",
            "body": "<p>Bishop Michael A. Saporito is installed today at 1 p.m. as Bishop of Metuchen, New Jersey. Who he is: until now an auxiliary bishop of Newark, named by Pope Leo on Sept. 15 to lead the 1,425-square-mile central New Jersey diocese.<\/p>",
            "sources": [
              {

              {
                "name": "Diocese of Metuchen",

          {
            "headline": "Appointment: Fr. Leandro Machado Silvestre named bishop of Guajará-Mirim, Brazil",
            "body": "<p>Pope Leo on Wednesday named Fr. Leandro Machado Silvestre, 48, bishop of Guajará-Mirim, an Amazon diocese on the Bolivian border in Rondônia. Who he is: a priest of Mogi das Cruzes, near São Paulo, ordained in 2004, a longtime seminary rector, and since 2023 a <em>fidei donum<\/em> missionary priest in Porto Velho, where he is a pastor, spiritual director of the major seminary and, since January, vicar general.<\/p>",
            "sources": [
              {
                "name": "Holy See Press Office: Resignations and Appointments, Oct. 21",

            ]

          {
            "headline": "Appointment: Bishop Ignatius Ding Zuyao ordained for Haimen, China",
            "body": "<p>Fr. Ignatius Ding Zuyao, 40, was ordained Bishop of Haimen in Jiangsu Province on Oct. 15, after Pope Leo appointed him Aug. 24 under the Holy See–China Provisional Agreement; the news was reported in Hong Kong’s <em>Sunday Examiner<\/em> today. Who he is: a Haimen priest ordained in 2011, trained at Sheshan and Beijing seminaries, and most recently pastor of Qingnian Donglu Parish in Nantong. Bishop Joseph Shen Bin of Shanghai, his predecessor in Haimen, was principal consecrator before about 400 priests, religious and laypeople.<\/p>",
            "sources": [
              {
                "name": "Sunday Examiner",
                "url": "https://www.examiner.org.hk/2026/10/21/new-bishop-ordained-for-haimen-china/news/china/"

          {
            "headline": "Appointments: Venice, Fla., reshuffles priests; Saporito installs Thursday in Metuchen",
            "body": "<p>In Florida’s Diocese of Venice, effective this week, Fr. David Vidal, longtime pastor of Ave Maria Parish, becomes full-time vicar general, among other moves. In New Jersey, Bishop-designate Saporito is installed Thursday in Metuchen.<\/p>",

      {
        "id": "signs",
        "title": "Signs of the times",
        "headline": "Countdown latest Oct. 21; Marian message Oct. 20; Medjugorje days open.",
        "stories": [
          {
            "headline": "Countdown to the Kingdom: checked this morning, latest post Oct. 21",
            "body": "<p>Checked at dawn: the newest Countdown to the Kingdom post is still Wednesday’s “Pedro – The One Who Opposes Christ,” dated Oct. 21, after Tuesday’s “There Will be a Great War.” Its key line, from an Oct. 13 message, says “He who opposes Christ will act in the world, and my poor children will carry a heavy cross.” The site itself reminds readers that the Church, not the site, is the final judge of private revelation.<\/p>",
            "sources": [
              {
                "name": "Countdown to the Kingdom",
                "url": "https://www.countdowntothekingdom.com/"
              },

                "name": "Countdown: Pedro – The One Who Opposes Christ",
                "url": "https://www.countdowntothekingdom.com/pedro-a-reference-to-antichrist/"

            ]
          },
          {
            "headline": "Marian: the newest message is Oct. 20, a call not to delay conversion",
            "body": "<p>The latest dated Marian message is Tuesday, Oct. 20, 2026, attributed to Our Lady, Queen of Peace, through Pedro Regis in Anguera, Brazil: “You live in a time worse than the time of the Flood… None of my devotees will be lost. This is the time of grace. What you have to do, do not leave for tomorrow.” They are offered here for prayerful discernment, under the Church’s judgment. The next Medjugorje monthly message is expected Sunday, Oct. 25.<\/p>",
            "sources": [
              {
                "name": "Apelos Urgentes (Anguera)",
                "url": "https://apelosurgentes.com.br/pt-br/mensagens/"
              },
              {
                "name": "Medjugorje.org messages",
                "url": "https://www.medjugorje.org/olmmsg.htm"
              }
            ]
          },
          {
            "headline": "Medjugorje: the first Mariological Days open this afternoon",
            "body": "<p>The first Mariological Days in Medjugorje open today at 3 p.m. local time (9 a.m. Eastern) with an address by Archbishop Aldo Cavalli, the Vatican’s apostolic visitor, and run through Oct. 25 with ten theologians revisiting the Second Vatican Council’s teaching on Mary. It is a sign of how the Holy See, after granting its “nihil obstat” to the spiritual fruits of Medjugorje, is anchoring devotion there in sound theology.<\/p>",
            "sources": [
              {
                "name": "Medjugorje.hr",
                "url": "https://medjugorje.hr/en/news/mariological-days-medjugorje/460"
              },
              {
                "name": "Medjugorje.it",
                "url": "https://www.medjugorje.it/medjugorje-quattro-giorni-con-dieci-teologi-per-riscoprire-la-mariologia-conciliare/"
              }
            ]
          },
          {
            "headline": "Returns to the faith: the Vatican confirms conversions are rising",
            "body": "<p>Today’s “Venite ad Me” states plainly that conversions and returns to the Church are increasing in some highly secularized places, and gathers testimonies from people who discovered or rediscovered Jesus in its final chapter. Its warning: too many new Catholics drift away soon after baptism, so parishes must become real communities that walk with them.<\/p>",
            "sources": [
              {
                "name": "Vatican News",
                "url": "https://www.vaticannews.va/en/vatican-city/news/2026-10/dicastery-doctrine-faith-venite-ad-me-transmission-change.html"
              }
            ]
          },
          {
            "headline": "Revival: Ohio State’s 35 baptisms, Fresno State next on Sunday",
            "body": "<p>Ohio State’s Oct. 19 “Invitation to Jesus” event, led by football players, drew nearly 1,000 people and ended with 35 baptisms. It joins this fall’s run of campus revivals: about 100 baptized at Appalachian State’s UniteUS rally, 19 at Pepperdine, 15 at North Georgia, with Fresno State’s Fields of Faith planning baptisms this Sunday.<\/p>",
            "sources": [
              {
                "name": "Sports Spectrum",
                "url": "https://sportsspectrum.com/sport/football/2026/10/21/ohio-state-football-3rd-invitation-jesus-event/"
              },
              {
                "name": "WWJD.com",
                "url": "https://wwjd.com/news/campus-baptisms-fall-2026/"
              },
              {
                "name": "Billy Graham Decision",
                "url": "https://billygraham.org/decision-magazine/articles/spirit-movement-at-appalachian-state-university-worship-rally-includes-100-baptisms-in-plastic-lined-truck-beds"
              }
            ]
          },
          {
            "headline": "Digital ID and money, soberly: EU wallets get payment rules; digital euro debated",
            "body": "<p>The European Payments Council launched SCARLET, a rulebook for using EU Digital Identity Wallets to approve bank logins and payments, with version 1.0 planned for December 2027. EU lawmakers are meanwhile negotiating digital-euro rules on offline payments, anti-money-laundering checks and merchant fees; the ECB plans a pilot in late 2027 and possible issuance in 2029. These are real steps toward linking identity and money, worth watching for privacy and cash protections, not cause for panic.<\/p>",
            "sources": [
              {
                "name": "Biometric Update",
                "url": "https://www.biometricupdate.com/202610/european-payments-council-launches-scarlet-framework-for-eudi-wallet-payments"
              },
              {
                "name": "Agence Europe",
                "url": "https://agenceurope.eu/en/bulletin/article/13964/26/digital-euro-eu-co-legislators-examine-anti-money-laundering-offline-payments-usage-fees"
              },
              {
                "name": "ECB",
                "url": "https://www.ecb.europa.eu/press/key/date/2026/html/ecb.sp261006~0da978f159.en.html"
              }
            ]
          },
          {
            "headline": "False prophecy, judged: Shakahola sentencing set for Nov. 6",
            "body": "<p>Kenya’s conviction of self-styled pastor Paul Mackenzie and 28 associates for the murders of 191 people, 190 of them children whom he told to starve to “meet Jesus,” is a hard reminder of why the Church tests every claimed revelation. His “End Days” sermons called schools and medicine evil. Sentencing is Nov. 6.<\/p>",
            "sources": [
              {
                "name": "BBC: Shakahola verdict",
                "url": "https://www.bbc.com/news/articles/ckd6d2l3dz4xo"
              },
              {
                "name": "Capital FM: Sentencing Nov. 6",
                "url": "https://capitalfm.africa/court-convicts-all-29-shakahola-accused-of-murder-sets-sentencing-for-november-6/"
              }
            ]
          },
          {
            "headline": "Eucharistic: the Cuilapa Host remains under the bishop’s study",
            "body": "<p>In Guatemala, the Diocese of Santa Rosa de Lima is still studying a consecrated Host at Cuilapa’s cathedral that did not dissolve in water and showed reddish stains; it is kept reserved, not displayed, and the parish asks for “prudence and moderation.” In Australia, a Eucharistic miracles exhibit runs in Parramatta through Oct. 25.<\/p>",

            "headline": "Cutting health red tape: big employers join the prior-authorization fix",
            "body": "<p>Promise: make health care work for patients, not paperwork. What was done: HHS, CMS and the Labor Department announced Wednesday that Amazon, Google, Meta, Oracle and Axon will back extending the 2025 insurer pledge on electronic prior authorization to self-funded employer plans, which cover more than 180 million Americans. “Prior authorization should help patients get the right care, not trap doctors and families in administrative delays,” Secretary Kennedy said. Real impact: promising but voluntary; a federal rule requires electronic prior authorization from certain payers only from Jan. 1, 2027, so watch whether faxes and denials actually drop.<\/p>",

            "headline": "Ending the war: Russia agrees to resume three-way talks after Nov. 10",
            "body": "<p>Promise: end the Ukraine war. What was done: Witkoff’s ninth meeting with Putin produced Moscow’s agreement to restart U.S.–Russia–Ukraine talks after Nov. 10 and plans for a Putin–Trump–Xi summit in Shenzhen. Real impact: a process, not peace; the Kremlin wants talks on a postwar “security framework” and still aims to take the rest of eastern Ukraine. Room for disagreement: critics in Kyiv and Europe say easing sanctions for Russian diesel rewards Moscow before any ceasefire.<\/p>",

            "headline": "Bring Americans home: Hubbard is free after more than four years",
            "body": "<p>Promise: bring wrongfully detained Americans home. What was done: Stephen Hubbard, a retired teacher in his 70s seized in Ukraine in 2022 and sentenced to nearly seven years as a “mercenary,” a charge he always denied, was released as Witkoff arrived, a day after Trump asked for it. Witkoff thanked Putin, saying Hubbard’s son is a Greek Orthodox priest. Real impact: a sick, elderly man is going home to his family. Room for disagreement: the release was folded into a meeting where Putin praised the diesel deal Kyiv opposes.<\/p>",

            "headline": "Securing the border: the administration asks the Supreme Court to restart Big Bend work",
            "body": "<p>Promise: secure the southern border. What was done: the administration asked the justices Wednesday to lift a Texas judge’s Oct. 14 injunction on a 1.7-billion-dollar road, camera, sensor and vehicle-barrier project along more than 500 miles in and around Big Bend National Park; it says the halt leaves “a quarter of the southern border” exposed. Real impact, and disagreement: the sector saw more than 89,000 apprehensions from 2021 to 2025, but opponents, including a bipartisan group of lawmakers, say it accounts for about 2% of apprehensions and that waiving environmental laws threatens a national treasure.<\/p>",

            "headline": "MAHA: HHS launches a national kidney-care plan focused on prevention",
            "body": "<p>Promise: tackle chronic disease at the root. What was done: HHS Secretary Robert F. Kennedy Jr. on Tuesday launched a Kidney Care National Plan built on Trump’s 2019 executive order, aiming to detect kidney disease earlier, expand home dialysis and competition, and make living donation easier. About 37 million American adults have kidney disease, most without knowing it. Real impact so far: HHS’s own analysis credits the 2019 order with about 2,000 extra transplants a year; the new plan is a strategy, so funding and rules will tell.<\/p>",

            "headline": "Tesla beats on profit and cash, cuts its spending plan to $20 billion",
            "body": "<p>Tesla’s third-quarter revenue was about flat at $28.0 billion, slightly below forecasts, and GAAP net income fell roughly 44% to $787 million, hit partly by marking down its SpaceX and Bitcoin holdings. But adjusted earnings of 48 cents a share beat estimates, gross margin was 19.6%, and free cash flow was a positive $1.5 billion when Wall Street feared heavy cash burn, because capital spending was $4.7 billion against about $7.8 billion expected. The CFO cut 2026 capex guidance to about $20 billion from more than $25 billion and said Tesla secured $30 billion of shorter-term debt for future spending. Shares rose about 1.5% to 1.7% after hours.<\/p>",

            "body": "<p>Musk said the Austin Cybercab fleet has grown tenfold since launch and unsupervised miles grew eightfold in the quarter; Tesla’s self-driving chief, Ashok, said Dallas is next, with other cities before year-end, and unsupervised self-driving in customer cars around the second quarter of 2027. Optimus has begun initial production in Fremont, but Musk asked investors to “temper expectations,” saying it will take about a year to reach 20,000 a week and outside customers come around the end of 2027. Tesla has its largest car backlog in four years, limited by batteries, and FSD is on over 75% of new North American deliveries. Analysts were told no merger questions would be taken.<\/p>",
