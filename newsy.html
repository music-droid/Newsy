  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Short, bounded news briefings — not a news portal.">
  <meta name="color-scheme" content="light">
  <meta name="theme-color" content="#6b4f3a">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Newsy">

  <!-- Self-contained offline reader. PWA install (Add to Home Screen) needs the
       multi-file HTTPS deploy (index.html + manifest + sw.js + icons). Service
       workers do not run from file://. See HOME-SCREEN.md. -->
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400;600&family=Source+Serif+4:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
  <style>
/* Newsy — calm briefings, not a news portal */
:root {
  --bg: #f7f3ec;
  --bg-soft: #f0eae0;
  --ink: #2c2925;
  --ink-muted: #5c564e;
  --ink-faint: #8a8278;
  --accent: #6b4f3a;
  --accent-soft: #c4a882;
  --rule: #e0d6c8;
  --chip: #fffdf9;
  --chip-active: #6b4f3a;
  --chip-active-ink: #f7f3ec;
  --link: #4a6b5a;
  --link-hover: #355244;
  --max: 38rem;
  --font: "Source Serif 4", "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif;
  --font-ui: "Source Sans 3", "Segoe UI", system-ui, -apple-system, sans-serif;
}

*,
*::before,
*::after {
  box-sizing: border-box;
}

html {
  font-size: 112.5%; /* ~18px */
  -webkit-text-size-adjust: 100%;
}

body {
  margin: 0;
  min-height: 100vh;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font);
  line-height: 1.65;
  font-weight: 400;
}

a {
  color: var(--link);
  text-decoration-thickness: 1px;
  text-underline-offset: 0.15em;
}

a:hover {
  color: var(--link-hover);
}

.wrap {
  width: min(100% - 2rem, var(--max));
  margin-inline: auto;
  padding-block: 2rem 4rem;
}

/* Header */
.site-header {
  border-bottom: 1px solid var(--rule);
  padding-bottom: 1.25rem;
  margin-bottom: 1.75rem;
}

.brand {
  font-family: var(--font-ui);
  font-size: 0.75rem;
  font-weight: 600;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: var(--accent);
  margin: 0 0 0.35rem;
}

.briefing-title {
  font-size: clamp(1.45rem, 4vw, 1.85rem);
  font-weight: 600;
  line-height: 1.25;
  margin: 0 0 0.25rem;
  letter-spacing: -0.01em;
}

.meta {
  font-family: var(--font-ui);
  font-size: 0.85rem;
  color: var(--ink-muted);
  margin: 0;
}

/* Picker — compact "Briefings" select (native wheel on iPhone) */
.picker {
  display: flex;
  align-items: center;
  gap: 0.75rem;
  margin: 0 0 1.75rem;
}

.picker-label {
  font-family: var(--font-ui);
  font-size: 0.7rem;
  font-weight: 600;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--ink-faint);
  margin: 0;
  flex: 0 0 auto;
}

.select-wrap {
  position: relative;
  flex: 1 1 auto;
  max-width: 16rem;
}

.select-wrap::after {
  content: "";
  position: absolute;
  right: 1rem;
  top: 50%;
  width: 0.5rem;
  height: 0.5rem;
  border-right: 2px solid var(--accent, #6b4f3a);
  border-bottom: 2px solid var(--accent, #6b4f3a);
  transform: translateY(-70%) rotate(45deg);
  pointer-events: none;
}

.briefing-select {
  -webkit-appearance: none;
  appearance: none;
  width: 100%;
  min-height: 44px;
  font-family: var(--font-ui);
  font-size: 1rem; /* 16px+ keeps iOS Safari from zooming on focus */
  font-weight: 600;
  color: var(--accent, #6b4f3a);
  background: var(--chip);
  border: 1.5px solid var(--accent, #6b4f3a);
  border-radius: 999px;
  padding: 0.5rem 2.5rem 0.5rem 1.1rem;
  cursor: pointer;
  transition: background 0.15s ease, box-shadow 0.15s ease;
}

.briefing-select:hover {
  background: #f7f1e8;
}

.briefing-select:focus-visible {
  outline: none;
  box-shadow: 0 0 0 3px rgba(107, 79, 58, 0.25);
}

/* Beats */
.beats {
  display: flex;
  flex-direction: column;
  gap: 2rem;
}

.beat {
  padding-top: 0.25rem;
}

.beat-title {
  font-size: 1.05rem;
  font-weight: 600;
  margin: 0 0 0.65rem;
  padding-bottom: 0.4rem;
  border-bottom: 1px solid var(--rule);
  color: var(--accent);
  letter-spacing: 0.01em;
}

.beat-body {
  margin: 0;
}

.beat-body p {
  margin: 0 0 0.85rem;
}

.beat-body p:last-child {
  margin-bottom: 0;
}

.sources {
  margin-top: 0.85rem;
  padding-top: 0.55rem;
  border-top: 1px dotted var(--rule);
  font-family: var(--font-ui);
  font-size: 0.8rem;
  color: var(--ink-muted);
  line-height: 1.55;
}

.sources-label {
  font-weight: 600;
  color: var(--ink-faint);
  margin-right: 0.35rem;
}

.sources a {
  word-break: break-word;
}

.sources .sep {
  color: var(--ink-faint);
  margin: 0 0.3rem;
}

.sources .name-only {
  color: var(--ink-muted);
}

/* Status / empty */
.status {
  font-family: var(--font-ui);
  font-size: 0.9rem;
  color: var(--ink-muted);
  padding: 1.5rem 0;
}

.site-footer {
  margin-top: 3rem;
  padding-top: 1rem;
  border-top: 1px solid var(--rule);
  font-family: var(--font-ui);
  font-size: 0.75rem;
  color: var(--ink-faint);
}

.site-footer p {
  margin: 0;
}


/* Podcast player */
.podcast {
  margin-top: 0.85rem;
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 0.65rem 0.85rem;
}

.listen-btn {
  font-family: var(--font-ui);
  font-size: 0.8rem;
  font-weight: 600;
  letter-spacing: 0.04em;
  appearance: none;
  border: 1px solid var(--accent);
  background: var(--accent);
  color: var(--chip-active-ink);
  border-radius: 999px;
  padding: 0.4rem 1rem;
  cursor: pointer;
  transition: background 0.15s ease, color 0.15s ease, border-color 0.15s ease;
}

.listen-btn:hover {
  background: #5a3f2d;
  border-color: #5a3f2d;
}

.listen-btn:focus-visible {
  outline: 2px solid var(--accent-soft);
  outline-offset: 2px;
}

.listen-btn[aria-pressed="true"] {
  background: var(--bg-soft);
  color: var(--accent);
  border-color: var(--accent);
}

.podcast audio {
  flex: 1 1 12rem;
  min-width: 11rem;
  max-width: 100%;
  height: 2.1rem;
  accent-color: var(--accent);
}

@media print {
  .podcast {
    display: none !important;
  }
}

/* Print — quiet page, no chrome clutter */
@media print {
  :root {
    --bg: #fff;
    --ink: #111;
    --ink-muted: #333;
    --rule: #ccc;
    --accent: #333;
    --link: #000;
  }

  body {
    background: #fff;
    font-size: 11pt;
    line-height: 1.5;
  }

  .wrap {
    width: 100%;
    max-width: none;
    padding: 0;
  }

  .picker,
  .site-footer {
    display: none;
  }

  .site-header {
    border-bottom-color: #999;
  }

  .beat {
    break-inside: avoid;
  }

  a {
    color: inherit;
    text-decoration: none;
  }

  .sources a::after {
    content: " (" attr(href) ")";
    font-size: 0.75em;
    color: #555;
  }
}

@media (max-width: 480px) {
  html {
    font-size: 106.25%;
  }

  .wrap {
    width: min(100% - 1.5rem, var(--max));
    padding-block: 1.5rem 3rem;
  }
}

  </style>
</head>
<body>
  <main class="wrap">
    <header class="site-header">
      <p class="brand" id="brand">Newsy</p>
      <h1 class="briefing-title" id="briefing-title">Briefing</h1>
      <p class="meta" id="briefing-meta"></p>
      <div class="podcast" id="podcast" hidden>
        <button type="button" class="listen-btn" id="listen-btn" aria-label="Listen to this briefing">Listen</button>
        <audio id="podcast-audio" controls preload="none"></audio>
      </div>
    </header>

    <nav class="picker" aria-label="Briefings">
      <label class="picker-label" for="briefing-select">Briefings</label>
      <div class="select-wrap">
        <select id="briefing-select" class="briefing-select"></select>
      </div>
    </nav>

    <p class="status" id="status" hidden>Loading…</p>

    <div class="beats" id="beats"></div>

    <footer class="site-footer">
      <p>A short page. Read it, then close the tab.</p>
    </footer>
  </main>
  <script>
(function () {
  "use strict";


  const els = {
    brand: document.getElementById("brand"),
    title: document.getElementById("briefing-title"),
    meta: document.getElementById("briefing-meta"),
    podcast: document.getElementById("podcast"),
    listenBtn: document.getElementById("listen-btn"),
    audio: document.getElementById("podcast-audio"),
    select: document.getElementById("briefing-select"),
    beats: document.getElementById("beats"),
    status: document.getElementById("status"),
  };

  let briefings = [];

  function formatGeneratedAt(iso) {
    if (!iso) return "";
    const d = new Date(iso);
    if (Number.isNaN(d.getTime())) return iso;
    try {
      return new Intl.DateTimeFormat("en-US", {
        weekday: "short",
        month: "short",
        day: "numeric",
        year: "numeric",
        hour: "numeric",
        minute: "2-digit",
        timeZoneName: "short",
      }).format(d);
    } catch (_) {
      return iso;
    }
  }

  const MONTHS = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
  const WEEKDAYS = ["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"];
  const SLOT_NAMES = { morning: "Morning", noon: "Noon", evening: "Night" };

  function slotOf(b) {
    const m = /-(morning|noon|evening)$/.exec(b.id || "");
    return m ? m[1] : (b.slot || "").toLowerCase();
  }

  function optionLabel(b) {
    // e.g. "Wed, Oct 7 · Night"
    const src = b.date || (b.id || "").slice(0, 10);
    const parts = src.split("-");
    const slot = SLOT_NAMES[slotOf(b)] || (b.slot ? b.slot.charAt(0).toUpperCase() + b.slot.slice(1) : "");
    if (parts.length === 3) {
      const y = Number(parts[0]);
      const mo = Number(parts[1]);
      const day = Number(parts[2]);
      const wd = WEEKDAYS[new Date(Date.UTC(y, mo - 1, day)).getUTCDay()];
      return wd + ", " + MONTHS[mo - 1] + " " + day + (slot ? " · " + slot : "");
    }
    return b.label || b.id;
  }

  function renderSources(sources) {
    if (!sources || !sources.length) return "";
    const parts = sources.map(function (s) {
      const name = s.name || "Source";
      if (s.url) {
        return (
          '<a href="' +
          escapeAttr(s.url) +
          '" rel="noopener noreferrer" target="_blank">' +
          escapeHtml(name) +
          "</a>"
        );
      }
      return '<span class="name-only">' + escapeHtml(name) + "</span>";
    });
    return (
      '<p class="sources"><span class="sources-label">Sources</span> ' +
      parts.join('<span class="sep">·</span>') +
      "</p>"
    );
  }

  function bodyHtml(body) {
    if (!body) return "";
    // Allow simple HTML paragraphs; if plain text, wrap paragraphs
    if (/<[a-z][\s\S]*>/i.test(body)) return body;
    return body
      .split(/\n\n+/)
      .map(function (p) {
        return "<p>" + escapeHtml(p.trim()) + "</p>";
      })
      .join("");
  }

  function escapeHtml(str) {
    return String(str)
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;");
  }

  function escapeAttr(str) {
    return escapeHtml(str).replace(/'/g, "&#39;");
  }


  function setPodcast(b) {
    if (!els.podcast || !els.audio) return;
    const src = b && b.audio ? b.audio : "";
    if (!src) {
      els.audio.pause();
      els.audio.removeAttribute("src");
      els.audio.load();
      els.podcast.hidden = true;
      if (els.listenBtn) {
        els.listenBtn.setAttribute("aria-pressed", "false");
        els.listenBtn.textContent = "Listen";
      }
      return;
    }
    const abs = new URL(src, location.href).href;
    const current = els.audio.currentSrc || els.audio.src || "";
    if (current !== abs) {
      els.audio.pause();
      els.audio.src = src;
      els.audio.load();
      if (els.listenBtn) {
        els.listenBtn.setAttribute("aria-pressed", "false");
        els.listenBtn.textContent = "Listen";
      }
    }
    els.podcast.hidden = false;
  }

  function renderBriefing(b) {
    if (!b) {
      els.title.textContent = "No briefing";
      els.meta.textContent = "";
      els.beats.innerHTML = "";
      setPodcast(null);
      els.status.hidden = false;
      els.status.textContent = "No briefing selected.";
      return;
    }

    els.status.hidden = true;
    els.title.textContent = b.label || b.id;
    const when = formatGeneratedAt(b.generatedAt);
    els.meta.textContent = when ? "Prepared " + when : "";
    setPodcast(b);

    document.title = (b.label || "Briefing") + " · Newsy";

    const beats = b.beats || [];
    els.beats.innerHTML = beats
      .map(function (beat) {
        return (
          '<article class="beat" id="beat-' +
          escapeAttr(beat.id || "") +
          '">' +
          "<h2 class=\"beat-title\">" +
          escapeHtml(beat.title || "") +
          "</h2>" +
          '<div class="beat-body">' +
          bodyHtml(beat.body || "") +
          "</div>" +
          renderSources(beat.sources) +
          "</article>"
        );
      })
      .join("");

    // Keep the picker in sync
    if (els.select && els.select.value !== b.id) els.select.value = b.id;

    // Reflect selection in the URL hash without scrolling noise
    if (history.replaceState) {
      history.replaceState(null, "", "#" + encodeURIComponent(b.id));
    } else {
      location.hash = encodeURIComponent(b.id);
    }
  }

  function findBriefing(id) {
    return briefings.find(function (b) {
      return b.id === id;
    });
  }

  function renderPicker() {
    if (!els.select) return;
    // Newest first (briefings.json is already newest-first; sort defensively by id)
    const ordered = briefings.slice().sort(function (a, b) {
      const ka = (a.date || a.id || "") + " " + ({ morning: 1, noon: 2, evening: 3 }[slotOf(a)] || 0);
      const kb = (b.date || b.id || "") + " " + ({ morning: 1, noon: 2, evening: 3 }[slotOf(b)] || 0);
      return ka < kb ? 1 : ka > kb ? -1 : 0;
    });
    els.select.innerHTML = ordered
      .map(function (b) {
        return '<option value="' + escapeAttr(b.id) + '">' + escapeHtml(optionLabel(b)) + "</option>";
      })
      .join("");

    els.select.addEventListener("change", function () {
      const found = findBriefing(els.select.value);
      if (found) {
        renderBriefing(found);
        window.scrollTo(0, 0);
      }
    });

    window.addEventListener("hashchange", function () {
      const id = decodeURIComponent((location.hash || "").replace(/^#/, ""));
      const found = findBriefing(id);
      if (found && (!els.select || els.select.value !== id || els.title.textContent !== (found.label || found.id))) {
        renderBriefing(found);
      }
    });
  }

  function pickInitial() {
    const hash = (location.hash || "").replace(/^#/, "");
    if (hash) {
      const decoded = decodeURIComponent(hash);
      const match = briefings.find(function (b) {
        return b.id === decoded;
      });
      if (match) return match;
    }
    return briefings[0] || null;
  }

  function showError(msg) {
    els.status.hidden = false;
    els.status.textContent = msg;
    els.title.textContent = "Briefing";
    els.meta.textContent = "";
    els.beats.innerHTML = "";
    setPodcast(null);
  }


  if (els.listenBtn && els.audio) {
    els.listenBtn.addEventListener("click", function () {
      if (els.podcast.hidden || !els.audio.src) return;
      if (els.audio.paused) {
        els.audio.play().then(function () {
          els.listenBtn.setAttribute("aria-pressed", "true");
          els.listenBtn.textContent = "Pause";
        }).catch(function () {
          /* autoplay blocked; controls still work */
        });
      } else {
        els.audio.pause();
        els.listenBtn.setAttribute("aria-pressed", "false");
        els.listenBtn.textContent = "Listen";
      }
    });
    els.audio.addEventListener("play", function () {
      els.listenBtn.setAttribute("aria-pressed", "true");
      els.listenBtn.textContent = "Pause";
    });
    els.audio.addEventListener("pause", function () {
      els.listenBtn.setAttribute("aria-pressed", "false");
      els.listenBtn.textContent = "Listen";
    });
    els.audio.addEventListener("ended", function () {
      els.listenBtn.setAttribute("aria-pressed", "false");
      els.listenBtn.textContent = "Listen";
    });
  }


  const EMBEDDED_BRIEFINGS = [
  {
    "id": "2026-10-15-morning",
    "date": "2026-10-15",
    "slot": "morning",
    "label": "Thursday morning",
    "generatedAt": "2026-10-15T07:55:00-04:00",
    "beats": [
      {
        "id": "world",
        "title": "World",
        "headline": "Vatican City: Pope’s good second night; Yalu bridge opens; EU summit.",
        "body": "<p><strong>Vatican City.<\/strong> The Holy See Press Office said Thursday morning that Pope Leo XIV “had a good night in the hospital, got up and had breakfast”—his second night at Gemelli after Tuesday’s removal of the lower lobe of his right lung. Spokesman Matteo Bruni says the Pope wants to make the Nov. 6–17 Uruguay–Argentina–Peru trip; Peru’s President Keiko Fujimori said recovery could take weeks and the schedule might change, but the Holy See has announced no change. Today’s Bollettino: Father Ignatius Ding Zuyao was ordained bishop of Haimen, China, under the Holy See–China Provisional Agreement, and Bishop Paolo Andreolli, S.X., was named to Ponta de Pedras, Brazil (see Catholic). At the UN, Archbishop El Kassis told the First Committee that disarmament “cannot be postponed until more favourable circumstances arise.”<\/p><p><strong>Africa.<\/strong> Secretary of State Rubio phoned Ethiopia’s Abiy Ahmed urging de-escalation with Eritrea under their 2018 peace deal, as Ethiopian forces expand control in northern Tigray. Kenya confirmed a second Ebola (Bundibugyo) case—a relative of the first patient who was already in quarantine; officials see no community spread. Mauritius extended its curfew through Friday morning after protests over water shortages and living costs; 94 arrests so far (16 minors), and schools are closed Thursday and Friday.<\/p><p><strong>Asia.<\/strong> China and North Korea opened the New Yalu River Bridge Thursday morning—the four-lane, 3-km Dandong–Sinuiju crossing finished in 2014 but idle until now; Premier Li Qiang called it a “new landmark” of friendship. Singapore’s haze peaked at a season-high 24-hour PSI of 212 in the west at noon local time; masks are being distributed and 300+ community centers are serving as haze shelters. The EU–Gulf summit planned for Oct. 24 in Riyadh was postponed after repeated Houthi strikes on Riyadh’s airport.<\/p><p><strong>Europe.<\/strong> EU leaders opened a two-day Brussels summit focused on energy prices (oil above $100, gas at its highest since winter 2022), a sharply divided 2028–34 budget, and Ukraine; draft conclusions lament the U.S. pause on Russian-diesel sanctions, which Bulgaria’s Radev backed as fuel-price relief while most leaders criticized it. Zelenskyy joins Friday. Radev also said he summoned Russia’s ambassador over the Black Sea drone strikes—logic points to Russia, he said, but there is no solid evidence yet; a full terror investigation starts when the ship damaged Tuesday reaches port.<\/p><p><strong>North America.<\/strong> Simon is now a tropical storm (60 mph), nearly stationary about 270 miles south-southeast of Cabo San Lucas; it should drift northwest from Friday and fade by late weekend, with 1–3 inches of rain possible in Baja California Sur and no watches posted. Carney headlines a “Forever Canadian” rally in Calgary tonight ahead of Monday’s Alberta referendum. Panama reported its first death from the Oct. 9 magnitude-7.7 quake, and aftershocks are keeping hundreds from going home.<\/p><p><strong>South America.<\/strong> Brazil’s first Quaest runoff poll has Flávio Bolsonaro 46%, Lula 44%—a statistical tie—ahead of the Oct. 25 vote; Datafolha publishes today. In Colombia, thousands marched peacefully Wednesday, led by ex-president Petro, against President Abelardo de la Espriella’s labor and pension proposals—the opposition’s first big show since he took office in August.<\/p><p><strong>Oceania.<\/strong> Pacific Islands Forum chair Surangel Whipps of Palau, visiting Canberra, pushed back on critics counting absent leaders at last week’s Fiji–Tuvalu pre-COP and pressed for climate finance before COP31 opens Nov. 9; pledges to the Pacific Resilience Facility reached only half of a $500 million goal. Fiji approved a six-month, New Zealand–funded NZSIS review of its intelligence system amid foreign-interference concerns.<\/p>",

          },
          {

            "url": "https://press.vatican.va/content/salastampa/it/bollettino/pubblico/2026/10/15/0813/01518.html"
          },
          {

          },

        "body": "<p><strong>Vatican City.<\/strong> Day four of the <em>Amoris Laetitia<\/em> anniversary meeting turns to the first years of marriage—Cardinal José Cobo Cano and Prof. María Marcela Mazzini lead inputs after Cardinal Farrell’s opening. Pope Leo XIV on Saturday also appointed Archbishop Vittorio Francesco Viola, O.F.M., Archpriest of St. Peter’s Basilica (and Vicar General for Vatican City / Fabric of St. Peter), with Bishop Aurelio García Macías succeeding him as Secretary of the Dicastery for Divine Worship. Friday’s confirmation stands: Cardinal Luis Antonio Tagle is the new Dean of the College of Cardinals (first Asian dean), succeeding Cardinal Giovanni Battista Re.<\/p><p><strong>Africa.<\/strong> Ethiopia and Eritrea still trade “war of aggression” accusations over Tigray. Addis Ababa’s UN letter called Eritrean advances an “all-out invasion” (troops said to have pushed up to ~60 km); Asmara denies backing the TPLF and says Ethiopia is hunting Red Sea access via Assab. Ethiopian forces hold Mekelle; Ethiopian Airlines plans flights there Oct. 11.<\/p><p><strong>Asia.<\/strong> Saudi aviation says Riyadh’s King Khalid airport is back to normal after this week’s Houthi-claimed missile and drone strikes that killed three and wounded dozens at Abha and Riyadh airports (a Saudia captain among the dead; a parked Saudia jet damaged Thursday). The Saudi-led coalition vowed a firm response; Houthis again warned global airlines about Saudi airspace.<\/p><p><strong>Europe.<\/strong> U.S. envoys Steve Witkoff and Jared Kushner wrapped Friday’s Miami talks with Ukraine, the E3, the European Commission, and NATO a day early—Witkoff called them “constructive” on winter energy resilience, grain, security guarantees, reconstruction, and EU accession, with no Russia at the table. Overnight, Russian glide bombs on Zaporizhzhia killed at least 15, Zelenskyy said, as Pentagon-style “stalemate” warnings linger.<\/p><p><strong>North America.<\/strong> Hurricane Isaias made landfall near Destin, Florida, about 8:30 p.m. CDT Friday as a high-end Category 2 (105 mph). By early Saturday it was post-tropical near Montgomery, Alabama (~35 mph), with NHC’s final advisory out; flash flooding, tornado risk, and 4–8 inches of rain (locally higher) still threaten Alabama, the Panhandle, Georgia, and the Southern Appalachians through Sunday. South Florida was not in the hurricane warning.<\/p><p><strong>South America.<\/strong> Cleanup continues in Santiago’s Las Condes after Thursday’s flash mudflow injured six and affected more than 2,000 homes; Chile declared a disaster zone. In Brazil, Lula’s government cut gasoline taxes and extended diesel/ethanol subsidies ahead of the Oct. 25 runoff against Flávio Bolsonaro.<\/p><p><strong>Oceania.<\/strong> Pacific leaders’ Taku Pakasoa Declaration (“strength in unity”) from the Fiji–Tuvalu Pre-COP31 push remains the week’s regional headline—urging 1.5°C ambition, climate finance, and ocean protection ahead of COP31 in Türkiye.<\/p>",

        "body": "<p><strong>Miami.<\/strong> The <em>Florida Catholic<\/em> looks back at the Feast of Our Lady of Mercy Mass, held September 24 at Mercy Hospital with students from six archdiocesan schools. The Eucharistic Miracles Exposition opens Monday at St. Mark the Evangelist and runs through Friday. No new clergy assignments posted.<\/p><p><strong>United States.<\/strong> Close to home, Bishop Emeritus Frank J. Dewane of Venice in Florida died Wednesday, the feast of Our Lady of the Rosary, at 76. He led the diocese from 2006 until this May. Funeral arrangements are pending. The USCCB also released its November ballot: Bishop Earl Fernandes of Columbus and Bishop Kevin Rhoades of Fort Wayne–South Bend are the nominees for conference secretary.<\/p><p><strong>Latin America.<\/strong> Ahead of Pope Leo’s November trip, Montevideo’s Cardinal Daniel Sturla says the Pope was “impactado,” deeply struck, by youth suicide in Uruguay, which he said needs “an injection of hope.” Uruguay’s visit runs November 6 to 8, and on November 15 in Cusco, Peru, the Pope will celebrate at Sacsayhuamán, give a Golden Rose to the “Mamacha de Belén,” present a pontifical shroud for the “Taytacha de los Temblores,” and meet Quechua-speaking communities.<\/p><p><strong>Europe.<\/strong> French bishops are urging prayer and dialogue as student unrest spreads. “Violence is a failure,” said Bishop Gosselin, and Bishop Olivier de Cagny of Évreux said “violence is unnecessary.”<\/p><p><strong>Africa.<\/strong> Kenya’s Subukia Shrine hosted the bishops’ National Prayer Day for peace ahead of the 2027 election. “Kenya is greater than our differences,” said Archbishop Maurice Muhatia. The day was marked by grief: 17 pilgrims from Mombasa died in a road accident on the way.<\/p><p><strong>Asia.<\/strong> Archbishop Paul Gallagher, the Vatican’s foreign minister, is in Islamabad through Saturday to mark 75 years of Holy See–Pakistan relations. He meets Prime Minister Shehbaz Sharif, celebrates Mass at Our Lady of Fatima, and visits the Faisal Mosque.<\/p><p><strong>Middle East.<\/strong> In Taybeh, the West Bank’s last entirely Christian village, residents can’t reach their olive trees for the fourth harvest in a row. The village is a closed military zone, which also keeps pilgrims out. Of about 1,200 remaining residents, some 200 are considering leaving, a local activist told Vatican News.<\/p><p><strong>Oceania.<\/strong> Sydney’s Archbishop Anthony Fisher and Auxiliary Bishop Richard Umbers met Pope Leo this morning.<\/p><p><strong>Reassignments.<\/strong><\/p><ul><li><strong>Sr. Mary Teresa Barron, N.S.A.<\/strong>, superior general of the Missionary Sisters of Our Lady of the Apostles, becomes adjunct secretary of the Dicastery for Evangelization and president of the Pontifical Mission Societies on January 4, 2027. Born in Donegal in 1968, she led the International Union of Superiors General from 2023 to 2025.<\/li><li><strong>Diocese of Venice in Florida<\/strong> (effective October 19): <strong>Fr. David M. Vidal<\/strong> leaves Ave Maria Parish to become vicar general, living at Epiphany Cathedral, and <strong>Fr. Shawn Roser<\/strong> takes over Ave Maria as administrator. <strong>Fr. Daniel Scanlan<\/strong> becomes administrator of Ss. Peter and Paul in Bradenton while pastor Fr. Gordon Zanetti takes medical leave. <strong>Fr. Alexander Pince<\/strong> stays vocations director, now living at Resurrection in Fort Myers, and <strong>Fr. Jiobani Batista<\/strong> and <strong>Fr. Benjamin Casimir<\/strong> become the diocese’s delegates for Hispanic and Haitian ministry (Batista on October 26).<\/li><li><strong>Archdiocese of New York:<\/strong> <strong>Fr. Christopher Monturo<\/strong> is the new pastor of the Church of the Resurrection in Rye.<\/li><li>No other Holy See nominations today, and nothing new in Miami.<\/li><\/ul>",

        "headline": "Vatican City: Amoris week underway; Lecornu taps diesel stocks; Ukraine toll 28.",
        "body": "<p><strong>Vatican City.<\/strong> More detail from the first day of the <em>Amoris Laetitia<\/em> meeting: the 187 participants, including 22 lay people, mostly married couples, sit at 16 round tables in the Paul VI Hall with 26 experts, using the “conversations in the Spirit” method from the synod. Cardinal Farrell’s welcome recalled the Pope’s March message that <em>Familiaris Consortio<\/em> and <em>Amoris Laetitia<\/em> “have both strengthened the Church’s doctrinal and pastoral commitment” to young people, couples, and families. In her meditation, Dominican Sr. Helen Alford said <em>Amoris<\/em> is consistent with the teaching before it, tying both documents to the “law of gradualness,” and said “the beauty of the vocation to marriage is to be found through and with and in its fragility.” Earlier, the Pope told Louisiana’s Patrons of the Arts in the Vatican Museums that “in an age dominated by technology, in which efficiency and profit often take precedence,” we must “allow time and space for beauty.” No new curia appointments since this morning.<\/p><p><strong>Africa.<\/strong> The African Union–backed Africa Credit Rating Agency launched in Port Louis, Mauritius. It is private and self-funded, and governments cannot own shares. Only 32 of Africa’s 55 states are rated by the big three agencies, and the AU says the continent’s external debt service rose from $61 billion in 2010 to $163 billion in 2024.<\/p><p><strong>Asia.<\/strong> Iran’s army spokesman said its forces will carry out pre-emptive operations “should circumstances require it,” and a senior Revolutionary Guard adviser said the Strait of Hormuz “is closed” and will stay that way until Iran’s demands are met. Vice President Vance said it is “not totally clear how their country makes decisions.” In Singapore, smoke from fires in Sumatra and Kalimantan pushed air quality into the unhealthy range across all five regions, and fine-particle readings in the west briefly hit the “high” band for the first time this haze season.<\/p><p><strong>Europe.<\/strong> In his address tonight, French Prime Minister Lecornu said France will release 10 million barrels of diesel from its strategic stocks to distributors at cost over three months, which he expects to cut pump prices by 12 to 18 cents a liter. He said electricity prices “must not rise this winter” and asked EDF to maximize production. To students, he said police “have no instruction to confront” them, that their anger “does not come from nowhere,” and that the government’s first decisions will come at the end of October. He held to a 2027 deficit of 5% of GDP and appealed to lawmakers’ “patriotism” to pass a budget. In Ukraine, the toll from Wednesday’s barrage rose to at least 28 dead and 118 injured, including 20 in Pryluky, five of them children. The EU paid out €1.24 billion for Ukrainian-made drones, interceptors, and missiles, and Turkey’s Erdogan told Putin that Turkey is ready to help with direct talks with Ukraine.<\/p><p><strong>North America.<\/strong> Canada’s House of Commons voted down a Conservative motion to end all federal taxes on diesel until Canada Day. Only Conservatives voted for it. The Liberal government has already extended its pause on the federal fuel excise tax into 2027.<\/p><p><strong>South America.<\/strong> CBS News reports that federal prosecutors are expected to bring new charges against Venezuela’s former president Nicolás Maduro and his wife, Cilia Flores, accusing them of torturing more than a dozen Americans held in Venezuelan prisons, possibly as soon as Thursday. Maduro’s lawyer says he has had no notice. Flores has a bond hearing Thursday, and a trial is tentatively set for June 2027.<\/p><p><strong>Oceania.<\/strong> Australia’s High Court, in its first climate case, upheld a ruling that the approval of MACH Energy’s Mount Pleasant coal mine expansion was invalid, because planners never weighed the local climate effects of emissions from the exported coal. The project must be reassessed, and the ruling affects 17 other New South Wales coal proposals. The mine can keep operating until 2032 under its existing approval, and the NSW Minerals Council called the challenge “activist lawfare.”<\/p>",

        "body": "<p><strong>Vatican City.<\/strong> Pope Leo opens the closed-door meeting marking ten years of <em>Amoris Laetitia<\/em> at 4 p.m. Rome time today in the Paul VI Hall. Cardinals Kevin Farrell and Mario Grech give the welcome, and Dominican Sr. Helen Alford leads a meditation. There are 187 participants, most of them bishops’ conference presidents. There will be no votes, and the synthesis report goes to the Pope rather than replacing the exhortation. It closes with Mass in St. Peter’s Square on October 14. At this morning’s General Audience, on the feast of Our Lady of the Rosary, he continued his <em>Gaudium et Spes<\/em> series. He said the Church’s first mission is to help people face “the profound questions of life,” and that a gap between “professed faith and daily life” is among the gravest errors of our age. He also released a video message ahead of the 100th World Mission Day on October 18, saying evangelization is “always a work of love.” In personnel news, he moved Archbishop Jan Romeo Pawłowski from Greece to be nuncio to Ireland (see Catholic).<\/p><p><strong>Africa.<\/strong> Kenya has identified 57 contacts of its first Ebola patient, who died October 6 after traveling from Congo, and has 10 in quarantine. Doctors Without Borders says spread in Congo’s North Kivu province is “out of control,” with most new cases coming from unknown chains of transmission. In Nigeria, the Air Force named 25 people killed in Monday’s ATR-42 crash in Ondo State and found no survivors. The Senate postponed next week’s security summit in their honor, and the Christian Association of Nigeria is calling for a transparent investigation. Separately, the army says troops repelled an ISWAP assault in Borno State and killed more than 25 fighters.<\/p><p><strong>Asia.<\/strong> Israel is marking three years since the October 7 attack, which killed about 1,200 people and saw 251 taken hostage. Ceremonies began at 6:29 a.m. at some 400 sites, and protesters are demanding a state commission of inquiry. It is the first anniversary with all the hostages home. In Gaza, the Hamas-run health ministry counts more than 74,000 dead, and AP reports Israeli strikes continue almost daily despite the ceasefire nearly a year old. In the Gulf, the UK’s maritime agency has logged nine attacks on ships in the Strait of Hormuz already this month, half of September’s total, even as oil flows near prewar levels and Brent sits just above $101. Vice President Vance told Reuters any deal to reopen the strait would require Iran to cut its ability to enrich uranium. Houthi forces also struck at Aden’s airport. China’s foreign minister told a former Japanese foreign minister that Prime Minister Takaichi herself must resolve her Taiwan remark.<\/p><p><strong>Europe.<\/strong> Russia hit Ukraine overnight with 130 drones and 48 cruise missiles plus ballistic missiles, on Putin’s 74th birthday. At least 15 were killed, with RFE/RL putting the toll at 19, including 13 in a residential building in Pryluky. Ukraine began emergency power cuts in five regions. Kyiv says it hit two oil facilities and a training ground in Russia, and a Liberian-flagged tanker burned off Sochi after a reported naval-drone attack; all 23 Indian crew were rescued. In France, the government suspended stun grenades for school protests after a 15-year-old’s hand was blown off in Lens. More than 250,000 marched Tuesday, more than 500 schools were shut this morning, and Prime Minister Lecornu speaks tonight.<\/p><p><strong>North America.<\/strong> The S&amp;P 500 and Nasdaq both closed at record highs Tuesday on AI enthusiasm, with the S&amp;P up 14% this year despite $100 oil and 10-year Treasury yields above 5%. Minutes from the Fed’s September meeting, when it raised rates, come out today. Canada’s Prime Minister Carney announced the first bilateral visit to Türkiye by a Canadian prime minister, October 21 to 23, to push a free-trade deal and energy, mining, and defense ties.<\/p><p><         "body": "<p><strong>“Bring energy prices down.”<\/strong> <em>What was done:<\/em> Trump signed an order letting a broad range of road vehicles use dyed diesel, which is normally reserved for farm and construction equipment and is exempt from the 24.4-cent federal fuel tax. Federal agencies were also told to defer federal road taxes for the rest of 2026. <em>Impact:<\/em> small. AAA puts diesel at $6.31 a gallon, up $2.63 (about 70%) from a year ago, mostly because of the Iran war. Analysts told ABC News the tax break takes about $36 off a $948 fill-up of a 150-gallon truck tank, that dyed diesel is sold at few stations, and that the effect on grocery prices will be “negligible.” Some states, including Texas, Nebraska, and North Carolina, added their own waivers. A short-term patch, but the promise of cheaper fuel isn’t being kept right now.<\/p><p><strong>“End the corporate capture of our health agencies.”<\/strong> <em>What was done:<\/em> At last week’s MAHA Summit, put on by a private group run by Kennedy allies, Kennedy said AI will free Americans from “medical tyranny” by letting them “fact check their own medical advice.” OpenAI and Anthropic were among the sponsors, along with more than a dozen companies with business pending before the government. Sponsors paid up to $300,000, and many got panel slots alongside officials like CMS chief Dr. Oz. <em>Impact:<\/em> no policy has changed yet, but it’s splitting the movement. Dr. Robert Malone called it “classic pay-to-play,” and medical experts say AI tends to repeat mainstream medical advice, not challenge it. HHS says the goal is helping people understand their own health data alongside their doctors. This one is a credibility test, not a promise kept.<\/p>",

        "body": "<p><strong>Miami.<\/strong> Archbishop Wenski is pushing Catholics to oppose the death penalty as Florida carries out executions at a record pace: 15 this year, more than half the national total, according to Catholic Mobilizing Network. “No human being is a problem,” he said, and Florida’s bishops have repeatedly asked Gov. DeSantis to commute sentences. Coming up: the St. Carlo Acutis Eucharistic Miracles Exposition, October 12 to 16 at St. Mark the Evangelist. No new clergy assignments posted.<\/p><p><strong>United States.<\/strong> NCR reports that Catholic immigration advocacy is moving into the streets. More than 4,000 walked with San Diego’s Bishop Michael Pham, St. Louis Archbishop Rozanski called for an end to “indiscriminate detention and mass deportation,” and Providence Catholics are praying the Rosary outside a detention center. Rozanski expects it to be a major topic at the bishops’ November meeting in Baltimore.<\/p><p><strong>Latin America.<\/strong> CELAM, the Latin American bishops’ council, met in Bogotá to review its 2023–2027 pastoral plan and prepare its May 2027 General Assembly in Panama.<\/p><p><strong>Europe.<\/strong> Two new German auxiliary bishops say that at the Rome course for new bishops, colleagues asked them whether the German Synodal Way “is still Catholic” and “what are you Germans really doing?” Both insist no German bishop wants to break from the Pope. The Synodal Conference’s statutes still await Vatican approval.<\/p><p><strong>Africa.<\/strong> Ethiopia’s bishops joined Pope Leo’s appeal for dialogue as the new Tigray war spreads. A September 20 drone strike destroyed a food-aid truck from the Eparchy of Adigrat that was headed to a camp for about 56,000 displaced people.<\/p><p><strong>Asia.<\/strong> In India, Bombay’s Auxiliary Bishop Savio Fernandes published “Standing with Gen Z” as young people protest the removal of legitimate voters from electoral rolls. He called for elections that are “impartial, transparent and accountable” and said he wasn’t backing any party.<\/p><p><strong>Middle East.<\/strong> On the anniversary, Cardinal Pizzaballa said October 7 was “a watershed,” and that the Holy Land is in “neither peace nor war.” He said the future must be rebuilt “not only in terms of infrastructure, but also in terms of relationships and humanity.”<\/p><p><strong>Oceania.<\/strong> Parramatta’s Eucharistic miracles exhibit opens Sunday and runs through October 25.<\/p><p><strong>Reassignments.<\/strong><\/p><ul><li><strong>Archbishop Jan Romeo Pawłowski<\/strong>, nuncio to Greece, is the new Apostolic Nuncio to Ireland. A Polish canon lawyer who previously ran the Holy See’s staffing of its diplomatic posts, he succeeds Archbishop Luis Mariano Montemayor, who retired in July.<\/li><li><strong>Bishop Antônio Carlos Paiva<\/strong> takes over the Diocese of Oliveira, Brazil, as Pope Leo accepted the resignation of <strong>Bishop Miguel Ângelo Freitas Ribeiro<\/strong>. Paiva had been coadjutor.<\/li><li>Earlier this week: Msgr. Grzegorz Bielaszka was named nuncio to the UAE, and Cardinal Gambetti moved from St. Peter’s to Chieti-Vasto. St. Peter’s still has no new archpriest named.<\/li><\/ul>",

        "body": "<p><strong>Vatican City.<\/strong> Pope Leo will go to Assisi on October 27 for the 40th anniversary of St. John Paul II’s 1986 World Day of Prayer for Peace. Sant’Egidio’s gathering there, “Disarmed and Disarming Peace” (a phrase of Pope Leo’s), runs October 25 to 27 with 384 religious and civic representatives from 53 countries. The Pope will pray with Christians in the Lower Basilica, where he and Patriarch Bartholomew will each offer a meditation, then give a message of peace in the piazza. The Vatican also released the full program for tomorrow’s <em>Amoris Laetitia<\/em> assembly: 187 participants, including 114 bishops’ conference presidents and 22 married couples. Among the Pope’s personal invitees are two bishops from mainland China, whose Party-overseen bishops’ conference the Vatican does not recognize. Pope Leo opens it tomorrow and closes it with Mass in St. Peter’s Square on October 14.<\/p><p><strong>Africa.<\/strong> President Ruto ordered a stepped-up Ebola response in Kenya. Eight family members and 21 health workers are in quarantine, 27 passengers from the flight have been contacted, and 48 people in all are being monitored. Of 267 samples tested, the only positive is still the man who died.<\/p><p><strong>Asia.<\/strong> Israel’s defense minister put the military on high alert ahead of tomorrow’s October 7 anniversary, citing intelligence that Hamas plans attacks on troops in Gaza, and warned Gazans would pay a “heavy price” if soldiers are harmed. In Yemen, Saudi Arabia acknowledged that two of its airports were hit, with three people lightly hurt. Yemeni officials told AP that coalition forces retook the town of Dhubab near the Bab el-Mandeb. The UN migration agency counts more than 184,000 people displaced since August. AP says the U.S. is giving Riyadh intelligence and planning help but isn’t resuming its own strikes.<\/p><p><strong>Europe.<\/strong> Drones hit merchant ships in the Black Sea. The Togo-flagged <em>Alfa Watan         "body": "<p><strong>Vatican City.<\/strong> The Vatican’s assembly marking ten years of <em>Amoris Laetitia<\/em> opens tomorrow and runs through October 14, with USCCB leaders and three U.S. cardinals taking part. Pope Leo met the Vatican’s two lay workers’ associations and urged “the path of dialogue,” but he didn’t answer their recent demands for back pay after years of wage restraint. Today he also published a foreword to <em>YOUCAT: Love Forever<\/em>, calling married love a faithful “yes” for a lifetime. St. Peter’s Basilica still has no archpriest named since Cardinal Gambetti was moved to Chieti-Vasto.<\/p><p><strong>Africa.<\/strong> Kenya confirmed its first Ebola death: a Kenyan who had lived in Congo, where more than 4,000 have died this year, flew into Nairobi Saturday and died days later. In Nigeria, all 32 people aboard an Air Force ATR-42 that crashed Monday in Ondo State were killed, and President Tinubu declared three days of mourning. In Ethiopia’s widening Tigray war, witnesses tell the Guardian that the new rebel alliance is forcibly recruiting men and boys as young as 15. Egypt’s objection also pushed the African Union to walk back a statement on the crisis.<\/p><p><strong>Asia.<\/strong> Saudi-backed Yemeni government forces say they’ve retaken the Red Sea port of Mokha and positions around the Bab el-Mandeb Strait. The Houthis answered with missile and drone strikes on Riyadh’s airport, Abha airport, and the Rabigh refinery, and Pakistan and Turkey agreed to send troops to Saudi Arabia. Iran has attacked ships in the Strait of Hormuz nearly every day since September 29, and Brent is holding near $100. Separately, Japan said a Chinese survey ship left its economic waters after repeated demands.<\/p><p><strong>Europe.<\/strong> Russia says it shot down 1,750 Ukrainian drones and 17 Flamingo cruise missiles in 24 hours, the largest Ukrainian barrage of the war by Moscow’s count. Strikes near Moscow killed two men, hurt nine, set a fuel depot on fire, and snarled more than 200 flights. A Russian strike also hit a medical facility in Kramatorsk. European officials tell the Washington Post that Putin is counting on sabotage, cyberattacks, and nuclear threats to break Europe’s support for Kyiv this winter.<\/p><p><strong>North America.<\/strong> With four weeks until the November 3 midterms, NPR and the Guardian both report that Democrats hold a clear polling edge, driven by costs, tariffs, and the Iran war. The 30-year Treasury yield is near 5.67% and the 10-year near 5.30%, the highest since 2002. The Pentagon has raised combat pay for the first time since 2002: hostile fire pay doubled to $450 a month, and imminent danger pay rose to $275.<\/p><p><strong>South America.<\/strong> Final counts in Brazil show Flávio Bolsonaro with 47.03% to President Lula’s 45.16%, setting up an October 25 runoff. Since democracy returned in 1985, no first-round runner-up has gone on to win. U.S. prosecutors say Venezuela itself has never claimed immunity for Maduro and Cilia Flores, and the immunity hearing is November 17.<\/p><p><strong>Oceania.<\/strong> At a pre-COP31 meeting in Tuvalu with Prime Minister Albanese, Fiji’s Sitiveni Rabuka said the 2023 deal to move away from fossil fuels is “not open for renegotiation.” A Tuvalu government adviser said Australia “overstepped” during the visit. In New Zealand, National’s plan to pay for health spending by cutting Pacific aid drew fire from coalition partner NZ First.<\/p>",

        "body": "<p><strong>“Patients should know the price before they get care.”<\/strong> <em>What was done:<\/em> On Monday, HHS, Labor, and Treasury finalized an overhaul of the insurer price-disclosure rules. Insurers must post real dollar amounts instead of vague percentages, drop “ghost” rates for services a provider would never perform, report more out-of-network prices, and name an executive who vouches that the files are accurate. <em>Impact:<\/em> nothing yet. The changes take effect 5 to 11 months after publication, and drug-price disclosure is still waiting until spring. Employer groups say the data will finally be usable for bargaining. Healthcare Dive notes that price transparency hasn’t yet moved overall U.S. health spending. Promise partly kept, with the payoff still ahead.<\/p><p><strong>“The largest deportation operation in history.”<\/strong> <em>What was done:<\/em> The Marshall Project finds that after the big city operations ended, arrests climbed through a quieter, nationwide approach that relies on about 2,000 local police and sheriff partnerships. DHS reported nearly 51,000 ICE arrests in August, a monthly record. In Florida, July arrests topped 7,000, triple the year before. <em>Impact:<\/em> arrests are not the same as removals, and in July half of the people arrested had no prior criminal record. That share keeps rising. Enforcement is clearly up, but the deportation total is still not the promised scale.<\/p>",

        "headline": "Little Flower turns 100; Zambia's archbishop charged; new UAE nuncio named.",
        "body": "<p><strong>Miami.<\/strong> Archbishop Wenski celebrated the 100th anniversary of St. Theresa, the Church of the Little Flower in Coral Gables. The St. Carlo Acutis Eucharistic Miracles Exposition comes to the archdiocese October 12 to 16. No new Miami clergy assignments have been posted.<\/p><p><strong>United States.<\/strong> The Vatican’s ten-years-after <em>Amoris Laetitia<\/em> meeting on families opens tomorrow. USCCB president Archbishop Coakley and vice president Bishop Flores represent the U.S. bishops, after their audiences with Pope Leo this week.<\/p><p><strong>Latin America.<\/strong> Peru is preparing for Pope Leo’s November 11 to 16 visit to Lima, Chiclayo, Cusco, and Pucallpa. The bishops have launched a “Friends of Leo” volunteer corps for crowds expected to reach up to a million.<\/p><p><strong>Europe.<\/strong> In Germany, impatience is building as the bishops’ proposed permanent Synodal Conference still waits for Vatican approval, and its November meeting has been postponed.<\/p><p><strong>Africa.<\/strong> Archbishop Alick Banda of Lusaka, an outspoken critic of the government, was arrested over a car he says former President Lungu gave him and that he surrendered to the state in 2023. He spent a night in prison and is out on bail, and his trial starts November 3. Cardinal Ambongo, speaking for Africa’s bishops, has called for fair and transparent due process.<\/p><p><strong>Asia.<\/strong> The Philippine bishops are backing “Dapat Isa Lang,” a nationwide signature drive for a law that would actually bar political dynasties.<\/p><p><strong>Middle East.<\/strong> Two Christian women, Maysa Abu Dawoud and Mary al-Najjar, were killed in an Israeli strike on a Gaza City apartment on October 3. Gaza’s Christians will hold a Rosary, Mass, and procession for peace tomorrow.<\/p><p><strong>Oceania.<\/strong> Parramatta’s diocese is hosting a Eucharistic miracles exhibit from October 11 to 25, and Sydney is set to host the 2028 International Eucharistic Congress from September 24 to October 1.<\/p><p><strong>Reassignments.<\/strong><\/p><ul><li><strong>Cardinal Mauro Gambetti<\/strong> leaves St. Peter’s Basilica and the Vatican City vicariate to become Archbishop of Chieti-Vasto, Italy. He succeeds Archbishop Bruno Forte, whose resignation was accepted.<\/li><li><strong>Msgr. Grzegorz Bielaszka<\/strong>, a Polish Vatican diplomat, was named Apostolic Nuncio to the United Arab Emirates and made an archbishop on October 5. He succeeds Archbishop Christophe El-Kassis.<\/li><li><strong>Bishop Ramón Salazar Estrada<\/strong>, auxiliary of Guadalajara and a leading voice on life issues for Mexico’s bishops, moves to lead the Diocese of Mazatlán, his first diocese of his own.<\/li><li><strong>Bishop Pierre Goudreault<\/strong>, president of the Canadian bishops, was named Bishop of Trois-Rivières, Quebec.<\/li><li><strong>Bishop Bonaventure Bosco Gubazire, M.Afr.<\/strong> was ordained and installed as Kabale, Uganda’s fifth bishop on October 3.<\/li><\/ul>",

        "headline": "Rosary-for-peace message stands; Cape Town revival Saturday; national digital IDs spread.",
        "body": "<p><strong>Latest message.<\/strong> Our Lady’s September 25 Medjugorje message through Marija is still the newest: “May this time be a time of prayer for peace. I am calling you to renew in your families the prayer of the Rosary for my intentions… like never before I pray for you and with you, my little children.” It fits Pope Leo’s October call to the Rosary. The next monthly message is due October 25.<\/p><p><strong>Countdown to the Kingdom.<\/strong> Nothing new since the October 3 posts: that Medjugorje message, a Flame of Love passage from Elizabeth Kindelmann (“the Spirit of Pentecost will flood the earth”), and Pedro Regis’s October 2 message (“healing will come, only by the mercy of Jesus”).<\/p><p><strong>Eucharistic miracles.<\/strong> No new reports. The Host in Cuilapa, Guatemala, that reportedly didn’t dissolve and developed red stains is still under formal Church discernment, and the Church is asking for “prudence and restraint.”<\/p><p><strong>Revival and returns.<\/strong> Saturday’s free “Revival Fire” gathering at Athlone Stadium in Cape Town is pitched as the start of a revival movement “from Cape Town to Cairo.” Pastors are running about 50 buses, and bus bookings are already full. In the U.S., dioceses this year reported an average of about 38% more adults entering the Church than last year. A survey of new Catholics found most came for a deeper relationship with God and for the liturgy and tradition, not for marriage.<\/p><p><strong>Digital ID watch.<\/strong> The Philippines approved ₱2.5 billion to upgrade the biometric and digital side of its national ID. Vietnam set rules for its VNeID app, which combines electronic ID, digital documents, payments, and public services. The EU keeps promoting its digital identity wallet. No implantable-chip news this morning.<\/p>",
