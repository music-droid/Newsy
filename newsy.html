  <meta name="description" content="Short, bounded news briefings — not a news portal.">
  <meta name="color-scheme" content="light">
  <meta name="theme-color" content="#6b4f3a">
  <meta name="apple-mobile-web-app-title" content="Newsy">

       multi-file HTTPS deploy (index.html + manifest + sw.js + icons). Service
       workers do not run from file://. See HOME-SCREEN.md. -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400;600&family=Source+Serif+4:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
  <style>
/* Newsy — calm briefings, not a news portal */
:root {
  --bg: #f7f3ec;
  --bg-soft: #f0eae0;
  --ink: #2c2925;
  --ink-muted: #5c564e;
  --ink-faint: #8a8278;
  --accent: #6b4f3a;
  --accent-soft: #c4a882;
  --rule: #e0d6c8;
  --chip: #fffdf9;
  --chip-active: #6b4f3a;
  --chip-active-ink: #f7f3ec;
  --link: #4a6b5a;
  --link-hover: #355244;
  --max: 38rem;
  --font: "Source Serif 4", "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif;
  --font-ui: "Source Sans 3", "Segoe UI", system-ui, -apple-system, sans-serif;
}

*,
*::before,
*::after {
  box-sizing: border-box;
}

html {
  font-size: 112.5%; /* ~18px */
  -webkit-text-size-adjust: 100%;
}

body {
  margin: 0;
  min-height: 100vh;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font);
  line-height: 1.65;
  font-weight: 400;
}

a {
  color: var(--link);
  text-decoration-thickness: 1px;
  text-underline-offset: 0.15em;
}

a:hover {
  color: var(--link-hover);
}

.wrap {
  width: min(100% - 2rem, var(--max));
  margin-inline: auto;
  padding-block: 2rem 4rem;
}

/* Header */
.site-header {
  border-bottom: 1px solid var(--rule);
  padding-bottom: 1.25rem;
  margin-bottom: 1.75rem;
}

.brand {
  font-family: var(--font-ui);
  font-size: 0.75rem;
  font-weight: 600;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: var(--accent);
  margin: 0 0 0.35rem;
}

.briefing-title {
  font-size: clamp(1.45rem, 4vw, 1.85rem);
  font-weight: 600;
  line-height: 1.25;
  margin: 0 0 0.25rem;
  letter-spacing: -0.01em;
}

.meta {
  font-family: var(--font-ui);
  font-size: 0.85rem;
  color: var(--ink-muted);
  margin: 0;
}

/* Picker — chips */
.picker {
  margin: 0 0 2rem;
}

.picker-label {
  font-family: var(--font-ui);
  font-size: 0.7rem;
  font-weight: 600;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--ink-faint);
  margin: 0 0 0.6rem;
}

.chips {
  display: flex;
  flex-wrap: wrap;
  gap: 0.4rem;
  list-style: none;
  margin: 0;
  padding: 0;
}

.chip {
  font-family: var(--font-ui);
  font-size: 0.8rem;
  appearance: none;
  border: 1px solid var(--rule);
  background: var(--chip);
  color: var(--ink-muted);
  border-radius: 999px;
  padding: 0.35rem 0.85rem;
  cursor: pointer;
  transition: background 0.15s ease, color 0.15s ease, border-color 0.15s ease;
}

.chip:hover {
  border-color: var(--accent-soft);
  color: var(--ink);
}

.chip[aria-pressed="true"] {
  background: var(--chip-active);
  border-color: var(--chip-active);
  color: var(--chip-active-ink);
}

.chip:focus-visible {
  outline: 2px solid var(--accent-soft);
  outline-offset: 2px;
}

/* Beats */
.beats {
  display: flex;
  flex-direction: column;
  gap: 2rem;
}

.beat {
  padding-top: 0.25rem;
}

.beat-title {
  font-size: 1.05rem;
  font-weight: 600;
  margin: 0 0 0.65rem;
  padding-bottom: 0.4rem;
  border-bottom: 1px solid var(--rule);
  color: var(--accent);
  letter-spacing: 0.01em;
}

.beat-body {
  margin: 0;
}

.beat-body p {
  margin: 0 0 0.85rem;
}

.beat-body p:last-child {
  margin-bottom: 0;
}

.sources {
  margin-top: 0.85rem;
  padding-top: 0.55rem;
  border-top: 1px dotted var(--rule);
  font-family: var(--font-ui);
  font-size: 0.8rem;
  color: var(--ink-muted);
  line-height: 1.55;
}

.sources-label {
  font-weight: 600;
  color: var(--ink-faint);
  margin-right: 0.35rem;
}

.sources a {
  word-break: break-word;
}

.sources .sep {
  color: var(--ink-faint);
  margin: 0 0.3rem;
}

.sources .name-only {
  color: var(--ink-muted);
}

/* Status / empty */
.status {
  font-family: var(--font-ui);
  font-size: 0.9rem;
  color: var(--ink-muted);
  padding: 1.5rem 0;
}

.site-footer {
  margin-top: 3rem;
  padding-top: 1rem;
  border-top: 1px solid var(--rule);
  font-family: var(--font-ui);
  font-size: 0.75rem;
  color: var(--ink-faint);
}

.site-footer p {
  margin: 0;
}

/* Print — quiet page, no chrome clutter */
@media print {
  :root {
    --bg: #fff;
    --ink: #111;
    --ink-muted: #333;
    --rule: #ccc;
    --accent: #333;
    --link: #000;
  }

  body {
    background: #fff;
    font-size: 11pt;
    line-height: 1.5;
  }

  .wrap {
    width: 100%;
    max-width: none;
    padding: 0;
  }

  .picker,
  .site-footer {
    display: none;
  }

  .site-header {
    border-bottom-color: #999;
  }

  .beat {
    break-inside: avoid;
  }

  a {
    color: inherit;
    text-decoration: none;
  }

  .sources a::after {
    content: " (" attr(href) ")";
    font-size: 0.75em;
    color: #555;
  }
}

@media (max-width: 480px) {
  html {
    font-size: 106.25%;
  }

  .wrap {
    width: min(100% - 1.5rem, var(--max));
    padding-block: 1.5rem 3rem;
  }
}

  </style>
</head>
<body>
  <main class="wrap">
    <header class="site-header">
      <p class="brand" id="brand">Newsy</p>
      <h1 class="briefing-title" id="briefing-title">Briefing</h1>
      <p class="meta" id="briefing-meta"></p>
    </header>

    <nav class="picker" aria-label="Past briefings">
      <p class="picker-label">Briefings</p>
      <ul class="chips" id="chips"></ul>
    </nav>

    <p class="status" id="status" hidden>Loading…</p>

    <div class="beats" id="beats"></div>

    <footer class="site-footer">
      <p>A short page. Read it, then close the tab.</p>
    </footer>
  </main>

  <script>
(function () {
  "use strict";

  const els = {
    brand: document.getElementById("brand"),
    title: document.getElementById("briefing-title"),
    meta: document.getElementById("briefing-meta"),
    chips: document.getElementById("chips"),
    beats: document.getElementById("beats"),
    status: document.getElementById("status"),
  };

  let briefings = [];

  function formatGeneratedAt(iso) {
    if (!iso) return "";
    const d = new Date(iso);
    if (Number.isNaN(d.getTime())) return iso;
    try {
      return new Intl.DateTimeFormat("en-US", {
        weekday: "short",
        month: "short",
        day: "numeric",
        year: "numeric",
        hour: "numeric",
        minute: "2-digit",
        timeZoneName: "short",
      }).format(d);
    } catch (_) {
      return iso;
    }
  }

  function chipLabel(b) {
    // Prefer short date + slot for the chip row
    const d = b.date || "";
    const parts = d.split("-");
    if (parts.length === 3) {
      const month = Number(parts[1]);
      const day = Number(parts[2]);
      const months = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
      const slot = (b.slot || "").charAt(0).toUpperCase() + (b.slot || "").slice(1);
      return months[month - 1] + " " + day + " · " + slot;
    }
    return b.label || b.id;
  }

  function renderSources(sources) {
    if (!sources || !sources.length) return "";
    const parts = sources.map(function (s) {
      const name = s.name || "Source";
      if (s.url) {
        return (
          '<a href="' +
          escapeAttr(s.url) +
          '" rel="noopener noreferrer" target="_blank">' +
          escapeHtml(name) +
          "</a>"
        );
      }
      return '<span class="name-only">' + escapeHtml(name) + "</span>";
    });
    return (
      '<p class="sources"><span class="sources-label">Sources</span> ' +
      parts.join('<span class="sep">·</span>') +
      "</p>"
    );
  }

  function bodyHtml(body) {
    if (!body) return "";
    // Allow simple HTML paragraphs; if plain text, wrap paragraphs
    if (/<[a-z][\s\S]*>/i.test(body)) return body;
    return body
      .split(/\n\n+/)
      .map(function (p) {
        return "<p>" + escapeHtml(p.trim()) + "</p>";
      })
      .join("");
  }

  function escapeHtml(str) {
    return String(str)
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;");
  }

  function escapeAttr(str) {
    return escapeHtml(str).replace(/'/g, "&#39;");
  }

  function renderBriefing(b) {
    if (!b) {
      els.title.textContent = "No briefing";
      els.meta.textContent = "";
      els.beats.innerHTML = "";
      els.status.hidden = false;
      els.status.textContent = "No briefing selected.";
      return;
    }

    els.status.hidden = true;
    els.title.textContent = b.label || b.id;
    const when = formatGeneratedAt(b.generatedAt);
    els.meta.textContent = when ? "Prepared " + when : "";

    document.title = (b.label || "Briefing") + " · Newsy";

    const beats = b.beats || [];
    els.beats.innerHTML = beats
      .map(function (beat) {
        return (
          '<article class="beat" id="beat-' +
          escapeAttr(beat.id || "") +
          '">' +
          "<h2 class=\"beat-title\">" +
          escapeHtml(beat.title || "") +
          "</h2>" +
          '<div class="beat-body">' +
          bodyHtml(beat.body || "") +
          "</div>" +
          renderSources(beat.sources) +
          "</article>"
        );
      })
      .join("");

    // Update chip pressed state
    Array.prototype.forEach.call(els.chips.querySelectorAll(".chip"), function (btn) {
      btn.setAttribute("aria-pressed", btn.dataset.id === b.id ? "true" : "false");
    });

    // Reflect selection in the URL hash without scrolling noise
    if (history.replaceState) {
      history.replaceState(null, "", "#" + encodeURIComponent(b.id));
    } else {
      location.hash = encodeURIComponent(b.id);
    }
  }

  function renderChips() {
    els.chips.innerHTML = briefings
      .map(function (b) {
        return (
          "<li>" +
          '<button type="button" class="chip" data-id="' +
          escapeAttr(b.id) +
          '" aria-pressed="false">' +
          escapeHtml(chipLabel(b)) +
          "</button>" +
          "</li>"
        );
      })
      .join("");

    els.chips.addEventListener("click", function (e) {
      const btn = e.target.closest(".chip");
      if (!btn) return;
      const found = briefings.find(function (b) {
        return b.id === btn.dataset.id;
      });
      if (found) renderBriefing(found);
    });
  }

  function pickInitial() {
    const hash = (location.hash || "").replace(/^#/, "");
    if (hash) {
      const decoded = decodeURIComponent(hash);
      const match = briefings.find(function (b) {
        return b.id === decoded;
      });
      if (match) return match;
    }
    return briefings[0] || null;
  }

  function showError(msg) {
    els.status.hidden = false;
    els.status.textContent = msg;
    els.title.textContent = "Briefing";
    els.meta.textContent = "";
    els.beats.innerHTML = "";
  }
