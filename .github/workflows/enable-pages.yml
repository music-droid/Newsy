name: Enable GitHub Pages

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write

jobs:
  enable:
    runs-on: ubuntu-latest
    steps:
      - name: Publish from main /
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          payload='{"build_type":"legacy","source":{"branch":"main","path":"/"}}'
          post() {
            curl -sS -o /tmp/pages-body.json -w "%{http_code}" \
              -X "$1" \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              -H "Content-Type: application/json" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/pages" \
              -d "$payload"
          }
          code=$(post POST)
          echo "POST ${code}"
          cat /tmp/pages-body.json
          echo
          if [ "$code" = "201" ] || [ "$code" = "409" ]; then
            exit 0
          fi
          code=$(post PUT)
          echo "PUT ${code}"
          cat /tmp/pages-body.json
          echo
          if [ "$code" != "200" ] && [ "$code" != "201" ]; then
            exit 1
          fi
